<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lusin — Cold and Warm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════
     ПРОТОТИП v11 · РАБОЧАЯ СИСТЕМА

     Cold / Warm — переключатель наверху левой панели, а не два плаката.
     Под переключателем меняется весь состав панели, потому что это
     два разных режима работы:

       COLD  машина пишет массе. Настоящая база: 2.4M людей,
             184K компаний, сегменты, кампании, каналы. Работа —
             таблицами, фильтрами и массовыми действиями.
       WARM  человек говорит с людьми. Десятки. У каждого владелец,
             следующий шаг и лента касаний.

     Токены — из bobroff-cap/ai-crm (apps/web/src/styles.css).
     Блоки пронумерованы.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ╔═ БЛОК 0 · ТОКЕНЫ ═══════════════════════════════════════════════ */
:root{
  --ink:#17241f; --ink-2:#3a4843; --muted:#636d69; --faint:#7d8983;
  --line:rgba(23,36,31,.08); --line-2:rgba(23,36,31,.14); --line-soft:#e9ece8;
  --canvas:#f3f5f1; --surface:#ffffff; --tint:#f7f9f5;
  --sidebar:#10231d; --sidebar-soft:#1a3129; --on-dark:#dbe6e0; --on-dark-muted:#8fa59c;
  --sage:#2f705c; --sage-dark:#245b4a; --sage-pale:#e5f0ea;
  --lime:#cce36c; --blue:#3d6f9e; --blue-pale:#e9f1f8;
  --gold:#8a5f1f; --gold-pale:#fbf2df; --coral:#a94f40; --coral-pale:#f9eae7;
  --shadow-lift:0 0 0 1px rgba(23,36,31,.06),0 1px 2px rgba(23,36,31,.05),0 6px 16px rgba(23,36,31,.05);
  --shadow-ring:inset 0 0 0 1px var(--line-2);
  --shadow-hair:inset 0 0 0 1px var(--line);
  --r:10px; --r-card:16px; --pill:999px; --h:36px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Manrope,-apple-system,sans-serif;background:var(--canvas);color:var(--ink);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font:inherit}
.mono{font-family:"DM Mono",monospace}
.shell{display:flex;min-height:100vh}

/* ╔═ БЛОК 1 · ЛЕВАЯ ПАНЕЛЬ С ПЕРЕКЛЮЧАТЕЛЕМ ═══════════════════════ */
.side{width:236px;flex:none;background:var(--sidebar);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh}
.side.hid{display:none}
.logo{padding:16px 16px 12px;color:#fff;font-weight:800;font-size:15px;
  display:flex;align-items:center;gap:8px}
.logo i{width:21px;height:21px;border-radius:6px;background:var(--lime);color:var(--sidebar);
  display:grid;place-items:center;font-size:11px;font-style:normal}

/* переключатель режима */
.mode{margin:2px 12px 12px;background:var(--sidebar-soft);border-radius:var(--r);padding:3px;
  display:grid;grid-template-columns:1fr 1fr;gap:3px}
.mode button{padding:7px 0;border-radius:7px;font-size:12.5px;font-weight:700;
  color:var(--on-dark-muted);letter-spacing:.02em}
.mode button.on{background:#fff;color:var(--sidebar)}
.mode .sub{display:block;font-size:10.5px;font-weight:600;opacity:.65;margin-top:1px}

.grp{padding:4px 10px}
.grp h3{font-size:11px;font-weight:700;color:var(--on-dark-muted);padding:7px 8px 6px;letter-spacing:.05em;
  text-transform:uppercase}
.nav{display:flex;align-items:center;gap:9px;height:34px;padding:0 9px;border-radius:8px;
  color:var(--on-dark);font-size:13.5px;font-weight:500;width:100%;text-align:left;
  position:relative;margin-bottom:1px}
.nav:hover{background:var(--sidebar-soft)}
.nav.on{background:var(--sidebar-soft);color:#fff;font-weight:700}
.nav.on::before{content:"";position:absolute;left:-9px;top:8px;bottom:8px;width:3px;
  background:var(--lime);border-radius:0 3px 3px 0}
.nav .ic{width:14px;text-align:center;opacity:.8;font-size:12px;flex:none}
.nav .c{margin-left:auto;font-size:11px;font-weight:700;color:var(--on-dark-muted);
  font-variant-numeric:tabular-nums}
.nav.on .c{color:var(--on-dark)}
.nav .c.hot{background:var(--lime);color:var(--sidebar);border-radius:var(--pill);padding:1px 6px}
.side .btm{margin-top:auto;padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,.07)}
.side .ws{background:var(--sidebar-soft);border-radius:8px;padding:9px 11px;color:var(--on-dark)}
.side .ws b{font-size:13px;display:block;font-weight:700}
.side .ws span{font-size:11px;color:var(--on-dark-muted)}

/* ╔═ БЛОК 2 · ШАПКА ═══════════════════════════════════════════════ */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{height:52px;flex:none;background:var(--surface);border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:30}
.burger{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.burger:hover{background:var(--tint)}
.find{display:flex;align-items:center;gap:8px;height:var(--h);padding:0 12px;border-radius:var(--pill);
  background:var(--tint);box-shadow:var(--shadow-ring);color:var(--muted);width:300px;font-size:13px}
.find .k{margin-left:auto;font-size:11px;color:var(--faint);font-family:"DM Mono",monospace}
.bar .r{margin-left:auto;display:flex;align-items:center;gap:9px}
.ava{width:28px;height:28px;border-radius:var(--pill);background:var(--sage-pale);color:var(--sage-dark);
  display:grid;place-items:center;font-size:11px;font-weight:700}
.page{padding:18px 18px 40px;min-width:0}

/* ╔═ БЛОК 3 · ЗАГОЛОВОК И ПАНЕЛЬ ЗАПРОСА ══════════════════════════ */
.ph{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ph h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.ph .n{font-size:13px;color:var(--muted)}
.ph .a{margin-left:auto;display:flex;gap:7px}
.btn{height:var(--h);padding:0 13px;border-radius:var(--r);font-size:13px;font-weight:600;
  background:var(--surface);box-shadow:var(--shadow-ring);display:inline-flex;align-items:center;gap:7px;
  white-space:nowrap}
.btn:hover{box-shadow:0 0 0 1px rgba(47,112,92,.3)}
.btn.pri{background:var(--sage);color:#fff;box-shadow:none}
.btn.pri:hover{background:var(--sage-dark)}
.btn.g{background:none;box-shadow:none;color:var(--sage);padding:0 9px}
.btn.g:hover{background:var(--sage-pale);box-shadow:none}
.btn .cnt{font-size:11px;background:var(--tint);border-radius:var(--pill);padding:1px 6px;color:var(--muted)}

.q{display:flex;align-items:center;gap:7px;margin-bottom:10px;flex-wrap:wrap}
.q .search{display:flex;align-items:center;gap:7px;height:var(--h);padding:0 11px;border-radius:var(--r);
  background:var(--surface);box-shadow:var(--shadow-ring);width:230px}
.q .search input{border:none;outline:none;background:none;width:100%;font-size:13px;color:var(--ink)}
.filt{height:var(--h);padding:0 11px;border-radius:var(--r);background:var(--surface);
  box-shadow:var(--shadow-ring);font-size:13px;display:inline-flex;align-items:center;gap:7px}
.filt b{font-weight:700}
.filt .x{color:var(--faint);font-size:14px;margin-left:2px}
.filt .x:hover{color:var(--coral)}
.filt.add{color:var(--sage);font-weight:600}
.segs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.seg{height:30px;padding:0 11px;border-radius:var(--pill);font-size:12.5px;font-weight:600;
  background:var(--surface);box-shadow:var(--shadow-ring);color:var(--ink-2)}
.seg.on{background:var(--ink);color:#fff;box-shadow:none}
.seg .n{opacity:.6;margin-left:5px;font-size:11px}

/* ╔═ БЛОК 4 · ТАБЛИЦА ═════════════════════════════════════════════ */
.tw{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-hair);overflow:hidden}
.selbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--sage-pale);
  border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--sage-dark);font-weight:600}
.selbar .a{margin-left:auto;display:flex;gap:7px}
.selbar .btn{height:30px;font-size:12.5px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:1020px}
th{font-size:11px;font-weight:700;color:var(--muted);text-align:left;padding:9px 10px;
  border-bottom:1px solid var(--line-soft);white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
td{padding:0 10px;height:46px;border-bottom:1px solid var(--line-soft);font-size:13px;vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--tint)}
tbody tr.sel{background:var(--sage-pale)}
.cb{width:15px;height:15px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--line-2);
  display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.cb.on{background:var(--sage);box-shadow:none;color:#fff;font-size:10px}
td.nm{font-weight:700;white-space:nowrap}
td.nm a{color:var(--ink);text-decoration:none}
td.nm:hover a{color:var(--sage)}
.co{display:flex;align-items:center;gap:8px;white-space:nowrap}
.co .sq{width:22px;height:22px;flex:none;border-radius:6px;background:var(--tint);color:var(--muted);
  display:grid;place-items:center;font-size:10px;font-weight:700;box-shadow:var(--shadow-ring)}
.dim{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:var(--pill);
  font-size:11px;font-weight:700;background:var(--tint);color:var(--muted);box-shadow:var(--shadow-ring);
  white-space:nowrap}
.pill.s{background:var(--sage-pale);color:var(--sage-dark);box-shadow:none}
.pill.g{background:var(--gold-pale);color:var(--gold);box-shadow:none}
.pill.b{background:var(--blue-pale);color:var(--blue);box-shadow:none}
.pill.c{background:var(--coral-pale);color:var(--coral);box-shadow:none}
.chan{display:flex;gap:4px}
.chan i{width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-style:normal;
  font-size:9px;font-weight:700;background:var(--tint);color:var(--faint);box-shadow:var(--shadow-ring)}
.chan i.on{background:var(--sage-pale);color:var(--sage-dark);box-shadow:none}
.pg{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--muted)}
.pg .a{margin-left:auto;display:flex;gap:6px}
.pg .b2{height:30px;padding:0 11px;border-radius:8px;box-shadow:var(--shadow-ring);font-size:12.5px;
  font-weight:600;background:var(--surface);color:var(--ink)}
.pg .b2[disabled]{color:var(--faint);cursor:default;box-shadow:inset 0 0 0 1px var(--line)}

/* ╔═ БЛОК 5 · КАРТОЧКИ И ПРОЧЕЕ ═══════════════════════════════════ */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-hair);padding:14px 16px}
.kpi .l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.kpi .d b{color:var(--sage-dark)}
.card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow-hair);overflow:hidden;margin-bottom:16px}
.ch{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.ch h2{font-size:14px;font-weight:700}
.ch .n{font-size:12px;color:var(--muted)}
.ch .a{margin-left:auto}
.rw{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line-soft)}
.rw:last-child{border-bottom:none}
.rw:hover{background:var(--tint)}
.rw .k{flex:1;min-width:0;font-size:13.5px}
.rw .k b{font-weight:700;display:block}
.rw .k span{font-size:12px;color:var(--muted)}
.rw .m{flex:none;width:190px;font-size:12.5px;color:var(--ink-2)}
.rw .m .l{font-size:11px;color:var(--faint);font-weight:600}
.bar2{height:5px;width:60px;border-radius:var(--pill);background:var(--line-soft);overflow:hidden;flex:none}
.bar2 i{display:block;height:100%;background:var(--sage)}
.bar2 i.g{background:var(--gold)} .bar2 i.c{background:var(--coral)}
.hint{font-size:12.5px;color:var(--muted);padding:12px 16px;background:var(--tint);line-height:1.55}
.add{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--sage-pale);
  border-radius:var(--r-card);margin-bottom:16px}
.add .t{flex:1;font-size:13px;color:var(--sage-dark);line-height:1.5}
.add .t b{display:block;font-size:13.5px;font-weight:700}
@media (max-width:900px){ .side{position:fixed;z-index:60;box-shadow:0 0 60px rgba(0,0,0,.3)} }
</style>
</head>
<body>

<div class="shell">
  <!-- ╔═ БЛОК 1 · ПАНЕЛЬ ══════════════════════════════════════════ -->
  <aside class="side" id="side">
    <div class="logo"><i>L</i> Lusin</div>
    <div class="mode">
      <button id="mCold" onclick="setMode('cold')">Cold<span class="sub">machine</span></button>
      <button id="mWarm" onclick="setMode('warm')">Warm<span class="sub">you</span></button>
    </div>
    <div id="navBox"></div>
    <div class="btm"><div class="ws"><b>Bobroff Cap</b><span>MSP roll-up · Boston</span></div></div>
  </aside>

  <div class="main">
    <!-- ╔═ БЛОК 2 · ШАПКА ═════════════════════════════════════════ -->
    <div class="bar">
      <button class="burger" onclick="document.getElementById('side').classList.toggle('hid')">☰</button>
      <div class="find"><span>Search people, companies, commands</span><span class="k">⌘K</span></div>
      <div class="r">
        <button class="btn g">Import</button>
        <div class="ava">LI</div>
      </div>
    </div>
    <div class="page" id="page"></div>
  </div>
</div>

<script>
/* ╔═ БЛОК 6 · ДАННЫЕ ═══════════════════════════════════════════════ */
const PEOPLE = [
 ['Sofia Marchetti','CTO','Cobalt Systems','Peabody, MA',38,'Opened 5× in one evening','Breach signal','step 2 of 4','2d','alive',1,1],
 ['Ben Carrow','Owner','Halyard Group','Revere, MA',27,'Viewed your LinkedIn twice','Hiring signal','step 2 of 4','1d','alive',1,1],
 ['Nadia Fields','President','Portside IT','Gloucester, MA',44,'Breach filed this morning','Breach signal','not started','today','alive',1,0],
 ['Trevor Nunes','Owner','Bayline Technology','Malden, MA',19,'—','Breach signal','step 3 of 4','4d','running',1,0],
 ['Amara Osei','IT Director','Granite Peak MSP','Nashua, NH',56,'—','Hiring signal','step 1 of 4','1d','running',1,1],
 ['Colin Vasquez','Owner','Ridgeway Networks','Woburn, MA',23,'—','Breach signal','step 4 of 4','6d','running',1,0],
 ['Hannah Blake','COO','Sentinel Managed','Danvers, MA',31,'—','Compliance','paused','12d','paused',1,1],
 ['Marcus Feld','Owner','Tidewater IT','Beverly, MA',22,'—','Breach signal','step 2 of 4','3d','running',1,0],
 ['Elena Rusk','CTO','Fairmont Systems','Andover, MA',47,'—','Hiring signal','step 3 of 4','5d','running',1,1],
 ['Jordan Pike','Owner','Blue Harbor Tech','Salem, MA',18,'—','Breach signal','step 1 of 4','2d','running',1,0],
 ['Iris Tanaka','VP Ops','Northgate IT','Lowell, MA',62,'—','Compliance','step 2 of 3','7d','running',1,1],
 ['Sam Delgado','Owner','Copperline MSP','Haverhill, MA',25,'—','Hiring signal','not started','—','queued',1,0],
 ['Priya Nandi','IT Director','Westbrook Group','Waltham, MA',39,'—','Breach signal','not started','—','queued',1,1],
 ['Owen Brandt','Owner','Lighthouse IT','Newburyport, MA',21,'—','Compliance','step 1 of 3','9d','running',1,0],
 ['Clara Voss','COO','Ironside Networks','Chelsea, MA',34,'—','Hiring signal','step 4 of 4','11d','running',1,1]
];

const SEGMENTS = [
 ['All people','2,412,880',0],
 ['MSP · New England · 15–75 staff','184,203',1],
 ['Breach filed in last 12 months','9,418',0],
 ['Passed CMMC 12+ months ago','3,106',0],
 ['Hiring a security role now','1,884',0]
];

const WARM = [
 ['Mark Reilly','Owner','Anchor IT','Waltham, MA','replied','s','Call Wednesday 14:00','in 2 days','Nicolas',6],
 ['Dana Wu','CTO','NorthBridge Systems','Quincy, MA','replied','s','Call Thursday 10:30','in 3 days','Nicolas',5],
 ['Owen Salazar','Owner','Keystone Managed','Lowell, MA','introduced','b','Call Monday 16:00','in 6 days','Nicolas',3],
 ['David Okafor','VP Ops','Meridian IT','Framingham, MA','met in person','g','He said call in two weeks','in 4 days','Nicolas',2],
 ['Priya Raman','COO','Beacon Grid','Newton, MA','replied','s','She is waiting on you','17 days','Lisa',3],
 ['Rachel Kim','Founder','Tessellate','Cambridge, MA','introduced','b','No next step set','4 days','—',1]
];

const CAMPAIGNS = [
 ['Breach signal · Boston','Running','s','112','112','5','1'],
 ['Hiring signal · Boston','Running','s','88','88','3','1'],
 ['Compliance · CMMC year two','Paused','g','44','44','1','1']
];

const BOXES = [
 ['nicolas@anchor-reach.com','Google',97,'','18 / 18','Healthy','s'],
 ['nicolas@anchor-signal.com','Google',96,'','18 / 18','Healthy','s'],
 ['lisa@anchor-reach.com','Google',94,'','14 / 18','Healthy','s'],
 ['lisa@anchor-signal.com','Google',91,'g','6 / 18','Warming','g'],
 ['team@anchor-grid.com','Microsoft',88,'g','4 / 18','Warming','g'],
 ['hello@anchor-grid.com','Microsoft',62,'c','0 / 18','Withdrawn','c']
];

/* ╔═ БЛОК 7 · СОСТОЯНИЕ ════════════════════════════════════════════ */
let S = { mode:'cold', page:'people', seg:1, sel:[], allSel:false };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const NAV = {
  cold:[
    ['Work',[ ['people','◎','People','2.4M'], ['companies','▦','Companies','184,203'], ['alive','✳','Signs of life','3','hot'] ]],
    ['Outreach',[ ['campaigns','➤','Campaigns','3'], ['channels','⌁','Channels','6'] ]],
    ['Data',[ ['segments','◈','Segments','12'], ['imports','↓','Imports',''] ]]
  ],
  warm:[
    ['Work',[ ['wpeople','◎','People','6'], ['meetings','◷','Meetings','3'], ['stuck','▲','Stuck','2','hot'] ]],
    ['Add',[ ['intake','✳','Card or note',''] ]]
  ]
};

function setMode(m){
  S.mode = m; S.sel = []; S.allSel = false;
  S.page = m === 'cold' ? 'people' : 'wpeople';
  render();
}
function go(p){ S.page = p; S.sel = []; S.allSel = false; render(); }

function vNav(){
  return NAV[S.mode].map(g =>
    '<div class="grp"><h3>' + g[0] + '</h3>' + g[1].map(n =>
      '<button class="nav' + (S.page === n[0] ? ' on' : '') + '" onclick="go(\'' + n[0] + '\')">' +
        '<span class="ic">' + n[1] + '</span>' + n[2] +
        (n[3] ? '<span class="c' + (n[4] ? ' hot' : '') + '">' + n[3] + '</span>' : '') +
      '</button>').join('') + '</div>').join('');
}

/* ╔═ БЛОК 8 · COLD · PEOPLE — главная таблица ═════════════════════ */
function vPeople(){
  const rows = PEOPLE.map((p, i) => {
    const on = S.sel.includes(i);
    const st = { alive:['g','signs of life'], running:['s','in sequence'], paused:['g','paused'], queued:['b','queued'] }[p[9]];
    return '<tr class="' + (on ? 'sel' : '') + '">' +
      '<td style="width:34px"><span class="cb' + (on ? ' on' : '') + '" onclick="tog(' + i + ')">' + (on ? '✓' : '') + '</span></td>' +
      '<td class="nm"><a href="#" onclick="return false">' + esc(p[0]) + '</a></td>' +
      '<td class="dim" style="white-space:nowrap">' + esc(p[1]) + '</td>' +
      '<td><div class="co"><span class="sq">' + esc(p[2][0] + p[2].split(' ').slice(-1)[0][0]) + '</span>' + esc(p[2]) + '</div></td>' +
      '<td class="dim" style="white-space:nowrap">' + esc(p[3]) + '</td>' +
      '<td class="num">' + p[4] + '</td>' +
      '<td class="dim" style="max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(p[5]) + '">' + esc(p[5]) + '</td>' +
      '<td><span class="pill ' + st[0] + '">' + st[1] + '</span></td>' +
      '<td class="dim" style="white-space:nowrap">' + esc(p[7]) + '</td>' +
      '<td><div class="chan"><i class="' + (p[10] ? 'on' : '') + '">@</i><i class="' + (p[11] ? 'on' : '') + '">in</i></div></td>' +
      '<td class="dim">' + esc(p[8]) + '</td></tr>';
  }).join('');

  return '<div class="ph"><h1>People</h1><span class="n">2,412,880 in the canon · 184,203 in this segment</span>' +
    '<div class="a"><button class="btn">Export</button><button class="btn pri">New campaign</button></div></div>' +

    '<div class="segs">' + SEGMENTS.map((s, i) =>
      '<button class="seg' + (S.seg === i ? ' on' : '') + '" onclick="S.seg=' + i + ';render()">' +
      esc(s[0]) + '<span class="n">' + s[1] + '</span></button>').join('') +
      '<button class="btn g">Save this view</button></div>' +

    '<div class="q">' +
      '<div class="search"><span style="color:var(--faint)">⌕</span><input placeholder="Filter within segment"></div>' +
      '<span class="filt"><b>Employees</b> 15–75<span class="x">×</span></span>' +
      '<span class="filt"><b>State</b> MA, NH, RI<span class="x">×</span></span>' +
      '<span class="filt"><b>Email</b> verified<span class="x">×</span></span>' +
      '<button class="filt add">+ Filter</button>' +
      '<button class="btn" style="margin-left:auto">Columns</button>' +
      '<button class="btn">Sort · last activity</button>' +
    '</div>' +

    '<div class="tw">' +
      (S.sel.length ? '<div class="selbar"><span>' + S.sel.length + ' selected</span>' +
        '<button class="btn g" onclick="S.sel=[];render()">Clear</button>' +
        '<span class="a"><button class="btn">Add to campaign</button>' +
        '<button class="btn">Move to warm</button>' +
        '<button class="btn">Export</button></span></div>' : '') +
      '<div class="scroll"><table><thead><tr>' +
        '<th><span class="cb' + (S.allSel ? ' on' : '') + '" onclick="togAll()">' + (S.allSel ? '✓' : '') + '</span></th>' +
        '<th>Name</th><th>Title</th><th>Company</th><th>Location</th><th>Staff</th>' +
        '<th>Signal</th><th>Status</th><th>Sequence</th><th>Channels</th><th>Last</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<div class="pg"><span>1–15 of 184,203</span>' +
        '<span class="a"><button class="b2" disabled>Previous</button><button class="b2">Next page</button></span>' +
      '</div>' +
    '</div>';
}

/* ╔═ БЛОК 9 · COLD · ОСТАЛЬНОЕ ════════════════════════════════════ */
function vAlive(){
  const A = PEOPLE.filter(p => p[9] === 'alive');
  return '<div class="ph"><h1>Signs of life</h1><span class="n">3 of 184,203 · they did something but never answered</span></div>' +
    '<div class="card">' + A.map(p =>
      '<div class="rw"><div class="k"><b>' + esc(p[0]) + '</b><span>' + esc(p[1] + ' · ' + p[2] + ' · ' + p[3]) + '</span></div>' +
      '<div class="m"><div class="l">' + esc(p[8]) + '</div>' + esc(p[5]) + '</div>' +
      '<button class="btn pri">Write by hand</button><button class="btn g">Leave it</button></div>').join('') +
      '<div class="hint">Writing by hand moves them to Warm and pulls them out of every sequence. This queue is the only place in Cold where one person is worth looking at alone.</div></div>';
}

function vCampaigns(){
  return '<div class="ph"><h1>Campaigns</h1><span class="n">2 running · 1 paused</span>' +
    '<div class="a"><button class="btn pri">New campaign</button></div></div>' +
    '<div class="cards">' +
      '<div class="kpi"><div class="l">Sent this week</div><div class="v">244</div><div class="d">across 6 mailboxes</div></div>' +
      '<div class="kpi"><div class="l">Replied</div><div class="v">9</div><div class="d">3.7% reply rate</div></div>' +
      '<div class="kpi"><div class="l">Moved to warm</div><div class="v">6</div><div class="d"><b>the only number that matters</b></div></div>' +
    '</div>' +
    '<div class="card"><div class="ch"><h2>All campaigns</h2></div>' +
    CAMPAIGNS.map(c =>
      '<div class="rw"><div class="k"><b>' + esc(c[0]) + '</b><span>audience is a saved segment · ' + esc(c[3]) + ' people</span></div>' +
      '<div class="m"><div class="l">sent · replied · warm</div>' + esc(c[4] + ' · ' + c[5] + ' · ' + c[6]) + '</div>' +
      '<span class="pill ' + c[2] + '">' + esc(c[1]) + '</span>' +
      '<button class="btn">Open</button></div>').join('') +
    '<div class="hint">A campaign never holds its own list. Change the segment and every running campaign follows it.</div></div>';
}

function vChannels(){
  return '<div class="ph"><h1>Channels</h1><span class="n">3 domains · 6 mailboxes · 1 withdrawn</span>' +
    '<div class="a"><button class="btn">Run seed test</button><button class="btn pri">Add mailbox</button></div></div>' +
    '<div class="cards">' +
      '<div class="kpi"><div class="l">Placement</div><div class="v">93%</div><div class="d">your own seed tests, not an average</div></div>' +
      '<div class="kpi"><div class="l">Daily ceiling</div><div class="v">60</div><div class="d">of 108 possible · warm-up in progress</div></div>' +
      '<div class="kpi"><div class="l">Domains</div><div class="v">3</div><div class="d"><b>all registered to you</b></div></div>' +
    '</div>' +
    '<div class="card"><div class="ch"><h2>Mailboxes</h2><span class="n">placement · today · status</span></div>' +
    BOXES.map(b =>
      '<div class="rw"><div class="k mono" style="font-size:12.5px"><b style="font-weight:500">' + esc(b[0]) + '</b>' +
      '<span style="font-family:Manrope">' + esc(b[1]) + '</span></div>' +
      '<div class="bar2"><i class="' + b[3] + '" style="width:' + b[2] + '%"></i></div>' +
      '<div class="num" style="width:44px">' + b[2] + '%</div>' +
      '<div class="num" style="width:56px">' + esc(b[4]) + '</div>' +
      '<span class="pill ' + b[6] + '">' + esc(b[5]) + '</span></div>').join('') +
    '<div class="hint">hello@anchor-grid.com fell to 62% placement and was pulled out of sending on its own. Campaigns rerouted; nobody got two touches because of it.</div></div>';
}

function vCompanies(){
  return '<div class="ph"><h1>Companies</h1><span class="n">184,203 in this segment · 2 with someone warm inside</span></div>' +
    '<div class="card"><div class="hint" style="background:var(--surface)">The company list is the same table as People, grouped one level up. ' +
    'A company can hold warm and cold people at once — Anchor IT has Mark warm and three colleagues still in the sequence.</div></div>';
}

/* ╔═ БЛОК 10 · WARM ═══════════════════════════════════════════════ */
function vWarmPeople(){
  return '<div class="ph"><h1>People</h1><span class="n">6 · everyone here answered or was met</span>' +
    '<div class="a"><button class="btn pri">Add someone you met</button></div></div>' +
    '<div class="add"><div class="t"><b>Three ways in, no way back</b>' +
    'They replied · somebody met them · you took them out of the signs-of-life queue by hand. A person you have spoken to never returns to the machine.</div></div>' +
    '<div class="tw"><div class="scroll"><table style="min-width:900px"><thead><tr>' +
      '<th>Name</th><th>Title</th><th>Company</th><th>Came in</th><th>Next step</th><th>When</th><th>Owner</th><th>Touches</th>' +
    '</tr></thead><tbody>' +
    WARM.map(w =>
      '<tr><td class="nm"><a href="#" onclick="return false">' + esc(w[0]) + '</a></td>' +
      '<td class="dim">' + esc(w[1]) + '</td>' +
      '<td><div class="co"><span class="sq">' + esc(w[2][0] + w[2].split(' ').slice(-1)[0][0]) + '</span>' + esc(w[2]) + '</div></td>' +
      '<td><span class="pill ' + w[5] + '">' + esc(w[4]) + '</span></td>' +
      '<td>' + esc(w[6]) + '</td>' +
      '<td class="dim">' + esc(w[7]) + '</td>' +
      '<td class="dim">' + esc(w[8]) + '</td>' +
      '<td class="num">' + w[9] + '</td></tr>').join('') +
    '</tbody></table></div></div>';
}

function vStuck(){
  return '<div class="ph"><h1>Stuck</h1><span class="n">2 with nothing scheduled</span></div>' +
    '<div class="card">' +
      '<div class="rw"><div class="k"><b>Priya Raman</b><span>COO · Beacon Grid · Lisa</span></div>' +
      '<div class="m"><div class="l">17 days</div>Asked about price, never got an answer</div>' +
      '<button class="btn pri">Answer now</button></div>' +
      '<div class="rw"><div class="k"><b>Rachel Kim</b><span>Founder · Tessellate · no owner</span></div>' +
      '<div class="m"><div class="l">4 days</div>Came through Adam, nobody picked her up</div>' +
      '<button class="btn pri">Take her</button></div>' +
      '<div class="hint">Nobody here went cold — that door opens one way. They simply stopped moving, and only a person can restart them.</div>' +
    '</div>';
}

function vMeetings(){
  return '<div class="ph"><h1>Meetings</h1><span class="n">3 this week</span></div>' +
    '<div class="card">' +
    WARM.filter(w => w[6].indexOf('Call') === 0).map(w =>
      '<div class="rw"><div class="k"><b>' + esc(w[0]) + '</b><span>' + esc(w[1] + ' · ' + w[2]) + '</span></div>' +
      '<div class="m"><div class="l">' + esc(w[7]) + '</div>' + esc(w[6]) + '</div>' +

function vIntake(){
  return '<div class="ph"><h1>Card or note</h1><span class="n">whatever came back from the field</span></div>' +
    '<div class="add"><div class="t"><b>Drop it in any shape</b>' +
    'Photograph a card, forward a message, record a voice note. The machine reads it, finds the person in the canon, cancels any sequence already running on them, and only then asks one question.</div>' +
    '<button class="btn pri">Upload</button></div>' +
    '<div class="card"><div class="ch"><h2>Waiting on you</h2><span class="n">3</span></div>' +
      '<div class="rw"><div class="k"><b>Business card · Mark Reilly</b><span>Nicolas · DAS NYC · 18 Sep</span></div>' +
      '<div class="m"><div class="l">sequence cancelled</div>What did you talk about?</div>' +
      '<button class="btn">Answer</button></div>' +
      '<div class="rw"><div class="k"><b>Voice note · David at Meridian</b><span>Nicolas · DAS NYC · 18 Sep</span></div>' +
      '<div class="m"><div class="l">held, not written</div>Three people named David there</div>' +
      '<button class="btn">Pick one</button></div>' +
      '<div class="rw"><div class="k"><b>Forwarded email · three intros</b><span>Masha · 20 Sep</span></div>' +
      '<div class="m"><div class="l">one collides</div>Priya is already in a campaign</div>' +
      '<button class="btn">Resolve</button></div>' +
    '</div>';
}

/* ╔═ БЛОК 11 · ВЫБОР СТРОК ════════════════════════════════════════ */
function tog(i){
  S.sel = S.sel.includes(i) ? S.sel.filter(x => x !== i) : S.sel.concat(i);
  S.allSel = S.sel.length === PEOPLE.length;
  render();
}
function togAll(){
  S.allSel = !S.allSel;
  S.sel = S.allSel ? PEOPLE.map((_, i) => i) : [];
  render();
}

/* ╔═ БЛОК 12 · РЕНДЕР ═════════════════════════════════════════════ */
function render(){
  document.getElementById('mCold').classList.toggle('on', S.mode === 'cold');
  document.getElementById('mWarm').classList.toggle('on', S.mode === 'warm');
  document.getElementById('navBox').innerHTML = vNav();
  document.getElementById('page').innerHTML = ({
    people:vPeople, alive:vAlive, campaigns:vCampaigns, channels:vChannels,
    companies:vCompanies, segments:vCompanies, imports:vCompanies,
    wpeople:vWarmPeople, stuck:vStuck, meetings:vMeetings, intake:vIntake
  }[S.page] || vPeople)();
}
render();
</script>
