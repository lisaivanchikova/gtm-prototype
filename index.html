<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTM Engine — живой прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --graphite:#14171F;--ink:#131A54;--signal:#0057FF;--echo:#A9BDF0;--mist:#DCEBF8;--paper:#F7F9FC;
 --line:#D9E2EE;--line2:#E8EEF6;--muted:#5D6B85;--muted2:#8A97AC;
 --ok:#0F7B5A;--warn:#8A6A12;--stop:#A32B2B;--violet:#5B3FA8;
 --act:56px;--side:272px;--bot:180px;--asst:360px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--paper);
 color:var(--graphite);font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
.mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
svg{stroke-linecap:round;stroke-linejoin:round}

#app{display:grid;height:100vh;grid-template-columns:var(--act) var(--side) 1fr var(--asst);
 grid-template-rows:38px 1fr 22px;
 grid-template-areas:"t t t t" "a s m r" "b b b b";transition:grid-template-columns .16s}
#app.noside{grid-template-columns:var(--act) 0 1fr var(--asst)}
#app.noasst{grid-template-columns:var(--act) var(--side) 1fr 0}
#app.noside.noasst{grid-template-columns:var(--act) 0 1fr 0}

#title{grid-area:t;background:var(--graphite);color:#fff;display:flex;align-items:center;padding:0 11px;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12.5px;letter-spacing:-.01em}
.bmark{width:15px;height:15px;border:2px solid var(--signal);border-radius:3px;position:relative;flex:none}
.bmark::after{content:'';position:absolute;inset:2.5px 2.5px auto auto;width:4px;height:4px;background:var(--signal);border-radius:1px}
.brand em{font-style:normal;font-weight:500;color:#8E9AB4;font-size:11px}
.tsep{width:1px;height:15px;background:#2C313D}
.tbtn{color:#9AA6BE;font-size:11.5px;padding:4px 8px;border-radius:4px;font-weight:500;display:flex;align-items:center;gap:6px}
.tbtn:hover{background:#242935;color:#fff}
.tbtn.on{background:#242935;color:#fff}
.tbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;background:#242935;color:#9AA6BE;padding:2px 5px;border-radius:3px;border:1px solid #333947}
.tsp{flex:1}
.who{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#9AA6BE}
.who b{color:#fff;font-weight:600}
.avatar{width:20px;height:20px;border-radius:50%;background:var(--signal);color:#fff;font-size:10px;font-weight:700;
 display:flex;align-items:center;justify-content:center}

#act{grid-area:a;background:#1B1F29;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:2px}
.ai{width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
 border-radius:5px;color:#6E7A92;position:relative}
.ai svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
.ai span{font-size:8.5px;font-weight:700;letter-spacing:.01em}
.ai:hover{color:#C3CCDE}.ai.on{color:#fff}
.ai.on::before{content:'';position:absolute;left:-6px;top:6px;bottom:6px;width:2px;background:var(--signal);border-radius:0 2px 2px 0}
.ai .bdg{position:absolute;top:3px;right:2px;min-width:15px;height:15px;background:var(--signal);color:#fff;border-radius:8px;
 font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.aisp{flex:1}

#side{grid-area:s;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#app.noside #side{display:none}
.sh{padding:9px 12px 7px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);
 display:flex;align-items:center;justify-content:space-between;flex:none}
.sb{flex:1;overflow-y:auto;padding-bottom:14px}
.sgrp{margin-bottom:3px}
.sgh{display:flex;align-items:center;gap:5px;padding:4px 12px;font-size:10.5px;font-weight:700;color:var(--muted);
 letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}
.sgh .chev{width:9px;height:9px;transition:transform .12s;stroke:var(--muted2);fill:none;stroke-width:2}
.sgrp.cl .chev{transform:rotate(-90deg)}.sgrp.cl .sgi{display:none}
.si{display:flex;align-items:center;gap:8px;padding:4px 12px 4px 23px;cursor:pointer;border-left:2px solid transparent;font-size:12.5px}
.si:hover{background:var(--paper)}
.si.on{background:var(--mist);border-left-color:var(--signal);font-weight:600}
.si .d{width:6px;height:6px;border-radius:50%;flex:none;background:#CAD5E4}
.si .n{margin-left:auto;font-size:10.5px;color:var(--muted2);font-family:'JetBrains Mono',monospace}
.si .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.snote{padding:10px 12px;font-size:11px;color:var(--muted2);line-height:1.5;border-top:1px solid var(--line2);margin-top:8px}
.sact{margin:8px 12px;display:flex;gap:6px}

#main{grid-area:m;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#tabs{height:34px;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;flex:none;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tb{display:flex;align-items:center;gap:7px;padding:0 9px 0 12px;border-right:1px solid var(--line2);font-size:12px;
 color:var(--muted);cursor:pointer;white-space:nowrap;position:relative;max-width:240px}
.tb:hover{background:var(--paper)}
.tb.on{background:var(--paper);color:var(--graphite);font-weight:600}
.tb.on::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--signal)}
.tb .ti{font-size:9.5px;font-family:'JetBrains Mono',monospace;color:var(--signal);font-weight:700}
.tb .x{width:15px;height:15px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;
 line-height:1;color:var(--muted2);opacity:0}
.tb:hover .x,.tb.on .x{opacity:1}
.tb .x:hover{background:var(--line);color:var(--graphite)}
#ed{flex:1;overflow:auto;background:var(--paper)}
.pad{padding:17px 21px 36px}

#bot{height:var(--bot);background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#bot.cl{height:29px}#bot.cl .bb{display:none}
.bh{height:29px;display:flex;align-items:center;gap:2px;padding:0 9px;border-bottom:1px solid var(--line2);flex:none}
.bt{padding:4px 9px;font-size:11px;font-weight:700;color:var(--muted2);border-radius:4px}
.bt.on{color:var(--graphite);background:var(--mist)}
.bsp{flex:1}
.bb{flex:1;overflow-y:auto;padding:6px 11px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.7}
.lr{display:flex;gap:9px;padding:1px 0}
.lr:hover{background:var(--paper)}
.lt{color:var(--muted2);flex:none;width:52px}
.ls{flex:none;width:98px;font-weight:700;font-size:10px}
.lm{flex:1}.lm b{font-weight:600;color:var(--ink)}
.c-auto{color:var(--signal)}.c-gate{color:var(--warn)}.c-human{color:var(--ok)}.c-stop{color:var(--stop)}.c-sys{color:var(--muted2)}

#asst{grid-area:r;background:#fff;border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
#app.noasst #asst{display:none}
.ah{padding:9px 13px;border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:8px;flex:none}
.arobot{width:24px;height:24px;border-radius:6px;background:var(--ink);display:flex;align-items:center;justify-content:center;flex:none}
.arobot svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.7}
.ahn{font-size:12.5px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.ahs{font-size:10.5px;color:var(--muted2)}
.ab{flex:1;overflow-y:auto;padding:11px 13px}
.amsg{margin-bottom:11px}
.amsg.me{text-align:right}
.abub{display:inline-block;max-width:92%;text-align:left;padding:8px 11px;border-radius:9px;font-size:12.5px;line-height:1.5;
 background:var(--paper);border:1px solid var(--line2)}
.amsg.me .abub{background:var(--signal);color:#fff;border-color:var(--signal)}
.abub b{font-weight:700}
.abub ul{margin:5px 0 0 15px;padding:0}
.abub li{margin-bottom:3px}
.aq{background:#FFF9EC;border:1px solid #E8D5A0;border-radius:9px;padding:10px 12px;margin-bottom:11px}
.aq-h{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);margin-bottom:5px}
.aq-t{font-size:12.5px;line-height:1.5;margin-bottom:8px}
.aq-t b{font-weight:700}
.aq-why{font-size:11.5px;color:var(--muted);line-height:1.45;margin-bottom:9px;padding-left:9px;border-left:2px solid #E8D5A0}
.aq-btns{display:flex;gap:6px;flex-wrap:wrap}
.af{padding:9px 13px;border-top:1px solid var(--line2);flex:none}
.achips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.achip{padding:3px 9px;border:1px solid var(--line);border-radius:12px;font-size:11px;color:var(--muted);white-space:nowrap}
.achip:hover{border-color:var(--signal);color:var(--signal);background:var(--mist)}
.ain{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:5px 9px}
.ain input{flex:1;border:none;outline:none;font-size:12.5px}
.ain button{color:var(--signal);font-weight:700;font-size:12px}

#status{grid-area:b;background:var(--ink);color:#C9D4F0;display:flex;align-items:center;padding:0 10px;font-size:11px}
.st{display:flex;align-items:center;gap:5px;padding:0 9px;height:100%;white-space:nowrap}
.st:hover{background:rgba(255,255,255,.09)}
.st b{color:#fff;font-weight:600;font-family:'JetBrains Mono',monospace}
.stsp{flex:1}
.sdot{width:6px;height:6px;border-radius:50%}

/* общие */
.ph{margin-bottom:14px}
.pk{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--signal);margin-bottom:4px}
.pt{font-size:20px;font-weight:800;letter-spacing:-.025em;margin-bottom:4px;line-height:1.18}
.pd{font-size:12.5px;color:var(--muted);max-width:680px;line-height:1.55}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.tbl th{text-align:left;padding:7px 10px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
 color:var(--muted2);background:var(--paper);border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
.tbl th:hover{color:var(--signal)}
.tbl th .sort{opacity:.45;font-size:9px}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--line2);font-size:12px;vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--paper)}
.tbl tbody tr.on{background:var(--mist)}
.tbl tbody tr.flag{background:#FFFBF0}
.tbl tbody tr.flag:hover{background:#FFF6E3}
.tbl td.mono{font-size:11px}
.gap{color:var(--stop);font-weight:600;font-size:11px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:3px;font-size:10.5px;font-weight:700;white-space:nowrap}
.t-ok{background:#E3F2EC;color:var(--ok)}.t-warn{background:#FBF2DC;color:var(--warn)}
.t-stop{background:#FBE7E7;color:var(--stop)}.t-neu{background:var(--line2);color:var(--muted)}
.t-sig{background:var(--mist);color:var(--ink)}.t-vio{background:#EDE7FB;color:var(--violet)}
.lnk{color:var(--signal);cursor:pointer}.lnk:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:5px;font-size:12px;font-weight:600;
 border:1px solid var(--line);background:#fff;transition:.1s;white-space:nowrap}
.btn:hover{border-color:var(--muted2);background:var(--paper)}
.btn-p{background:var(--signal);color:#fff;border-color:var(--signal)}
.btn-p:hover{background:#0048D6;border-color:#0048D6}
.btn-g{border-color:transparent;color:var(--muted)}
.btn-g:hover{background:var(--line2);color:var(--graphite)}
.btn-d{color:var(--stop);border-color:transparent}
.btn-d:hover{background:#FBE7E7;border-color:#F0C9C9}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.btn-s{padding:3px 8px;font-size:11px}
.tool{display:flex;align-items:center;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.tool .sp{flex:1}
.fld{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 9px}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
.fld select,.fld input{border:none;outline:none;background:none;font-size:12px;font-weight:600;min-width:60px}
.srch{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:5px;padding:4px 9px;min-width:210px}
.srch svg{width:13px;height:13px;stroke:var(--muted2);fill:none;stroke-width:1.8;flex:none}
.srch input{flex:1;border:none;outline:none;font-size:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ct{font-size:13px;font-weight:700;letter-spacing:-.01em}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.met{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.mk{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);margin-bottom:3px}
.mv{font-size:22px;font-weight:800;letter-spacing:-.03em;font-family:'JetBrains Mono',monospace;line-height:1}
.ms{font-size:11px;color:var(--muted);margin-top:3px}
.empty{padding:44px 20px;text-align:center;color:var(--muted2);font-size:12.5px}
.empty svg{width:32px;height:32px;stroke:var(--line);fill:none;stroke-width:1.3;margin-bottom:10px}
.kv{display:flex;gap:8px;padding:3px 0;font-size:12px;align-items:baseline}
.kvk{width:118px;flex:none;color:var(--muted);font-size:11.5px}
.kvv{flex:1;min-width:0;word-break:break-word}

/* ── BPMN конструктор ─────────────────── */
.wf{display:grid;grid-template-columns:186px 1fr;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.pal{border-right:1px solid var(--line);background:var(--paper);padding:9px}
.palh{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin:7px 0 5px}
.palh:first-child{margin-top:0}
.palb{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#fff;border:1px solid var(--line);border-radius:5px;
 margin-bottom:4px;cursor:pointer;font-size:11.5px;font-weight:600}
.palb:hover{border-color:var(--signal);background:var(--mist)}
.palb .bi{width:20px;height:20px;flex:none;display:flex;align-items:center;justify-content:center}
.canvas{padding:16px 18px;overflow:auto;min-height:440px;
 background-image:radial-gradient(var(--line2) 1px,transparent 1px);background-size:14px 14px}
.bcol{display:flex;flex-direction:column;align-items:flex-start;gap:0}
.brow{display:flex;align-items:flex-start;gap:12px}
.bnode{background:#fff;border:1.5px solid var(--graphite);cursor:pointer;position:relative;transition:.1s;flex:none}
.bnode:hover{box-shadow:0 2px 9px rgba(19,26,84,.13)}
.bnode.on{border-color:var(--signal);box-shadow:0 0 0 3px rgba(0,87,255,.15)}
.bnode.live{border-color:var(--signal);background:var(--mist);animation:pls 1s infinite}
.bnode.done{border-color:var(--ok)}
.bnode.fail{border-color:var(--stop);background:#FDF4F4}
@keyframes pls{0%,100%{box-shadow:0 0 0 0 rgba(0,87,255,.3)}50%{box-shadow:0 0 0 7px rgba(0,87,255,0)}}
.b-task{border-radius:7px;padding:8px 11px;width:224px;border-width:1.5px}
.b-task .bt2{font-size:12px;font-weight:600;line-height:1.3}
.b-task .bd{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.b-task .bw{position:absolute;top:-8px;left:9px;font-size:8.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
 padding:1px 5px;border-radius:3px;background:#fff;border:1px solid var(--line)}
.bw-auto{color:var(--signal);border-color:var(--echo)!important}
.bw-human{color:var(--ok);border-color:#9FD3BF!important}
.b-ev{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.b-ev.end{border-width:3px}
.b-ev svg{width:17px;height:17px;stroke:var(--graphite);fill:none;stroke-width:1.8}
.b-gw{width:42px;height:42px;transform:rotate(45deg);border-radius:4px;display:flex;align-items:center;justify-content:center}
.b-gw span{transform:rotate(-45deg);font-size:17px;font-weight:300;color:var(--graphite);line-height:1}
.blbl{font-size:11.5px;font-weight:600;line-height:1.35}
.blbl small{display:block;font-weight:400;color:var(--muted);font-size:10.5px}
.blbl.evl{padding:9px 0 0 11px;max-width:230px}
.blbl.gwl{padding:11px 0 0 11px;width:172px;flex:none}
.vln{width:1px;height:20px;background:var(--graphite);margin-left:18px;position:relative;flex:none}
.vln::after{content:'';position:absolute;left:-3.5px;bottom:0;border-top:6px solid var(--graphite);
 border-left:3.5px solid transparent;border-right:3.5px solid transparent}
.vln.t{margin-left:110px}
.vln.g{margin-left:20px}
.vln.hot,.vln.hot::after{background:var(--signal)}
.vln.hot::after{border-top-color:var(--signal);background:none}
.hln{height:1px;width:44px;background:var(--graphite);margin-top:21px;position:relative;flex:none}
.hln::after{content:'';position:absolute;right:0;top:-3.5px;border-left:6px solid var(--graphite);
 border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.hlbl{position:absolute;top:-15px;left:1px;font-size:9.5px;font-weight:700;color:var(--muted);background:#fff;
 padding:0 3px;white-space:nowrap;z-index:3}
.bside{display:flex;align-items:flex-start;gap:0;margin-left:0}
.wfval{margin-top:11px;padding:9px 12px;border-radius:6px;font-size:12px;line-height:1.5}
.wfval.ok{background:#E9F5F0;border:1px solid #9FD3BF;color:#0B5B43}
.wfval.bad{background:#FFF9EC;border:1px solid #E8D5A0;color:#5E4A12}

/* ── отображения в workspace ──────────── */
.fun{display:flex;flex-direction:column;gap:6px;max-width:660px}
.funrow{display:flex;align-items:center;gap:11px;cursor:pointer}
.funbar{height:38px;border-radius:5px;display:flex;align-items:center;padding:0 12px;color:#fff;font-weight:700;
 font-size:12.5px;transition:.15s;min-width:96px}
.funrow:hover .funbar{filter:brightness(1.09)}
.funmeta{font-size:11.5px;color:var(--muted);white-space:nowrap}
.funmeta b{color:var(--graphite);font-family:'JetBrains Mono',monospace}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:9px}
.bcol2{flex:none;width:224px;background:var(--paper);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column}
.bch{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;
 letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.bch .n{margin-left:auto;font-family:'JetBrains Mono',monospace;color:var(--muted2)}
.bcb{padding:7px;display:flex;flex-direction:column;gap:6px;min-height:52px}
.crd{background:#fff;border:1px solid var(--line);border-radius:5px;padding:8px 10px;cursor:pointer}
.crd:hover{border-color:var(--echo);box-shadow:0 2px 7px rgba(19,26,84,.07)}

function gaps(){const out=[];
 Object.entries(TABLES).forEach(([k,cfg])=>{if(!cfg.req.length)return;
  DB[k].forEach(r=>{const miss=cfg.req.filter(c=>r[c]==null||r[c]==='');
   if(miss.length)out.push({tbl:k,id:r.id,name:recName(k+'/'+r.id),miss})})});
 return out}
function checkGaps(){const g=gaps();S.flagGaps=true;
 log('помощник','gate','Проверка полноты: неполных записей <b>'+g.length+'</b>');
 asstSay('Прошёл по таблицам. Неполных записей: <b>'+g.length+'</b>.<ul>'+
  g.map(x=>'<li>'+esc(x.name)+' — нет: '+x.miss.map(m=>esc(m.toLowerCase())).join(', ')+'</li>').join('')+'</ul>'+
  'Такие записи выбывают на проверке годности молча — человек об этом не узнаёт.');
 if(g.length)openTab('tbl:'+g[0].tbl); else render();
 toast('Подсвечено неполных: '+g.length)}
function sortBy(t,c){const cur=S.tblSort[t];S.tblSort[t]=cur&&cur.c===c?{c,d:-cur.d}:{c,d:1};render()}
function tblSearch(t,v){S.tblQ[t]=v;render()}
function rowsOf(t){let r=[...DB[t]];const q=(S.tblQ[t]||'').toLowerCase().trim();
 if(q)r=r.filter(x=>TABLES[t].cols.some(c=>{let v=x[c];
  if(c==='Компания'&&t==='people')v=co(v);if(c==='Кому'||c==='От')v=pers(v);if(c==='Ящик')v=sndr(v);
  return String(v==null?'':v).toLowerCase().includes(q)}));
 const s=S.tblSort[t];
 if(s)r.sort((a,b)=>{let x=a[s.c],y=b[s.c];if(x==null)return 1;if(y==null)return -1;
  return (typeof x==='number'?x-y:String(x).localeCompare(String(y)))*s.d});
 return r}
function cellVal(t,r,c){
 let v=r[c];
 if(v==null||v==='')return '<span class="gap">нет данных</span>';
 if(t==='people'&&c==='Компания')return '<span class="lnk" onclick="event.stopPropagation();openRec(\'companies\',\''+v+'\')">'+esc(co(v))+'</span>';
 if(t==='signals'&&c==='Компания')return '<span class="lnk" onclick="event.stopPropagation();openRec(\'companies\',\''+v+'\')">'+esc(co(v))+'</span>';
 if((c==='Кому'||c==='От'))return '<span class="lnk" onclick="event.stopPropagation();openRec(\'people\',\''+v+'\')">'+esc(pers(v))+'</span>';
 if(c==='Ящик'&&v!=='—')return '<span class="mono" style="font-size:11px">'+esc(sndr(v))+'</span>';
 if(c==='Годность')return '<span class="tag '+(v>=75?'t-ok':v>=60?'t-warn':'t-neu')+'">'+v+'</span>';
 if(c==='Состояние'||c==='Стадия'||c==='Разбор'||c==='Тип')return tag(v);
 if(c==='Канал')return v==='закрыт полностью'?'<span class="tag t-stop">закрыт</span>':
   v.startsWith('только')?'<span class="tag t-warn">'+esc(v)+'</span>':'<span class="tag t-ok">'+esc(v)+'</span>';
 if(c==='Прогрев')return '<span class="mono">'+v+'%</span>';
 if(c==='Домен'||c==='Почта'||c==='LinkedIn'||c==='Адрес')return '<span class="mono" style="font-size:11px">'+esc(v)+'</span>';
 return esc(v)}

 'Ответили':'t-ok','Сделка':'t-ok','Встреча':'t-ok','Открыли':'t-sig','Написали':'t-sig','Новые':'t-neu','Закрыт':'t-stop',
 'интерес':'t-ok','не сейчас':'t-warn','смена канала':'t-sig','вакансия':'t-sig','раунд':'t-vio','смена работы':'t-warn','новость':'t-neu'};

function touchTpl(t){t.edited='только что'}
function addNode(tid,type){const t=tplById(tid);
 const id='x'+Math.random().toString(36).slice(2,7);
 const N={start:{name:'Начало'},task:{name:'Новая задача',desc:'',who:'auto'},
  gw:{name:'Новое условие?',desc:'',no:'нет',branch:[{id:id+'b',type:'end',name:'Выход'}]},
  timer:{name:'Ждать 1 день'},end:{name:'Конец'}}[type];
 const node=Object.assign({id,type},N);
 const sel=S.wfSel?findNode(t.nodes,S.wfSel):null;
 const arr=sel?findParent(t.nodes,S.wfSel):t.nodes;
 const at=sel?arr.indexOf(sel)+1:t.nodes.length;
 arr.splice(at,0,node);S.wfSel=id;touchTpl(t);
 log('человек','human','В процесс <b>'+esc(t.name)+'</b> добавлен блок «'+esc(node.name)+'»');
 hist('Добавлен блок «'+node.name+'» в процесс «'+t.name+'»');
 S.wfVal=null;render();toast('Блок добавлен — настройте его слева')}
function renameNode(tid,id,v){const t=tplById(tid);const n=findNode(t.nodes,id);if(!n)return;n.name=v;touchTpl(t);
 const el=document.getElementById('bn_'+id);if(el){const b=el.querySelector('.bt2');if(b)b.textContent=v}
 const lbl=el&&el.parentElement.querySelector('.blbl');if(lbl)lbl.childNodes[0].nodeValue=v}
function descNode(tid,id,v){const t=tplById(tid);const n=findNode(t.nodes,id);if(!n)return;n.desc=v;touchTpl(t)}
function whoNode(tid,id,w){const t=tplById(tid);const n=findNode(t.nodes,id);if(!n)return;n.who=w;touchTpl(t);
 log('человек','human','Блок «'+esc(n.name)+'» теперь выполняет '+(w==='human'?'человек':'робот'));
 hist('Исполнитель блока «'+n.name+'» → '+(w==='human'?'человек':'робот'));render()}
function moveNode(tid,id,d){const t=tplById(tid);const arr=findParent(t.nodes,id);if(!arr)return;
 const n=findNode(t.nodes,id);const i=arr.indexOf(n);const j=i+d;
 if(j<0||j>=arr.length)return toast('Дальше некуда');
 arr.splice(i,1);arr.splice(j,0,n);touchTpl(t);S.wfVal=null;
 log('человек','human','Блок «'+esc(n.name)+'» переставлен');hist('Порядок блоков изменён в «'+t.name+'»');render()}
function delNode(tid,id){const t=tplById(tid);const arr=findParent(t.nodes,id);if(!arr)return;
 const n=findNode(t.nodes,id);arr.splice(arr.indexOf(n),1);S.wfSel=null;touchTpl(t);S.wfVal=null;
 log('человек','human','Блок «'+esc(n.name)+'» удалён из <b>'+esc(t.name)+'</b>');
 hist('Удалён блок «'+n.name+'»');render();toast('Блок удалён')}
function validateTpl(id){const t=tplById(id);const errs=[];
 if(t.nodes[0]&&t.nodes[0].type!=='start')errs.push('первый блок — не начало');
 const flat=(ns)=>ns.reduce((a,n)=>a.concat([n],n.branch?flat(n.branch):[]),[]);
 const all=flat(t.nodes);
 if(!all.some(n=>n.type==='end'))errs.push('нет ни одного конца');
 all.forEach(n=>{if(!n.name||!n.name.trim())errs.push('блок без названия')});
 const last=t.nodes[t.nodes.length-1];
 if(last&&last.type!=='end')errs.push('основная ветка не заканчивается блоком «конец»');
 all.filter(n=>n.type==='gw').forEach(n=>{if(!n.branch||!n.branch.length)errs.push('у развилки «'+n.name+'» пустая вторая ветка')});
 S.wfVal=errs.length?{ok:false,m:'Процесс собран не до конца:<br>· '+errs.join('<br>· ')}:
  {ok:true,m:'Процесс замкнут: '+cnt(t.nodes)+' блоков, все ветки заканчиваются. Можно применять в рабочем пространстве.'};
 log('помощник',errs.length?'gate':'auto','Проверка «'+esc(t.name)+'»: '+(errs.length?errs.length+' замечаний':'всё сходится'));
 render()}

function runTpl(id){
 if(S.wfBusy)return;const t=tplById(id);S.wfBusy=true;S.wfRun={};S.wfVal=null;render();
 const flat=(ns)=>ns.reduce((a,n)=>a.concat([n]),[]);
 const seq=flat(t.nodes);let i=0;
 log('прогон','sys','Пошёл по процессу <b>'+esc(t.name)+'</b>');
 const step=()=>{
  if(i>0)S.wfRun[seq[i-1].id]='done';
  if(i>=seq.length){S.wfBusy=false;log('прогон','sys','Процесс дошёл до конца');toast('Процесс прошёл целиком');paint();render();return}
  const n=seq[i];S.wfRun[n.id]='live';paint();
  const el=document.getElementById('bn_'+n.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>{
   log(n.who==='human'?'человек':(n.type==='gw'?'развилка':'робот'),
     n.who==='human'?'human':(n.type==='gw'?'gate':'auto'),
     '<b>'+esc(n.name)+'</b>'+(n.type==='gw'?' — да, идём дальше':n.type==='timer'?' — таймер поставлен':' — выполнено'));
   i++;step()},n.type==='timer'?820:480)};
 const paint=()=>{const f=(ns)=>ns.forEach(n=>{const e=document.getElementById('bn_'+n.id);
  if(e)e.className=e.className.replace(/\b(live|done|fail)\b/g,'').trim()+' '+(S.wfRun[n.id]||'');
  const l=document.getElementById('lk_'+n.id);
  if(l)l.className=l.className.replace(/ hot/,'')+(S.wfRun[n.id]==='done'?' hot':'');
  if(n.branch)f(n.branch)});f(t.nodes)};
 step()}

let palIdx=0;
function openPal(){document.getElementById('pal').classList.add('open');const i=document.getElementById('palIn');
 i.value='';palIdx=0;renderPal();setTimeout(()=>i.focus(),25)}
function closePal(){document.getElementById('pal').classList.remove('open')}
function palHits(){const q=document.getElementById('palIn').value.toLowerCase().trim();const all=CMDS();
 return q?all.filter(c=>(c.t+' '+c.k+' '+c.h).toLowerCase().includes(q)):all}
function renderPal(){const h=palHits();if(palIdx>=h.length)palIdx=0;
 document.getElementById('palL').innerHTML=h.length?h.map((c,i)=>'<div class="pali'+(i===palIdx?' on':'')+'" onclick="palRun('+i+')">'+
  '<span class="pk2">'+esc(c.k)+'</span><span>'+esc(c.t)+'</span>'+(c.h?'<span class="ph2">'+esc(c.h)+'</span>':'')+'</div>').join('')
  :'<div style="padding:15px;color:var(--muted2);font-size:12.5px">Ничего не нашлось</div>'}
function palRun(i){const h=palHits();if(h[i]){closePal();h[i].go()}}
function palKey(e){const h=palHits();
 if(e.key==='ArrowDown'){palIdx=Math.min(palIdx+1,h.length-1);renderPal();e.preventDefault()}
 else if(e.key==='ArrowUp'){palIdx=Math.max(palIdx-1,0);renderPal();e.preventDefault()}
 else if(e.key==='Enter')palRun(palIdx);
 else if(e.key==='Escape')closePal()}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal()}
 else if(e.key==='Escape'){closePal();closeModal()}});

/* ── слой модели. Прокси держит ключ у себя; без него — сборщик ── */
const AI={ep:'/api/ask',live:null,err:null};
function aiReason(code,detail){
 const d=String(detail||'');
 if(code===0)return['Страница открыта файлом или сервер не запущен','Демо должно открываться через <b>python3 serve.py</b> и адрес localhost:8800 — иначе запросу некуда идти.'];
 if(code===503)return['Ключ не задан','Положите строку ANTHROPIC_API_KEY в файл <b>.env</b> рядом с serve.py и перезапустите сервер.'];
 if(/credit balance/i.test(d))return['На счёте API нет средств','Ключ рабочий, но баланс нулевой. Подписка Claude и API — разные кошельки. Пополнить: <b>console.anthropic.com → Plans &amp; Billing</b>.'];
 if(/authentication|invalid x-api-key/i.test(d))return['Ключ не принят','Проверьте, что в .env скопирован весь ключ целиком, без пробелов и переносов.'];
 if(/rate_limit/i.test(d))return['Слишком часто','Лимит запросов. Подождите несколько секунд и повторите.'];
 if(/not_found|model/i.test(d))return['Модель недоступна','Задайте другую в переменной DEMO_MODEL при запуске сервера.'];
 if(code==='timeout')return['Модель не ответила вовремя','Запрос шёл дольше отведённого времени. Повторите.'];
 return['Модель не ответила','Код '+code+(d?': '+esc(d.slice(0,160)):'')];
}
async function aiAsk(prompt,fallback,ms){
 try{
  const ctl=new AbortController();
  let timedOut=false;
  const to=setTimeout(()=>{timedOut=true;ctl.abort()},ms||9000);
  const r=await fetch(AI.ep,{method:'POST',headers:{'content-type':'application/json'},
   body:JSON.stringify({prompt}),signal:ctl.signal});
  clearTimeout(to);
  if(!r.ok){
   let d='';try{d=JSON.stringify(await r.json())}catch(e){}
   AI.live=false;AI.err=aiReason(r.status,d);return fallback;
  }
  const j=await r.json();
  const t=(j.text||j.completion||'').trim();
  if(!t){AI.live=false;AI.err=aiReason(r.status,'пустой ответ');return fallback}
  AI.live=true;AI.err=null;return t;
 }catch(e){
  AI.live=false;
  AI.err=aiReason(e&&e.name==='AbortError'?'timeout':0,'');
  return fallback;
 }
}
function aiBanner(){
 if(AI.live)return '<div class="dlive on">живая модель отвечает</div>';
 if(!AI.err)return '';
 return '<div class="dwarn" style="margin-top:14px"><b>'+AI.err[0]+'.</b> '+AI.err[1]+
  '<br><br>Демо продолжает работать на правилах — оно читает ваш текст, но не понимает его так же точно, как модель.</div>';
}

function plural(k,one,few,many){const n=Math.abs(k)%100,d=n%10;
 if(n>10&&n<20)return many;if(d>1&&d<5)return few;if(d===1)return one;return many}

/* ── поиск по сети контактов: откат, когда прокси не отвечает ── */
function netSearch(q){
 const w=String(q).toLowerCase().replace(/[^a-zа-яё0-9 ]/gi,' ').split(/\s+/).filter(x=>x.length>2);
 return DB.net.map(p=>{
  const hay=(p.tg.join(' ')+' '+p.r+' '+p.note+' '+p.c).toLowerCase();let s=0;
  w.forEach(x=>{const k=x.slice(0,4);if(hay.includes(k))s++;
   p.tg.forEach(t=>{if(t.toLowerCase().includes(k))s+=2})});
  return{p,s}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,4);
}
function netCard(p,why){
 return '<div class="dres"><div class="rn">'+esc(p.n)+'</div>'+
  '<div class="rr"><b>'+esc(p.r)+'</b> · '+esc(p.c)+'</div>'+
  '<div class="rr">'+esc(why||p.note)+'</div>'+
  '<div class="rr" style="color:var(--muted2)">Последний контакт: '+esc(p.last)+'</div>'+
  '<div class="rt">'+p.tg.map(t=>'<span class="dtag">'+esc(t)+'</span>').join('')+'</div></div>';
}

 const i=D.tools.indexOf(t);

/* ── распознавание работы по словам человека: работает и без модели ── */
const GUESS=[
 ['dealmaker',/прода(ть|ва|жа|ют|ются)|купить|покуп|приобрет|сделк|m&a|владельц|собственник|бизнес на прода|выход из бизнеса|roll.?up|msp/i],
 ['recruiter',/кандидат|резюме|рекрут|наня|найм|ваканс|соискат|executive search|людей.*ищ|ищ.*людей/i],
 ['agency',/заказчик|клиент(ов|ам|ы).*(веду|кампан)|за клиента|от имени клиента|агентств|white.?label/i],
 ['revops',/журнал|аудит|безопасн|закупк|комплаенс|соответств|регламент|отдел продаж|команд(а|ы) продаж/i],
 ['firm',/дважды|повторн|отписк|домен|доставля|сжеч|выгор|репутац/i],
];
function guessSeg(t){
 for(const [id,re] of GUESS) if(re.test(t)) return id;
 return null;
}
function applyPlan(pl){
 if(!pl)return false;
 let touched=false;
 if(Array.isArray(pl.blocks)&&pl.blocks.length){
  const want=pl.blocks.filter(x=>HB[x]);
  if(want.length){
   const known=Object.fromEntries(D.blocks.map(b=>[b.id,b]));
   const out=want.map(id=>known[id]||{id,n:HB[id].t,s:'добавлено по вашему ответу',on:true});
   out.forEach(b=>b.on=true);
   D.blocks.forEach(b=>{if(!want.includes(b.id)){b.on=false;if(!out.find(x=>x.id===b.id))out.push(b)}});
   D.blocks=out;touched=true;
  }
 }
 if(pl.flow&&pl.flow.n&&Array.isArray(pl.flow.steps)&&pl.flow.steps.length){

function buildCFG(){
 const s=SEG[D.seg];
 const why=[];
 why.push(['Вход: '+s.n,s.m+' — отсюда берётся порядок критериев','h']);
 if(D.tools.length)why.push(['Подключаю то, чем вы уже пользуетесь',D.tools.join(' · ')+' — данные переносятся, работать заново не надо','h']);
 if(D.free)why.push(['Учла, как вы описали задачу','«'+(D.free.length>90?D.free.slice(0,90)+'…':D.free)+'»','h']);
 why.push(['Собрала таблицы','одна база на всех: люди, компании, касания, согласия, ящики','']);
 why.push(['Оставила в меню только нужное',s.nav.length+' раздела из семи. Остальные не исчезли — их можно вернуть одной командой','']);
 why.push(['Поставила первый экран',s.home==='memory'?'сегодняшние встречи и контекст к каждой':'отчёт по последней кампании на ваших данных','']);
 why.push(['Завела сквозной учёт касаний','отписка и «уже писали» держатся на человеке, а не на отправителе и не на кампании','']);
 if(D.seg==='agency')why.push(['Добавила слой заказчиков','один человек в кампаниях двух ваших клиентов теперь виден. Этого нет ни у кого на рынке','']);
 if(D.seg==='dealmaker')why.push(['Сменила источник данных','справочники и карты вместо баз персон — ваши цели это компании, а не контакты','']);
 if(D.seg==='revops')why.push(['Включила журнал действий','кто, что и когда — то, чего вам не хватает вместо функций','']);
 if(D.seg==='recruiter')why.push(['Переставила на людей','объект поиска — человек, а не компания; критерий успеха — его согласие','']);
 if(s.warn)why.push(['Сказала честно, чего здесь нет',s.warn.replace(/<[^>]+>/g,''),'h']);
 return{seg:D.seg,nav:s.nav,home:s.home,blocks:D.blocks.map(b=>({...b})),chips:s.chips,
  label:s.n,who:s.who,mark:s.m,tools:D.tools.slice(),free:D.free,why:why};
}

  kv('под параметры',86)+kv('уже предлагали','<b style="color:var(--warn)">19</b>')+
  kv('повторных','<b style="color:var(--ok)">0</b>')},
};
function kv(k,v){return '<div class="kv"><span class="kvk">'+k+'</span><span class="kvv">'+v+'</span></div>'}
function hbGo(id){const x=HB[id];if(x)x.go()}

function vHome(){
 const c=CFG;
 let h='<div class="ph"><div class="pk">Ваше место</div><div class="pt">Собрано по трём ответам</div>'+
  '<div class="pd">Вход: <b>'+esc(c.label)+'</b> · '+esc(c.mark)+
  '. Состав и порядок блоков — ваш вид; у другой роли он другой, а база под ним одна и та же.</div></div>';
 const on=c.blocks.filter(b=>b.on&&HB[b.id]);
 h+='<div class="g3">'+on.map(b=>{const x=HB[b.id];
  return '<div class="card lnk" style="color:inherit" onclick="hbGo(\''+b.id+'\')">'+
   '<div class="ch"><div class="ct">'+esc(x.t)+'</div></div>'+x.b()+'</div>'}).join('')+'</div>';
 h+='<div class="ph" style="margin-top:22px"><div class="pt" style="font-size:16px">Что система сделала без вас</div>'+
  '<div class="pd">За прохождение: <b>сама '+S.iv.auto+'</b> раз, <b>спросила '+S.iv.asked+
  '</b>. Счётчик живёт внизу и считает дальше — это главный прибор продукта, а не украшение.</div></div>';
 const off=c.blocks.filter(b=>!b.on);
 if(off.length)h+='<div class="pd">Скрыто вами: '+off.map(b=>esc(b.n)).join(' · ')+
  '. Вернуть — <b>⌘K</b>.</div>';
 if(c.free)h+='<div class="card" style="margin-top:14px"><div class="ch"><div class="ct">Как я поняла вашу задачу</div></div>'+
  '<div class="pd">«'+esc(c.free)+'»</div></div>';
 return h;
}


function dSkip(){
 if(!D.seg){D.seg='firm';D.blocks=SEG.firm.blocks.map(b=>({...b}));D.auto=118;D.asked=7}
 CFG=buildCFG();dFinish();
}

/* ═════ СТАРТ ═════ */
log('система','sys','Место собрано по вашим ответам. Данные демонстрационные, всё нажимается.');
render();renderBot();dRender();
</script>
</body>
