<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lusin — how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --graphite:#14171F; --navy:#131A54; --signal:#0057FF;
  --echo:#A9BDF0; --mist:#DCEBF8; --paper:#F7F9FC;
  --line:#E3EAF3; --body:#3B4453; --quiet:#6E7A8C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:400 15px/1.6 Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--graphite); background:var(--paper); -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.02em; color:var(--navy)}
h1{font-size:30px; line-height:1.2}
h2{font-size:19px}
p{margin:0}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
a{color:var(--signal)}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  text-transform:uppercase; letter-spacing:.16em; font-size:10.5px; font-weight:500}

/* ——— frame ——— */
.app{display:flex; min-height:100vh}
.side{width:232px; flex:0 0 232px; background:var(--graphite); color:#fff;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{padding:22px 20px 18px; border-bottom:1px solid rgba(169,189,240,.16)}
.brand img{height:26px; display:block}
.brand .prod{margin-top:12px; font-size:17px; font-weight:800; letter-spacing:-.02em}
.brand .sub{color:var(--echo); margin-top:4px; opacity:.85}
.navgroup{padding:16px 12px 4px}
.navlabel{color:var(--echo); opacity:.6; padding:0 8px 8px}
.nav{display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 9px; border-radius:7px; font-size:14px; font-weight:500; color:rgba(255,255,255,.78)}
.nav:hover{background:rgba(169,189,240,.10); color:#fff}
.nav.on{background:rgba(169,189,240,.16); color:#fff}
.nav i{width:7px; height:7px; border-radius:50%; background:var(--echo); flex:0 0 7px; opacity:.5}
.nav.on i{background:var(--signal); opacity:1; box-shadow:0 0 0 3px rgba(0,87,255,.22)}
.sidefoot{margin-top:auto; padding:16px 20px 20px; color:var(--echo); opacity:.7;
  font-size:12px; line-height:1.55}

.main{flex:1; min-width:0}
.topbar{display:flex; align-items:center; gap:16px; padding:14px 28px;
  border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:20}
.askbtn{flex:1; max-width:540px; text-align:left; border:1px solid var(--line); border-radius:8px;
  padding:9px 13px; font-size:14px; color:var(--quiet); background:var(--paper)}
.askbtn:hover{border-color:var(--echo); background:#fff}
.askbtn kbd{float:right; font-family:"JetBrains Mono",monospace; font-size:10.5px;
  color:var(--quiet); border:1px solid var(--line); border-radius:4px; padding:3px 6px; background:#fff}
.counter{display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff}
.counter div{padding:7px 15px; text-align:center}
.counter div+div{border-left:1px solid var(--line)}
.counter b{display:block; font-family:"JetBrains Mono",monospace; font-size:19px;
  font-weight:500; line-height:1.1; color:var(--navy)}
.counter .act b{color:var(--signal)}
.counter span{color:var(--quiet); display:block; margin-top:2px}
.wrap{padding:30px 28px 90px; max-width:1020px}

/* ——— pieces ——— */
.lead{color:var(--body); font-size:15px; max-width:68ch; margin-top:10px}
.sec{margin-top:34px}
.sec>h2{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.sec>h2 .n{color:var(--quiet); font-weight:400}
.card{background:#fff; border:1px solid var(--line); border-radius:10px}
.pad{padding:18px 20px}
.muted{color:var(--quiet)}
.tiny{font-size:13.5px}
.tag{display:inline-block; font-family:"JetBrains Mono",monospace; font-size:9.5px;
  text-transform:uppercase; letter-spacing:.14em; padding:4px 8px; border-radius:4px;
  background:var(--mist); color:var(--navy)}
.tag.warm{background:rgba(0,87,255,.10); color:var(--signal)}
.tag.cold{background:#EEF2F7; color:var(--quiet)}
.btn{background:var(--signal); color:#fff; padding:8px 16px; border-radius:7px;
  font-size:14px; font-weight:600}
.btn:hover{background:#0049D6}
.btn.ghost{background:#fff; color:var(--navy); border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--echo)}
.btn.quiet{background:none; color:var(--quiet); border:1px solid var(--line);
  font-size:13px; font-weight:500; padding:7px 12px}
.btn.quiet:hover{color:var(--navy); border-color:var(--echo)}

.av{width:42px; height:42px; border-radius:50%; background:var(--mist); color:var(--navy);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; flex:0 0 42px}
.av.lg{width:68px; height:68px; font-size:22px; flex:0 0 68px}
.av.sm{width:26px; height:26px; font-size:10px; flex:0 0 26px}

/* decisions */
.dec{display:flex; gap:16px; padding:18px 20px}
.dec+.dec{border-top:1px solid var(--line)}
.dec .b{flex:1; min-width:0}
.dec .q{font-weight:700; color:var(--navy); margin-bottom:3px}
.dec .why{color:var(--body); font-size:14px}
.ev{margin-top:11px; padding:11px 13px; background:var(--paper); border:1px solid var(--line);
  border-radius:7px; font-size:13.5px; color:var(--body)}
.ev .src{display:block; margin-top:5px; color:var(--quiet)}
.acts{display:flex; gap:8px; margin-top:13px; flex-wrap:wrap; align-items:center}
.done{color:var(--signal); font-size:14px; font-weight:600; padding-top:4px}

/* feed */
.fd{display:flex; gap:14px; padding:12px 20px; align-items:flex-start}
.fd+.fd{border-top:1px solid var(--line)}
.fd .t{flex:0 0 58px; color:var(--quiet)}
.fd .x{flex:1; font-size:14px; color:var(--body)}
.fd .x b{color:var(--navy); font-weight:600}

/* person */
.phead{display:flex; gap:18px; padding:20px}
.pname{font-size:21px; font-weight:700; color:var(--navy); letter-spacing:-.02em}
.state{margin-top:12px; padding:13px 15px; background:rgba(0,87,255,.05);
  border:1px solid rgba(0,87,255,.18); border-radius:8px; font-size:13.5px; color:var(--body)}
.state b{color:var(--navy)}
.tr{display:flex; gap:14px; padding:13px 20px; align-items:flex-start}
.tr+.tr{border-top:1px solid var(--line)}
.tr .d{flex:0 0 66px; color:var(--quiet); padding-top:3px}
.tr .c{flex:0 0 104px; padding-top:1px}
.tr .s{flex:1; font-size:14px; color:var(--body)}
.tr .s b{color:var(--navy)}
.tr .src{margin-top:3px; color:var(--quiet)}
.nofields{padding:13px 20px; font-size:13.5px; color:var(--quiet);
  background:var(--paper); border-top:1px solid var(--line); border-radius:0 0 10px 10px}

/* table */
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; padding:11px 14px; border-bottom:1px solid var(--line);
  color:var(--quiet); font-weight:500}
td{padding:12px 14px; border-bottom:1px solid var(--line); color:var(--body)}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--navy); font-weight:600}

/* agents */
.ag{padding:18px 20px}
.ag+.ag{border-top:1px solid var(--line)}
.ag.ours{border-left:3px solid var(--signal)}
.aghead{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.agname{font-weight:700; color:var(--navy); font-size:15.5px}
.rules{display:grid; grid-template-columns:104px 1fr; gap:6px 16px; margin-top:13px; font-size:14px}
.rules dt{color:var(--quiet); padding-top:3px}
.rules dd{margin:0; color:var(--body)}

/* ask */
.veil{position:fixed; inset:0; background:rgba(20,23,31,.42); display:none; z-index:60}
.veil.on{display:block}
.ask{position:fixed; left:50%; top:15vh; transform:translateX(-50%); width:min(600px,92vw);
  background:#fff; border-radius:12px; box-shadow:0 24px 60px rgba(20,23,31,.32); z-index:61; display:none}
.ask.on{display:block}
.ask input{width:100%; border:0; border-bottom:1px solid var(--line); padding:18px 20px;
  font:400 16px Manrope,sans-serif; outline:none; border-radius:12px 12px 0 0; color:var(--graphite)}
.chips{padding:14px 16px; display:flex; gap:8px; flex-wrap:wrap}
.chip{display:flex; align-items:center; gap:9px; border:1px solid var(--line); background:#fff;
  border-radius:22px; padding:5px 14px 5px 6px; font-size:13.5px; color:var(--body)}
.chip:hover{border-color:var(--signal); color:var(--signal)}
.asknote{padding:0 20px 16px; font-size:13px; color:var(--quiet)}

/* scenario */
.sc{position:fixed; right:20px; bottom:20px; width:340px; background:var(--graphite);
  color:#fff; border-radius:11px; box-shadow:0 16px 40px rgba(20,23,31,.30); z-index:40}
.sc .h{padding:13px 16px; border-bottom:1px solid rgba(169,189,240,.16); display:flex; align-items:center; gap:10px}
.sc .h b{flex:1; font-size:14px; font-weight:700}
.sc .h .btn.quiet{border-color:rgba(169,189,240,.3); color:var(--echo)}
.sc .h .btn.quiet:hover{color:#fff; border-color:var(--echo)}
.st{display:flex; gap:11px; padding:9px 16px; font-size:13.5px; width:100%; text-align:left;
  color:rgba(255,255,255,.6)}
.st b{flex:0 0 20px; height:20px; border-radius:50%; background:rgba(169,189,240,.18);
  color:var(--echo); font-family:"JetBrains Mono",monospace; font-size:10px; font-weight:500;
  display:flex; align-items:center; justify-content:center; margin-top:2px}
.st.on{color:#fff}
.st.on b{background:var(--signal); color:#fff}
.st.past b{background:var(--echo); color:var(--graphite)}
.st:hover{background:rgba(169,189,240,.08)}
.sc .f{padding:12px 16px 14px; border-top:1px solid rgba(169,189,240,.16);
  display:flex; gap:10px; align-items:center}
.sc .f span{flex:1; font-size:12px; color:var(--echo); opacity:.85; line-height:1.4}
.flash{animation:fl 1.6s ease-out}
@keyframes fl{0%{background:rgba(0,87,255,.08)}100%{background:transparent}}

@media (max-width:860px){
  .app{flex-direction:column}
  .side{width:100%; flex:none; height:auto; position:static}
  .sidefoot{display:none}
  .wrap{padding:20px 18px 80px}
  .sc{left:14px; right:14px; width:auto; bottom:14px}
  h1{font-size:25px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <img src="assets/intwin-lockup-light-1800.png" alt="Intwin">
      <div class="prod">Lusin</div>
      <div class="sub mono">Prototype · 24 Sep</div>
    </div>
    <div class="navgroup">
      <div class="navlabel mono">Work</div>
      <button class="nav on" data-p="today"><i></i>Today</button>
      <button class="nav" data-p="person"><i></i>Person</button>
    </div>
    <div class="navgroup">
      <div class="navlabel mono">Setup · rarely</div>
      <button class="nav" data-p="data"><i></i>Data</button>
      <button class="nav" data-p="agents"><i></i>Who does what</button>
    </div>
    <div class="sidefoot">Two screens to work in,<br>two to set up.<br>There is nothing else.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="askbtn" onclick="openAsk()">Ask, or drop a card, a photo, a name… <kbd>⌘K</kbd></button>
      <div class="counter">
        <div class="act"><b id="c1">14</b><span class="mono">Acted</span></div>
        <div><b id="c2">3</b><span class="mono">Asked</span></div>
      </div>
    </div>
    <div class="wrap" id="page"></div>
  </div>
</div>

<div class="veil" id="veil" onclick="closeAsk()"></div>
<div class="ask" id="ask">
  <input id="askin" placeholder="Who is this? What did we agree? What happens next?" autocomplete="off">
  <div class="chips">
    <button class="chip" onclick="pickPerson()"><span class="av sm">JR</span>photo from the conference</button>
    <button class="chip" onclick="pickPerson()"><span class="av sm">BC</span>business card, pink one</button>
    <button class="chip" onclick="pickPerson()">“heavy-set guy, Joel or Joan”</button>
  </div>
  <div class="asknote">You do not need to remember the name. A face, a card or half a phrase is enough.</div>
</div>

<div class="sc">
  <div class="h"><b>End-to-end path</b><button class="btn quiet" onclick="resetAll()">Restart</button></div>
  <div id="steps"></div>
  <div class="f"><span id="scnote"></span><button class="btn" id="scbtn" onclick="nextStep()">Next</button></div>
</div>

<script>
const S={page:'today',step:0,self:14,asked:3,added:false,stopped:false,dec:{d1:null,d2:null,d3:null},feed:[]};

const BASE=[
 ['09:58','<b>Keeps records</b> — created 3 contacts from yesterday’s email, sent 1 for review'],
 ['09:41','<b>Moves stages</b> — Brightpath Legal: “First conversation” → “Meeting booked”'],
 ['09:20','<b>Watches commitments</b> — 2 conversations went quiet with a step still owed, tasks created'],
 ['08:47','<b>Sorts out duplicates</b> — “D. Whitfield” and “Dana Whitfield” look like one person, evidence collected'],
 ['08:30','<b>Guards the line</b> — checked 412 people in cold sequences, no conflicts found'],
 ['yesterday','<b>Keeps records</b> — took 2 commitments and a next step out of the 16:00 meeting']
];

const STEPS=[
 ['You dropped a business card','The agent created the record and handed back a summary while you were still talking'],
 ['The agent stopped the sequence','A cold sequence was running against this person. He is no longer cold'],
 ['“Who was that guy?”','A week later you do not recall the name. You search by face'],
 ['The day on one screen','What was done without you, and what needs your decision']
];

function go(p){S.page=p;render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.p));

function render(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.p===S.page));
  c1.textContent=S.self; c2.textContent=S.asked;
  page.innerHTML=({today:pgToday,person:pgPerson,data:pgData,agents:pgAgents})[S.page]();
  steps.innerHTML=STEPS.map((s,i)=>`<button class="st ${i===S.step?'on':(i<S.step?'past':'')}" onclick="gotoStep(${i})"><b>${i<S.step?'✓':i+1}</b><span>${s[0]}</span></button>`).join('');
  scnote.textContent=STEPS[Math.min(S.step,3)][1];
  scbtn.textContent=S.step>=3?'Done':'Next';
  window.scrollTo(0,0);
}

function gotoStep(i){
  if(i===1&&!S.added) S.feed.unshift(['now','<b>Keeps records</b> — Joel Ramirez created from a business card, enriched, photo pulled in']);
  if(i===2&&!S.stopped){S.feed.unshift(['now','<b>Guards the line</b> — cold sequence stopped for Joel Ramirez: he has turned warm']); S.self++;}
  S.step=i; S.added=i>=1; S.stopped=i>=2;
  S.page=(i===0||i===3)?'today':'person';
  render();
}
function nextStep(){gotoStep(S.step<3?S.step+1:0)}
function resetAll(){S.self=14;S.asked=3;S.dec={d1:null,d2:null,d3:null};S.feed=[];gotoStep(0)}

function pgToday(){
  const open=['d1','d2','d3'].filter(k=>!S.dec[k]).length;
  return `<h1>Today, Thursday</h1>
  <p class="lead">This is the only screen you work in. Above the line — what the system did without you.
  Below — the few things that need your decision. There is nothing here to fill in: the records are kept by agents.</p>

  ${S.step===0?`<div class="sec"><div class="card pad" style="border-color:rgba(0,87,255,.3)">
    <h2>Start here</h2>
    <p class="tiny muted" style="margin-top:8px">You are at a conference. Someone hands you a card.
    You drop it into the chat and carry on talking.</p>
    <div class="acts"><button class="btn" onclick="gotoStep(1)">Drop the card</button>
    <span class="tiny muted">the agent answers in 8 seconds</span></div></div></div>`:''}

  <div class="sec">
    <h2>Needs your decision <span class="n">${open} of 3 · the rest was decided without you</span></h2>
    <div class="card" style="margin-top:12px">
      ${dec('d1','ER','Elaine Rodriguez','Replied “let’s come back to this after the 15th.” Set a reminder for 16 October?',
        'Classified the reply as “not now.” You usually move these to the day after the date named.',
        'From the email: <b>“interested, but let’s come back after the 15th”</b> · 3 October, 11:42')}
      ${dec('d2','DW','Dana Whitfield','This looks like the same person as “D. Whitfield.” Merge the records?',
        'Same email domain and company, but the names are written differently. Did not merge on its own.',
        'Two records: <b>dana@corwinreed.com</b> (from the website) and <b>d.whitfield@corwinreed.com</b> (from your email)')}
      ${dec('d3','MC','Maya Chen','Send on your behalf, or prepare a draft?',
        'She is warm — she replied to you in August. That means the email goes from your mailbox under your name.',
        'Rule: <b>always ask on warm people.</b> On cold ones the agent acts within policy.')}
    </div>
  </div>

  <div class="sec">
    <h2>Done without you <span class="n">today</span></h2>
    <div class="card" style="margin-top:12px">
      ${S.feed.map(f=>`<div class="fd flash"><div class="t mono">${f[0]}</div><div class="x">${f[1]}</div></div>`).join('')}
      ${BASE.map(f=>`<div class="fd"><div class="t mono">${f[0]}</div><div class="x">${f[1]}</div></div>`).join('')}
    </div>
    <p class="tiny muted" style="margin-top:11px">Every line is work a person used to do by hand. The counter at the top
    is the ratio of <b>acted</b> to <b>asked</b>. The product’s promise is that the left number grows and the right one falls.</p>
  </div>`;
}

function dec(id,ini,name,q,why,ev){
  const v=S.dec[id];
  if(v) return `<div class="dec"><span class="av">${ini}</span><div class="b"><div class="q">${name}</div><div class="done">✓ ${v}</div></div></div>`;
  return `<div class="dec"><span class="av">${ini}</span><div class="b">
    <div class="q">${name}</div><div class="why">${q}</div>
    <div class="ev">${why}<span class="src mono">${ev}</span></div>
    <div class="acts">
      <button class="btn" onclick="decide('${id}','Done')">Yes</button>
      <button class="btn ghost" onclick="decide('${id}','Declined')">No</button>
      <button class="btn quiet" onclick="decide('${id}','Corrected and done')">Correct it</button>
      <button class="btn quiet" onclick="trust('${id}')">Decide these yourself from now on</button>
    </div></div></div>`;
}
function decide(id,l){S.dec[id]=l;S.self++;S.asked=Math.max(0,S.asked-1);render()}
function trust(id){S.dec[id]='Done — and this kind of question will not be asked again';S.self++;S.asked=Math.max(0,S.asked-1);
  S.feed.unshift(['now','<b>Rule accepted</b> — the system no longer asks this class of question']);render()}

function pgPerson(){
  const stop=S.stopped?`<div class="tr" style="background:rgba(0,87,255,.04)">
    <div class="d mono">today</div><div class="c"><span class="tag warm">The line</span></div>
    <div class="s"><b>Cold sequence stopped.</b> He turned warm — you met in person.
    <div class="src mono">Guards the line · email 3 of 6 never sent · cold mailboxes will not touch him again</div></div></div>`:'';
  const add=S.added?`<div class="tr flash"><div class="d mono">today</div><div class="c"><span class="tag">Card</span></div>
    <div class="s"><b>Met in person at the conference.</b> Record created from the card, filled in from public sources.
    <div class="src mono">Keeps records · 8 seconds · photo pulled from LinkedIn</div></div></div>`:'';
  return `<h1>Joel Ramirez</h1>
  <p class="lead">A memory screen, not a form. There is nothing to fill in — everything visible here
  was written by agents. A person comes here to remember and to decide.</p>

  ${S.step===2?`<div class="sec"><div class="card pad" style="border-color:rgba(0,87,255,.3)">
    <h2>You searched by face</h2>
    <p class="tiny muted" style="margin-top:8px">You did not remember the name — only that he was
    “a heavy-set guy, Joel or Joan.” That is enough: the search takes a photo, a card or half a phrase.</p></div></div>`:''}

  <div class="sec"><div class="card">
    <div class="phead"><span class="av lg">JR</span><div style="flex:1">
      <div class="pname">Joel Ramirez</div>
      <div class="tiny muted">Director of Operations · Harborline Partners · New York · 60 people</div>
      <div class="state"><b>Warm since 24 September.</b> He turned warm because you met in person at a conference.
      Before that he was cold: he entered the base as a match for the selection rule, with no interaction.
      <br><span class="mono" style="display:block;margin-top:7px;color:var(--quiet);letter-spacing:.1em;text-transform:none;font-size:11.5px">
      The line between cold and warm is the fact of two-way contact. It decides which mailbox sends and whether the system asks first.</span></div>
    </div></div>
    <div style="border-top:1px solid var(--line)">
      ${add}${stop}
      <div class="tr"><div class="d mono">18 Sep</div><div class="c"><span class="tag cold">Cold</span></div>
        <div class="s">Email 2 of 6 — opened, no reply
        <div class="src mono">sequence “MSP · New York · 25–100 staff” · mailbox outreach-3</div></div></div>
      <div class="tr"><div class="d mono">11 Sep</div><div class="c"><span class="tag cold">Cold</span></div>
        <div class="s">Email 1 of 6 — delivered
        <div class="src mono">sequence “MSP · New York · 25–100 staff” · mailbox outreach-3</div></div></div>
      <div class="tr"><div class="d mono">9 Sep</div><div class="c"><span class="tag">Signal</span></div>
        <div class="s">The company is hiring a systems administrator
        <div class="src mono">evidence source: job posting on the company site, published 4 September</div></div></div>
      <div class="tr"><div class="d mono">2 Sep</div><div class="c"><span class="tag">Created</span></div>
        <div class="s">Matched the selection rule: professional services, 25–100 staff, no internal IT lead
        <div class="src mono">Keeps records · checked against public data</div></div></div>
    </div>
    <div class="nofields">Not one field for manual entry. Agents keep the records; a person only corrects them
    when the system has asked.</div>
  </div></div>

  <div class="sec"><h2>What happens next</h2>
    <div class="card pad" style="margin-top:12px">
      <p style="font-weight:700;color:var(--navy)">You agreed to send a service description by the end of the week.</p>
      <p class="tiny muted" style="margin-top:6px">Taken out of the conversation at the conference. The deadline is Friday —
      if there is no email by Thursday, the system will say so.</p>
      <div class="acts"><button class="btn" onclick="alert('Not wired up in the prototype.\\n\\nIn the product: the agent drafts the email in your voice,\\nyou correct it and send.')">Prepare the email</button>
      <button class="btn ghost" onclick="go('today')">Back to work</button></div>
    </div></div>`;
}

function pgData(){
  const R=[['Joel Ramirez','Harborline Partners','warm','today','met in person'],
    ['Maya Chen','Brightpath Legal','warm','12 Aug','replied'],
    ['Dana Whitfield','Corwin &amp; Reed','warm','5 Sep','replied'],
    ['Elaine Rodriguez','Ashford Group','warm','3 Oct','replied'],
    ['Marcus Hall','Delaney &amp; Sons','cold','18 Sep','—'],
    ['Priya Nair','Westgate Advisors','cold','21 Sep','—']];
  return `<h1>Data</h1>
  <p class="lead">An architect’s screen, not an operator’s. Opened rarely — to check completeness,
  or to correct what an agent flagged as uncertain. A table, because nothing better than a table
  has been invented for a database.</p>
  <div class="sec"><div class="card" style="overflow:auto">
    <table><thead><tr><th class="mono">Person</th><th class="mono">Company</th><th class="mono">State</th>
    <th class="mono">Last touch</th><th class="mono">What made them warm</th></tr></thead>
    <tbody>${R.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td>
      <td><span class="tag ${r[2]==='warm'?'warm':'cold'}">${r[2]}</span></td>
      <td class="mono" style="font-size:12px">${r[3]}</td><td class="muted">${r[4]}</td></tr>`).join('')}</tbody></table>
  </div></div>
  <div class="sec"><h2>What a person may not touch</h2>
    <div class="card pad" style="margin-top:12px">
      <p class="tiny">Every field carries its own policy. Descriptive — the agent fills it itself.
      Identifying — only with confirmation. Consequential — never automatically.
      Computed — not editable at all, otherwise the touch ledger cannot be trusted.</p>
      <div class="rules" style="margin-top:15px">
        <dt class="mono">Itself</dt><dd>job title, city, industry, photo</dd>
        <dt class="mono">With review</dt><dd>name, email, profile link — these identify the person</dd>
        <dt class="mono">Never</dt><dd>phone, “do not contact”, notes — these carry consequences</dd>
        <dt class="mono">System only</dt><dd>touch times, cold or warm state, which agent did what</dd>
      </div></div></div>`;
}

function pgAgents(){
  const A=[
   ['Keeps records','creates and links records from email, business cards and meetings',
    'creates the record, fills it in from public sources, pulls the photo',
    'never writes to the person and never touches anything consequential',
    'when it is not certain this is the same person',0],
   ['Watches commitments','finds conversations that went quiet with a step still owed',
    'locates the commitment in the thread, creates the task and drafts the text',
    'never sends — it only prepares',
    'always, if the person is warm: the email would go from your mailbox',0],
   ['Moves stages','keeps the pipeline matching what is actually happening',
    'moves a record on by the plain-language description of the stage',
    'never closes a deal and never changes an amount',
    'when the events can be read two ways',0],
   ['Sorts out duplicates','finds records that look like the same person',
    'collects the evidence and shows what disagrees',
    'never merges records silently on a matching name',
    'always — resolving an identity is a person’s decision',0],
   ['Guards the line','keeps the cold machine away from anyone who has turned warm',
    'stops the cold sequence the moment the person replies or you meet in person',
    'never decides what to say next',
    'if the sequence can no longer be stopped — an email already queued',1]];
  return `<h1>Who does what</h1>
  <p class="lead">Five agents. None of them writes cold email — all five keep the records matching reality.
  That is why the product has no forms: filling in a CRM by hand makes no sense once agents are doing the writing.</p>
  <div class="sec"><div class="card">
    ${A.map(a=>`<div class="ag ${a[5]?'ours':''}">
      <div class="aghead"><span class="agname">${a[0]}</span><span class="tiny muted">${a[1]}</span>
      ${a[5]?'<span class="tag warm">Nobody else has this</span>':''}</div>
      <div class="rules"><dt class="mono">Does</dt><dd>${a[2]}</dd>
      <dt class="mono">Never</dt><dd>${a[3]}</dd>
      <dt class="mono">Asks</dt><dd>${a[4]}</dd></div></div>`).join('')}
  </div></div>
  <div class="sec"><h2>The autonomy rule</h2>
    <div class="card pad" style="margin-top:12px">
      <p class="tiny"><b style="color:var(--navy)">Cold person</b> — the agent acts on its own within policy.
      They do not know you yet, the email goes from a disposable mailbox, the cost of a mistake is low.</p>
      <p class="tiny" style="margin-top:9px"><b style="color:var(--navy)">Warm person</b> — the agent always asks.
      The email goes from your mailbox under your name; you pay with your reputation.</p>
      <p class="tiny muted" style="margin-top:12px">This is why cold and warm are not two tabs in a menu.
      They are the rule that decides whether the system acts or asks — and why the fifth agent exists:
      a line needs someone watching it.</p>
    </div></div>`;
}

function openAsk(){veil.classList.add('on');ask.classList.add('on');askin.focus()}
function closeAsk(){veil.classList.remove('on');ask.classList.remove('on');askin.value=''}
function pickPerson(){closeAsk();gotoStep(Math.max(S.step,2))}
askin.addEventListener('keydown',e=>{if(e.key==='Enter')pickPerson()});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openAsk()}
  if(e.key==='Escape')closeAsk()});

render();
</script>
