<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lusin — как это работает</title>
<style>
:root{
  --slate:#31435B; --teal:#2E7780; --steel:#A9C5D6; --mist:#DCE5EC;
  --ink:#151A1F; --gray:#C9D2DC; --paper:#FAF9F6;
  --w:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; font-weight:600; letter-spacing:-.01em}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:15px}
p{margin:0}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}
a{color:var(--teal)}

/* ————— каркас ————— */
.app{display:flex; min-height:100vh}
.side{
  width:216px; flex:0 0 216px; background:var(--slate); color:var(--w);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:18px 18px 14px; border-bottom:1px solid rgba(255,255,255,.14)}
.brand b{font-size:16px; letter-spacing:-.01em}
.brand span{display:block; font-size:11.5px; opacity:.66; margin-top:3px}
.navgroup{padding:14px 10px 4px}
.navlabel{font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; opacity:.5; padding:0 8px 6px}
.nav{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:8px 8px; border-radius:6px; font-size:14px; color:rgba(255,255,255,.82);
}
.nav:hover{background:rgba(255,255,255,.08); color:#fff}
.nav.on{background:rgba(255,255,255,.15); color:#fff; font-weight:500}
.nav .dot{width:6px; height:6px; border-radius:50%; background:var(--steel); flex:0 0 6px; opacity:.7}
.nav.on .dot{background:var(--steel); opacity:1}
.sidefoot{margin-top:auto; padding:14px 18px 18px; font-size:11.5px; opacity:.6; line-height:1.5}

.main{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{
  display:flex; align-items:center; gap:14px; padding:14px 26px;
  border-bottom:1px solid var(--mist); background:var(--w); position:sticky; top:0; z-index:20;
}
.askbtn{
  flex:1; max-width:520px; text-align:left; border:1px solid var(--gray); border-radius:8px;
  padding:8px 12px; font-size:13.5px; color:#6b7684; background:var(--paper);
}
.askbtn:hover{border-color:var(--steel); background:var(--w)}
.askbtn kbd{float:right; font:11px/1 inherit; color:#8a95a3; border:1px solid var(--gray);
  border-radius:4px; padding:3px 5px; background:var(--w)}
.counter{display:flex; gap:0; align-items:stretch; border:1px solid var(--mist); border-radius:8px; overflow:hidden}
.counter div{padding:6px 12px; text-align:center; background:var(--w)}
.counter div+div{border-left:1px solid var(--mist)}
.counter b{display:block; font-size:17px; line-height:1.1; color:var(--slate)}
.counter.hl b{color:var(--teal)}
.counter span{font-size:10.5px; color:#6b7684}
.wrap{padding:26px; max-width:1060px}

/* ————— общие блоки ————— */
.lead{color:#4b5765; font-size:14.5px; max-width:70ch; margin-top:6px}
.sec{margin-top:30px}
.sec>h2{display:flex; align-items:baseline; gap:10px}
.sec>h2 em{font-style:normal; font-size:12.5px; color:#77828f; font-weight:400}
.card{background:var(--w); border:1px solid var(--mist); border-radius:10px}
.pad{padding:16px 18px}
.rowline{border-top:1px solid var(--mist)}
.muted{color:#6b7684}
.tiny{font-size:12.5px}
.mini{font-size:11.5px}
.tag{display:inline-block; font-size:11px; padding:2px 7px; border-radius:20px; background:var(--mist); color:var(--slate)}
.tag.warm{background:#E3EFF0; color:var(--teal)}
.tag.cold{background:var(--mist); color:#5a6775}
.tag.agent{background:var(--paper); border:1px solid var(--gray); color:#5a6775}
.btn{border:1px solid var(--slate); background:var(--slate); color:#fff; padding:7px 14px; border-radius:7px; font-size:13.5px}
.btn:hover{opacity:.9}
.btn.ghost{background:var(--w); color:var(--slate)}
.btn.ghost:hover{background:var(--paper)}
.btn.quiet{border-color:var(--gray); background:var(--w); color:#5a6775; font-size:12.5px; padding:6px 11px}
.btn.quiet:hover{border-color:var(--steel); color:var(--slate)}

/* ————— решения ————— */
.dec{display:flex; gap:14px; padding:16px 18px}
.dec+.dec{border-top:1px solid var(--mist)}
.dec .who{flex:0 0 40px}
.av{width:40px; height:40px; border-radius:50%; background:var(--steel); color:var(--slate);
  display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px}
.av.lg{width:64px; height:64px; font-size:21px}
.av.sm{width:26px; height:26px; font-size:10.5px}
.dec .body{flex:1; min-width:0}
.dec .q{font-weight:600; margin-bottom:3px}
.dec .why{color:#4b5765; font-size:13.5px}
.dec .ev{margin-top:9px; padding:9px 12px; background:var(--paper); border:1px solid var(--mist);
  border-radius:7px; font-size:12.8px; color:#4b5765}
.dec .ev b{color:var(--ink)}
.acts{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center}
.done{padding:14px 18px; color:var(--teal); font-size:13.5px}

/* ————— лента ————— */
.feed{display:flex; gap:12px; padding:11px 18px; align-items:flex-start}
.feed+.feed{border-top:1px solid var(--mist)}
.feed .t{flex:0 0 46px; color:#8a95a3; font-size:12px; padding-top:1px}
.feed .x{flex:1; font-size:13.5px}
.feed .x b{font-weight:600}

/* ————— карточка человека ————— */
.phead{display:flex; gap:16px; align-items:flex-start; padding:18px}
.phead .meta{flex:1}
.pname{font-size:19px; font-weight:600}
.state{margin-top:10px; padding:10px 13px; background:#E9F1F2; border:1px solid #CADEE0;
  border-radius:8px; font-size:13px; color:#2b5f66}
.track{padding:2px 0 8px}
.tr{display:flex; gap:12px; padding:11px 18px; align-items:flex-start}
.tr+.tr{border-top:1px solid var(--mist)}
.tr .d{flex:0 0 58px; color:#8a95a3; font-size:12px}
.tr .c{flex:0 0 96px}
.tr .s{flex:1; font-size:13.5px}
.tr .src{font-size:11.5px; color:#8a95a3; margin-top:2px}
.nofields{padding:12px 18px; font-size:12.5px; color:#77828f; background:var(--paper); border-top:1px solid var(--mist)}

/* ————— таблица ————— */
table{width:100%; border-collapse:collapse; font-size:13.5px}
th{text-align:left; font-weight:600; font-size:11.5px; text-transform:uppercase;
  letter-spacing:.05em; color:#77828f; padding:9px 12px; border-bottom:1px solid var(--mist)}
td{padding:10px 12px; border-bottom:1px solid var(--mist)}
tr:last-child td{border-bottom:0}
.sys{font-size:11px; color:#8a95a3}

/* ————— агенты ————— */
.ag{padding:16px 18px}
.ag+.ag{border-top:1px solid var(--mist)}
.aghead{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.agname{font-weight:600}
.agrule{display:grid; grid-template-columns:132px 1fr; gap:4px 14px; margin-top:11px; font-size:13.3px}
.agrule dt{color:#77828f; font-size:12.3px; padding-top:1px}
.agrule dd{margin:0; color:#37424f}
.agrule dd.no{color:#8a5a5a}
.ours{border-left:3px solid var(--teal)}

/* ————— спроси ————— */
.veil{position:fixed; inset:0; background:rgba(21,26,31,.34); display:none; z-index:60}
.veil.on{display:block}
.ask{position:fixed; left:50%; top:16vh; transform:translateX(-50%); width:min(620px,92vw);
  background:var(--w); border-radius:12px; box-shadow:0 20px 50px rgba(21,26,31,.28); z-index:61; display:none}
.ask.on{display:block}
.ask input{width:100%; border:0; border-bottom:1px solid var(--mist); padding:17px 18px;
  font:15.5px inherit; outline:none; border-radius:12px 12px 0 0}
.chips{padding:12px 14px 14px; display:flex; gap:8px; flex-wrap:wrap}
.chip{display:flex; align-items:center; gap:8px; border:1px solid var(--gray); background:var(--w);
  border-radius:20px; padding:5px 12px 5px 6px; font-size:13px}
.chip:hover{border-color:var(--teal); color:var(--teal)}
.asknote{padding:0 18px 14px; font-size:12.2px; color:#8a95a3}

/* ————— сценарий ————— */
.sc{position:fixed; right:18px; bottom:18px; width:330px; background:var(--w);
  border:1px solid var(--gray); border-radius:11px; box-shadow:0 12px 30px rgba(21,26,31,.14); z-index:40}
.sc .h{padding:12px 15px; border-bottom:1px solid var(--mist); display:flex; align-items:center; gap:8px}
.sc .h b{font-size:13.5px; flex:1}
.sc .steps{padding:6px 0 4px}
.st{display:flex; gap:10px; padding:8px 15px; font-size:13px; color:#77828f; width:100%; text-align:left}
.st b{flex:0 0 19px; height:19px; border-radius:50%; background:var(--mist); color:#5a6775;
  font-size:11px; display:flex; align-items:center; justify-content:center; font-weight:600; margin-top:1px}
.st.on{color:var(--ink)}
.st.on b{background:var(--teal); color:#fff}
.st.past b{background:var(--steel); color:var(--slate)}
.st:hover{background:var(--paper)}
.sc .f{padding:10px 15px 13px; border-top:1px solid var(--mist); display:flex; gap:8px; align-items:center}
.sc .f .muted{flex:1; font-size:11.5px}
.flash{animation:fl 1.4s ease-out}
@keyframes fl{0%{background:#E9F1F2}100%{background:transparent}}

@media (max-width:820px){
  .app{flex-direction:column}
  .side{width:100%; flex:none; height:auto; position:static; flex-direction:row; flex-wrap:wrap; align-items:center}
  .brand{border:0; padding:12px 16px}
  .navgroup{padding:6px; display:flex; gap:4px; flex-wrap:wrap}
  .navlabel{display:none}
  .sidefoot{display:none}
  .wrap{padding:18px}
  .sc{left:12px; right:12px; width:auto; bottom:12px}
}
</style>
</head>
<body>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Lusin</b><span>прототип · 24 сентября</span></div>
    <div class="navgroup">
      <div class="navlabel">Работа</div>
      <button class="nav on" data-p="today"><i class="dot"></i>Сегодня</button>
      <button class="nav" data-p="person"><i class="dot"></i>Карточка человека</button>
    </div>
    <div class="navgroup">
      <div class="navlabel">Настройка · редко</div>
      <button class="nav" data-p="data"><i class="dot"></i>Данные</button>
      <button class="nav" data-p="agents"><i class="dot"></i>Кто что делает</button>
    </div>
    <div class="sidefoot">Два экрана для работы,<br>два для настройки.<br>Больше ничего нет.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="askbtn" onclick="openAsk()">Спросите или киньте визитку, фото, имя… <kbd>⌘K</kbd></button>
      <div class="counter hl" id="cnt">
        <div><b id="c1">14</b><span>сама</span></div>
        <div><b id="c2">3</b><span>спросила</span></div>
      </div>
    </div>
    <div class="wrap" id="page"></div>
  </div>
</div>

<div class="veil" id="veil" onclick="closeAsk()"></div>
<div class="ask" id="ask">
  <input id="askin" placeholder="Кто это? О чём договаривались? Что дальше?" autocomplete="off">
  <div class="chips">
    <button class="chip" onclick="pickPerson()"><span class="av sm">ДЖ</span>фото с конференции</button>
    <button class="chip" onclick="pickPerson()"><span class="av sm" style="background:#DCE5EC">ВЗ</span>визитка, розовая</button>
    <button class="chip" onclick="pickPerson()">«толстячок, Джоэль или Джоан»</button>
  </div>
  <div class="asknote">Имя вспоминать не нужно. Достаточно лица, визитки или обрывка фразы.</div>
</div>

<div class="sc" id="sc">
  <div class="h"><b>Сквозной путь</b><button class="btn quiet" onclick="resetAll()">Сначала</button></div>
  <div class="steps" id="steps"></div>
  <div class="f"><span class="muted" id="scnote"></span><button class="btn" id="scbtn" onclick="nextStep()">Дальше</button></div>
</div>

<script>
/* ═══════════ состояние ═══════════ */
const S = {
  page:'today',
  step:0,
  self:14, asked:3,
  cardAdded:false,      // визитка заведена
  stopped:false,        // кампания остановлена
  decisions:{d1:null,d2:null,d3:null},
  feed:[]
};

const BASE_FEED = [
  ['09:58','<b>Ведёт записи</b> — завела 3 контакта из вчерашней переписки, 1 отправила на проверку'],
  ['09:41','<b>Двигает стадии</b> — Brightpath Legal: «Первый разговор» → «Назначена встреча»'],
  ['09:20','<b>Следит за обещаниями</b> — 2 разговора заглохли с невыполненным шагом, задачи созданы'],
  ['08:47','<b>Разбирает двойников</b> — D. Whitfield и Dana Whitfield похожи на одного человека, собрала доказательства'],
  ['08:30','<b>Стережёт границу</b> — проверила 412 человек в холодных кампаниях, конфликтов не нашла'],
  ['вчера','<b>Ведёт записи</b> — из встречи в 16:00 вынесла 2 договорённости и следующий шаг']
];

const STEPS = [
  ['Кинули визитку','Агент завёл запись и вернул сводку, пока вы ещё разговариваете'],
  ['Агент остановил рассылку','По этому человеку шла холодная кампания. Он больше не холодный'],
  ['«Кто этот толстячок?»','Через неделю вы не помните имени. Ищете по лицу'],
  ['День на одном экране','Что сделано без вас и что требует решения']
];

/* ═══════════ каркас ═══════════ */
function go(p){ S.page=p; render(); }
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.p));

function render(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on', b.dataset.p===S.page));
  document.getElementById('c1').textContent = S.self;
  document.getElementById('c2').textContent = S.asked;
  document.getElementById('page').innerHTML = ({today:pgToday, person:pgPerson, data:pgData, agents:pgAgents})[S.page]();
  renderSteps();
  window.scrollTo(0,0);
}

function renderSteps(){
  document.getElementById('steps').innerHTML = STEPS.map((s,i)=>
    `<button class="st ${i===S.step?'on':(i<S.step?'past':'')}" onclick="gotoStep(${i})">
      <b>${i<S.step?'✓':i+1}</b><span>${s[0]}</span></button>`).join('');
  document.getElementById('scnote').textContent = STEPS[Math.min(S.step,3)][1];
  document.getElementById('scbtn').textContent = S.step>=3 ? 'Готово' : 'Дальше';
}

function gotoStep(i){
  S.step=i;
  if(i>=1) S.cardAdded=true; else S.cardAdded=false;
  if(i>=2) S.stopped=true; else S.stopped=false;
  S.page = (i===3) ? 'today' : (i===0 ? 'today' : 'person');
  if(i===0){ S.cardAdded=false; S.stopped=false; }
  render();
}
function nextStep(){ if(S.step<3) gotoStep(S.step+1); else gotoStep(0); }
function resetAll(){
  S.self=14; S.asked=3; S.decisions={d1:null,d2:null,d3:null}; S.feed=[];
  gotoStep(0);
}

/* ═══════════ экран «Сегодня» ═══════════ */
function pgToday(){
  const open = ['d1','d2','d3'].filter(k=>!S.decisions[k]).length;
  return `
  <h1>Сегодня, четверг</h1>
  <p class="lead">Это единственный рабочий экран. Сверху — что система сделала без вас,
  ниже — то немногое, где нужно ваше решение. Заполнять здесь нечего: записи ведут агенты.</p>

  ${S.step===0 ? `
  <div class="sec">
    <div class="card pad" style="border-color:var(--steel)">
      <h2>Начните отсюда</h2>
      <p class="tiny muted" style="margin-top:6px">Вы на конференции. Познакомились с человеком, он дал визитку.
      Кидаете её в чат — и продолжаете разговаривать.</p>
      <div class="acts"><button class="btn" onclick="gotoStep(1)">Кинуть визитку</button>
      <span class="tiny muted">агент ответит за 8 секунд</span></div>
    </div>
  </div>` : ''}

  <div class="sec">
    <h2>Требует вашего решения <em>${open} из 3 · остальное система решила сама</em></h2>
    <div class="card" style="margin-top:10px">
      ${decCard('d1','ЭР','Элейн Родригес', 'Ответила «давайте после 15-го». Поставить напоминание на 16 октября?',
        'Классифицировала ответ как «не сейчас». Такие вы обычно переносите на день после названной даты.',
        'Из письма: <b>«интересно, но давайте вернёмся после 15-го»</b> · 3 октября, 11:42')}
      ${decCard('d2','ДУ','Дана Уитфилд', 'Похоже, это тот же человек, что «D. Whitfield». Объединить записи?',
        'Совпадает домен почты и компания, но имена написаны по-разному. Сама сливать не стала.',
        'Две записи: <b>dana@corwinreed.com</b> (с сайта) и <b>d.whitfield@corwinreed.com</b> (из вашей переписки)')}
      ${decCard('d3','МЧ','Майя Чен', 'Написать ей от вашего имени или подготовить черновик?',
        'Она тёплая: ответила вам в августе. Значит, письмо уйдёт с вашего ящика и вашим именем.',
        'Правило: <b>по тёплым всегда спрашиваю</b>. По холодным действую сама в рамках политики.')}
    </div>
  </div>

  <div class="sec">
    <h2>Сделано без вас <em>сегодня</em></h2>
    <div class="card" style="margin-top:10px">
      ${S.feed.map(f=>`<div class="feed flash"><div class="t">${f[0]}</div><div class="x">${f[1]}</div></div>`).join('')}
      ${BASE_FEED.map(f=>`<div class="feed"><div class="t">${f[0]}</div><div class="x">${f[1]}</div></div>`).join('')}
    </div>
    <p class="tiny muted" style="margin-top:9px">Каждая строка — действие, которое раньше делал человек руками.
    Счётчик наверху показывает отношение «сама» к «спросила». Задача продукта — чтобы левое число росло, а правое падало.</p>
  </div>`;
}

function decCard(id,ini,name,q,why,ev){
  const v = S.decisions[id];
  if(v) return `<div class="dec"><div class="who"><span class="av">${ini}</span></div>
    <div class="body"><div class="q">${name}</div>
    <div class="done">✓ ${v}</div></div></div>`;
  return `<div class="dec">
    <div class="who"><span class="av">${ini}</span></div>
    <div class="body">
      <div class="q">${name}</div>
      <div class="why">${q}</div>
      <div class="ev">${why}<br><span class="mini" style="color:#8a95a3">${ev}</span></div>
      <div class="acts">
        <button class="btn" onclick="decide('${id}','Да, сделано')">Да</button>
        <button class="btn ghost" onclick="decide('${id}','Отклонено')">Нет</button>
        <button class="btn quiet" onclick="decide('${id}','Поправлено и сделано')">Поправить</button>
        <button class="btn quiet" onclick="trust('${id}')">Дальше решай сам</button>
      </div>
    </div></div>`;
}

function decide(id,label){
  S.decisions[id]=label;
  S.self++; S.asked=Math.max(0,S.asked-1);
  render();
}
function trust(id){
  S.decisions[id]='Решено — и такие вопросы больше не задаю';
  S.self+=1; S.asked=Math.max(0,S.asked-1);
  S.feed.unshift(['сейчас','<b>Правило принято</b> — этот класс вопросов система больше не задаёт']);
  render();
}

/* ═══════════ карточка человека ═══════════ */
function pgPerson(){
  const stopRow = S.stopped ? `
    <div class="tr" style="background:#E9F1F2">
      <div class="d">сегодня</div><div class="c"><span class="tag warm">граница</span></div>
      <div class="s"><b>Холодная кампания остановлена.</b> Он стал тёплым — вы познакомились лично.
        <div class="src">Стережёт границу · письмо 3 из 6 не ушло · холодные ящики больше его не трогают</div></div>
    </div>` : '';
  const addRow = S.cardAdded ? `

/* ═══════════ спроси ═══════════ */
function openAsk(){ document.getElementById('veil').classList.add('on');
  document.getElementById('ask').classList.add('on'); document.getElementById('askin').focus(); }
function closeAsk(){ document.getElementById('veil').classList.remove('on');
  document.getElementById('ask').classList.remove('on'); document.getElementById('askin').value=''; }
function pickPerson(){ closeAsk(); S.cardAdded=true; if(S.step<2) S.step=2; S.page='person'; render(); }
document.getElementById('askin').addEventListener('keydown',e=>{ if(e.key==='Enter') pickPerson(); });
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openAsk(); }
  if(e.key==='Escape') closeAsk();
});

/* ═══════════ сценарий ═══════════ */
const _goto = gotoStep;
gotoStep = function(i){
  if(i===1 && !S.cardAdded){
    S.feed.unshift(['сейчас','<b>Ведёт записи</b> — Джоэль Рамирес заведён из визитки, данные дополнены, фото подтянуто']);
  }
  if(i===2 && !S.stopped){
    S.feed.unshift(['сейчас','<b>Стережёт границу</b> — по Джоэлю Рамиресу остановлена холодная кампания: он стал тёплым']);
    S.self++;
  }
  _goto(i);
};

render();
</script>
