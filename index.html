<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lusin</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14171F; --surface:#1A1E29; --raised:#212734; --line:rgba(169,189,240,.14);
  --line2:rgba(169,189,240,.24);
  --signal:#0057FF; --echo:#A9BDF0; --mist:#DCEBF8;
  --text:#EEF2F9; --dim:#98A3B8; --faint:#6D778C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg)}
body{font:400 15px/1.6 Manrope,-apple-system,sans-serif; color:var(--text); -webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}
h1{font-size:26px} h2{font-size:17px} h3{font-size:15px}
p{margin:0}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font:inherit}
.mono{font-family:"JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.15em;font-size:10px;font-weight:500}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}

.app{display:flex;min-height:100vh}
/* ——— sidebar ——— */
.side{width:218px;flex:0 0 218px;background:#0F121A;border-right:1px solid var(--line);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px}
.brand img{width:28px;height:28px;display:block}
.brand b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.nav{display:flex;align-items:center;gap:11px;width:100%;text-align:left;margin:1px 10px;
  width:calc(100% - 20px);padding:10px 11px;border-radius:8px;font-size:14.5px;font-weight:500;color:var(--dim)}
.nav:hover{background:rgba(169,189,240,.07);color:var(--text)}
.nav.on{background:rgba(0,87,255,.16);color:#fff}
.nav .ic{width:17px;text-align:center;opacity:.9}
.nav .badge{margin-left:auto;background:var(--signal);color:#fff;font-family:"JetBrains Mono",monospace;
  font-size:10px;padding:2px 6px;border-radius:9px}
.navsep{height:1px;background:var(--line);margin:12px 18px}
.gear{margin-top:auto}
.sub{padding:2px 0 10px}
.sub .nav{font-size:13.5px;padding:7px 11px 7px 38px;color:var(--faint)}
.sub .nav.on{background:rgba(169,189,240,.10);color:var(--text)}
.who{padding:14px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.who .av{width:28px;height:28px;font-size:10.5px;flex:0 0 28px}
.who div{font-size:12.5px;line-height:1.3}
.who span{color:var(--faint);font-size:11px}

/* ——— main ——— */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:14px;padding:13px 26px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:rgba(20,23,31,.94);backdrop-filter:blur(8px);z-index:20}
.bar h2{flex:1}
.pill{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.pill div{padding:6px 14px;text-align:center}
.pill div+div{border-left:1px solid var(--line)}
.pill b{display:block;font-family:"JetBrains Mono",monospace;font-size:17px;font-weight:500;line-height:1.15}
.pill .a b{color:var(--signal)}
.pill span{color:var(--faint);display:block;margin-top:1px}
.wrap{padding:24px 26px 80px;max-width:1000px}
.lead{color:var(--dim);max-width:66ch;margin-top:8px;font-size:14.5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:11px}
.pad{padding:17px 19px}
.sec{margin-top:26px}
.sec>h2{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.sec>h2 .n{color:var(--faint);font-weight:400;font-size:13px}
.dim{color:var(--dim)} .faint{color:var(--faint)} .tiny{font-size:13.5px}
.av{width:38px;height:38px;border-radius:50%;background:var(--raised);color:var(--echo);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 38px}
.av.lg{width:58px;height:58px;font-size:19px;flex:0 0 58px}
.tag{display:inline-block;font-family:"JetBrains Mono",monospace;font-size:9px;text-transform:uppercase;
  letter-spacing:.13em;padding:4px 8px;border-radius:4px;background:var(--raised);color:var(--echo)}
.tag.w{background:rgba(0,87,255,.18);color:#8FB4FF}
.tag.c{background:rgba(169,189,240,.08);color:var(--faint)}
.tag.g{background:rgba(0,200,120,.14);color:#6EDBA6}
.btn{background:var(--signal);color:#fff;padding:8px 15px;border-radius:7px;font-size:13.5px;font-weight:600}
.btn:hover{background:#1466FF}
.btn.g{background:var(--raised);color:var(--text)}
.btn.g:hover{background:#2A3141}
.btn.q{background:none;border:1px solid var(--line2);color:var(--dim);font-size:12.5px;padding:7px 12px;font-weight:500}
.btn.q:hover{color:var(--text);border-color:var(--echo)}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}

/* today */
.ev{display:flex;gap:14px;padding:15px 19px;cursor:pointer}
.ev+.ev{border-top:1px solid var(--line)}
.ev:hover{background:rgba(169,189,240,.035)}
.ev .t{flex:0 0 52px;color:var(--faint);padding-top:3px}
.ev .x{flex:1;font-size:14px;color:var(--dim)}
.ev .x b{color:var(--text);font-weight:600}
.ev .chev{color:var(--faint);font-size:12px;padding-top:3px}
.detail{margin:0 19px 15px;padding:13px 15px;background:var(--raised);border-radius:8px;
  font-size:13.5px;color:var(--dim);border-left:2px solid var(--signal)}
.detail b{color:var(--text)}
.detail .row{display:flex;gap:10px;margin-top:6px}
.detail .row:first-child{margin-top:0}
.detail .k{flex:0 0 118px;color:var(--faint)}

.dec{display:flex;gap:15px;padding:18px 19px}
.dec+.dec{border-top:1px solid var(--line)}
.dec .b{flex:1;min-width:0}
.dec .q{font-weight:700;margin-bottom:2px}
.dec .why{color:var(--dim);font-size:14px}
.prf{margin-top:11px;padding:11px 13px;background:var(--raised);border-radius:7px;font-size:13.5px;color:var(--dim)}
.prf .src{display:block;margin-top:6px;color:var(--faint)}
.ok{color:#6EDBA6;font-weight:600;font-size:14px;padding-top:3px}

/* chat */
.chat{display:flex;flex-direction:column;height:calc(100vh - 56px)}
.stream{flex:1;overflow-y:auto;padding:24px 26px 10px}
.stream .in{max-width:760px;margin:0 auto}
.msg{display:flex;gap:13px;margin-bottom:22px}
.msg .av{width:30px;height:30px;font-size:10px;flex:0 0 30px}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--signal);color:#fff;border-radius:12px 12px 3px 12px;max-width:70%}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 3px;
  padding:12px 15px;font-size:14.5px;line-height:1.6;max-width:calc(100% - 44px)}
.msg.me .bub{border:0}
.bub p+p{margin-top:9px}
.bub .note{color:var(--faint);font-size:12.5px;margin-top:9px;display:block}
.pcard{margin-top:12px;background:var(--raised);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pcard .h{display:flex;gap:13px;padding:14px 15px}
.pcard .nm{font-weight:700;font-size:15.5px}
.pcard .st{margin-top:9px;padding:9px 11px;background:rgba(0,87,255,.10);border:1px solid rgba(0,87,255,.25);
  border-radius:7px;font-size:12.8px;color:var(--dim)}
.pcard .st b{color:var(--text)}
.tl{border-top:1px solid var(--line)}
.tl .r{display:flex;gap:12px;padding:10px 15px;font-size:13px;color:var(--dim)}
.tl .r+.r{border-top:1px solid var(--line)}
.tl .d{flex:0 0 56px;color:var(--faint)}
.tl .c{flex:0 0 80px}
.tl .s b{color:var(--text)}
.tl .src{color:var(--faint);margin-top:2px}
.compose{border-top:1px solid var(--line);padding:14px 26px 20px;background:var(--bg)}
.compose .in{max-width:760px;margin:0 auto}
.box{display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line2);
  border-radius:11px;padding:10px 12px}
.box textarea{flex:1;background:none;border:0;outline:none;color:var(--text);resize:none;
  font-size:14.5px;line-height:1.5;max-height:110px}
.box textarea::placeholder{color:var(--faint)}
.drop{border:1px dashed var(--line2);border-radius:7px;padding:6px 10px;color:var(--faint);font-size:12.5px}
.drop:hover{border-color:var(--signal);color:var(--echo)}
.sugg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:20px;
  padding:7px 14px;font-size:13px;color:var(--dim)}
.sugg button:hover{border-color:var(--signal);color:var(--text)}
.typing span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--echo);
  margin-right:4px;animation:bl 1.1s infinite}
.typing span:nth-child(2){animation-delay:.18s} .typing span:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* tables */
.tw{overflow:auto;border-radius:11px}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px}
th{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line);color:var(--faint);
  font-weight:500;white-space:nowrap;background:var(--raised);position:sticky;top:0}
td{padding:10px 13px;border-bottom:1px solid var(--line);color:var(--dim);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.k{color:var(--text);font-weight:600}
.bar-m{height:5px;border-radius:3px;background:var(--raised);overflow:hidden;width:78px;display:inline-block;vertical-align:middle}
.bar-m i{display:block;height:100%;background:var(--signal)}
.ag{padding:16px 19px}
.ag+.ag{border-top:1px solid var(--line)}
.ag.ours{border-left:2px solid var(--signal)}
.rules{display:grid;grid-template-columns:92px 1fr;gap:5px 15px;margin-top:11px;font-size:13.5px}
.rules dt{color:var(--faint);padding-top:2px}
.rules dd{margin:0;color:var(--dim)}

/* tour */
.tour{position:fixed;right:20px;bottom:20px;width:318px;background:var(--raised);
  border:1px solid var(--line2);border-radius:11px;box-shadow:0 18px 44px rgba(0,0,0,.5);z-index:50}
.tour .h{padding:12px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.tour .h b{flex:1;font-size:13.5px}
.st-i{display:flex;gap:10px;padding:8px 15px;font-size:13px;width:100%;text-align:left;color:var(--faint)}
.st-i b{flex:0 0 19px;height:19px;border-radius:50%;background:rgba(169,189,240,.14);color:var(--echo);
  font-family:"JetBrains Mono",monospace;font-size:9.5px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.st-i.on{color:var(--text)} .st-i.on b{background:var(--signal);color:#fff}
.st-i.past b{background:var(--echo);color:var(--bg)}
.st-i:hover{background:rgba(169,189,240,.06)}
.tour .f{padding:11px 15px 13px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center}
.tour .f span{flex:1;font-size:11.8px;color:var(--faint);line-height:1.45}
.flash{animation:fl 1.7s ease-out}
@keyframes fl{0%{background:rgba(0,87,255,.14)}100%{background:transparent}}
.hide{display:none}
@media(max-width:880px){
  .app{flex-direction:column} .side{width:100%;flex:none;height:auto;position:static}
  .wrap{padding:18px 16px 80px} .tour{left:14px;right:14px;width:auto;bottom:14px}
  .chat{height:auto} .stream{padding:18px 16px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><img src="assets/intwin-mark-light-1024.png" alt=""><b>Lusin</b></div>
    <button class="nav on" data-p="today"><span class="ic">◆</span>Today<span class="badge" id="nb">3</span></button>
    <button class="nav" data-p="chat"><span class="ic">✦</span>Assistant</button>
    <div class="navsep"></div>
    <div class="gear">
      <button class="nav" data-p="agents"><span class="ic">⚙</span>Settings</button>
      <div class="sub hide" id="sub">
        <button class="nav" data-p="agents">Agents</button>
        <button class="nav" data-p="data">Database</button>
        <button class="nav" data-p="seq">Sequences</button>
        <button class="nav" data-p="mail">Mailboxes</button>
      </div>
    </div>
    <div class="who"><span class="av">NB</span><div>Nicolas Bobroff<span>Intwin Tech</span></div></div>
  </aside>
  <div class="main">
    <div class="bar"><h2 id="ttl">Today</h2>
      <div class="pill"><div class="a"><b id="c1">14</b><span class="mono">Acted</span></div>
      <div><b id="c2">3</b><span class="mono">Asked</span></div></div></div>
    <div id="page"></div>
  </div>
</div>

<div class="tour">
  <div class="h"><b>Guided tour</b><button class="btn q" onclick="reset()">Restart</button></div>
  <div id="steps"></div>
  <div class="f"><span id="tnote"></span><button class="btn" id="tbtn" onclick="next()">Next</button></div>
</div>

<script>
const S={p:'today',step:0,self:14,asked:3,dec:{},open:{},chat:[],busy:false,warm:false,tour:true};

const TOUR=[
 ['Your morning','Everything the agents did overnight, and the few things they could not settle alone'],
 ['Approve one thing','Three questions, not thirty. Answer one and watch the counter move'],
 ['Ask the assistant','You forgot the name. Ask the way you would ask a colleague'],
 ['Stop the cold machine','You met him in person. The sequence running against him stops'],
 ['Look under the hood','Raw data, sequences, mailbox warm-up — the parts you open once a month']
];

const EV=[
 ['08:12','<b>Keeps records</b> created 6 contacts from yesterday’s replies',
  [['Source','4 replies in outreach-2, 2 in your own mailbox'],['Enriched','title, company size, LinkedIn, photo'],['Held back','1 record — two people share a name at the same company']]],
 ['08:34','<b>Moves stages</b> advanced Brightpath Legal to “Meeting booked”',
  [['Trigger','calendar invite accepted for 26 Sep, 15:00'],['Stage rule','“a first meeting is on the calendar”'],['Previous','First conversation · 11 days']]],
 ['09:02','<b>Watches commitments</b> found 2 threads that went quiet with a step still owed',
  [['Ashford Group','you promised pricing on 12 Sep · 12 days ago'],['Delaney &amp; Sons','they promised an intro · 8 days ago'],['Prepared','a draft for each, waiting in Assistant']]],
 ['09:15','<b>Guards the line</b> checked 412 people in cold sequences against the warm base',
  [['Conflicts','none this morning'],['Last week','3 stopped — all had replied or been met in person'],['Checked at','09:15, and again at 15:00']]],
 ['09:40','<b>Sorts out duplicates</b> flagged one possible duplicate for you',
  [['Records','dana@corwinreed.com and d.whitfield@corwinreed.com'],['Agrees','company, domain, job title'],['Disagrees','the name is spelled two ways · did not merge']]]
];

const DEC=[
 ['d1','ER','Elaine Rodriguez','She replied “let’s come back after the 15th.” Push the follow-up to 16 October?',
  'Read the reply as “not now, but keep going.” You normally move these to the day after the date they name.',
  'From her email, 3 Oct 11:42 — “interested, but let’s come back after the 15th”'],
 ['d2','DW','Dana Whitfield','Two records look like the same person. Merge them?',
  'Same company, same domain, same job title. The name is written two different ways, so it did not merge on its own.',
  'dana@corwinreed.com (from the website) · d.whitfield@corwinreed.com (from your inbox)'],
 ['d3','MC','Maya Chen','Send the follow-up under your name, or leave you a draft?',
  'She is warm — she replied in August. A warm email goes from your mailbox, so the agent will not send it without you.',
  'Rule: always ask on warm people. On cold people the agent sends within policy.']
];

const AG=[
 ['Keeps records','creates and links records from email, cards and meetings',
  'creates the record, fills it from public sources, pulls the photo',
  'writes to the person, or touches anything consequential',
  'when it is not certain two records are the same person',0],
 ['Watches commitments','finds threads that went quiet with a step still owed',
  'locates the commitment, creates the task, drafts the reply',
  'sends anything — it only prepares',
  'always, if the person is warm',0],
 ['Moves stages','keeps the pipeline matching what actually happened',
  'moves a record on by the plain-language description of the stage',
  'closes a deal or changes an amount',
  'when the events can be read two ways',0],
 ['Sorts out duplicates','finds records that look like one person',
  'collects the evidence and shows what disagrees',
  'merges records silently on a matching name',
  'always — resolving an identity is your call',0],
 ['Guards the line','keeps the cold machine away from anyone who turned warm',
  'stops the cold sequence the moment they reply or you meet in person',
  'decides what to say next',
  'only if the email is already queued and cannot be pulled',1]
];

const DB=[
 ['Harborline Partners','harborline.com','Joel','Ramirez','Director of Operations','j.ramirez@harborline.com',60,'warm','Conference · DAS NYC'],
 ['Brightpath Legal','brightpathlegal.com','Maya','Chen','Head of IT','m.chen@brightpathlegal.com',85,'warm','Reply · seq MSP-NY'],
 ['Corwin &amp; Reed','corwinreed.com','Dana','Whitfield','COO','dana@corwinreed.com',40,'warm','Reply · seq MSP-NY'],
 ['Ashford Group','ashfordgroup.com','Elaine','Rodriguez','Managing Partner','e.rodriguez@ashfordgroup.com',55,'warm','Reply · seq PROF-SVC'],
 ['Delaney &amp; Sons','delaneysons.com','Marcus','Hall','Operations Lead','m.hall@delaneysons.com',32,'cold','Parsed · state registry'],
 ['Westgate Advisors','westgateadv.com','Priya','Nair','Office Manager','p.nair@westgateadv.com',48,'cold','Parsed · LinkedIn'],
 ['Kingsley Tax','kingsleytax.com','Owen','Brady','Principal','o.brady@kingsleytax.com',26,'cold','Parsed · state registry'],
 ['Merrivale Group','merrivale.com','Tara','Quinn','Director of Finance','t.quinn@merrivale.com',71,'cold','Parsed · LinkedIn'],
 ['Fairlane Consulting','fairlane.co','Ben','Osei','Managing Director','b.osei@fairlane.co',38,'cold','Parsed · web'],
 ['Northrop &amp; Vale','northropvale.com','Sara','Lindqvist','Head of Operations','s.lindqvist@northropvale.com',64,'cold','Parsed · LinkedIn'],
 ['Pemberly Health','pemberly.health','Alan','Reyes','IT Manager','a.reyes@pemberly.health',92,'cold','Parsed · web'],
 ['Stonebridge Legal','stonebridge.legal','Nina','Costa','Partner','n.costa@stonebridge.legal',44,'cold','Parsed · state registry']
];

const MB=[['outreach-1@intwin-msp.com','intwin-msp.com','running',25,18,96],
 ['outreach-2@intwin-msp.com','intwin-msp.com','running',25,22,94],
 ['outreach-3@intwin-msp.com','intwin-msp.com','running',25,19,91],
 ['hello@intwin-partners.com','intwin-partners.com','warming · day 12 of 21',8,6,88],
 ['team@intwin-partners.com','intwin-partners.com','warming · day 4 of 21',4,3,79],
 ['nicolas@intwin.tech','intwin.tech','your own · never used for cold',0,0,100]];

const SEQ=[['MSP · New York · 25–100 staff','running',6,412,38,'9.2%'],
 ['Professional services · no internal IT','running',5,268,21,'7.8%'],
 ['Re-engage · went quiet 90 days','paused',3,96,0,'—']];

/* ——— router ——— */
function go(p){S.p=p;if(['agents','data','seq','mail'].includes(p))sub.classList.remove('hide');render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>go(b.dataset.p));
const T={today:'Today',chat:'Assistant',agents:'Agents',data:'Database',seq:'Sequences',mail:'Mailboxes'};

function render(){
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('on',b.dataset.p===S.p));
  ttl.textContent=T[S.p]; c1.textContent=S.self; c2.textContent=S.asked;
  const left=DEC.filter(d=>!S.dec[d[0]]).length;
  nb.textContent=left; nb.style.display=left?'':'none';
  page.innerHTML=({today:pToday,chat:pChat,agents:pAgents,data:pData,seq:pSeq,mail:pMail})[S.p]();
  if(S.p==='chat'){const st=document.getElementById('stream');if(st)st.scrollTop=st.scrollHeight;}
  steps.innerHTML=TOUR.map((s,i)=>`<button class="st-i ${i===S.step?'on':(i<S.step?'past':'')}" onclick="goStep(${i})"><b>${i<S.step?'✓':i+1}</b><span>${s[0]}</span></button>`).join('');
  tnote.textContent=TOUR[Math.min(S.step,4)][1];
  tbtn.textContent=S.step>=4?'Done':'Next';
}
function goStep(i){
  S.step=i;
  if(i===0||i===1) S.p='today';
  if(i===2) {S.p='chat'; if(!S.chat.length) seedChat();}
  if(i===3) {S.p='chat'; if(S.chat.length<3) seedChat(); askCard();}
  if(i===4) {S.p='mail'; sub.classList.remove('hide');}
  render();
}
function next(){goStep(S.step<4?S.step+1:0)}
function reset(){S.self=14;S.asked=3;S.dec={};S.open={};S.chat=[];S.warm=false;goStep(0)}

/* ——— today ——— */
function pToday(){
  const left=DEC.filter(d=>!S.dec[d[0]]).length;
  return `<div class="wrap">
  <h1>Good morning, Nicolas</h1>
  <p class="lead">While you were away the agents did ${S.self} things on their own and stopped at ${left} they
  could not settle without you. Nothing here needs filling in — the records keep themselves.</p>

  <div class="sec"><h2>Waiting on you <span class="n">${left} of 3</span></h2>
    <div class="card" style="margin-top:11px">${DEC.map(d=>decRow(d)).join('')}</div></div>

  <div class="sec"><h2>Done without you <span class="n">this morning · tap a line to see how</span></h2>
    <div class="card" style="margin-top:11px">
      ${S.extra?`<div class="ev flash"><div class="t mono">now</div><div class="x">${S.extra}</div></div>`:''}
      ${EV.map((e,i)=>`
        <div class="ev" onclick="tog(${i})"><div class="t mono">${e[0]}</div>
        <div class="x">${e[1]}</div><div class="chev">${S.open[i]?'▴':'▾'}</div></div>
        ${S.open[i]?`<div class="detail">${e[2].map(r=>`<div class="row"><div class="k mono">${r[0]}</div><div>${r[1]}</div></div>`).join('')}</div>`:''}
      `).join('')}
    </div>
    <p class="tiny faint" style="margin-top:10px">The counter at the top is the whole promise: <b style="color:var(--text)">acted</b>
    should climb and <b style="color:var(--text)">asked</b> should fall. Every “decide these yourself” you grant moves it.</p>
  </div></div>`;
}
function decRow(d){
  const v=S.dec[d[0]];
  if(v)return `<div class="dec"><span class="av">${d[1]}</span><div class="b"><div class="q">${d[2]}</div><div class="ok">✓ ${v}</div></div></div>`;
  return `<div class="dec"><span class="av">${d[1]}</span><div class="b">
    <div class="q">${d[2]}</div><div class="why">${d[3]}</div>
    <div class="prf">${d[4]}<span class="src mono">${d[5]}</span></div>
    <div class="acts"><button class="btn" onclick="dc('${d[0]}','Done')">Yes, do it</button>
    <button class="btn g" onclick="dc('${d[0]}','Declined')">No</button>
    <button class="btn q" onclick="dc('${d[0]}','Corrected, then done')">Let me edit</button>
    <button class="btn q" onclick="tr('${d[0]}')">Decide these yourself</button></div></div></div>`;
}
function tog(i){S.open[i]=!S.open[i];render()}
function dc(id,l){S.dec[id]=l;S.self++;S.asked=Math.max(0,S.asked-1);if(S.step===1)S.step=2;render()}
function tr(id){S.dec[id]='Done — you will not be asked this again';S.self++;S.asked=Math.max(0,S.asked-1);
  S.extra='<b>Rule accepted</b> — this class of question is now handled without you';if(S.step===1)S.step=2;render()}

/* ——— chat ——— */
function seedChat(){
  S.chat=[{r:'a',h:`<p>Morning. Two threads went quiet with something you owe, and I have drafts ready for both.</p>
  <p>Ask me anything about a person, a company or a deal — or drop a photo or a business card if you cannot recall the name.</p>`}];
}
function pChat(){
  if(!S.chat.length) seedChat();
  const sug = S.warm
    ? ['Draft the service description for Joel','Who else was at that conference?','What is stuck right now?']
    : ['I met someone on 14 September, Kevin or Keith — who was it?','What is stuck right now?','Show me the two quiet threads'];
  return `<div class="chat"><div class="stream" id="stream"><div class="in">
    ${S.chat.map(m=>m.r==='me'
      ? `<div class="msg me"><div class="bub">${m.h}</div></div>`
      : `<div class="msg"><span class="av">L</span><div class="bub">${m.h}</div></div>`).join('')}
    ${S.busy?`<div class="msg"><span class="av">L</span><div class="bub typing"><span></span><span></span><span></span></div></div>`:''}
  </div></div>
  <div class="compose"><div class="in">
    <div class="sugg">${sug.map(s=>`<button onclick="say(this.textContent)">${s}</button>`).join('')}
      <button onclick="askCard()">📎 drop a photo</button></div>
    <div class="box"><textarea id="ti" rows="1" placeholder="Ask anything…"></textarea>
      <button class="btn" onclick="say(document.getElementById('ti').value)">Send</button></div>
  </div></div></div>`;
}
function push(r,h){S.chat.push({r,h});render()}
function say(t){
  if(!t||!t.trim())return;
  push('me',t.replace(/</g,'&lt;'));
  const q=t.toLowerCase();
  S.busy=true;render();
  setTimeout(()=>{S.busy=false;
    if(q.includes('kevin')||q.includes('keith')||q.includes('14 sep')||q.includes('who')) return reply(personCard(
      `<p>Nobody called Kevin. On 14 September you were at DAS NYC and spoke with three people — the closest is <b>Joel Ramirez</b>. He handed you a card and you agreed to send a service description.</p>`));
    if(q.includes('stuck')||q.includes('quiet')) return reply(`<p>Two, both waiting on you:</p>
      <p><b>Ashford Group</b> — you promised pricing on 12 September. 12 days.<br>
      <b>Delaney &amp; Sons</b> — they promised an intro and went quiet. 8 days.</p>
      <p>Drafts are written for both. Say the word and I will put them in front of you.</p>
      <span class="note">Watches commitments · found by reading the threads, not by a reminder you set</span>`);
    if(q.includes('draft')||q.includes('service description')) return reply(`<p>Here is the draft, in your voice — short, one ask, no attachment:</p>
      <p style="background:var(--raised);padding:11px 13px;border-radius:7px;margin-top:9px">Joel — good speaking on Tuesday.<br><br>
      Attaching what we cover at a flat rate for a 60-person firm, and what sits outside it.<br><br>
      Worth 20 minutes next week to see whether it fits? Tuesday or Thursday both work.<br><br>Best, Nicolas</p>
      <span class="note">72 words · matches how you normally write: one ask, no bullets, plain close</span>
      <div class="acts"><button class="btn" onclick="reply('Sent from your mailbox. I logged it on his card.')">Send it</button>
      <button class="btn g" onclick="reply('Left in your drafts.')">Edit first</button></div>`);
    if(q.includes('conference')) return reply(`<p>Eleven people from DAS NYC are in the base. Three you spoke to in person —
      Joel Ramirez, Dana Whitfield and one card I could not read well enough to be sure about.</p>
      <span class="note">I did not guess the third. It is waiting for you under Waiting on you.</span>`);
    reply(`<p>I can look that up. Everything I have on a person sits behind their name, a photo, or a scrap of a phrase —
      whichever you remember.</p><span class="note">Prototype: only a few scripted answers are wired up.</span>`);
  },700);
}
function reply(h){S.busy=false;push('a',h)}
function askCard(){
  if(S.p!=='chat'){S.p='chat';}
  if(!S.chat.length)seedChat();
  push('me','📎 photo_2647.jpg');
  S.busy=true;render();
  setTimeout(()=>{S.busy=false;
    push('a',personCard(`<p>That is <b>Joel Ramirez</b> — you met him at DAS NYC on 14 September.
      You owe him a service description by Friday.</p>`));
    if(!S.warm){S.warm=true;S.self++;
      setTimeout(()=>push('a',`<p><b>One thing I did while you looked.</b> A cold sequence was still running against him —
        email 3 of 6 was due tomorrow. He is not cold any more, so I stopped it.</p>
        <span class="note">Guards the line · mailbox outreach-3 · he will not be touched by the cold machine again</span>`),900);}
  },800);
}
function personCard(intro){
  return intro+`<div class="pcard">
    <div class="h"><span class="av lg">JR</span><div style="flex:1">
      <div class="nm">Joel Ramirez</div>
      <div class="tiny faint">Director of Operations · Harborline Partners · New York · 60 people</div>
      <div class="st"><b>Warm since 24 September</b> — because you met in person.
      Before that he was cold: matched the selection rule, never interacted.</div></div></div>
    <div class="tl">
      ${S.warm?`<div class="r"><div class="d mono">today</div><div class="c"><span class="tag w">Stopped</span></div>
        <div class="s"><b>Cold sequence stopped</b><div class="src mono">email 3 of 6 never sent · outreach-3</div></div></div>`:''}
      <div class="r"><div class="d mono">14 Sep</div><div class="c"><span class="tag w">In person</span></div>
        <div class="s"><b>DAS NYC — agreed to send a service description</b><div class="src mono">from a business card · photo pulled from LinkedIn</div></div></div>
      <div class="r"><div class="d mono">11 Sep</div><div class="c"><span class="tag c">Cold</span></div>
        <div class="s">Email 1 of 6 — delivered, opened<div class="src mono">seq MSP · New York · 25–100 staff</div></div></div>
      <div class="r"><div class="d mono">9 Sep</div><div class="c"><span class="tag">Signal</span></div>
        <div class="s">Hiring a systems administrator<div class="src mono">evidence: job posting on their site, 4 Sep</div></div></div>
      <div class="r"><div class="d mono">2 Sep</div><div class="c"><span class="tag">Added</span></div>
        <div class="s">Matched the rule: professional services, 25–100 staff, no internal IT lead<div class="src mono">parsed · state registry</div></div></div>
    </div></div>`;
}

/* ——— settings ——— */
function pAgents(){
  return `<div class="wrap"><h1>Agents</h1>
  <p class="lead">Five of them. None writes cold email — all five keep the records matching reality.
  That is why there is no form anywhere in this product.</p>
  <div class="sec"><div class="card">${AG.map(a=>`<div class="ag ${a[5]?'ours':''}">
    <div style="display:flex;gap:11px;align-items:baseline;flex-wrap:wrap">
      <b style="font-size:15.5px">${a[0]}</b><span class="tiny faint">${a[1]}</span>
      ${a[5]?'<span class="tag w">Only here</span>':''}</div>
    <div class="rules"><dt class="mono">Does</dt><dd>${a[2]}</dd>
    <dt class="mono">Never</dt><dd>${a[3]}</dd><dt class="mono">Asks</dt><dd>${a[4]}</dd></div></div>`).join('')}</div></div>
  <div class="sec"><h2>The autonomy rule</h2><div class="card pad" style="margin-top:11px">
    <p class="tiny dim"><b style="color:var(--text)">Cold</b> — the agent acts within policy. They do not know you,
    the email leaves a disposable mailbox, a mistake costs little.</p>
    <p class="tiny dim" style="margin-top:8px"><b style="color:var(--text)">Warm</b> — the agent always asks.
    The email leaves your mailbox under your name; you pay with your reputation.</p>
    <p class="tiny faint" style="margin-top:11px">Cold and warm are not two tabs. They are the rule that decides
    whether the system acts or asks — which is why one agent does nothing but watch the line between them.</p></div></div></div>`;
}
function pData(){
  return `<div class="wrap"><h1>Database</h1>
  <p class="lead">Everything the engine has parsed and everything the agents have written, raw.
  Open it to check coverage or fix something flagged uncertain. Most weeks nobody opens it.</p>
  <p class="tiny faint" style="margin-top:12px">12 of <b style="color:var(--text)">18,412</b> people shown · filtered to this quarter’s target list</p>
  <div class="sec"><div class="card tw" style="margin-top:11px"><table>
    <thead><tr><th class="mono">Company</th><th class="mono">Domain</th><th class="mono">First</th><th class="mono">Last</th>
    <th class="mono">Title</th><th class="mono">Email</th><th class="mono">Staff</th><th class="mono">State</th><th class="mono">Origin</th></tr></thead>
    <tbody>${DB.map(r=>`<tr><td class="k">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td>
      <td>${r[5]}</td><td>${r[6]}</td><td><span class="tag ${r[7]==='warm'?'w':'c'}">${r[7]}</span></td><td>${r[8]}</td></tr>`).join('')}</tbody>
  </table></div></div>
  <div class="sec"><h2>What you are allowed to edit</h2><div class="card pad" style="margin-top:11px">
    <div class="rules" style="grid-template-columns:120px 1fr">
      <dt class="mono">Agent fills</dt><dd>title, city, industry, staff count, photo</dd>
      <dt class="mono">Asks first</dt><dd>name, email, profile link — these identify a person</dd>
      <dt class="mono">Never auto</dt><dd>phone, “do not contact”, your notes — these carry consequences</dd>
      <dt class="mono">Locked</dt><dd>touch times, cold/warm state, which agent did what</dd></div>
    <p class="tiny faint" style="margin-top:12px">The last row is locked on purpose. If touch times could be edited by hand,
    nothing built on them could be trusted.</p></div></div></div>`;
}
function pSeq(){
  return `<div class="wrap"><h1>Sequences</h1>
  <p class="lead">The cold machine. It runs without you and you are not expected to watch it —
  it is here so that it can be audited, not operated.</p>
  <div class="sec"><div class="card tw" style="margin-top:11px"><table>
    <thead><tr><th class="mono">Sequence</th><th class="mono">State</th><th class="mono">Steps</th>
    <th class="mono">Enrolled</th><th class="mono">Replied</th><th class="mono">Reply rate</th></tr></thead>
    <tbody>${SEQ.map(s=>`<tr><td class="k">${s[0]}</td>
      <td><span class="tag ${s[1]==='running'?'g':'c'}">${s[1]}</span></td><td>${s[2]}</td>
      <td>${s[3]}</td><td>${s[4]}</td><td>${s[5]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec"><h2>Stopped this week <span class="n">by Guards the line</span></h2>
    <div class="card" style="margin-top:11px">
      <div class="ev" style="cursor:default"><div class="t mono">24 Sep</div><div class="x">
        <b>Joel Ramirez</b> — met in person at DAS NYC · email 3 of 6 never sent</div></div>
      <div class="ev" style="cursor:default"><div class="t mono">22 Sep</div><div class="x">
        <b>Dana Whitfield</b> — replied to email 2 · sequence closed, moved to warm</div></div>
      <div class="ev" style="cursor:default"><div class="t mono">19 Sep</div><div class="x">
        <b>Elaine Rodriguez</b> — replied “after the 15th” · paused until 16 Oct</div></div>
    </div>
    <p class="tiny faint" style="margin-top:10px">Nobody pressed stop on any of these. That is the point of the fifth agent.</p></div></div>`;
}
function pMail(){
  return `<div class="wrap"><h1>Mailboxes</h1>
  <p class="lead">Two kinds of mailbox, and they must never be confused. Disposable ones carry cold volume.
  Your own carries your name and is never used for cold.</p>
  <div class="sec"><div class="card tw" style="margin-top:11px"><table>
    <thead><tr><th class="mono">Mailbox</th><th class="mono">Domain</th><th class="mono">Warm-up</th>
    <th class="mono">Daily cap</th><th class="mono">Sent today</th><th class="mono">Health</th></tr></thead>
    <tbody>${MB.map(m=>`<tr><td class="k">${m[0]}</td><td>${m[1]}</td>
      <td><span class="tag ${m[2].startsWith('warming')?'':(m[2]==='running'?'g':'c')}">${m[2]}</span></td>
      <td>${m[3]||'—'}</td><td>${m[4]||'—'}</td>
      <td><span class="bar-m"><i style="width:${m[5]}%"></i></span> ${m[5]}%</td></tr>`).join('')}</tbody></table></div></div>
  <div class="sec"><h2>Why this screen is buried</h2><div class="card pad" style="margin-top:11px">
    <p class="tiny dim">A cap of 25 a day per mailbox is not a setting anyone tunes — it is what keeps the domain alive.
    Sending 500 a day means twenty mailboxes, not one mailbox working harder.</p>
    <p class="tiny dim" style="margin-top:8px">The domains stay yours. If you leave, they leave with you.</p>
    <p class="tiny faint" style="margin-top:11px">You will open this page when something breaks, and otherwise never.
    That is the correct amount of attention for plumbing.</p></div></div></div>`;
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey&&document.activeElement.id==='ti'){e.preventDefault();say(document.activeElement.value)}
});
render();
</script>
</body>
</html>
