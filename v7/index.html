<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прототип v7 — одна кнопка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════
     ПРОТОТИП v7 · РАДИКАЛЬНЫЙ
     Корневая работа (Николай, 24.09): «нажал кнопку — пришёл лид,
     назначил встречу. Больше ничего не надо.»

     Правило отбора для каждого элемента на экране:
     убрать его — лид перестанет приходить? Нет — значит элемента нет.

     Визуальный язык взят из twenty-ui (MIT, twentyhq/twenty) —
     открытая копия Attio: Inter, светлый фон, радиусы 4/8/16,
     текст #333 / #666, границы #EBEBEB, синий #4662D5.

     Файл разбит на нумерованные блоки. Чтобы переделать блок целиком,
     достаточно назвать его номер.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ╔═ БЛОК 0 · ОСНОВАНИЕ — токены и сброс ═══════════════════════════ */
:root{
  --bg:          #FCFCFC;
  --surface:     #FFFFFF;
  --line:        #EBEBEB;
  --line-soft:   #F4F4F4;
  --ink:         #333333;
  --ink-2:       #666666;
  --ink-3:       #999999;
  --blue:        #4662D5;
  --blue-soft:   #EDF0FC;
  --green:       #1E8E5A;
  --green-soft:  #E9F5EF;
  --amber:       #8A6A12;
  --amber-soft:  #FBF3DE;
  --r-sm: 4px; --r-md: 8px; --r-lg: 16px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 24px}

/* ╔═ БЛОК 1 · ШАПКА ════════════════════════════════════════════════ */
.top{
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 0 0;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-.01em}
.brand .mark{
  width:22px;height:22px;border-radius:var(--r-sm);background:var(--ink);
  display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700
}
.counter{
  font-size:12.5px;color:var(--ink-3);cursor:pointer;
  padding:5px 9px;border-radius:var(--r-sm);transition:background .12s
}
.counter:hover{background:var(--line-soft);color:var(--ink-2)}
.counter b{color:var(--ink-2);font-weight:600}

/* ╔═ БЛОК 2 · ЗАПРОС — единственный ввод и единственная кнопка ═════ */
.ask{padding:72px 0 0;text-align:center}
.ask h1{
  font-size:26px;font-weight:600;letter-spacing:-.02em;
  margin-bottom:6px
}
.ask .sub{color:var(--ink-2);margin-bottom:26px;font-size:14.5px}
.field{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:6px;transition:border-color .15s, box-shadow .15s;
  text-align:left
}
.field:focus-within{border-color:#C9D2F2;box-shadow:0 0 0 3px var(--blue-soft)}
.field textarea{
  width:100%;border:none;outline:none;resize:none;
  font:inherit;color:var(--ink);background:transparent;
  padding:14px 14px 8px;min-height:58px;line-height:1.5
}
.field textarea::placeholder{color:var(--ink-3)}
.field .row{display:flex;align-items:center;justify-content:space-between;padding:0 8px 6px}
.hintline{font-size:12.5px;color:var(--ink-3)}
.go{
  background:var(--ink);color:#fff;border-radius:var(--r-md);
  padding:9px 18px;font-size:13.5px;font-weight:550;
  display:inline-flex;align-items:center;gap:8px;
  transition:opacity .15s, transform .08s
}
.go:hover{opacity:.86}
.go:active{transform:translateY(1px)}
.go[disabled]{opacity:.35;cursor:default;transform:none}
.chips{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.chip{
  font-size:12.5px;color:var(--ink-2);background:var(--surface);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;
  transition:border-color .12s,color .12s
}
.chip:hover{border-color:#D8D8D8;color:var(--ink)}

/* ╔═ БЛОК 3 · РАБОТА — видно, что система делает прямо сейчас ══════ */
.work{margin-top:34px;display:none}
.work.on{display:block}
.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden
}
.card-h{
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between
}
.card-t{font-weight:600;font-size:13.5px;letter-spacing:-.01em}
.card-n{font-size:12.5px;color:var(--ink-3)}
.steps{padding:6px 0}
.step{
  display:flex;align-items:flex-start;gap:12px;
  padding:9px 18px;font-size:13.5px;opacity:0;
  animation:in .3s ease forwards
}
@keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.dot{
  width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;
  display:grid;place-items:center;font-size:9px;color:#fff;font-weight:700
}
.dot.done{background:var(--green)}
.dot.live{background:var(--blue)}
.dot.live::after{
  content:"";width:6px;height:6px;border-radius:50%;background:#fff;
  animation:pulse 1s infinite
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.step .tx{flex:1}
.step .tx b{font-weight:600}
.step .meta{color:var(--ink-3);font-size:12.5px;margin-top:1px}

/* ╔═ БЛОК 4 · ВСТРЕЧИ — то, ради чего всё ══════════════════════════ */
.result{margin-top:20px;display:none}
.result.on{display:block}
.meet{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;border-bottom:1px solid var(--line-soft);
  opacity:0;animation:in .35s ease forwards
}
.meet:last-child{border-bottom:none}
.when{
  flex:none;width:58px;text-align:center;
  background:var(--green-soft);color:var(--green);
  border-radius:var(--r-md);padding:7px 0;
}
.when .d{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.when .h{font-size:14px;font-weight:600;margin-top:1px}
.who{flex:1;min-width:0}
.who .nm{font-weight:600;font-size:14px}
.who .co{color:var(--ink-2);font-size:12.5px;margin-top:1px}
.why{
  flex:none;max-width:210px;font-size:12.5px;color:var(--ink-3);
  text-align:right;line-height:1.45
}
.prep{
  flex:none;font-size:12.5px;color:var(--blue);
  padding:5px 10px;border-radius:var(--r-sm)
}
.prep:hover{background:var(--blue-soft)}

/* ╔═ БЛОК 5 · ТРЕБУЕТ ВАС — только то, что робот не решил сам ══════ */
.hitl{margin-top:20px;display:none}
.hitl.on{display:block}
.q{padding:16px 18px;border-bottom:1px solid var(--line-soft)}
.q:last-child{border-bottom:none}
.q .txt{font-size:13.5px;margin-bottom:3px}
.q .txt b{font-weight:600}
.q .ctx{font-size:12.5px;color:var(--ink-3);margin-bottom:11px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{
  border:1px solid var(--line);border-radius:var(--r-md);
  padding:6px 13px;font-size:13px;background:var(--surface);
  transition:border-color .12s,background .12s
}
.b:hover{border-color:#D8D8D8;background:var(--line-soft)}
.b.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.b.pri:hover{opacity:.86;background:var(--ink)}
.b.ghost{border:none;color:var(--ink-3);padding:6px 8px}
.b.ghost:hover{background:transparent;color:var(--blue)}

/* ╔═ БЛОК 6 · ПОДВАЛ — всё остальное спрятано, но существует ═══════ */
.foot{margin:40px 0 64px;text-align:center}
.foot .more{
  font-size:12.5px;color:var(--ink-3);
  padding:7px 12px;border-radius:var(--r-sm)
}
.foot .more:hover{background:var(--line-soft);color:var(--ink-2)}
.hidden-list{
  display:none;margin-top:16px;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:6px
}
.hidden-list.on{display:block}
.hi{
  display:flex;align-items:center;justify-content:space-between;
  padding:9px 12px;border-radius:var(--r-md);font-size:13.5px;
  transition:background .12s;cursor:pointer
}
.hi:hover{background:var(--line-soft)}
.hi .k{color:var(--ink-2)}
.hi .v{color:var(--ink-3);font-size:12.5px}
.note{
  font-size:12.5px;color:var(--ink-3);line-height:1.6;
  padding:12px 12px 8px;border-top:1px solid var(--line-soft);margin-top:4px
}

/* ╔═ БЛОК 7 · ОКНО — для деталей, которые не живут на экране ═══════ */
.veil{
  position:fixed;inset:0;background:rgba(20,20,20,.28);
  display:none;place-items:center;padding:24px;z-index:50;
  backdrop-filter:blur(2px)
}
.veil.on{display:grid}
.modal{
  background:var(--surface);border-radius:var(--r-lg);
  max-width:560px;width:100%;max-height:82vh;overflow:auto;
  box-shadow:0 12px 40px rgba(0,0,0,.18)
}
.modal-h{
  padding:18px 22px 14px;border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;justify-content:space-between
}
.modal-h .t{font-weight:600;letter-spacing:-.01em}
.modal-b{padding:18px 22px 22px;font-size:13.5px;line-height:1.65}
.x{color:var(--ink-3);font-size:18px;line-height:1;padding:4px 8px;border-radius:var(--r-sm)}
.x:hover{background:var(--line-soft);color:var(--ink)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-soft)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:550}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(60px);
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r-md);
  font-size:13px;opacity:0;transition:all .25s;z-index:60;pointer-events:none
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- ╔═ БЛОК 1 · ШАПКА ══════════════════════════════════════════════ -->
<div class="wrap">
  <div class="top">
    <div class="brand"><span class="mark">G</span><span>Движок</span></div>
    <div class="counter" onclick="showWork()">
      сделала сама <b id="cAuto">47</b> · спросила вас <b id="cAsk">2</b>
    </div>
  </div>
</div>

<!-- ╔═ БЛОК 2 · ЗАПРОС ═════════════════════════════════════════════ -->
<div class="wrap">
  <div class="ask">
    <h1 id="askH">Кого искать?</h1>
    <div class="sub" id="askS">Одной строкой, как сказали бы коллеге.</div>

    <div class="field">
      <textarea id="q" rows="2" placeholder="MSP в Бостоне, 20–50 человек, у кого недавно был инцидент с данными"></textarea>
      <div class="row">
        <span class="hintline" id="hint">Остальное система решит сама.</span>
        <button class="go" id="goBtn" onclick="run()">Найти и написать</button>
      </div>
    </div>

    <div class="chips" id="chips">
      <button class="chip" onclick="pick(this)">MSP в Бостоне, 20–50 человек, был инцидент с данными</button>
      <button class="chip" onclick="pick(this)">Бухгалтерские фирмы в Нью-Джерси, где владелец под 60</button>
      <button class="chip" onclick="pick(this)">IT-подрядчики с оборонными контрактами, ищут CMMC</button>
    </div>
  </div>
</div>

<!-- ╔═ БЛОК 3 · РАБОТА ═════════════════════════════════════════════ -->
<div class="wrap">
  <div class="work" id="work">
    <div class="card">
      <div class="card-h">
        <span class="card-t" id="workT">Идёт работа</span>
        <span class="card-n" id="workN"></span>
      </div>
      <div class="steps" id="steps"></div>
    </div>
  </div>
</div>

<!-- ╔═ БЛОК 4 · ВСТРЕЧИ ════════════════════════════════════════════ -->
<div class="wrap">
  <div class="result" id="result">
    <div class="card">
      <div class="card-h">
        <span class="card-t">Встречи</span>
        <span class="card-n" id="meetN"></span>
      </div>
      <div id="meets"></div>
    </div>
  </div>
</div>

<!-- ╔═ БЛОК 5 · ТРЕБУЕТ ВАС ════════════════════════════════════════ -->
<div class="wrap">
  <div class="hitl" id="hitl">
    <div class="card">
      <div class="card-h">
        <span class="card-t">Требует вас</span>
        <span class="card-n" id="hitlN"></span>
      </div>
      <div id="qs"></div>
    </div>
  </div>
</div>

<!-- ╔═ БЛОК 6 · ПОДВАЛ ═════════════════════════════════════════════ -->
<div class="wrap">
  <div class="foot">
    <button class="more" onclick="toggleHidden()" id="moreBtn">Что система делает без вас →</button>
    <div class="hidden-list" id="hiddenList"></div>
  </div>
</div>

<!-- ╔═ БЛОК 7 · ОКНО И УВЕДОМЛЕНИЕ ═════════════════════════════════ -->
<div class="veil" id="veil" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-h"><span class="t" id="mT"></span><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-b" id="mB"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ╔═ БЛОК 8 · ДАННЫЕ ════════════════════════════════════════════════
   Всё вымышлено. Компании, люди и числа существуют только здесь.
   ═══════════════════════════════════════════════════════════════════ */

const MEETINGS = [
  { d:'Ср', h:'14:00', nm:'Mark Reilly',  co:'Anchor IT · Waltham, MA · 34 чел.',
    why:'Ответил через 2 дня: «в декабре были проблемы, сейчас ищем помощь»' },
  { d:'Чт', h:'10:30', nm:'Dana Wu',      co:'NorthBridge Systems · Quincy, MA · 41 чел.',
    why:'Ответила на второе письмо, сама предложила время' },
  { d:'Пн', h:'16:00', nm:'Owen Salazar', co:'Keystone Managed · Lowell, MA · 22 чел.',
    why:'Пришёл по рекомендации — Mark переслал письмо ему' }
];

const QUESTIONS = [
  { id:'q1',
    txt:'<b>Priya Raman</b> из Beacon Grid спрашивает цену.',
    ctx:'Раньше про цену не спрашивали — у меня нет вашего ответа на этот случай.',
    acts:[
      {t:'От $4К в месяц',       pri:true,  say:'Записала. В следующий раз отвечу сама.'},
      {t:'Сначала на звонке',    pri:false, say:'Записала. В следующий раз отвечу сама.'},
      {t:'Я напишу сам',         pri:false, say:'Открыла черновик.'}
    ]},
  { id:'q2',
    txt:'<b>Greg Tanaka</b> из Fulcrum ответил «не сейчас, вернитесь в марте».',
    ctx:'Могу поставить напоминание и написать сама, могу закрыть.',
    acts:[
      {t:'Напомнить в марте',    pri:true,  say:'Поставила на 3 марта. Напишу сама.'},
      {t:'Закрыть',              pri:false, say:'Закрыла.'}
    ]}
];

const HIDDEN = [
  ['Собрала список',        '2 218 компаний → 340 подошли под ваше условие'],
  ['Проверила годность',    'выкинула 96: закрылись, нет почты, уже писали'],
  ['Завела ящики и домены', '6 ящиков на 2 доменах, домены оформлены на вас'],
  ['Прогрела канал',        '3 недели до первой отправки, тест каждые 6 часов'],
  ['Написала тексты',       '4 письма в цепочке, под каждого своё первое предложение'],
  ['Держит темп',           '09:00–17:00 по часовому поясу получателя, 18 писем в день с ящика'],
  ['Разобрала ответы',      '9 ответов: 3 интерес, 4 отказ, 2 позже'],
  ['Не пишет дважды',       'человек получает одно касание, даже если он в трёх списках']
];

/* ╔═ БЛОК 9 · ХОД РАБОТЫ — что показывается после нажатия ═══════════ */

const SCRIPT = [
  { t:1,    tx:'Поняла запрос',           m:'MSP · Массачусетс · 20–50 человек · был инцидент' },
  { t:900,  tx:'Нашла 340 компаний',      m:'из 2 218 в коридоре Бостон–Провиденс' },
  { t:1900, tx:'Отсеяла 96',              m:'закрылись, нет живой почты, уже писали раньше' },
  { t:2900, tx:'Нашла людей',             m:'244 владельца и технических директора' },
  { t:3900, tx:'Написала',                m:'первое письмо ушло 244 · дальше три касания по расписанию' },
  { t:5200, tx:'Пришли ответы',           m:'9 ответили · 3 согласились на разговор' },
  { t:6400, tx:'Назначила встречи',       m:'3 встречи в календаре · приглашения отправлены' }
];

let ran = false, auto = 47, asked = 2, answered = [];

function pick(el){
  document.getElementById('q').value = el.textContent.trim();
  document.getElementById('q').focus();
}

function run(){
  const txt = document.getElementById('q').value.trim()
           || document.getElementById('q').placeholder;
  document.getElementById('q').value = txt;
  document.getElementById('goBtn').disabled = true;
  document.getElementById('goBtn').textContent = 'Работаю…';
  document.getElementById('chips').style.display = 'none';
  document.getElementById('hint').textContent = 'Можно закрыть — придёт письмо, когда будут встречи.';

  document.getElementById('work').classList.add('on');
  const box = document.getElementById('steps');
  box.innerHTML = '';

  SCRIPT.forEach((s, i) => {
    setTimeout(() => {
      // предыдущий шаг помечаем завершённым
      const prev = box.querySelector('.dot.live');
      if (prev){ prev.classList.remove('live'); prev.classList.add('done'); prev.textContent = '✓'; }

      const last = (i === SCRIPT.length - 1);
      const el = document.createElement('div');
      el.className = 'step';
      el.innerHTML = '<span class="dot ' + (last ? 'done' : 'live') + '">' + (last ? '✓' : '') + '</span>' +
                     '<span class="tx"><b>' + s.tx + '</b><div class="meta">' + s.m + '</div></span>';
      box.appendChild(el);

      auto += 6; document.getElementById('cAuto').textContent = auto;
      document.getElementById('workN').textContent = (i + 1) + ' из ' + SCRIPT.length;

      if (last){
        document.getElementById('workT').textContent = 'Сделано';
        document.getElementById('goBtn').textContent = 'Готово';
        setTimeout(showResult, 500);
      }
    }, s.t);
  });
  ran = true;
}

function showResult(){
  const R = document.getElementById('result');
  R.classList.add('on');
  document.getElementById('meetN').textContent = MEETINGS.length + ' на этой неделе';
  document.getElementById('meets').innerHTML = MEETINGS.map((m, i) =>
    '<div class="meet" style="animation-delay:' + (i * 90) + 'ms">' +
      '<div class="when"><div class="d">' + m.d + '</div><div class="h">' + m.h + '</div></div>' +
      '<div class="who"><div class="nm">' + m.nm + '</div><div class="co">' + m.co + '</div></div>' +
      '<div class="why">' + m.why + '</div>' +
      '<button class="prep" onclick="prep(' + i + ')">подготовить</button>' +
    '</div>').join('');

  setTimeout(showQuestions, 700);
  R.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function showQuestions(){
  const open = QUESTIONS.filter(q => !answered.includes(q.id));
  const H = document.getElementById('hitl');
  if (!open.length){ H.classList.remove('on'); return; }
  H.classList.add('on');
  document.getElementById('hitlN').textContent = open.length === 1 ? 'один вопрос' : open.length + ' вопроса';
  document.getElementById('qs').innerHTML = open.map(q =>
    '<div class="q"><div class="txt">' + q.txt + '</div><div class="ctx">' + q.ctx + '</div><div class="acts">' +
    q.acts.map((a, i) => '<button class="b ' + (a.pri ? 'pri' : '') + '" onclick="answer(\'' + q.id + '\',' + i + ')">' + a.t + '</button>').join('') +
    '<button class="b ghost" onclick="answer(\'' + q.id + '\',-1)">дальше решай сам</button>' +
    '</div></div>').join('');
}

function answer(id, i){
  const q = QUESTIONS.find(x => x.id === id);
  answered.push(id);
  if (i === -1){
    asked = Math.max(0, asked - 1);
    document.getElementById('cAsk').textContent = asked;
    auto += 1; document.getElementById('cAuto').textContent = auto;
    toast('Больше про это не спрошу — буду решать сама.');
  } else {
    asked = Math.max(0, asked - 1);
    document.getElementById('cAsk').textContent = asked;
    toast(q.acts[i].say);
  }
  showQuestions();
}

/* ╔═ БЛОК 10 · ДЕТАЛИ ПО ТРЕБОВАНИЮ ════════════════════════════════ */

function prep(i){
  const m = MEETINGS[i];
  openModal('Разговор с ' + m.nm,
    '<div class="kv"><span class="k">Когда</span><span class="v">' + m.d + ', ' + m.h + '</span></div>' +
    '<div class="kv"><span class="k">Компания</span><span class="v">' + m.co + '</span></div>' +
    '<div class="kv"><span class="k">Как дошли</span><span class="v">4 касания за 11 дней</span></div>' +
    '<div style="margin-top:16px"><b>Что он писал</b><div style="color:var(--ink-2);margin-top:6px">' + m.why + '</div></div>' +
    '<div style="margin-top:16px"><b>О чём спросить</b>' +
    '<div style="color:var(--ink-2);margin-top:6px;line-height:1.75">' +
    '1. Что именно случилось в декабре и кто разбирал?<br>' +
    '2. Кто сейчас отвечает за безопасность — свои или подрядчик?<br>' +
    '3. Что должно произойти, чтобы вы поменяли подход?</div></div>');
}

function showWork(){
  openModal('Сколько система решила сама',
    '<div class="kv"><span class="k">Решила сама</span><span class="v">' + auto + '</span></div>' +
    '<div class="kv"><span class="k">Спросила вас</span><span class="v">' + asked + '</span></div>' +
    '<div style="margin-top:16px;color:var(--ink-2);line-height:1.7">' +
    'Каждый раз, когда вы отвечаете на вопрос, система запоминает решение и в следующий раз не спрашивает. ' +
    'Кнопка «дальше решай сам» под вопросом убирает целый класс вопросов сразу.</div>' +
    '<div style="margin-top:14px;color:var(--ink-3);font-size:12.5px">' +
    'Неделю назад было 31 и 9. Счёт слева растёт, справа падает — это и есть то, за что платят.</div>');
}

function toggleHidden(){
  const L = document.getElementById('hiddenList');
  const B = document.getElementById('moreBtn');
  const on = L.classList.toggle('on');
  B.textContent = on ? 'Свернуть ↑' : 'Что система делает без вас →';
  if (on && !L.dataset.filled){
    L.innerHTML = HIDDEN.map(h => '<div class="hi"><span class="k">' + h[0] + '</span><span class="v">' + h[1] + '</span></div>').join('') +
    '<div class="note">Ничего из этого не вынесено на экран: чтобы пришёл лид, вам не нужно этим управлять. ' +
    'Любая строка открывается и правится, если однажды понадобится.</div>';
    L.dataset.filled = '1';
  }
}

function openModal(t, b){
  document.getElementById('mT').textContent = t;
  document.getElementById('mB').innerHTML = b;
  document.getElementById('veil').classList.add('on');
}
function closeModal(){ document.getElementById('veil').classList.remove('on'); }

let tt;
function toast(m){
  const T = document.getElementById('toast');
  T.textContent = m; T.classList.add('on');
  clearTimeout(tt); tt = setTimeout(() => T.classList.remove('on'), 2600);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && !ran) run();
});
</script>
