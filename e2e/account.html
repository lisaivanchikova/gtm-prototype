<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your account | Intwin</title><link rel="stylesheet" href="e2e.css"></head><body class="pg">

<header class="inav"><div class="wrap">
  <a class="ilogo" href="review.html">Int<i>win</i></a>
  <nav><a href="review.html">The breakdown</a><a href="account.html" class="on">Your account</a>
    <a href="deals.html">M&amp;A index</a><a href="multiples.html">Valuations</a></nav>
  <span class="sp"></span>
  <a class="back" href="host.html">&larr; ChannelE2E</a>
</div></header>

<div class="wrap" style="padding:26px 0 0;max-width:860px"><div id="out"></div></div>

<footer class="iftr"><div class="wrap"><span>Intwin &middot; we buy and build MSPs</span><span class="sp"></span>
  <a href="host.html">ChannelE2E</a><a href="kelly.html">Partner dashboard</a></div></footer>

<script src="e2e.js"></script>
<script>
var r = E2E.get(), out = document.getElementById('out');

function donut(pass, total){
  var c = 2 * Math.PI * 44, on = c * pass / total;
  return '<svg viewBox="0 0 110 110" width="118" height="118" aria-hidden="true">'+
    '<circle cx="55" cy="55" r="44" fill="none" stroke="#eceef0" stroke-width="10"/>'+
    '<circle cx="55" cy="55" r="44" fill="none" stroke="#67be39" stroke-width="10" stroke-linecap="round" '+
      'stroke-dasharray="'+on.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 55 55)"/>'+
    '<text x="55" y="58" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" '+
      'font-size="30" font-weight="800" fill="#1d2126" letter-spacing="-1">'+pass+
      '<tspan font-size="15" fill="#8b949e">/'+total+'</tspan></text>'+
    '<text x="55" y="76" text-anchor="middle" font-family="-apple-system,Segoe UI,Roboto,sans-serif" '+
      'font-size="9" font-weight="700" fill="#8b949e" letter-spacing="1.2">CHECKS</text></svg>';
}
function shortName(t){
  return t.replace('Recurring revenue under signed contract','Contracted revenue')
          .replace('Someone other than the owner sells','Someone else sells')
          .replace('The business runs without the owner present','Runs without you')
          .replace('No client worth more than a fifth of revenue','Client concentration')
          .replace('Books could open to a buyer this month','Books ready')
          .replace('Processes documented well enough to hand over','Processes documented');
}

if (!E2E.unlocked() || r.profit == null) {
  out.innerHTML = '<div class="card top"><h2>This page opens with your own run</h2>'+
    '<p class="lead">The account holds your figures so the next quarter is a comparison, not a fresh start.</p>'+
    '<p style="margin-top:18px"><a class="btn" style="max-width:280px" href="review.html">Open your breakdown &rarr;</a></p></div>';
} else {
  var ch = E2E.checks(r), pass = ch.filter(function(c){return c.pass}).length,
      s = E2E.score(r), g = E2E.range(r),
      d = new Date(r.ts || Date.now()),
      dstr = d.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),
      dshort = d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});

  out.innerHTML =
    '<p class="kicker">'+((r.co||'Your business') + (r.city ? ' &middot; ' + r.city : ''))+'</p>'+
    '<h1 style="margin:9px 0 7px">Readiness clock</h1>'+
    '<p class="lead" style="margin-bottom:24px">You are not selling today. This is the line you are moving, '+
      'one quarter at a time.</p>'+

    '<div class="card top"><div class="clock">'+ donut(pass, ch.length) +
      '<div class="ct"><p class="kicker" style="color:var(--dim)">Today, '+dstr+'</p>'+
        '<h2 style="font-size:23px;margin:9px 0 8px">'+
          ['None','One','Two','Three','Four','Five','Six'][pass]+' of the six checks a buyer&rsquo;s diligence '+
          'runs would pass today.</h2>'+
        '<p class="lead">First run. The next one, in January, shows the direction.</p></div></div>'+
      '<div class="pills">'+ ch.map(function(c){
          return '<div class="'+(c.pass?'':'no')+'"><i></i>'+shortName(c.t)+'</div>'; }).join('') +'</div>'+
      '<p class="fine">Re-run it each quarter. Two quarters moving the same way is what tells us, and you, that '+
        'you are ready. The '+(ch.length-pass)+' open items are what a buyer would use to move money out of closing.</p>'+
    '</div>'+

    '<div class="card"><h2>Your runs</h2><ul class="hist">'+
      '<li><span class="d">'+dshort+'</span><span><strong>Score '+s+'</strong> &middot; '+pass+' of '+ch.length+' checks</span>'+
        '<span class="sp"></span><span><strong>'+E2E.money(g.low)+' &ndash; '+E2E.money(g.high)+'</strong></span></li>'+
      '<li class="next"><span class="d">Jan 2027</span><span>Next run &middot; we will write</span>'+
        '<span class="sp"></span><span>&mdash;</span></li>'+
      '</ul>'+
      '<div class="grid2" style="margin-top:20px">'+
        '<a class="btn" href="review.html">Re-run with new figures &rarr;</a>'+
        '<a class="btn gh" href="multiples.html">Where you sit this quarter &rarr;</a></div>'+
    '</div>'+

    '<div class="card"><h2>What we will do with this</h2>'+
      '<p class="lead">Your figures are yours. The aggregate, without your name, goes into the quarterly index '+
      'on ChannelE2E. Your name and email reached us at the moment you asked for the comparison, and nothing '+
      'before that. If you want a conversation about an offer, you ask for it; we do not pass you to anyone.</p>'+
      '<p style="margin-top:18px"><a class="btn gh" style="max-width:320px" href="mailto:hello@intwin.tech?subject=E2E%20Score%20%E2%80%94%2030%20minutes">Ask for a 30-minute conversation &rarr;</a></p>'+
    '</div>';
}
</script></body></html>
