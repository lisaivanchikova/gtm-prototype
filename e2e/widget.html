<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E2E Score</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="c2e.css"><link rel="stylesheet" href="e2e.css">
<style>body{background:transparent;margin:0;font-size:16px}</style>
</head><body>
<div class="w" id="w"></div>
<script src="e2e.js"></script>
<script>
var Q = [
  { id:'rev',  q:'What was revenue last year?', kind:'opts',
    opts: E2E.BANDS.map(function(b){return b.t}), vals: E2E.BANDS.map(function(b){return b.k}) },
  { id:'rec',  q:'How much of that renews on its own, under contract?', kind:'pct' },
  { id:'fte',  q:'How many full-time people, including you?', kind:'num', ph:'e.g. 12' },
  { id:'sells',q:'Who brings in a new client?', kind:'opts', opts:E2E.SELLS, vals:[0,1,2] },
  { id:'away', q:'Longest you have been away from the business in the last year?', kind:'opts', opts:E2E.AWAY, vals:[0,1,2] }
];
var SITE = 'https://join.intwin.tech/';
var step = -1, w = document.getElementById('w');

var TOP = '<div class="w-top"><span class="sq"></span><span class="nm">E2E Score</span>'+
          '<span class="free">Free &middot; 30 seconds</span></div>';
var PWR = '<div class="pwr">Powered by <a href="'+SITE+'" target="_top" rel="noopener"><b>Intwin</b></a> &middot; we buy and build MSPs</div>';

function h(s){ w.innerHTML = TOP + s + PWR; resize(); }
function resize(){ try{ parent.postMessage({e2eHeight: document.body.scrollHeight}, '*'); }catch(e){} }

function segs(n){
  var s = '<div class="seg">';
  for (var i = 0; i < Q.length; i++) s += '<i class="'+(i <= n ? 'on' : '')+'"></i>';
  return s + '</div>';
}
function ring(v){
  var c = 2 * Math.PI * 25, on = c * Math.max(0, Math.min(100, v)) / 100;
  return '<svg viewBox="0 0 62 62" width="62" height="62" aria-hidden="true">'+
    '<circle cx="31" cy="31" r="25" fill="none" stroke="#eceef0" stroke-width="7"/>'+
    '<circle cx="31" cy="31" r="25" fill="none" stroke="#67be39" stroke-width="7" stroke-linecap="round" '+
      'stroke-dasharray="'+on.toFixed(1)+' '+c.toFixed(1)+'" transform="rotate(-90 31 31)"/></svg>';
}

function intro(){
  h('<div class="w-bd">'+
      '<p class="hl">What would a buyer pay for your MSP?</p>'+
      '<p class="s">Five questions. A score out of 100 and the three things holding it down. '+
        'No call, no listing.</p>'+
      '<div class="cta-row">'+
        '<button class="btn" id="go">Start &rarr;</button>'+
        '<p class="fine">Nothing leaves this page until you ask for it. Not an offer, not an appraisal.</p>'+
      '</div>'+
    '</div>');
  document.getElementById('go').onclick = function(){ E2E.bump('open'); step = 0; draw(); };
}

function draw(){
  if (step >= Q.length) return done();
  var q = Q[step], body = '';
  if (q.kind === 'opts') {
    body = q.opts.map(function(o,i){ return '<button class="opt" data-v="'+i+'">'+o+'</button>'; }).join('');
  } else if (q.kind === 'pct') {
    body = '<input class="num" id="in" type="number" min="0" max="100" placeholder="e.g. 62">'+
           '<p class="fine" style="margin:8px 0 13px">Per cent of revenue.</p>'+
           '<button class="btn" id="nx">Next &rarr;</button>';
  } else {
    body = '<input class="num" id="in" type="number" min="1" placeholder="'+(q.ph||'')+'">'+
           '<p class="fine" style="margin:8px 0 13px">Head count, not contractors.</p>'+
           '<button class="btn" id="nx">Next &rarr;</button>';
  }
  h(segs(step) + '<div class="w-bd">'+
      '<p class="prg">Question '+(step+1)+' of '+Q.length+'</p>'+
      '<p class="q">'+q.q+'</p>'+ body +'</div>');
  if (q.kind === 'opts') {
    [].forEach.call(w.querySelectorAll('.opt'), function(b){
      b.onclick = function(){
        b.classList.add('sel');
        var o = {}; o[q.id] = q.vals[+b.dataset.v]; E2E.set(o);
        setTimeout(function(){ step++; draw(); }, 110);
      };
    });
  } else {
    var inp = document.getElementById('in');
    inp.focus();
    var go = function(){ var v = +inp.value; if (!isFinite(v) || v <= 0) { inp.focus(); return; }
      var o = {}; o[q.id] = q.kind === 'pct' ? Math.min(100, v) : v; E2E.set(o); step++; draw(); };
    document.getElementById('nx').onclick = go;
    inp.onkeydown = function(e){ if (e.key === 'Enter') go(); };
  }
}

function done(){
  E2E.bump('finish');
  var r = E2E.get(), s = E2E.score(r), weak = E2E.weakest(r, 3);
  h('<div class="w-bd">'+
      '<p class="prg">Your E2E Score</p>'+
      '<div class="ring">'+ ring(s) +
        '<div><div class="n">'+s+' <small>/ 100</small></div>'+
        '<div class="cap">Where your business sits on what a buyer looks at first.</div></div></div>'+
      '<ul class="facets">'+ weak.map(function(f){
          var k = f.s < 34 ? 'weak' : f.s < 67 ? 'mid' : 'strong';
          var t = f.s < 34 ? 'Weak' : f.s < 67 ? 'Middling' : 'Strong';
          return '<li><span>'+f.n+'</span><span class="badge '+k+'">'+t+'</span></li>';
        }).join('') +'</ul>'+
      '<p class="fine" style="margin-bottom:14px">These three hold your number down. What a buyer would '+
        'offer sits on our side, behind four more answers.</p>'+
      '<a class="btn" id="full" href="https://join.intwin.tech/" target="_top" rel="noopener">Get your valuation range &rarr;</a>'+
      '<a class="btn gh" href="mna.html" target="_top" style="margin-top:8px">See who is buying &rarr;</a>'+
      '<p class="fine">Arithmetic on figures you chose. Not an offer, not an appraisal.</p>'+
    '</div>');
  document.getElementById('full').onclick = function(){ E2E.bump('through'); };
}

intro();
addEventListener('load', resize);
</script></body></html>
