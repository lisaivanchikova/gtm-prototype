<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM + Outreach — the seam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════════
     ПРОТОТИП v8 · ШОВ МЕЖДУ CRM И OUTREACH

     Собран на языке существующей дизайн-системы bobroff-cap/ai-crm
     (docs/design/design-system.md): токены из apps/web/src/styles.css,
     направление «Плитки», раскрытие на месте вместо модальных панелей,
     английский интерфейс, левая панель 232 px.

     Что здесь нового по сравнению с ai-crm:
       Workspace → Campaigns   — аутрич берёт сегмент из CRM, а не свой список
       Control   → Channels    — домены, ящики, прогрев, доставляемость
       Contact   → Touch ledger — касания обоих каналов в одной ленте
       Contact   → Consent      — запрет живёт на человеке, не на кампании

     Данные вымышлены: это прототип, не стенд. В продукте демо-данных
     на экране быть не должно (§1.8 дизайн-системы).

     Блоки пронумерованы — чтобы переделать блок, достаточно назвать номер.
     ═══════════════════════════════════════════════════════════════════ -->

<style>
/* ╔═ БЛОК 0 · ТОКЕНЫ — дословно из apps/web/src/styles.css ═════════ */
:root{
  --ink:#17241f; --ink-2:#3a4843; --muted:#636d69; --faint:#7d8983;
  --line:rgba(23,36,31,.08); --line-2:rgba(23,36,31,.14); --line-soft:#e9ece8;
  --canvas:#f3f5f1; --surface:#ffffff; --tint:#f7f9f5;
  --sidebar:#10231d; --sidebar-soft:#1a3129; --on-dark:#dbe6e0; --on-dark-muted:#8fa59c;
  --on-accent:#ffffff;
  --sage:#2f705c; --sage-dark:#245b4a; --sage-pale:#e5f0ea;
  --lime:#cce36c; --lime-glow:#e9f6b4;
  --blue:#3d6f9e; --blue-pale:#e9f1f8;
  --gold:#8a5f1f; --gold-pale:#fbf2df;
  --coral:#a94f40; --coral-pale:#f9eae7;
  --focus:#245b4a;
  --shadow-lift:0 0 0 1px rgba(23,36,31,.06), 0 1px 2px rgba(23,36,31,.05), 0 6px 16px rgba(23,36,31,.05);
  --shadow-float:0 0 0 1px rgba(23,36,31,.08), 0 16px 40px rgba(23,36,31,.16);
  --shadow-hairline:inset 0 0 0 1px var(--line);
  --shadow-ring:inset 0 0 0 1px var(--line-2);
  --sidebar-width:232px;
  --text-meta:12px; --text-body:14px; --text-value:15px; --text-tile-title:15px;
  --text-title:20px; --text-heading:24px; --text-page-title:26px; --text-record:34px;
  --weight-medium:500; --weight-semibold:600; --weight-bold:700; --weight-extrabold:800;
  --control-height:40px; --card-inset:16px;
  --control-radius:10px; --card-radius:16px; --panel-radius:18px; --pill-radius:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Manrope,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--canvas); color:var(--ink);
  font-size:var(--text-body); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:"DM Mono",ui-monospace,monospace;font-size:13px}

/* ╔═ БЛОК 1 · ОБОЛОЧКА — левая панель 232 и шапка ══════════════════ */
.shell{display:flex;min-height:100vh}

.side{
  width:var(--sidebar-width);flex:none;background:var(--sidebar);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh
}
.side .logo{
  padding:18px 18px 14px;color:#fff;font-weight:var(--weight-extrabold);
  font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:9px
}
.side .logo i{
  width:24px;height:24px;border-radius:7px;background:var(--lime);
  display:grid;place-items:center;color:var(--sidebar);font-size:13px;font-style:normal
}
.grp{padding:10px 10px 2px}
.grp h3{
  font-size:var(--text-meta);font-weight:var(--weight-semibold);
  color:var(--on-dark-muted);padding:6px 8px 7px;letter-spacing:.01em
}
.nav{
  display:flex;align-items:center;gap:10px;height:var(--control-height);
  padding:0 10px;border-radius:var(--control-radius);color:var(--on-dark);
  font-size:var(--text-body);font-weight:var(--weight-medium);
  position:relative;width:100%;text-align:left;margin-bottom:2px
}
.nav:hover{background:var(--sidebar-soft)}
.nav.on{background:var(--sidebar-soft);color:#fff;font-weight:var(--weight-semibold)}
.nav.on::before{
  content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:3px;
  background:var(--lime);border-radius:0 3px 3px 0
}
.nav .ic{width:16px;height:16px;flex:none;opacity:.85;display:grid;place-items:center;font-size:13px}
.nav .cnt{
  margin-left:auto;font-size:var(--text-meta);font-weight:var(--weight-bold);
  background:var(--lime);color:var(--sidebar);border-radius:var(--pill-radius);
  padding:1px 7px
}
.nav .cnt.q{background:var(--sidebar-soft);color:var(--on-dark-muted)}
.side .ws{
  margin-top:auto;padding:14px;border-top:1px solid rgba(255,255,255,.07)
}
.side .ws .box{
  background:var(--sidebar-soft);border-radius:var(--control-radius);
  padding:11px 12px;color:var(--on-dark)
}
.side .ws .n{font-size:var(--text-body);font-weight:var(--weight-semibold)}
.side .ws .s{font-size:var(--text-meta);color:var(--on-dark-muted);margin-top:1px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.bar{
  height:56px;flex:none;background:var(--surface);
  border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:30
}
.search{
  display:flex;align-items:center;gap:9px;height:var(--control-height);
  padding:0 14px;border-radius:var(--pill-radius);background:var(--tint);
  box-shadow:var(--shadow-ring);color:var(--muted);min-width:290px;
  font-size:var(--text-body)
}
.search .k{
  margin-left:auto;font-size:var(--text-meta);color:var(--faint);
  font-family:"DM Mono",monospace
}
.bar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.av{
  width:30px;height:30px;border-radius:var(--pill-radius);background:var(--sage-pale);
  color:var(--sage-dark);display:grid;place-items:center;
  font-size:var(--text-meta);font-weight:var(--weight-bold)
}
.page{padding:26px 24px 60px;max-width:1180px;width:100%}

/* ╔═ БЛОК 2 · ЗАГОЛОВОК ЭКРАНА И ПАНЕЛЬ ЗАПРОСА ════════════════════ */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.ph h1{
  font-size:var(--text-page-title);font-weight:var(--weight-extrabold);
  letter-spacing:-.02em;line-height:1.2
}
.ph .sub{color:var(--muted);font-size:var(--text-body);margin-top:3px}
.ph .act{margin-left:auto;display:flex;gap:8px;align-items:center}

.btn{
  height:var(--control-height);padding:0 16px;border-radius:var(--control-radius);
  font-size:var(--text-body);font-weight:var(--weight-semibold);
  display:inline-flex;align-items:center;gap:8px;background:var(--surface);
  box-shadow:var(--shadow-lift);color:var(--ink);white-space:nowrap
}
.btn:hover{box-shadow:0 0 0 1px rgba(47,112,92,.25),0 8px 20px rgba(23,36,31,.08)}
.btn--primary{background:var(--sage);color:var(--on-accent);box-shadow:none}
.btn--primary:hover{background:var(--sage-dark);box-shadow:none}
.btn--ghost{background:none;box-shadow:none;color:var(--sage);padding:0 10px}
.btn--ghost:hover{background:var(--sage-pale);box-shadow:none}

.qbar{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap
}
.seg{
  display:flex;height:var(--control-height);padding:3px;border-radius:var(--control-radius);
  background:var(--surface);box-shadow:var(--shadow-ring)
}
.seg button{
  padding:0 13px;border-radius:7px;font-size:var(--text-body);
  color:var(--muted);font-weight:var(--weight-medium)
}
.seg button.on{background:var(--tint);color:var(--ink);font-weight:var(--weight-semibold);box-shadow:var(--shadow-hairline)}
.count{
  font-size:var(--text-meta);color:var(--muted);margin:2px 0 10px
}

/* ╔═ БЛОК 3 · СПИСОК ЗАПИСЕЙ — строки и раскрытие на месте ═════════ */
.list{
  background:var(--surface);border-radius:var(--card-radius);
  box-shadow:var(--shadow-hairline);overflow:hidden
}
.hrow,.row{display:grid;align-items:center;gap:14px;padding:0 18px}
.hrow{
  grid-template-columns:1fr 150px 118px 104px 74px;
  height:38px;font-size:var(--text-meta);font-weight:var(--weight-semibold);
  color:var(--muted);border-bottom:1px solid var(--line-soft)
}
.row{
  grid-template-columns:1fr 150px 118px 104px 74px;
  min-height:48px;border-bottom:1px solid var(--line-soft);cursor:pointer
}
.row:last-of-type{border-bottom:none}
.row:hover{background:var(--tint)}
.row.open{background:var(--tint)}
.cell-name{display:flex;align-items:center;gap:11px;min-width:0;padding:7px 0}
.logo-sq{
  width:30px;height:30px;flex:none;border-radius:9px;background:var(--sage-pale);
  color:var(--sage-dark);display:grid;place-items:center;
  font-size:var(--text-meta);font-weight:var(--weight-bold)
}
.cell-name .t{min-width:0}
.cell-name .t b{font-weight:var(--weight-semibold);font-size:var(--text-body);display:block}
.cell-name .t span{font-size:var(--text-meta);color:var(--muted)}
.chip{
  display:inline-flex;align-items:center;height:28px;padding:0 11px;
  border-radius:var(--pill-radius);font-size:var(--text-meta);
  font-weight:var(--weight-semibold);background:var(--tint);color:var(--ink-2);
  box-shadow:var(--shadow-ring)
}
.chip--sage{background:var(--sage-pale);color:var(--sage-dark);box-shadow:none}
.chip--gold{background:var(--gold-pale);color:var(--gold);box-shadow:none}
.chip--coral{background:var(--coral-pale);color:var(--coral);box-shadow:none}
.chip--blue{background:var(--blue-pale);color:var(--blue);box-shadow:none}
.chip--key{
  background:var(--surface);box-shadow:var(--shadow-ring);
  font-family:"DM Mono",monospace;font-weight:var(--weight-medium)
}
.num{font-size:var(--text-body);color:var(--ink-2);font-variant-numeric:tabular-nums}
.open-l{font-size:var(--text-body);color:var(--sage);font-weight:var(--weight-semibold);text-align:right}

/* раскрытие строки на месте — §5 дизайн-системы, не модалка */
.expand{
  background:var(--surface);box-shadow:var(--shadow-float);
  border-radius:var(--card-radius);margin:2px 12px 14px;padding:18px;
  position:relative
}
.expand::before{
  content:"";position:absolute;top:-6px;left:40px;width:12px;height:12px;
  background:var(--surface);transform:rotate(45deg)
}
.facts{
  display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px
}
.fact .k{font-size:var(--text-meta);font-weight:var(--weight-semibold);color:var(--muted)}
.fact .v{font-size:var(--text-value);font-weight:var(--weight-semibold);margin-top:2px}

/* ╔═ БЛОК 4 · ПЛИТКИ — сетка карточки записи ══════════════════════ */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.tile{
  background:var(--surface);border-radius:var(--card-radius);
  box-shadow:var(--shadow-lift);padding:18px 20px;min-width:0
}
.t-4{grid-column:span 4} .t-5{grid-column:span 5} .t-6{grid-column:span 6}
.t-7{grid-column:span 7} .t-8{grid-column:span 8} .t-12{grid-column:span 12}
.th{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.th h2{
  font-size:var(--text-tile-title);font-weight:var(--weight-bold);letter-spacing:-.01em
}
.th .n{font-size:var(--text-meta);color:var(--muted)}
.th .a{margin-left:auto}
.fl{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-soft)}
.fl:last-child{border-bottom:none}
.fl .k{font-size:var(--text-body);color:var(--muted)}
.fl .v{font-size:var(--text-value);font-weight:var(--weight-semibold);text-align:right}

/* шапка записи */
.rh{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
.rh .big{
  width:60px;height:60px;flex:none;border-radius:var(--card-radius);
  background:var(--sage-pale);color:var(--sage-dark);display:grid;place-items:center;
  font-size:var(--text-heading);font-weight:var(--weight-extrabold)
}
.rh .nm{
  font-family:Newsreader,Georgia,serif;font-size:var(--text-record);
  font-weight:600;line-height:1.1;letter-spacing:-.01em
}
.rh .meta{color:var(--muted);font-size:var(--text-body);margin-top:3px}
.rh .chips{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.rh .act{margin-left:auto;display:flex;gap:8px;align-items:center}
.crumb{
  font-size:var(--text-meta);color:var(--muted);margin-bottom:12px;
  display:flex;align-items:center;gap:6px
}
.crumb button{color:var(--sage);font-weight:var(--weight-semibold);font-size:var(--text-meta)}

/* ╔═ БЛОК 5 · ЛЕНТА КАСАНИЙ — шов между CRM и аутричем ════════════ */
.led{position:relative;padding-left:20px}
.led::before{
  content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--line-2)
}
.ev{position:relative;padding:10px 0;border-bottom:1px solid var(--line-soft)}
.ev:last-child{border-bottom:none}
.ev::before{
  content:"";position:absolute;left:-19px;top:16px;width:9px;height:9px;
  border-radius:50%;background:var(--faint);box-shadow:0 0 0 3px var(--surface)
}
.ev.in::before{background:var(--sage)}
.ev.bot::before{background:var(--blue)}
.ev.stop::before{background:var(--coral)}
.ev .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.ev .top b{font-size:var(--text-body);font-weight:var(--weight-semibold)}
.ev .top .d{margin-left:auto;font-size:var(--text-meta);color:var(--muted)}
.ev .q{
  margin-top:8px;padding:11px 13px;background:var(--tint);
  border-radius:var(--control-radius);box-shadow:var(--shadow-hairline);
  font-size:var(--text-body);color:var(--ink-2);white-space:pre-wrap;line-height:1.6
}
.src{
  display:inline-flex;align-items:center;height:22px;padding:0 8px;
  border-radius:var(--pill-radius);font-size:11.5px;font-weight:var(--weight-semibold);
  background:var(--tint);color:var(--muted);box-shadow:var(--shadow-ring)
}
.src.crm{background:var(--sage-pale);color:var(--sage-dark);box-shadow:none}
.src.out{background:var(--blue-pale);color:var(--blue);box-shadow:none}

/* ╔═ БЛОК 6 · КАНАЛЫ — здоровье инфраструктуры ════════════════════ */
.ch{
  display:grid;grid-template-columns:1fr 92px 92px 118px 96px;gap:14px;
  align-items:center;padding:13px 0;border-bottom:1px solid var(--line-soft)
}
.ch:last-child{border-bottom:none}
.ch .who{min-width:0}
.ch .who b{font-family:"DM Mono",monospace;font-size:13px;font-weight:500;display:block}
.ch .who span{font-size:var(--text-meta);color:var(--muted)}
.meter{height:6px;border-radius:var(--pill-radius);background:var(--line-soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:var(--pill-radius);background:var(--sage)}
.meter i.warn{background:var(--gold)}
.meter i.bad{background:var(--coral)}
.mv{font-size:var(--text-meta);color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}

.note{
  background:var(--tint);border-radius:var(--control-radius);
  box-shadow:var(--shadow-hairline);padding:13px 15px;
  font-size:var(--text-body);color:var(--ink-2);line-height:1.6
}
.note b{font-weight:var(--weight-bold)}
.seam{
  background:var(--sage-pale);border-radius:var(--control-radius);
  padding:13px 15px;font-size:var(--text-body);color:var(--sage-dark);line-height:1.6
}
.banner{
  display:flex;align-items:center;gap:10px;background:var(--gold-pale);
  color:var(--gold);border-radius:var(--control-radius);padding:10px 14px;
  font-size:var(--text-meta);font-weight:var(--weight-semibold);margin-bottom:16px
}
.hide{display:none}
@media (max-width:900px){
  .side{display:none}
  .hrow,.row{grid-template-columns:1fr 104px}
  .hrow span:nth-child(n+3),.row > *:nth-child(n+3){display:none}
  .bento > *{grid-column:span 12}
  .facts{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="shell">

  <!-- ╔═ БЛОК 1 · ЛЕВАЯ ПАНЕЛЬ ═══════════════════════════════════ -->
  <aside class="side">
    <div class="logo"><i>L</i> Lusin</div>

    <div class="grp">
      <h3>Workspace</h3>
      <button class="nav" data-go="companies"><span class="ic">▦</span>Companies<span class="cnt q">340</span></button>
      <button class="nav on" data-go="contacts"><span class="ic">◎</span>Contacts<span class="cnt q">244</span></button>
      <button class="nav" data-go="engagements"><span class="ic">◈</span>Engagements<span class="cnt q">3</span></button>
      <button class="nav" data-go="campaigns"><span class="ic">➤</span>Campaigns<span class="cnt">2</span></button>
    </div>

    <div class="grp">
      <h3>Build</h3>
      <button class="nav" data-go="agents"><span class="ic">✳</span>Agent Studio</button>
      <button class="nav" data-go="pages"><span class="ic">▤</span>Page Studio</button>
    </div>

    <div class="grp">
      <h3>Control</h3>
      <button class="nav" data-go="channels"><span class="ic">⌁</span>Channels<span class="cnt">1</span></button>
      <button class="nav" data-go="approvals"><span class="ic">✓</span>Approvals<span class="cnt">2</span></button>
      <button class="nav" data-go="audit"><span class="ic">◷</span>Audit</button>
    </div>

    <div class="ws">
      <div class="box">
        <div class="n">Bobroff Cap</div>
        <div class="s">MSP roll-up · Boston</div>
      </div>
    </div>
  </aside>

  <!-- ╔═ БЛОК 1б · ШАПКА ═════════════════════════════════════════ -->
  <div class="main">
    <div class="bar">
      <div class="search"><span>Search records and commands</span><span class="k">⌘K</span></div>
      <div class="right">
        <button class="btn btn--ghost">Notifications</button>
        <div class="av">LI</div>
      </div>
    </div>

    <div class="page" id="page"></div>
  </div>
</div>

<script>
/* ╔═ БЛОК 7 · ДАННЫЕ ════════════════════════════════════════════════
   Вымышлено. В продукте демо-данных на экране быть не должно (§1.8).
   Ключевое поле каждого касания — source: crm | outreach.
   Именно оно доказывает, что лента одна на двоих.
   ═══════════════════════════════════════════════════════════════════ */

const CONTACTS = [
  { id:'c1', nm:'Mark Reilly', role:'Owner', co:'Anchor IT', dom:'anchorit.com',
    mail:'mark@anchorit.com', place:'Waltham, MA', size:'34 staff',
    stage:'Meeting booked', stageKind:'sage', consent:'Open',
    sig:'Data breach filed with Massachusetts registry · Dec 2025 · 1,900 records',
    camp:'Boston MSP · breach signal',
    touch:[
      {d:'2 Sep', s:'outreach', k:'Email sent', t:'Re: your December filing', cls:'',
       b:'Mark, I saw your filing in the Massachusetts registry — December, 1,900 records.\n\nWe work through these with MSPs your size: not another antivirus, but closing the way in.\n\nWorth fifteen minutes?'},
      {d:'2 Sep', s:'outreach', k:'Opened', t:'Three times that evening', cls:''},
      {d:'4 Sep', s:'outreach', k:'Replied', t:'Positive', cls:'in',
       b:'December was rough. We are looking for someone to close it properly. I can talk next week.'},
      {d:'4 Sep', s:'crm', k:'Sequence stopped', t:'Reply detected — remaining steps cancelled', cls:'bot'},
      {d:'4 Sep', s:'crm', k:'Stage changed', t:'Working → Meeting booked', cls:'bot'},

/* ── Contacts: живой список ── */

  '<div class="act"><button class="btn">Export CSV</button>' +
  '<button class="btn btn--primary">New contact</button></div></div>' +

  '<div class="qbar">' +
    '<div class="seg"><button class="on">Mine</button><button>All</button></div>' +
    '<div class="seg"><button class="on">Rows</button><button>Tiles</button></div>' +
    '<button class="btn">Columns</button><button class="btn">Filters</button>' +
    '<button class="btn btn--ghost">Saved segments</button>' +
  '</div>' +
  '<div class="count" role="status">7 of 244 shown · sorted by last touch</div>' +

  'by every future campaign, because the block is held on him, not on the campaign.</div>';

function rowHTML(c){
  const open = S.open === c.id;
  const chip = c.stageKind ? 'chip chip--' + c.stageKind : 'chip';
  let h = '<div class="row' + (open ? ' open' : '') + '" onclick="toggleRow(\'' + c.id + '\')">' +
    '<div class="cell-name"><div class="logo-sq">' + esc(c.nm[0] + c.co[0]) + '</div>' +
      '<div class="t"><b>' + esc(c.nm) + '</b><span>' + esc(c.role + ' · ' + c.co) + '</span></div></div>' +
    '<div><span class="' + chip + '">' + esc(c.stage) + '</span></div>' +
    '<div style="font-size:var(--text-meta);color:var(--muted);overflow:hidden;text-overflow:ellipsis" title="' + esc(c.camp) + '">' + esc(c.camp) + '</div>' +
    '<div class="num">' + c.touch.length + '</div>' +
    '<div class="open-l">Open</div></div>';
  if (open) h += expandHTML(c);
  return h;
}

function expandHTML(c){
  const last = c.touch[c.touch.length - 1];
  return '<div class="expand">' +
    '<div class="facts">' +
      '<div class="fact"><div class="k">Signal it came from</div><div class="v" style="font-size:var(--text-body)">' + esc(c.sig) + '</div></div>' +

}

      '<div class="fl"><span class="k">Company</span><span class="v">' + esc(c.co) + '</span></div>' +

      '<div class="fl"><span class="k">Email</span><span class="v mono">' + esc(c.mail) + '</span></div>' +
      '<div class="fl"><span class="k">LinkedIn</span><span class="v mono">/in/' + esc(c.nm.toLowerCase().replace(' ', '-')) + '</span></div>' +
      '<div class="fl"><span class="k">Sent from</span><span class="v mono">nicolas@anchor-reach.com</span></div></div>' +

    '<div class="tile t-7"><div class="th"><h2>Consent</h2></div>' +
      '<div class="fl"><span class="k">Status</span><span class="v">' + esc(c.consent) + '</span></div>' +

      '<div class="fl"><span class="k">Applies to</span><span class="v">Every campaign, now and later</span></div>' +
      '<div class="seam" style="margin-top:12px">A block set here is obeyed by Outreach before any send. It is not a property of the campaign or of the sender.</div></div>' +

    '<div class="tile t-12"><div class="th"><h2>Touch ledger</h2>' +
      '<span class="n">' + c.touch.length + ' events · ' + outN + ' from Outreach · ' + crmN + ' from CRM</span></div>' +
      '<div class="led">' + lenta + '</div>' +
      '<div class="seam" style="margin-top:14px">One ledger, both sides. Outreach writes what the channel did; CRM writes what it changed in response. ' +

}

/* ── Заглушки для экранов, которые уже есть в ai-crm ── */
function vStub(name, what){
  return proto +
  '<div class="ph"><div><h1>' + esc(name) + '</h1>' +
  '<div class="sub">' + esc(what) + '</div></div></div>' +
  '<div class="tile t-12"><div class="note">This screen already exists in <b>bobroff-cap/ai-crm</b> — it is not redrawn here. ' +
  'The prototype only adds what is missing: <b>Campaigns</b>, <b>Channels</b>, and the touch ledger inside a contact.</div></div>';
}

/* ╔═ БЛОК 9 · НАВИГАЦИЯ ════════════════════════════════════════════ */
function render(){
  const P = document.getElementById('page');
  if (S.rec){ P.innerHTML = vRecord(); window.scrollTo(0,0); return; }
  P.innerHTML = {
    contacts:   vContacts,
    campaigns:  vCampaigns,
    channels:   vChannels,
    companies:  () => vStub('Companies', 'Canonical companies, attributes and provenance.'),
    engagements:() => vStub('Engagements', 'Pipelines, stages and next steps.'),
    agents:     () => vStub('Agent Studio', 'Agent definitions, capabilities and runs.'),
    pages:      () => vStub('Page Studio', 'Declarative page schemas and releases.'),
    approvals:  () => vStub('Approvals', 'Two-person approval of administrative actions.'),
    audit:      () => vStub('Audit', 'Every command, who ran it and what changed.')
  }[S.page]();
  document.querySelectorAll('.nav').forEach(n =>
    n.classList.toggle('on', n.dataset.go === S.page));
}
function go(p){ S.page = p; S.rec = null; S.open = null; render(); window.scrollTo(0,0); }
function toggleRow(id){ S.open = S.open === id ? null : id; render(); }
function openRec(id){ S.rec = id; render(); }

document.querySelectorAll('.nav').forEach(n =>
  n.addEventListener('click', () => go(n.dataset.go)));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (S.rec){ S.rec = null; render(); } else if (S.open){ S.open = null; render(); } }
});
render();
</script>
