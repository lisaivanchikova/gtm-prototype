.cd.out{color:var(--fg3);opacity:.4}
.calrow i{font-style:normal;font-size:10px;color:var(--fg3);padding-left:8px;white-space:nowrap}
.calrow.fc i{color:var(--accent)}
.calnote{font-size:10px;color:var(--fg3);line-height:1.35}


/* подпись объекта на вкладке области */
.tabb button .sub{color:var(--fg3);margin-left:8px;font-size:10px}
.tabb[aria-selected="true"] button .sub{color:var(--fg2)}
.wfrow{margin-bottom:8px}
.wfrow .row.sub .nm{padding-left:12px;color:var(--fg2)}

/* Фильтры: одна строка на поле — подпись слева, значение справа, × сбрасывает.
   Образец — карточка FILTERS в Lusin Sourcing Hub (кадр shots-05-10-walk2/t190.jpg). */
.sfilt .hdr{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--fg3);padding:8px 12px 6px}
.sfilt .fclr{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0}
.sfilt .fclr:hover{text-decoration:underline}
.frow{display:flex;align-items:center;gap:8px;min-height:30px;padding:0 6px 0 12px;border-top:1px solid var(--border)}
.frow .fk{color:var(--fg2);font-size:11px;white-space:nowrap}
.frow .fv{margin-left:auto;max-width:62%;background:none;border:0;color:var(--fg);font:inherit;font-size:11px;
  font-weight:600;text-align:right;text-align-last:right;cursor:pointer;padding:4px 0}
.frow .fv:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.frow .fx{width:18px;text-align:center;color:var(--fg3);background:none;border:0;cursor:pointer;font-size:11px}
.frow button.fx:hover{color:var(--fg)}
.frow.fchk{cursor:pointer}
.frow.fchk input{margin-left:auto}

.dblink{display:block;width:100%;text-align:left;padding:8px 12px;margin-top:8px;background:none;border:0;
  border-top:1px solid var(--border);color:var(--accent);font:inherit;font-size:11px;cursor:pointer}
.dblink:hover{background:var(--hover)}
</style>

/* Правило Николая: лента следует за кнопкой слева. Значит у каждой кнопки

const ENTFEED={seg:'market',acc:'account',ppl:'people',flow:'flow',doc:'account',ag:'agents',us:'channel'};
/* Роль не меняет ни зоны, ни дом. «А когда выбирает роль, например, юрист, у него

function setEnt(k){if(!k||S.ent===k){S.ptab=S.mail?'channel':ENTFEED[S.ent];return;}S.ent=k;S.ptab=ENTFEED[k];S.mail=null;}
/* Бейдж обещает ровно то, что человек увидит, нажав кнопку: число строк,

function entBadge(k){

function applyLayout(){
  const b=$('body'),c=$('center'),L=S.layout;
  b.classList.toggle('no-side',!L.side);b.classList.toggle('no-agent',!L.agent);b.classList.toggle('swap',L.swap);
  c.classList.toggle('no-panel',!L.panel);c.classList.toggle('panel-right',L.panelRight);
  $('tSide').setAttribute('aria-pressed',L.side);$('tPanel').setAttribute('aria-pressed',L.panel);$('tAgent').setAttribute('aria-pressed',L.agent);

  /* панели не должны съедать рабочее поле на узком экране: зажимаем показ, сохранённые значения не трогаем */
  const W=Math.max(640,innerWidth);
  const sb=Math.min(L.sbw||270,Math.max(170,W*0.24)), ag=Math.min(L.agw||340,Math.max(210,W*0.30));
  b.style.setProperty('--sbw',Math.round(sb)+'px');b.style.setProperty('--agw',Math.round(ag)+'px');if(L.pnh)c.style.setProperty('--pnh',L.pnh+'px');if(L.pnw)c.style.setProperty('--pnw',L.pnw+'px');
  saveLayout();setTimeout(()=>{if(ML&&MLREADY)ML.resize();},60);
}
/* gutters: drag to resize, like VS Code sashes */
document.querySelectorAll('.gutter').forEach(g=>{
  g.addEventListener('pointerdown',ev=>{ev.preventDefault();g.setPointerCapture(ev.pointerId);g.classList.add('drag');
    const key=g.dataset.g,start={x:ev.clientX,y:ev.clientY},L=S.layout,b=$('body').getBoundingClientRect(),c=$('center').getBoundingClientRect();
    const pr=L.panelRight&&key==='pnh';
    const move=e=>{
      if(key==='sbw'){let v=(L.swap?b.right-e.clientX:e.clientX-b.left)-48;L.sbw=Math.max(180,Math.min(480,v));}
      else if(key==='agw'){let v=L.swap?e.clientX-b.left-48:b.right-e.clientX;L.agw=Math.max(260,Math.min(560,v));}
      else if(pr){L.pnw=Math.max(280,Math.min(c.width-300,c.right-e.clientX));}
      else{L.pnh=Math.max(120,Math.min(c.height-160,c.bottom-e.clientY));}
      applyLayout();};
    const up=()=>{g.classList.remove('drag');g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);};
    g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);});
});
$('tSide').onclick=()=>{S.layout.side=!S.layout.side;applyLayout();renderActivity();};
$('tPanel').onclick=()=>{S.layout.panel=!S.layout.panel;applyLayout();};

function attnList(seg){return ACC.filter(a=>a.seg===seg&&stateAt(a,S.t)).sort((x,y)=>(y.feat-x.feat)||(momentum(x,S.t)-momentum(y,S.t))).slice(0,6);}
function accRow(a,ind=2){const m=momentum(a,S.t),e=stateAt(a,S.t);return `<button class="row ${S.sel&&S.sel.id===a.id?'on':''}" data-open="acc:${a.id}" style="padding-left:${ind*12}px"><span class="tw"></span>${logo(a,'sq')}<span class="nm" title="${esc(a.name)}">${esc(a.name)}</span><span class="rt"><span class="${mcls(m)}">${arrow(m)}</span> ${e?STAGE[e.s]:''}</span></button>`;}
/* ===== A8 · один компонент фильтров на все сущности =====
   «Найдите самый лучший в мире формат отражения фильтров, он должен быть униформным…
   все блоки должны начинаться с блока фильтров униформных» (Николай, 30.09).
   Поле описывается данными — метка, откуда берётся, куда кладётся, какие значения.
   Как его показать, решает компонент, а не автор экрана: пока значения умещаются в пару строк —
   чипами, иначе списком. Один заголовок, один сброс, один вид выбранного. */
const FOPT={
  seg:()=>[['','all']].concat(SEGS.map(g=>[g.id,g.abc+' · '+g.name,'Core job: “'+g.job+'” · NAICS '+g.naics.join(', ')])),
  /* Работа — не независимый фильтр, а свойство сегмента. Предлагать работу,
     которой в выбранном сегменте нет, значит предлагать пустой экран:
     восемь из двенадцати пар давали ноль компаний (Николай, 06.10, 07:40). */
  job:()=>JOBS.filter(([k])=>!k||ACC.some(a=>(!S.seg||a.seg===S.seg)&&jobOf(a)===k)),
  st:()=>[['','all states']].concat([...new Set(ACC.map(a=>a.st))].sort().map(x=>[x,x])),
  stage:()=>[['','all stages']].concat([1,2,3,4,5,6,7,8].map(k=>[String(k),STAGE[k]])),
  role:()=>[['','all'],['decides','decides','has the last word'],['champions','champions','moves the deal inside the company'],['pays','pays','approves the budget and signs the invoice']],
  src:()=>[['','all'],['gmail','email'],['linkedin','LinkedIn'],['aircall','call'],['teams','meeting'],['quickbooks','invoice']],
  dkind:()=>[['','all']].concat([...new Set(Object.values(DOCS).map(d=>d.kind))].map(k=>[k,k])),
  astate:()=>[['','all'],['active','running'],['awaiting','waiting on a human'],['paused','stopped']],
  arole:()=>[['','all roles']].concat([...new Set(Object.values(AGROLE))].map(r=>[r,r])),
  proc:()=>[['sale','Sale: interest → renewal'],['onb','Onboarding ≤ 7d'],['ren','Renewal and expansion']]};
/* light — поле меняет только этот список и ленту; остальные пересчитывают формулу и карту */
const FFLD={
  seg:   {lbl:'Segment',drill:1,get:()=>S.seg||'',set:v=>{pickSeg(v||null);}},
  job:   {lbl:'Job',    get:()=>S.job||'',       set:v=>{S.job=v;}},
  st:    {lbl:'State',  get:()=>S.stF||'',       set:v=>{S.stF=v;if(v&&S.tab==='map'){const f=statesF.find(x=>x.abbr===v);f&&zoomToFeature(f);}}},
  stage: {lbl:'Stage',  get:()=>S.stage||'',     set:v=>{S.stage=v;}},
  role:  {lbl:'Role in the deal',light:1,get:()=>S.ef.role||'',  set:v=>{S.ef.role=v;}},
  src:   {lbl:'Channel',light:1,get:()=>S.ef.src||'',            set:v=>{S.ef.src=v;}},
  dkind: {lbl:'Kind',   light:1,get:()=>S.ef.dkind||'',          set:v=>{S.ef.dkind=v;}},
  astate:{lbl:'State',  light:1,get:()=>S.ef.astate||'',         set:v=>{S.ef.astate=v;}},
  arole: {lbl:'Role',   light:1,get:()=>S.ef.arole||'',          set:v=>{S.ef.arole=v;}},
  proc:  {lbl:'Process',light:1,keep:1,get:()=>S.ef.proc||'sale',set:v=>{S.ef.proc=v||'sale';}},
  newonly:{lbl:'unverified facts only',hint:'while unconfirmed, these facts stay out of the formula',type:'tog',get:()=>!!S.ef.newonly,set:v=>{S.ef.newonly=v;}},
  down:   {lbl:'stuck or leaving only',hint:'no movement for 8 days, or a churn signal',type:'tog',get:()=>!!S.downOnly,set:v=>{S.downOnly=v;}}};
const FSET={seg:['seg','job','newonly'],acc:['seg','job','st','stage','down'],ppl:['role','src'],
            /* Сегмент — главный способ сузить поток: рассылка делается по сегменту,
               и список обещает это прямо в подписи. */
            flow:['seg','proc','stage'],doc:['dkind','seg'],ag:['arole','astate'],us:['arole','astate']};
function filterBar(ent){
  S.ef=S.ef||{role:'',src:'',proc:'sale',astate:'',owner:'',newonly:false};
  const keys=FSET[ent]||FSET.acc, allf=keys.map(k=>[k,FFLD[k]]).filter(x=>x[1]);
  /* Пред-проход. Два правила, оба из его слов.
     «Являются ли эти фильтры важными» (06.10, 06:56): поле, в котором выбор один,
     ничего не решает — его на экране нет. И значение, которого больше не предлагают,
     снимается само, иначе экран остаётся пустым без объяснения. */
  const OPT={};
  for(const [k,f] of allf){
    if(f.type==='tog')continue;
    OPT[k]=(FOPT[k]||(()=>[]))();
    const cur=String(f.get());
    if(cur&&!OPT[k].some(o=>String(o[0])===cur))f.set('');
  }
  const flds=allf.filter(([k,f])=>f.type==='tog'||f.keep||OPT[k].filter(o=>String(o[0])!=='').length>=2);
  const set=flds.some(([k,f])=>f.keep?false:(f.type==='tog'?f.get():!!f.get()));
  const wide=flds.some(([k,f])=>!f.light);
  /* Подпись поля, повторяющая заголовок панели, — мусор: «сегмент выше». */
  const dup=l=>String(l).toLowerCase().replace(/s$/,'')===String(ENTNM[ent]||'').toLowerCase().replace(/s$/,'');
  /* «Так же, как у Lusin, по каждому из интересующих блоков, в том же виде» (06.10, 05:22).
     Эталон — карточка Sourcing Hub: строка на фильтр, подпись слева, значение справа,
     × сбрасывает поле, Clear all сверху. Чипы столбиком занимали половину колонки. */
  const row=([k,f])=>{
    if(f.type==='tog')return `<label class="frow fchk"${f.hint?` data-tip="${esc(f.hint)}"`:''}><span class="fk">${esc(f.lbl)}</span><input type="checkbox" data-ftog="${k}" ${f.get()?'checked':''}></label>`;
    const opts=OPT[k]||[], cur=String(f.get()), on=!f.keep&&!!f.get();
    return `<div class="frow"><span class="fk">${esc(f.lbl)}</span><select class="fv" data-fsel="${k}">`
      +opts.map(o=>`<option value="${esc(String(o[0]))}" ${cur===String(o[0])?'selected':''}>${esc(o[1])}</option>`).join('')
      +`</select>${on?`<button class="fx" data-fclr="${k}" aria-label="Clear ${esc(f.lbl)}">×</button>`:'<span class="fx"></span>'}</div>`;};
  return `<div class="sfilt"><div class="hdr">Filters`
    +(set?`<button class="fclr" data-freset="${ent}">Clear all</button>`:'')+`</div>`
    +flds.map(row).join('')+`</div>`;
}

     вернувшись к людям, человек находит того человека, с которого ушёл. */

   «как отличить, хочу я фильтровать карту или открыть рассылку» (Лиза, 07.10).
   Хозяин один — центр. Зона ведёт в него, фильтры и лента идут за ним. */
const ENTVIEW={seg:'map',acc:'acc',ppl:'person',flow:'flow',doc:'doc',ag:'person'};

/* Куда ведёт зона, если в её области лежит чужое. */
const ENTDEF={acc:()=>['org',S.mapAcc||S.sopAcc||'a0'],ppl:()=>['msg',Object.keys(PEOPLE)[0]],
              flow:()=>['sop',S.sopAcc||'a0'],doc:()=>['doc',Object.keys(DOCS)[0]],
              ag:()=>['agent',AGENTS[0].id]};
function fitsEnt(k,tb){
  if(!(ENTKIND[k]||[]).includes(tb.kind))return false;
  if(k==='acc'&&tb.kind==='org'&&tb.ref==='us')return false;   /* «мы» живут в зоне Agents */
  if(k==='acc'&&tb.kind==='db')return S.dbKind!=='person'&&S.dbKind!=='doc';

   Без него переход программный (смена роли, провал из ленты), и колонка не должна

    /* Ступень задавалась только зумом — поэтому выбор сегмента в списке никуда не вёл:
       пузырьки лишь фильтровались, а «дальше появляются юрлица» не происходило.
       Выбранный сегмент — это и есть переход на вторую ступень. */
    const lv=S.mapAcc?'people':(S.seg||S.showAcc||z>=4.2)?'accounts':'segment';
    if(lv!==S.level){S.level=lv;
      /* уровень карты задаёт сущность только если внутри ничего не выбрано:
         иначе перелёт к юрлицу сбивал бы выбранный документ или поток */
      setEnt((S.sel&&ENTOF[S.sel.type])||{segment:'seg',accounts:'acc',people:'ppl'}[lv]);
      renderMap();renderCrumbs();renderPanel();}

function zoomTo(x,y,k){if(!ML)return;const ll=proj.invert([x,y]);if(ll)ML.flyTo({center:ll,zoom:kToZoom(k),duration:900});}
/* Левая рейка — то же дерево списком, и она обязана вести карту так же, как клик
   по пузырю: «дальше ты прям на карте можешь нажать на сегмент, появляются юрлица,
   карта увеличивается» (30.09). Один вход на все три места выбора. */
function zoomToSeg(id){
  if(!ML||!statesF||!statesF.length)return;
  const sts=new Set(ACC.filter(a=>a.seg===id&&stateAt(a,S.t)).map(a=>a.st));
  const fs=statesF.filter(f=>sts.has(f.abbr));
  if(!fs.length)return;
  let X0=Infinity,Y0=Infinity,X1=-Infinity,Y1=-Infinity;
  for(const f of fs){const [[x0,y0],[x1,y1]]=pathG.bounds(f);
    X0=Math.min(X0,x0);Y0=Math.min(Y0,y0);X1=Math.max(X1,x1);Y1=Math.max(Y1,y1);}
  const p1=proj.invert([X0,Y1]),p2=proj.invert([X1,Y0]);
  if(!p1||!p2)return;
  const bb=[[Math.min(p1[0],p2[0]),Math.min(p1[1],p2[1])],[Math.max(p1[0],p2[0]),Math.max(p1[1],p2[1])]];
  const cam=ML.cameraForBounds?ML.cameraForBounds(bb,{padding:70}):null;
  if(!cam){ML.fitBounds(bb,{padding:70,duration:900});return;}
  /* сегмент раскинут на десять штатов — вписывание отдаляло бы карту. Лестница ведёт
     вниз, а не вверх: центр переносим, но дальше, чем были, не уходим. */
  ML.flyTo({center:cam.center,zoom:Math.max(cam.zoom,ML.getZoom()),duration:900});}
function pickSeg(id,fly){
  S.seg=id||null;S.sel=null;S.mapAcc=null;S.showAcc=false;
  S.level=id?'accounts':'segment';
  setEnt(id?'acc':'seg');
  renderAll();
  if(fly===false)return;
  if(id)zoomToSeg(id);
  else if(ML)ML.flyTo({center:[-96,38.5],zoom:3.1,duration:700});}
function zoomToFeature(f){if(!ML)return;const [[x0,y0],[x1,y1]]=pathG.bounds(f);
  const p1=proj.invert([x0,y1]),p2=proj.invert([x1,y0]);
  if(!p1||!p2){return;}
  ML.fitBounds([[Math.min(p1[0],p2[0]),Math.min(p1[1],p2[1])],[Math.max(p1[0],p2[0]),Math.max(p1[1],p2[1])]],{padding:60,duration:900});}

function renderMap(){
  if(!ML||!MLREADY)return;
  const t=S.t,seg=S.level==='segment',z=ML.getZoom();
  const UP=cssv('--up'),DN=cssv('--down'),FL=cssv('--flat');
  $('mapbox').classList.toggle('future',t>NOW);

  /* --- юрлица точками на слое: их сотни, это работа карты, не DOM --- */
  const vis=seg?[]:ACC.filter(a=>{const e=stateAt(a,t);if(!e||!inF(a))return false;
    if(e.s>=7&&t-e.w>=3)return false;if(S.downOnly&&momentum(a,t)>=0)return false;return true;});
  {const box=$('mnone');
   /* Пузыри сегментов — сумма юрлиц, поэтому пусто на обоих уровнях одинаково. */
   if(box){const empty=!ACC.some(a=>!a.feat&&inF(a));
     box.hidden=!empty;

       +ACC.filter(a=>!a.feat).length+' companies in all.'
       +'<button data-freset="'+S.ent+'">Clear all filters</button>';}}
  const clustered=!seg&&z<5.6&&!(S.sel&&S.sel.type==='acc');
  const pts=clustered?[]:vis;
  const src=ML.getSource('accsrc');
  if(src)src.setData({type:'FeatureCollection',features:pts.map(a=>{const m=momentum(a,t);
    return {type:'Feature',geometry:{type:'Point',coordinates:llOf(a)},
      properties:{id:a.id,col:m>0?UP:m<0?DN:FL,sel:(S.sel&&S.sel.id===a.id)?1:0}};})});

  clearMarkers();

  /* --- первая ступень: сегменты пузырями на штат. Один пузырь = один сегмент
         в одном штате. Размер = $ его рынка там, цвет = движение ARR.
         Клик = «выбрал сегмент» и проваливание к юрлицам этого сегмента. --- */
  if(seg){
    const SEGL=S.seg?SEGS.filter(g=>g.id===S.seg):SEGS;
    const cells=[];
    statesF.forEach(f=>{const c=pathG.centroid(f);if(!isFinite(c[0]))return;
      const ll=proj.invert(c);if(!ll)return;

    const rS=d3.scaleSqrt().domain([0,d3.max(cells.flatMap(c=>c.here.map(x=>x.s.v)))||1]).range([0,26]);
    cells.forEach(c=>{const box=document.createElement('div');box.className='segclu';
      c.here.forEach(x=>{const r=Math.max(20,rS(x.s.v)*1.5),b=document.createElement('span');
        b.className='sb';b.style.width=b.style.height=r+'px';b.style.background=tradeCol(x.s.d);
        b.style.fontSize=(r>30?11:9.5)+'px';
        b.innerHTML=`${x.g.abc}<i>${x.s.d>=0?'▲':'▼'}${Math.abs(x.s.d*100).toFixed(1)}</i>`;
        b.title=`${x.g.name} in ${c.f.properties.name} · market ${usd(x.s.v)} · ${int(x.s.n)} accounts · our ARR ${usd(x.s.end)} ${x.s.d>=0?'▲':'▼'} ${Math.abs(x.s.d*100).toFixed(1)} %`;
        b.onclick=ev=>{ev.stopPropagation();pickSeg(x.g.id,false);zoomToFeature(c.f);};
        box.appendChild(b);});
      const ab=document.createElement('b');ab.className='ab';ab.textContent=c.f.abbr;box.appendChild(ab);
      mkMarker('bub',c.ll,box);});
  }

  /* --- уровень юрлиц издалека: кластеры по метро --- */
  if(clustered){
    d3.groups(vis,a=>a.mi).forEach(([mi,arr])=>{const m=METROS[mi];
      const up=arr.filter(a=>momentum(a,t)>0).length,dn=arr.filter(a=>momentum(a,t)<0).length;
      const bal=(up-dn)/arr.length,r=Math.max(22,16+Math.sqrt(arr.length)*4.2);
      const el=document.createElement('div');el.className='mk';
      el.style.width=el.style.height=r+'px';el.style.background=bal<0?DN:bal>0?UP:FL;
      el.textContent=arr.length;
      el.title=`${m[0]}, ${m[1]} · ${arr.length} accounts · ▲ ${up} moving · ▼ ${dn} stuck or leaving`;
      el.onclick=()=>ML.flyTo({center:[m[2],m[3]],zoom:8.2,duration:900});
      mkMarker('clu',[m[2],m[3]],el);});
  }

  /* --- мы: такая же точка на карте --- */
  const hq=document.createElement('div');hq.className='mk hq';
  hq.title='We are a point on this map like any other: our people and our agents';
  hq.onclick=()=>{selectNode('us',null);};
  mkMarker('hq',[-73.99,40.75],hq);

  /* --- человечки вокруг выбранного юрлица --- */
  /* На каком юрлице стоит карта — отдельное состояние от того, что выбрано внутри него.
     Иначе выбор человека, документа или потока гасил бы всю органеграмму. */
  const selA=S.mapAcc?ACCBY[S.mapAcc]:null;
  /* Третья ступень хребта: люди сверху, документы снизу, поток слева, агент справа.
     Снималась 06.10 по реплике «не вижу смысла на карте органеграммы отображать»
     (08:29) — сказанной неуверенно и тут же оставленной. Это элемент хребта, и
     трогать его по такой реплике было нельзя: без него третья ступень — голая
     точка на уличной карте. Возвращено.
     Если решим убирать — только отдельным решением, не попутно. */
  if(selA&&S.orgOpen){
    const P=peopleOf(selA),miss=selA===BRIGHT?2:-1;
    const box=document.createElement('div');box.className='mkorg';
    const pos=[[0,-64],[-62,-30],[62,-30]];
    pos.forEach(q=>{const ln=document.createElement('i');ln.className='ln';
      const len=Math.hypot(q[0],q[1]+14),ang=Math.atan2(q[1]+14,q[0])*180/Math.PI;
      ln.style.width=len+'px';ln.style.left='0px';ln.style.top='-14px';ln.style.transform=`rotate(${ang}deg)`;
      box.appendChild(ln);});
    P.forEach((p,i)=>{const n=document.createElement('div');
      const pl=personLight(selA,p,i);
      n.className='node '+(pl[0]||'')+(i===miss?' miss':'')+(S.sel&&S.sel.type==='person'&&S.sel.id===p.id?' on':'');
      n.style.left=pos[i][0]+'px';n.style.top=pos[i][1]+'px';
      /* фигурка человека: круглая голова и полукруг-тельце — тот же знак, что в списках */
      n.innerHTML=`<span>${esc(p.nm.split(' ').slice(-1)[0])} · ${esc(p.role.split(' ')[0])}</span><i>${GLYPH.person}</i>`;
      n.title=`${p.nm} — ${p.role} · ${pl[1]}${i===miss?' · the signature is waiting on their yes':''} → conversation log`;
      n.onclick=ev=>{ev.stopPropagation();selectNode('person',p.id);};
      box.appendChild(n);});

    /* «Сверху органеграмма, снизу документы, слева значок workflows» (Николай, 21:50).
       Цвет узла — его состояние, тот же язык, что и у юрлиц на карте. */
    const mkNode=(cls,x,y,label,tip,on,fn)=>{const n=document.createElement('div');
      n.className='node '+cls+(on?' on':'');n.style.left=x+'px';n.style.top=y+'px';
      /* знак берём из общей таблицы: на карте были два квадрата — поток и агент —
         и голый кружок вместо человека, поэтому типы не различались */
      const kind=/\bdoc\b/.test(cls)?'document':/\bflow\b/.test(cls)?'flow':/\bbot\b/.test(cls)?'agent':'person';
      n.innerHTML=`<i>${GLYPH[kind]}</i><span>${esc(label)}</span>`;n.title=tip;
      n.onclick=ev=>{ev.stopPropagation();fn();};box.appendChild(n);
      const len=Math.hypot(x,y),ang=Math.atan2(y,x)*180/Math.PI;
      const ln=document.createElement('i');ln.className='ln';ln.style.width=len+'px';ln.style.left='0px';ln.style.top='0px';
      ln.style.transform=`rotate(${ang}deg)`;box.insertBefore(ln,box.firstChild);};

    const docs=Object.entries(DOCS).filter(([id,d])=>d.acc===selA.id&&d.w<=Math.max(t,NOW)).slice(-3);
    const dpos=[[-58,62],[0,74],[58,62]];
    docs.forEach(([id,d],i)=>{const st=(S.docs[id]&&S.docs[id].us)?'up':d.status?d.status[0]:'flat';
      mkNode('doc '+st,dpos[i][0],dpos[i][1],d.kind,
        `${d.kind} · ${d.ttl}${d.status?' · '+d.status[1]:''} → the log of this document`,
        S.sel&&S.sel.type==='doc'&&S.sel.id===id,()=>selectNode('doc',id));});

    const e=stateAt(selA,t),stuckNow=e&&momentum(selA,t)<0;
    mkNode('flow '+(stuckNow?'down':'up'),-96,10,'Workflow',
      `The flow of this deal: who owes what to whom to get the document signed${e?' · stage “'+STAGE[e.s]+'”':''} → the log of this deal`,
      S.sel&&S.sel.type==='sop'&&S.sel.id===selA.id,()=>selectNode('sop',selA.id));

    const ag=AGENTS.find(g=>e&&g.owns.includes(e.s))||agBy('seller');
    mkNode('bot'+(ag.state==='paused'?' down':ag.state==='awaiting'?' warn':''),96,10,ag.nm+' · agent',
      `${ag.nm} — ${ag.title} · ${ASTATE[ag.state][1]} → what it did on this account`,
      S.sel&&S.sel.type==='agent'&&S.sel.id===ag.id,()=>selectNode('agent',ag.id));
    mkMarker('org',llOf(selA),box);
  }

  /* три ступени — три легенды. Ступень 3 раньше наследовала подпись второй и
     описывала точки ARR, которых на ней нет: там люди, документы, СОП и агент. */
  const legNode=k=>`<s>${GLYPH[k]}</s>`;
  $('legend').innerHTML=S.mapAcc?`<span>${legNode('person')}person</span><span>${legNode('document')}document</span><span>${legNode('flow')}workflow</span><span>${legNode('agent')}agent</span><span>colour = state, the same as everywhere</span>`
    :S.seg?`<span>ARR over 4 weeks</span><span class="grad"></span><span class="num">−4 % … +4 %</span><span>· size = $ of the segment market</span><span><i style="background:var(--agent);border-radius:1px;transform:rotate(45deg)"></i>us</span>`
      :`<span>one bubble = one segment in one state</span><span>size = $ of its market there</span><span><i style="background:var(--up)"></i>▲ moving</span><span><i style="background:var(--down)"></i>▼ stuck ≥ 8d or a churn signal</span><span><i style="background:var(--flat)"></i>■ flat</span>${t>NOW?'<span>faded — forecast</span>':''}<span><i style="background:var(--agent);border-radius:1px;transform:rotate(45deg)"></i>us</span>`;
}
/* «Если мы куда-то перекликнули, то все экраны должны соответствовать рабочей
   области» (Николай, 06.10, 11:18). Пять областей помнят свой объект — но когда
   выбрана компания, помнить они обязаны ЕЁ человека и ЕЁ документ, иначе Person
   говорит об одной компании, а Account о другой, и переключение выглядит так,
   будто ничего не изменилось. */
function pointAllViews(a){
  setView('org',a.id); setView('sop',a.id);
  const ppl=peopleOf(a), lead=ppl.find(p=>p.role==='decides')||ppl[0];
  if(lead)setView('msg',lead.id);
  const docs=Object.entries(DOCS).filter(([,d])=>d.acc===a.id).sort((x,y)=>y[1].w-x[1].w);
  if(docs.length)setView('doc',docs[0][0]);
}
function selectAcc(a){S.sel={type:'acc',id:a.id};S.mapAcc=a.id;S.sopAcc=a.id;S.orgOpen=true;S.level='people';
  pointAllViews(a);syncFilters();renderTabs();
  if(ML&&MLREADY)ML.flyTo({center:llOf(a),zoom:Math.max(ML.getZoom(),13),duration:900});
  setEnt('acc');renderAllButMap();renderMap();}
function segMetrics(g){const sv=S.seg;S.seg=g.id;const a=formulaAt(S.t),b=formulaAt(Math.max(TMIN,S.t-WIN));S.seg=sv;
  return {mkt:a.N*g.acv,N:a.N,arr:a.end,d:b.end?a.end/b.end-1:0};}
/* деньги и движение одного сегмента в одном штате: та же мера, что и у всего штата,
   просто срез сузили. Срез ставится глобально, поэтому его надо вернуть на место. */
function stateSegStats(ab,segId){const sv=S.seg;S.seg=segId;const r=stateStats(ab);S.seg=sv;return r;}
function stateStats(ab){let n=0,v=0;for(const g of SEGS){if(S.seg&&g.id!==S.seg)continue;const c=(POP[ab]||0)*g.perM;n+=c;v+=c*g.acv;}
  const F=formulaAt(S.t,ab);return {n,v,d:F.start?F.end/F.start-1:0,end:F.end};}
function stateTip(f){const s=stateStats(f.abbr);return `${f.properties.name} · ${int(s.n)} accounts · ${usd(s.v)} of market · our ARR ${usd(s.end)} ${s.d>=0?'▲':'▼'} ${Math.abs(s.d*100).toFixed(1)} % over 4 weeks`;}
function tradeCol(d,span=.04){const m=Math.min(Math.abs(d)/span,1);const c=d<0?'var(--down)':'var(--up)';return `color-mix(in srgb, ${c} ${Math.round(18+m*82)}%, var(--land))`;}
function selectAgent(id){S.sel=id?{type:'agent',id}:null;setEnt('ag');renderAllButMap();}
/* «А у меня вообще даже карта поменялась. Зачем? Я же не приказывал уходить в другой
   рабочий экран. Я нахожусь в Maps» (Николай, 30.09, 10:07). Клик по узлу на карте
   меняет ровно три вещи: подсветку, карточку объекта и ленту. В рабочую область
   уводит только второй, явный клик — из ленты или из карточки. */
const ENTOF={person:'ppl',acc:'acc',agent:'ag',doc:'doc',sop:'flow',us:'us'};
/* «Чётко фильтры сами настраиваются, что это за компания» (06.10, 07:19);
   «если я на map кликнул на конкретного человечка — здесь фильтры переставились» (10:31).
   Левая колонка обязана описывать выбранный объект, иначе она ни при чём. */
function syncFilters(){
  const s=S.sel; if(!s)return;
  if(s.type==='acc'||s.type==='sop'){const a=ACCBY[s.id];if(!a)return;
    S.seg=a.seg;S.stF=a.st;S.ef.role='';
    /* стадию не ставим: она сузила бы формулу до одной сделки и обнулила ARR сверху */}
  else if(s.type==='person'){const p=personById(s.id);if(!p)return;
    const a=ACCBY[p.acc];if(a){S.seg=a.seg;S.stF=a.st;}
    S.ef.role=p.role||'';}
  else if(s.type==='doc'){const d=DOCS[s.id];if(!d)return;
    const a=ACCBY[d.acc];if(a){S.seg=a.seg;S.stF=a.st;}}
  else if(s.type==='agent'){S.ef.astate='';}
}
function selectNode(type,id){
  S.sel=type?{type,id}:null;
  if(type==='person'||type==='acc')S.orgOpen=true;
  setEnt(ENTOF[type]||S.ent);
  if(type==='sop')S.sopAcc=id;
  /* «Любой клик логичный и синхронный» — клик на карте переставляет память всех
     областей, но не переключает центр сам. */
  if(type==='person')setView('msg',id); else if(type==='doc')setView('doc',id);
  else if(type==='agent')setView('agent',id); else if(type==='acc'){setView('org',id);setView('sop',id);}
  else if(type==='sop')setView('sop',id);

  renderAllButMap();renderMap();}
/* «Формулу вот это, там, время — ну, в самый низ убрать… потому что это реально
   постоянно на виду должно быть, как справочная информация» (Николай, 30.09, 03:19).
   Верх освободился целиком: там остались только имя, поиск и кнопки панелей. */

/* Четыре работы Head живут в строке формулы (JOBS.md, раскладка). Клик по множителю
   спрашивает агента о нём: что его держит, когда сломался, что будет, если не трогать. */
/* Второй способ узнать, что строка внизу живая: агент называет ограничение, и
   множитель, о котором он говорит, отзывается. Человек видит связь один раз — и

document.addEventListener('mouseover',e=>{

document.addEventListener('mouseout',e=>{

});
function fmulAsk(k){
  const F=formulaAt(S.t), P=formulaAt(S.t-WIN), E=formulaAt(TMAX);
  /* Итог спрашивают иначе, чем множитель: не «почему он такой», а «куда он придёт».
     Ответ кончается ходом дальше — сравнением сценариев, у которого своего места
     на экране нет и не должно быть: это разговор, а не экран. */
  if(k==='arr'){
    const d=E.end-F.end;
    S.chat.push({u:1,t:esc('Where does revenue end up if we change nothing?')});

/* КПД шага — свойство когорты той сделки, что открыта, а не текущего глобального фильтра.

function stepYield(i,scopeAcc){

  const SS=selI<0?null:(ART[(ST[selI]||{}).stage]||null), SST=selI<0?['','']:stState(selI);
  const strip=selI<0?'':`<div class="rsel"><div class="rselh"><b>${esc((ST[selI]||{}).a||'—')}</b>`
    +`<span class="faint">we: ${esc((ST[selI]||{}).b||'—')}</span>`
    +`<span class="chip ${SST[0]==='stuck'?'down':SST[0]==='now'?'warn':'flat'}">${esc(SST[1])}</span>`
    +(SS?`<button class="mf" ${SS[1]?`data-open="${SS[1]==='p'?'person:'+P[0].id:SS[1]}"`:''} data-tip="The artifact that moves at this stage — open it">${SS[0]}</button>`:'')
    +`</div>${stepRuleCell(selI)}</div>`;
  /* ===== шарики: кто за какой этап в ответе и где не сделал ===== */
  const GL={down:'⚠',warn:'○',none:'·'};
  const DOT=(k,open,tip)=>`<button class="dt ${k}" ${open?`data-open="${open}"`:''} data-tip="${esc(tip)}">${GL[k]||'●'}</button>`;
  const prow=(av,nm,role,cells)=>`<div class="prow"><div class="pwho">${av}<span class="pnm">${esc(nm)}</span><span class="prole">${esc(role)}</span></div>`
    +cells.map((c,i)=>`<div class="pc${i===selI?' sel':''}">${c}</div>`).join('')+`</div>`;
  const cRows=P.map((p,pi)=>{const L=personLight(a,p,pi);
    const cells=ST.map(st=>{
      if(!st.stage||st.stage>cur)return DOT('none',null,'not reached');
      if(st.stage<cur)return DOT('done','person:'+p.id,'done');
      return DOT(L[0],'person:'+p.id,L[1]);});
    return prow(face(p.nm,L[0]),p.nm,p.role+' · '+L[1],cells);}).join('');
  const agIds=[];ST.forEach(st=>{if(st.ag&&st.ag!=='sign'&&agIds.indexOf(st.ag)<0)agIds.push(st.ag);});
  let oRows=agIds.map(id=>{const g=agBy(id);if(!g)return '';
    const sc=ASTATE[g.state][0],lbl=ASTATE[g.state][1].replace(/^\S+\s/,'');
    const cells=ST.map(st=>{
      if(st.ag!==id)return DOT('none',null,'not its stage');
      if(st.stage&&st.stage<cur)return DOT('done','agent:'+id,'done');
      if(!st.stage||st.stage===cur)return DOT(sc,'agent:'+id,lbl);
      return DOT('none','agent:'+id,'not reached');});
    return prow(agAv(id,sc),g.nm,'agent · '+lbl,cells);}).join('');
  /* «Видно, что в этой компании Вася, Петя и Маша подписанты, с нашей стороны Лиза
     и Гульнар подписанты» (Николай, 05.10, 60:04). Наша сторона чаще и держит подпись. */
  OURSIDE.forEach(o=>{const i=ST.findIndex(x=>x.stage===o.stage);if(i<0)return;
    oRows+=prow(face(o.nm,'',true),o.nm,'us · '+o.what,
      ST.map((st,k)=>k!==i?DOT('none',null,'not their stage')
        :cur>o.stage?DOT('done',o.ref||null,'done')
        :cur===o.stage?DOT(o.warn?'warn':'up',o.ref||null,o.wait)
        :DOT('none',o.ref||null,'not reached')));});
  /* «Зелёный, зелёный, красный — значит нет бай-ина. Ищем человека, который может
     повлиять, добавляем его сюда» (25.09, 56:00) */
  const bl=P.map((p,i)=>[p,personLight(a,p,i)]).filter(x=>x[1][0]==='down')[0];
  const inf=(S.infl||{})[a.id];
  const iRow=!bl?''
    :!inf?`<div class="prow"><div class="pwho"><span class="pnm">Who can reach them</span><span class="prole">nobody added yet</span></div>`
      +`<div class="pc" style="grid-column:span ${N};text-align:left;padding-left:4px"><button class="btn" data-influencer="${a.id}" data-tip="The agent will find someone who can reach this person">Find someone who can reach ${esc(bl[0].nm)}</button></div></div>`
    :prow(face(inf.nm),inf.nm,'reaches '+bl[0].nm+' · added by you',
      ST.map(st=>st.stage===4?DOT('up',null,inf.why):DOT('none',null,'—')));
  let h=`<div class="bpmn" style="--sn:${N}">
    <div class="bph"><h2>Workflow · ${esc(a.name)}</h2><span class="chip acc">${STAGE[e.s]}</span><span class="muted">${esc(a.city)}, ${a.st} · ${segBy(a.seg).name} · ${usd(a.acv)}</span></div>
    <div class="sopbar">
      <span class="modesw"><button data-sopmode="0" aria-pressed="${!S.sopEdit}">Read</button><button data-sopmode="1" aria-pressed="${S.sopEdit}">Edit</button></span>
      ${S.sopEdit?`<span>Rename a stage right on it. ⠿ drags it, ＋ inserts, × removes.</span>`:''}
      ${S.sopEdit?`<button class="lnk" data-stepreset="1" data-tip="Back to the six original stages">reset the funnel</button>`:''}
    </div>
    ${!inF(a)?`<div class="outscope">${esc(a.name)} is outside the current scope${S.seg?' “'+esc(segBy(S.seg).name)+'”':''} — the percentages are computed over its own segment “${esc(segBy(a.seg).name)}”, not over the scope.</div>`:''}
    ${rail}
    ${strip}
    ${cRows}${oRows}${iRow}
    ${fixPanel()}
    ${e.s===7?`<div class="note">✕ lost: ${esc(a.reason||'—')}</div>`:''}
    <div class="bnote"><span style="color:var(--accent);font-weight:600">Constraint on this deal:</span><span>${bright?'the signature is waiting on Tom Hale (pays). The move: answer the price objection — a $1,400/mo freelancer against $3,170/mo with an SLA and HIPAA.':isStuck?'stage “'+STAGE[e.s]+'”: silent for '+daysIn(e,t)+'d.':'none — the deal is moving.'}</span></div>
</div>`;
  return h;
}

/* =================== рассылка: та же воронка =================== */
/* «Конструктор воронок и СОП плюс-минус одна и та же херня, только сбоку. Плюс
   здесь надо форму доработать, чтобы они совпадали» (Николай, 05.10, 61:10).
   Поэтому рейка здесь — те же классы .rail/.rst/.rsn/.rss/.rsy, что в renderSOP. */
const CAMP0=[{a:'found',b:'the agent filtered them'},
             {a:'first touch',b:'one letter under your name'},
             {a:'reply',b:'anything back'},
             {a:'meeting',b:'a conversation in the calendar'}];
function campPool(seg){return ACC.filter(a=>(!seg||seg==='all'||a.seg===seg)&&stateAt(a,S.t))
  .flatMap(a=>peopleOf(a).map(x=>({...x,acc:a})));}
function campNum(i,pool){const n=pool.length;
  return [n, Math.round(n*0.62), Math.round(n*0.19), Math.round(n*0.07)][i];}
function renderCamp(seg){
  const pool=campPool(seg), g=seg&&seg!=='all'?segBy(seg):null;
  const CS=S.camp&&S.camp.steps||CAMP0, N=CS.length;
  const selI=S.campStep==null?1:S.campStep;
  const off=S.campOff||{};
  const rail=`<div class="rail"><div class="rlab">the funnel · left to right</div>`+CS.map((st,i)=>{
      const n=campNum(i,pool), prev=i?campNum(i-1,pool):n, r=prev?n/prev:0;
      const bad=i>0&&r<0.25;
      return `<div class="rst ${i<selI?'done':i===selI?'now':'next'}${i===selI?' sel':''}" data-campsel="${i}">`
        +`<span class="rsn">${esc(st.a)}</span><span class="rss">${esc(st.b)}</span>`
        +`<span class="rsy"><i style="width:${Math.min(100,r*100)}%;background:${bad?'var(--down)':'var(--up)'}"></i></span>`
        +`<span class="rsp${bad?' ybad':''}">${i?prev+' → '+n+' · '+Math.round(r*100)+' %':n+' people'}</span></div>`;}).join('')+`</div>`;
  const sel=CS[selI];
  const list=pool.slice(0,12);
  const body=selI<=1
    ? `<div class="pgh">who the agent put in · click a name to take it out — nobody is added by hand</div>`
      +list.map(x=>`<div class="prow"><div class="pwho">${face(x.nm,off[x.id]?'':'up')}<span class="pnm">${esc(x.nm)}</span><span class="prole">${esc(x.role)} · ${esc(x.acc.name)}</span></div>`
        +`<div class="pc" style="grid-column:span ${N};text-align:left;padding-left:4px">`
        +`<button class="ib" data-campoff="${x.id}">${off[x.id]?'left out — put back':'in the send'}</button></div></div>`).join('')
    : `<div class="bnote"><span>This stage is the agent's work: it sends under your name, waits, and moves people on its own. Nothing here is a button for a human.</span></div>`;
  const nOff=Object.keys(off).filter(k=>off[k]).length;
  return `<div class="bpmn" style="--sn:${N}">
    <div class="bph"><h2>Campaign · ${esc(g?g.name:'all segments')}</h2>
      <span class="chip acc">${pool.length-nOff} people</span>
      <span class="muted">the same rail as a deal workflow — one form, two uses</span></div>
    ${rail}
    ${body}
    <div class="bnote"><span style="color:var(--accent);font-weight:600">What the agent needs from you:</span>
      <span>${S.camp&&S.camp.subj?'the line is set — “'+esc(S.camp.subj)+'”':'nothing is set yet. Ask the agent on the right to write the line and start it.'}</span></div>
    <div class="bnote"><span class="faint" style="font-size:11px">The log of this campaign is the feed below.</span></div></div>`;}

/* JOB-024: «А сколько конкретно вот этот человек внутри юрлица мне принёс? Вот там три
   продавана… вот этот принёс вот столько-то» (Николай, 25.09). Выручку между людьми мы
   не делим — это была бы выдуманная атрибуция, и карточка работы прямо говорит, что она
   спорна. Меряем проверяемое: сколько денег стоит за согласием этого человека и в какую
   сторону он их двигает. Член формулы тот же, что и везде, — ACV. */
function personWorth(pid){
  const p=personById(pid);if(!p)return null;
  const a=ACCBY[p.acc],e=stateAt(a,S.t),money=e?acvAt(a,S.t):a.acv;
  const act=peopleActs(a,S.t).find(x=>x.p.id===pid)||{};
  let eff={c:'flat',l:'no move either way'};
  const d=act.days||0;
  if(act.act==='silence')eff=d>=8?{c:'down',l:`holding \u00b7 silent ${d}d`}:{c:'flat',l:`quiet ${d}d`};
  else if(act.act==='expressive')eff=/expensive|a lot|too much/i.test(act.txt||'')?{c:'down',l:'holding \u00b7 objecting on price'}:{c:'flat',l:'talking, not deciding'};
  else if(act.act==='request')eff={c:'wn',l:`waiting on us \u00b7 ${d}d`};
  else if(act.act==='promise')eff={c:'up',l:'moving \u00b7 promised'};
  else if(act.act==='declaration')eff={c:'up',l:'moving \u00b7 signed or paid'};
  else if(act.act==='assertion')eff={c:'flat',l:'setting the terms'};
  return {p,a,money,eff};
}

      +`<button class="btn" data-open="doc:${sel.id}">Open the document</button>`+`<button class="btn alt" data-stuck="${sel.id}" data-tip="Who is holding it — in the SOP">Where it is stuck</button>`;}
  else if(sel&&sel.type==='sop'){const a=ACCBY[sel.id],e=stateAt(a,t),m=momentum(a,t);
    h=`<div class="top">${logo(a,'sq big')}<div><h3>Flow · ${esc(a.name)}</h3><div class="sub">who owes what to whom to get the document signed</div></div></div>`
      +params([['Stage',`<span class="${mcls(m)}">${arrow(m)} ${e?STAGE[e.s]:'—'}</span>`],['ACV',usd(a.acv)],['Stuck',(e?daysIn(e,t):0)+'d'],['People',peopleOf(a).length]])
      +`<button class="btn" data-open="sop:${sel.id}">Open the flow</button>`;}
  else if(sel&&sel.type==='agent'){const g=agBy(sel.id);h=`<div class="top">${agAv(g.id,'big')}<div><h3>${g.nm}</h3><div class="sub">${g.title}</div></div></div>`+params([['State',`<span class="${ASTATE[g.state][0]}">${ASTATE[g.state][1]}</span>`],['Autonomy',KNOB[S.knob[g.id]]],['Answers for it',OURS.find(o=>o.id===g.owner).nm],['Runs stages',g.owns.map(s=>STAGE[s]).join(', ')]])+
      `<div class="hdr">Autonomy \u2014 how much freedom</div><div class="btns">${KNOB.map((k,i)=>`<button class="btn ${S.knob[g.id]===i?'pri':''}" data-knob="${g.id}:${i}">${k}</button>`).join('')}</div>`;}
  else if(tab==='market'){const g=S.seg?segBy(S.seg):null;h=`<div class="top"><span class="av sq big">${g?g.abc:'US'}</span><div><h3>${g?g.name:'US market · all segments'}</h3><div class="sub">${g?'Core job: “'+g.job+'”':'three segments by core job'}</div></div></div>`+params([['Accounts',int(formulaAt(t).N)],['Market',usd(SEGS.filter(x=>!S.seg||x.id===S.seg).reduce((s,x)=>s+segMetrics(x).mkt,0))],['Unverified',MARKET.filter(n=>!S.facts[n.id]).length]])+`<button class="btn" data-camp="${S.seg||'all'}" data-tip="The same rail as the deal workflow — one form for both">Make a campaign for this segment</button>`;}
  else if(tab==='account'){const vis=ACC.filter(a=>stateAt(a,t)&&inF(a));h=`<div class="top"><span class="av sq big">⌂</span><div><h3>Accounts${S.seg?' · '+segBy(S.seg).name:''}</h3><div class="sub">an account speaks in documents — goods for money</div></div></div>`+params([['In pipeline',vis.filter(a=>{const e=stateAt(a,t);return e.s>=1&&e.s<=4;}).length],['In service',vis.filter(a=>isActive(stateAt(a,t))).length],['▼ stuck',vis.filter(a=>momentum(a,t)<0).length],['Awaiting signature',vis.filter(a=>stateAt(a,t).s===4).length]]);}
  else if(tab==='channel'){
    const rows=DELIV.filter(d=>d.w<=Math.max(t,NOW));const n=rows.length;
    const cnt=k=>rows.filter(d=>d.k===k).length;
    const ok=cnt('ok'),bad=cnt('hard')+cnt('soft')+cnt('block'),out=cnt('optout'),spam=cnt('spam');
    h=`<div class="top"><span class="av sq big">✉</span><div><h3>Channel · what landed</h3><div class="sub">four weeks of sending across every mailbox</div></div></div>`
      +params([['Sent',int(n)],['Landed',pct(n?ok/n:0,0)],['Bounced',int(bad)],['Opted out',int(out)],['Complaints',int(spam)]])
      +`<div class="hdr">By mailbox</div>`+MAIL.map(m=>{const r=rows.filter(d=>d.mail===m.id);const o2=r.filter(d=>d.k==='ok').length;
        /* Прогрев и дневной лимит — это ёмкость, и она стоит в центре, на странице «мы».
           Лента отвечает за историю: сколько через этот ящик дошло. Одна цифра — одно место. */
        return `<div class="mailrow" style="padding-left:0"><span class="adr">${esc(m.adr)}</span><span class="chip ${r.length&&o2/r.length<.85?'down':'up'}">${r.length?pct(o2/r.length,0)+' landed':'nothing sent'}</span></div>`;}).join('')
      +`<div class="note">A complaint or an opt-out silences that person across every mailbox at once. The limit protects the account; it is not a quota to spend.</div>`;}
  else if(tab==='flow'){const a=ACCBY[S.sopAcc],e=stateAt(a,t),m=momentum(a,t),d=e?daysIn(e,t):0;
    h=`<div class="top">${logo(a,'sq big')}<div><h3>${esc(a.name)}</h3><div class="sub">the flow of one deal: who owes what to whom to get the document signed</div></div></div>`
      +params([['Stage',`<span class="${mcls(m)}">${arrow(m)} ${e?STAGE[e.s]:'—'}</span>`],['ACV',usd(a.acv)],['Stuck',d+'d'],['People',peopleOf(a).length]])
      +`<button class="btn" data-open="sop:${a.id}">Open the workflow</button>`;}
  else if(tab==='people'){h=`<div class="top"><span class="av big">☺</span><div><h3>Client people</h3><div class="sub">people speak in speech acts: request, assertion, promise, declaration, expressive, silence</div></div></div>`;}
  else {h=`<div class="top"><span class="av bot big">${ICONS.bot}</span><div><h3>The machine</h3><div class="sub">5 agents · 3 people · a named human answers for each agent</div></div></div>`+params([['Running',AGENTS.filter(a=>a.state==='active').length],['Waiting on a human',AGENTS.filter(a=>a.state==='awaiting').length],['Stopped',AGENTS.filter(a=>a.state==='paused').length],['Alarms',AGENTS.filter(a=>a.state==='paused').length]]);}
  $('ecard').innerHTML=h;}
function denseRows(items){let last='',h='';
  for(const it of items){const d=/h$|now/.test(it.when)?'this week':(parseInt(it.when)||0)<=7?'last week':'earlier';
    if(d!==last){h+=`<div class="day">${d}</div>`;last=d;}
    const tip=(it.ttl+' — '+String(it.mt).replace(/<[^>]+>/g,'')).replace(/"/g,'&quot;');
    h+=`<div class="fi ${it.gone?'gone':''}"><span class="lead">${it.av||srcIc(it.src)}</span><span class="when">${it.when||'—'}</span><button class="main" data-open="${it.open}" title="${tip}"><span class="ttl">${esc(it.ttl)}</span><span class="mt">${it.mt}</span></button>${it.status?`<span class="chip st ${it.status[0]}">${esc(it.status[1])}</span>`:'<span class="st"></span>'}${it.acts?`<span class="acts">${it.acts}</span>`:''}</div>`;}
  return h;}
/* Лента обязана объяснять свой отбор: сколько строк из скольких и по какому правилу. */
const FEEDWHY={
  market:['facts nobody has confirmed — the formula does not count them','every fact about the market this quarter'],
  account:['documents where the move is ours or the client’s','every document and account in the pipeline'],
  people:['things said that need an answer by a deadline','everything people said over 4 weeks'],
  channel:['mail that did not land or burned the contact','every send over 4 weeks'],
  agents:['what the agents did without me \u2014 and where they stopped','the whole agent log'],
  flow:['the move is ours or the client’s — on this deal','all the correspondence and documents of this deal']};
/* Блок 3 «сути»: «Факт в ленте можно подтвердить, опровергнуть, выкинуть или дописать свой».
   Форма одна на все сущности — значит и действия одни, а не только на вкладке рынка. */
const MARKV={ok:['confirmed','up'],no:['refuted','down']};
/* Поправка после разбора: подтверждать КАЖДЫЙ факт на базе в сотни тысяч — это то же ручное
   заполнение CRM, только переименованное. Право оспорить остаётся на любой строке;
   обязанность решить выносится человеку только по четырём причинам. */
function needsHuman(it,tab){
  if(tab==='market')return S.facts[it.open&&it.open.split(':')[1]]?null:'it moves a term of the formula, and the formula ignores what is unverified';
  if(tab==='people')return /reply:/.test(String(it.mt))?'an obligation changed — an answer is due':null;
  if(tab==='agents')return (it.status&&(it.status[0]==='down'||it.status[0]==='warn'))?'the agent stepped outside its own rule':null;
  if(tab==='account')return (it.status&&it.status[0]==='down')?'the evidence is missing — the move is ours':null;
  if(tab==='channel')return (it.status&&it.status[0]==='down')?'the touch is burned — a human decides':null;
  if(tab==='flow')return needsHuman(it,/reply:/.test(String(it.mt))?'people':'account');
  return null;}
function markRow(ref,onlyNote){if(!ref)return '';
  if(onlyNote)return `<span class="acts"><button class="ib" data-note="${esc(ref)}" aria-label="Add your own note" data-tip="The agent decided this on its own. You can always add your own note.">+</button></span>`;
  return `<span class="acts"><button class="ib ok" data-mark="${esc(ref)}|ok" aria-label="Confirm" data-tip="Confirm: that is how it is">✓</button><button class="ib no" data-mark="${esc(ref)}|no" aria-label="Refute" data-tip="Refute: that is not so">✕</button><button class="ib" data-mark="${esc(ref)}|x" aria-label="Drop" data-tip="Drop it from the feed">−</button><button class="ib" data-note="${esc(ref)}" aria-label="Add your own note" data-tip="Add your own — a note under your name">+</button></span>`;}
/* Пояснение живёт здесь, только если его больше нигде нет: правило отбора выше
   и карточка сущности слева уже объясняют рынок и речевые акты. */
const GLOSS={
  channel:'a complaint or an opt-out silences that person across every mailbox at once',
  agents:'every entry has a human who answers for it — an agent does not answer for itself'};
const ageD=it=>{const w=String(it.when||'');if(!w||/now/.test(w))return 0;if(/h$/.test(w))return 0;const m=w.match(/(\d+)/);return m?+m[1]:999;};
function entFilter(tab,rows){
  const f=S.ef||{};
  if(tab==='people'){
    if(f.role)rows=rows.filter(x=>!x.role||x.role===f.role);
    if(f.src)rows=rows.filter(x=>x.src===f.src);
  }
  if(tab==='channel'&&S.mail)rows=rows.filter(x=>!x.mail||x.mail===S.mail);
  return rows;
}
function feedView(tab){
  const own=(S.own||[]).filter(o=>o.tab===tab).map(o=>({src:'me',ttl:o.txt,
    mt:o.kind==='edit'?'<b>model change</b> · asked by me, applied by the agent':`<b>my note</b>${o.about?' · on “'+esc(o.about)+'”':''}`,
    when:'now',open:o.ref,av:face('Me','',true),sig:true,
    status:o.kind==='edit'?['up','applied']:['flat','from me']}));
  let all=own.concat(entFilter(tab,(feedItems(tab)||[]).slice())).sort((a,b)=>ageD(a)-ageD(b));
  all.forEach(it=>{it.key=(it.open||'')+'#'+String(it.ttl).slice(0,60);
    it.need=needsHuman(it,tab);
    const m=S.marks&&S.marks[it.key];
    if(m==='x')it.gone=true;
    else if(m&&MARKV[m])it.mt=`<b class="fm ${MARKV[m][1]}">${m==='ok'?'✓ confirmed':'✕ refuted'}</b> · `+it.mt;
    if(!it.acts)it.acts=markRow(it.key,!it.need);});
  /* метка «ваше решение» отличает строку только если в срезе есть строки без неё */
  const needN=all.filter(x=>x.need&&!x.gone).length, shownN=all.filter(x=>!x.gone).length;
  if(needN&&needN<shownN)all.forEach(it=>{if(it.need&&!(S.marks&&S.marks[it.key]))
    it.mt=`<b class="fm need" title="${esc(it.need)}">your call</b> · `+it.mt;});
  const sig=all.filter(x=>x.sig);
  const mode=(S.fmode!=='all'&&sig.length)?'sig':'all';
  return {rows:mode==='sig'?sig:all,all:all,sig:sig,mode:mode};
}
function renderPanel(){
  /* Сущность выбирается слева — второго переключателя здесь быть не должно.
     Лента идёт за левой кнопкой: «это просто дублирование» (Николай, 25.09, 58:40). */
  const FNAME={market:'Market · facts',account:'Accounts · documents',people:'People · speech',flow:'Workflow · the whole deal',channel:'Channel · what landed',agents:'Agents · log'};
  const mb=S.mail?MAIL.find(m=>m.id===S.mail):null;
  $('ptabs').innerHTML=`<span class="fname">${esc(FNAME[S.ptab]||'Feed')}</span>`
    +(mb?`<span class="faint" style="font-size:11px">${esc(mb.adr)}</span><button class="ib" data-mailclear="1">all mailboxes ×</button>`:'')
    +`<span style="flex:1"></span><button class="ib" data-feeddown="1" aria-label="${S.feedDown?'Open the feed':'Pull the feed down'}" data-tip="${S.feedDown?'Pull the feed back up':'Pull the feed down — it stays there until you raise it'}">${S.feedDown?'▴':'▾'}</button><span class="dens" role="group" aria-label="Feed density"><button data-dense="1" aria-pressed="${S.dense!==false}" aria-label="Compact" data-tip="Compact: one line per event">≡</button><button data-dense="0" aria-pressed="${S.dense===false}" aria-label="Roomy" data-tip="Roomy: two lines per event">☰</button></span>${S.sel?`<button class="ib" data-clearsel="1">clear selection ×</button>`:''}`;
  renderEcard();
  const V=feedView(S.ptab), items=V.rows;
  $('feed').classList.toggle('dense',S.dense!==false);
  const nCom=S.ptab==='market'?MARKET.concat(S.addedFacts||[]).filter(n=>(!S.seg||n.seg===S.seg)&&isCommon(n)).length:0;
  const head=`<div class="subrule"><span>showing <b>${items.length}</b> of ${V.all.length} · ${FEEDWHY[S.ptab][V.mode==='sig'?0:1]}${nCom?` · <b>${nCom}</b> became common ground`+`` :''}</span>
    ${V.sig.length&&V.sig.length<V.all.length?`<span class="pick"><button data-fmode="sig" aria-pressed="${V.mode==='sig'}" data-tip="Only the lines that need a move">needs a move</button><button data-fmode="all" aria-pressed="${V.mode==='all'}" data-tip="The whole slice, unfiltered">all</button></span>`:''}
    ${GLOSS[S.ptab]?`<span class="gloss">${GLOSS[S.ptab]}</span>`:''}</div>`;
  const add=S.ptab==='market'?`<div class="addfact"><input id="myFact" placeholder="Write a fact or a thought about the market…"><button class="btn" id="addFact">Add</button><button class="btn" data-importfacts="1" data-tip="Log what you heard at a conference in one batch: each fact with its source and unconfirmed">＋ facts from a conference</button></div>`
    :(S.noteFor?`<div class="addfact"><input id="myNote" placeholder="Add your own — a note under your name…" autofocus><button class="btn" id="addNote">Add</button><button class="ib" data-notecancel="1">×</button></div>`:'');
  const body=items.length
    ? (S.dense===false?items.map(it=>`<div class="fi ${it.gone?'gone':''}"><span class="lead">${it.av||srcIc(it.src)}</span><button class="main" data-open="${it.open}"><span class="ttl">${esc(it.ttl)}</span><span class="mt">${it.mt}</span></button>${it.status?`<span class="chip st ${it.status[0]}">${esc(it.status[1])}</span>`:'<span class="st"></span>'}<span class="when">${it.when}</span>${it.acts?`<span class="acts">${it.acts}</span>`:''}</div>`).join(''):denseRows(items))
    : `<div class="note" style="padding:12px">Nothing happened in this slice in W${S.t}.</div>`;
  $('feed').innerHTML=head+add+body;}

/* =================== база: вся таблица в рабочей области ===================
   Дерево слева отвечает на «где нужен ход», база — на «покажи всё».
   Список в боковой панели не масштабируется: при сотнях тысяч юрлиц его нельзя
   ни пролистать, ни отфильтровать. Таблица с колонками, сортировкой и страницами —
   то же решение, что у Attio, Clarify и Breakcold (приёмы 100, 75, 51). */
const DBCOLS={
  acc:[['nm','Account'],['last','Last touch'],['touch','Wrote'],['stg','Stage'],['mv','Movement'],['acv','ACV'],['seg','Segment'],['loc','City, state']],
  person:[['nm','Person'],['last','Last touch'],['acc','Account'],['role','Role in the deal'],['title','Title'],['src','Channel']],
  doc:[['nm','Document'],['acc','Account'],['kind','Kind'],['stt','State'],['last','Age'],['src','Where it lives']]};
/* «Писали» отвечает на работу №2: дотянуться, не задев тех, кому уже писали.
   Остывание — 30 дней после последнего касания, как у Skyp (период остывания перед повторным входом). */
const COOL=30;
function touchState(d){return d>=9999?['never wrote','up']:d<COOL?['cooling off '+(COOL-d)+'d','warn']:['safe to write','flat'];}
function dbRows(kind){
  const t=S.t,q=(S.dbQ||'').toLowerCase().trim();
  const base=ACC.filter(a=>stateAt(a,t)&&inF(a));
  if(kind==='acc'){
    let r=base.map(a=>{const e=stateAt(a,t);return {id:'acc:'+a.id,a,
      nm:a.name,seg:segBy(a.seg).name,loc:a.city+', '+a.st,stg:e?STAGE[e.s]:'—',
      mv:momentum(a,t),acv:a.acv,last:e?(t-e.w)*7:9999,touch:e?(t-e.w)*7:9999};});
    if(q)r=r.filter(x=>(x.nm+' '+x.loc+' '+x.seg+' '+x.stg+' '+touchState(x.touch)[0]).toLowerCase().includes(q));
    return r;}
  if(kind==='doc'){
    let r=Object.entries(DOCS).filter(([id,d])=>{const a=ACCBY[d.acc];return a&&inF(a)&&d.w<=Math.max(t,NOW);})
      .map(([id,d])=>{const a=ACCBY[d.acc];return {id:'docnode:'+id,a,d,
        nm:d.ttl.length>52?d.ttl.slice(0,52)+'…':d.ttl,acc:a.name,kind:d.kind,
        stt:d.status?d.status[1]:'—',src:SRC[d.src]?SRC[d.src][0]:d.src,last:(Math.max(t,NOW)-d.w)*7};});
    if(q)r=r.filter(x=>(x.nm+' '+x.acc+' '+x.kind+' '+x.stt).toLowerCase().includes(q));
    return r;}
  let r=[];
  for(const a of base){const e=stateAt(a,t);
    for(const pp of peopleOf(a))r.push({id:'person:'+pp.id,a,p:pp,
      nm:pp.nm,acc:a.name,role:pp.role,title:pp.title,src:pp.src,last:e?(t-e.w)*7:9999});}
  if(q)r=r.filter(x=>(x.nm+' '+x.acc+' '+x.role+' '+x.title).toLowerCase().includes(q));
  return r;}
function renderDB(){
  const kind=DBCOLS[S.dbKind]?S.dbKind:'acc',cols=DBCOLS[kind];
  const sort=S.dbSort||{k:kind==='acc'?'acv':'nm',d:kind==='acc'?-1:1};
  const total=kind==='doc'?Object.keys(DOCS).length:ACC.filter(a=>stateAt(a,S.t)).length*(kind==='acc'?1:3);
  let rows=dbRows(kind);
  rows.sort((x,y)=>{const a=x[sort.k],b=y[sort.k];
    return (typeof a==='number'?(a-b):String(a).localeCompare(String(b),'ru'))*sort.d;});
  const n=S.dbN||50,page=rows.slice(0,n);
  const cell=(r,k)=>{
    if(k==='nm')return `<td class="nm">${kind==='acc'?logo(r.a,'sq'):kind==='doc'?logo(r.a,'sq'):face(r.nm)}${esc(r.nm)}</td>`;
    if(k==='stt')return `<td><span class="chip ${r.d&&r.d.status?r.d.status[0]:''}">${esc(r.stt)}</span></td>`;
    if(k==='mv')return `<td class="num ${mcls(r.mv)}">${arrow(r.mv)}</td>`;
    if(k==='acv')return `<td class="num">${usd(r.acv)}</td>`;
    if(k==='last')return `<td class="num">${r.last>=9999?'—':r.last+'d'}</td>`;
    if(k==='touch'){const ts=touchState(r.touch);return `<td><span class="chip ${ts[1]}">${esc(ts[0])}</span></td>`;}
    if(k==='role')return `<td><span class="role">${esc(r.role)}</span></td>`;
    return `<td title="${esc(String(r[k]))}">${esc(String(r[k]))}</td>`;};
  $('dbview').innerHTML=
    `<div class="dbh"><div class="r1"><h3>Database · ${kind==='acc'?'accounts':kind==='doc'?'documents':'people'}</h3>
      <span class="cnt">showing ${int(page.length)} of ${int(rows.length)}${rows.length<total?` · filtered down from ${int(total)}`:''}</span>
      <input id="dbQ" placeholder="${kind==='acc'?'Name, city, stage…':kind==='doc'?'Title, account, kind…':'Name, account, role…'}" value="${esc(S.dbQ||'')}">
      <span class="pick"><button data-dbkind="acc" aria-pressed="${kind==='acc'}">accounts</button><button data-dbkind="person" aria-pressed="${kind==='person'}">people</button><button data-dbkind="doc" aria-pressed="${kind==='doc'}">documents</button></span></div>
      <div class="note">The list on the left holds only what needs a move. Everything lives here; the filters on the left recalculate this table and the formula above it.</div></div>
    <table class="db"><thead><tr>${cols.map(([k,t])=>`<th data-dbsort="${k}">${t}${sort.k===k?` <span class="ar">${sort.d>0?'▲':'▼'}</span>`:''}</th>`).join('')}</tr></thead>
    <tbody>${page.map(r=>`<tr data-open="${r.id}">${cols.map(([k])=>cell(r,k)).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" style="padding:16px;color:var(--fg3)">Nothing matches these filters.</td></tr>`}</tbody></table>
    ${rows.length>page.length?`<button class="dbmore" data-dbmore="1">show ${int(Math.min(50,rows.length-page.length))} more · ${int(rows.length-page.length)} left</button>`:''}`;}

/* =================== «Сегодня»: очередь ходов в центре =================== */
/* Модель мира у всех одна, работа разная: центр показывает ходы всей команды,
   а сужает до «моего куска» только правая панель — «интерфейс от этого не поменяется»
   (Николай, 25.09, 1:15:30). Раньше центр резался по роли — это откачено. */
/* Две роли. Николай 29.09: управленец и продавец — под них описываются все джобы.
   Всё, что раньше было отдельными профилями «операции» и «юрист», — это работы
