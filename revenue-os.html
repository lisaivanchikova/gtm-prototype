<!doctype html><html data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Revenue OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Tokens follow VS Code "Light Modern" / "Dark Modern"; up/down follow TradingView */
:root{
  --title:#EEF2F9; --act:#EEF2F9; --side:#F2F5FB; --editor:#F7F9FC; --panel:#F2F5FB; --tab:#EEF2F9; --tab-on:#F7F9FC;
  --border:#D7E0EE; --fg:#14171F; --fg2:#4A5468; --fg3:#7C879C; --accent:#0057FF; --accent-soft:#DCEBF8; --on-accent:#F7F9FC;
  --link:#131A54; --echo1:#A9BDF0; --echo2:#DCEBF8; --hover:#E8EEF8; --selbg:#DCEBF8; --focus:#0057FF; --input:#FFFFFF;
  --land:#E3E9F3; --land-stroke:#F7F9FC; --water:#F7F9FC;
  --up:#0A8A5F; --down:#C62B3C; --flat:#7C879C; --warn:#9A6B00; --agent:#0057FF; --human:#131A54;
  --st1:#DCEBF8; --st2:#A9BDF0; --st3:#4C86FF; --st4:#0057FF; --st5:#131A54;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --title:#101319; --act:#101319; --side:#14171F; --editor:#181C26; --panel:#14171F; --tab:#14171F; --tab-on:#181C26;
  --border:#262C3A; --fg:#EAF2FB; --fg2:#9FAABF; --fg3:#69748C; --accent:#0057FF; --accent-soft:#131A54; --on-accent:#F7F9FC;
  --link:#A9BDF0; --echo1:#667292; --echo2:#40464F; --hover:#1C212D; --selbg:#232A3B; --focus:#0057FF; --input:#161A24;
  --land:#2A3140; --land-stroke:#14171F; --water:#101319;
  --up:#3DD8A4; --down:#FF6B7A; --flat:#69748C; --warn:#E8B14C; --agent:#0057FF; --human:#EAF2FB;
  --st1:#232A3B; --st2:#40507A; --st3:#A9BDF0; --st4:#0057FF; --st5:#3DD8A4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --title:#101319; --act:#101319; --side:#14171F; --editor:#181C26; --panel:#14171F; --tab:#14171F; --tab-on:#181C26;
  --border:#262C3A; --fg:#EAF2FB; --fg2:#9FAABF; --fg3:#69748C; --accent:#0057FF; --accent-soft:#131A54; --on-accent:#F7F9FC;
  --link:#A9BDF0; --echo1:#667292; --echo2:#40464F; --hover:#1C212D; --selbg:#232A3B; --focus:#0057FF; --input:#161A24;
  --land:#2A3140; --land-stroke:#14171F; --water:#101319;
  --up:#3DD8A4; --down:#FF6B7A; --flat:#69748C; --warn:#E8B14C; --agent:#0057FF; --human:#EAF2FB;
  --st1:#232A3B; --st2:#40507A; --st3:#A9BDF0; --st4:#0057FF; --st5:#3DD8A4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--editor);color:var(--fg);font-family:var(--ui);font-size:13px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--border);border-radius:4px;padding:4px 7px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}
.hdr{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--fg2)}
q{quotes:"«" "»"}

/* shell: VS Code workbench */
.app{height:100%;display:grid;grid-template-rows:35px minmax(0,1fr) 22px}
.app>*{min-width:0}
.alarmbar{min-width:0;overflow:hidden}
.alarmbar .owner{min-width:0;overflow:hidden;text-overflow:ellipsis}
.titlebar{background:var(--title);border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,560px) minmax(0,1fr);align-items:center;padding-inline:10px;gap:10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.brand .ex{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);border:1px dashed var(--fg3);border-radius:3px;padding:0 5px}
.cmd{display:flex;align-items:center;gap:8px;height:24px;border:1px solid var(--border);border-radius:6px;background:var(--input);padding-inline:10px;color:var(--fg2);font-size:12px;width:100%}
.cmd kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--fg3)}
.tright{display:flex;justify-content:flex-end;align-items:center;gap:4px;min-width:0;overflow:hidden}
.lbtn{width:26px;height:24px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2)}
.lbtn:hover{background:var(--hover)}
.lbtn[aria-pressed="true"]{color:var(--fg)}
.lbtn svg{width:16px;height:16px}
.profile{height:24px;font-size:12px;padding:0 6px;margin-left:6px;min-width:0;max-width:clamp(88px,17vw,200px)}

.body{display:grid;grid-template-columns:48px var(--sbw,270px) 4px minmax(0,1fr) 4px var(--agw,340px);min-height:0}
@media (max-width:1100px){.body{--agw:300px}}
.activity{grid-column:1;grid-row:1}.sidebar{grid-column:2;grid-row:1}.g1{grid-column:3;grid-row:1}.center{grid-column:4;grid-row:1}.g2{grid-column:5;grid-row:1}.agentbar{grid-column:6;grid-row:1}
.fever{max-height:180px}
.body.no-side{grid-template-columns:48px 0 0 minmax(0,1fr) 4px var(--agw,360px)}
.body.no-agent{grid-template-columns:48px var(--sbw,270px) 4px minmax(0,1fr) 0 0}
.body.no-side.no-agent{grid-template-columns:48px 0 0 minmax(0,1fr) 0 0}
.body.swap{direction:rtl}.body.swap>*{direction:ltr}
.activity{background:var(--act);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:2px}
.activity button{width:48px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--fg3);border-left:2px solid transparent;position:relative}
.activity button:hover{color:var(--fg)}
.activity button[aria-pressed="true"]{color:var(--fg);border-left-color:var(--accent)}
.activity svg{width:22px;height:22px}
.activity .badge{position:absolute;right:8px;bottom:8px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding-inline:3px}
.activity .sp{flex:1}
.sidebar{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.no-side .sidebar,.no-side .g1{display:none}
.no-agent .agentbar,.no-agent .g2{display:none}
.sidehead{height:35px;display:flex;align-items:center;padding-inline:14px 8px;justify-content:space-between}
.sidebody{overflow:auto;flex:1;padding-bottom:12px}
.gutter{background:transparent;cursor:col-resize;position:relative;z-index:3}
.gutter::after{content:'';position:absolute;inset:0;margin:auto;background:transparent;transition:background-color 80ms linear 300ms}
.gutter:not(.hgut)::after{width:1px}.gutter.hgut::after{height:1px}
.gutter:hover::after,.gutter.drag::after{background:var(--accent)}
.hgut{cursor:row-resize}

/* tree */
.sec{display:flex;align-items:center;gap:4px;height:22px;padding-inline:6px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--fg)}
.row{display:flex;align-items:center;gap:6px;height:22px;padding-right:8px;white-space:nowrap;overflow:hidden;width:100%;font-size:13px}
.row{transition:background-color 80ms linear}
.row:hover{background:var(--hover)}
.row:focus-visible,.fi:focus-within{outline:1px solid var(--accent);outline-offset:-1px;background:var(--selbg)}
.btn,.ib,.lbtn,.tabb{transition:background-color 80ms linear,border-color 80ms linear}
#map g{transition:opacity 150ms ease-out}
.acc:focus-visible{outline:none}.acc:focus-visible circle.d{stroke:var(--accent);stroke-width:2}
.tri{transition:opacity 150ms ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.row.on{background:var(--selbg)}
.row .tw{width:14px;flex:none;color:var(--fg3);text-align:center;font-size:11px}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .rt{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:9px;font-weight:600;color:var(--fg2);background:transparent;border:1px solid var(--border);width:16px;height:16px}
.av.hum{background:var(--human);border-color:var(--human);color:var(--title)}
.av.sq{border-radius:4px}
.av.bot{border-radius:5px;background:var(--agent);border-color:var(--agent);color:#fff}
.av.big{width:40px;height:40px;font-size:14px}
.av.mid{width:28px;height:28px;font-size:11px}
.naics{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:0 6px;height:17px;border-radius:9px;border:1px solid currentColor;white-space:nowrap;letter-spacing:.02em}
.chip.up{color:var(--up)} .chip.down{color:var(--down)} .chip.flat{color:var(--flat)} .chip.warn{color:var(--warn)} .chip.acc{color:var(--accent)} .chip.agent{color:var(--agent)}
.search{padding:6px 12px}
.search input{width:100%}
/* складывающиеся разделы дерева */
.sec.fold{cursor:pointer;user-select:none;display:flex;align-items:center;gap:6px}
.sec.fold:hover{color:var(--fg)}
.sec.fold .tw{width:10px;flex:none;font-size:9px;color:var(--fg3)}
.sec.fold .sum{margin-left:auto;font-family:var(--ui);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.grp2{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);padding:10px 12px 2px;border-top:1px solid var(--border);margin-top:6px}
.grp2:first-child{border-top:0;margin-top:0}
/* выход в полную базу */
.dbopen{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 12px;margin:2px 0 2px;font-size:12px;color:var(--link);border-top:1px dashed var(--border)}
.dbopen:hover{background:var(--hover)}
.dbopen i{font-style:normal;color:var(--fg3);font-size:11px}
.dbopen b{font-weight:600}
/* база таблицей */
#dbview{display:none;height:100%;overflow:auto;background:var(--editor)}
/* «Сегодня» — очередь ходов в центре. Три независимых разбора сошлись на том, что
   самое важное действие не может жить в 340-пиксельной колонке у края экрана. */
#todayview{display:none;height:100%;overflow:auto;background:var(--editor);padding:14px 16px 24px}
.tdh{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.tdh h2{margin:0;font-size:16px;font-weight:600}
.tdh .who{font-size:12px;color:var(--fg3)}
.tdwrap{max-width:880px}
.tdsec{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);margin:16px 0 6px;border-top:1px solid var(--border);padding-top:10px}
.tdq{display:flex;flex-direction:column;gap:8px}
#todayview .tri{padding:11px 13px}
#todayview .tri.now .t{font-size:15px}
#todayview .focus{padding:13px 15px}
#todayview .focus .t{font-size:15px}
#todayview .risk{padding:7px 0}
.tdempty{font-size:13px;color:var(--fg3);padding:10px 0}
.dbh{position:sticky;top:0;z-index:3;background:var(--editor);border-bottom:1px solid var(--border);padding:10px 14px 8px;display:flex;flex-direction:column;gap:6px}
.dbh .r1{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dbh h3{margin:0;font-size:14px}
.dbh .cnt{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.dbh input{flex:1;min-width:160px;max-width:320px;height:26px;background:var(--side);border:1px solid var(--border);border-radius:5px;color:var(--fg);padding:0 8px;font-size:12px;font-family:var(--ui)}
.dbh .note{font-size:11px;color:var(--fg3)}
table.db{width:100%;border-collapse:collapse;font-size:12px}
table.db th{position:sticky;top:0;background:var(--side);text-align:left;font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);padding:6px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
table.db th:hover{color:var(--fg2)}
table.db th .ar{color:var(--link)}
table.db td{padding:5px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
table.db tr:hover td{background:var(--hover)}
table.db tr{cursor:pointer}
table.db td.nm{display:flex;align-items:center;gap:7px;color:var(--fg)}
table.db td.num{font-family:var(--mono);text-align:right}
/* Фильтр стоит там, где виден его результат: он меняет формулу, карту, таблицу и ленту,
   поэтому живёт одной строкой под формулой, а не в подвале боковой панели. */
.scope{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:5px 15px 6px;border-top:1px solid var(--border);font-size:11.5px;color:var(--fg3);min-width:0;overflow:hidden}
.scope .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);flex:none}
.scope b{color:var(--fg2);font-weight:600}
.scope .sep{color:var(--border)}
.scope .fchip{height:19px}
.outscope{margin:6px 12px 0;padding:6px 9px;border:1px solid var(--warn);border-radius:5px;background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:11.5px;color:var(--fg2)}
.dbmore{display:block;width:100%;padding:10px;font-size:12px;color:var(--link);border-top:1px solid var(--border)}
.dbmore:hover{background:var(--hover)}
.filt{padding:4px 14px;display:flex;flex-direction:column;gap:6px}
.filt label{display:flex;align-items:center;gap:8px;font-size:13px}

/* center */
.center{display:grid;grid-template-rows:minmax(0,1fr) 4px var(--pnh,300px);min-width:0;min-height:0}
.center.panel-right{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 4px var(--pnw,420px)}
.center.no-panel{grid-template-rows:minmax(0,1fr) 0 0}
.center.no-panel .panel,.center.no-panel .g3{display:none}
.center.panel-right .g3{cursor:col-resize}
.editor{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--editor)}
.tabs{display:flex;background:var(--tab);border-bottom:1px solid var(--border);overflow-x:auto;flex:none;height:35px}
.tabs::-webkit-scrollbar{height:3px}
.tabb{display:flex;align-items:center;gap:6px;padding:0 10px 0 12px;border-right:1px solid var(--border);white-space:nowrap;color:var(--fg2);font-size:13px;border-top:1px solid transparent;flex:none}
.tabb[aria-selected="true"]{background:var(--tab-on);color:var(--fg);border-top-color:var(--accent)}
.tabb .x{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);font-size:14px}
.tabb .x:hover{background:var(--hover);color:var(--fg)}
.tabb .ic{font-size:12px}
.crumbs{height:24px;display:flex;align-items:center;gap:6px;padding-inline:12px;font-size:12px;color:var(--fg2);border-bottom:1px solid var(--border);flex:none;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--fg);font-weight:500}
.crumb{color:var(--fg2);padding:1px 4px;border-radius:3px;transition:background-color 80ms linear}
.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb.on{color:var(--fg);font-weight:600}
.view{flex:1;min-height:0;overflow:auto;position:relative}

/* map view */
.mapview{display:flex;flex-direction:column;height:100%;min-height:0}
.formula{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 13px;padding:6px 12px 7px;border-bottom:1px solid var(--border);flex:none}
.fres{display:grid;grid-template-rows:16px 4px 14px 21px 13px;padding:0 15px 0 0;border-right:1px solid var(--border)}
.fres .fn{grid-row:1;align-self:center}.fres .fv{grid-row:4}.fres .fdd{grid-row:5}
.fres .fn{font-size:11px;font-weight:600;color:var(--fg)}
.fres .fv{font-family:var(--mono);font-size:15px;font-weight:600;line-height:21px;white-space:nowrap}
.fres .fdd{display:flex;align-items:baseline;gap:6px}
.fres .vs{font-size:10px;color:var(--fg3)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg .fgi{padding-top:0}
.fgl{display:flex;align-items:baseline;gap:6px;height:16px;font-size:10px;font-weight:600;color:var(--link);border-bottom:1px solid color-mix(in srgb,var(--link) 30%,transparent)}
.fgl i{font-style:normal;font-weight:400;color:var(--fg3)}
.fgi{display:flex;align-items:flex-start;gap:9px}
.fc{display:grid;grid-template-rows:14px 21px 13px;min-width:0}
.fc .fn{font-size:11px;color:var(--fg2);white-space:nowrap}
.fc .fv{font-family:var(--mono);font-size:15px;font-weight:500;line-height:21px;white-space:nowrap}
.fc .fdd{line-height:13px}
.fc.lim{box-shadow:inset 0 -2px 0 var(--accent)}
.fc.lim .fn{color:var(--link)}
.formula .d{font-family:var(--mono);font-size:10px;white-space:nowrap;letter-spacing:-.01em}
.formula .d.flat{color:var(--fg3)}
.fres .d{font-size:12px}
.fo{font-family:var(--mono);color:var(--fg3);align-self:center;flex:none}
.fo.x{font-size:13px;color:var(--fg3);opacity:.8;align-self:start;margin-top:14px;line-height:21px}
.fo.big{font-size:15px;color:var(--link);align-self:start;margin-top:34px;line-height:21px}
.f{display:flex;flex-direction:column;padding:3px 8px;border-radius:5px;min-width:0}
.f.res .v{font-weight:600}
.f.lim{box-shadow:inset 0 -2px 0 var(--focus)}
.f .n{font-size:11px;color:var(--fg3);font-weight:400;white-space:nowrap}
.f .v{font-family:var(--mono);font-size:16px;font-weight:500;white-space:nowrap}
.f .d{font-family:var(--mono);font-size:11px;white-space:nowrap}
.op{align-self:center;font-family:var(--mono);color:var(--fg3);font-size:15px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 12px;border-bottom:1px solid var(--border);flex:none}
.fchip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:12px;font-size:12px;color:var(--fg2);background:var(--editor)}
.fchip:hover{border-color:var(--fg3)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.fchip .naics{font-size:11px}
.timeline{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:12px}
.timeline input{width:170px;padding:0;accent-color:var(--accent)}
.timeline .tl{font-family:var(--mono);font-size:11px;min-width:92px}
.mapbox{position:relative;flex:1;min-height:260px;overflow:hidden;background:var(--water)}
.mapbox.future{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--accent) 9%,transparent) 6px 12px)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.state{fill:var(--land);stroke:var(--land-stroke);stroke-width:1;vector-effect:non-scaling-stroke}
.state.hot{fill:color-mix(in srgb,var(--land) 70%,var(--fg3))}
.bub{stroke:var(--editor);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.clu circle{stroke:var(--editor);stroke-width:1.5;cursor:pointer}
.clu text,.bubt{font-family:var(--mono);font-size:11px;font-weight:600;fill:#111;pointer-events:none}
.bubt.o{fill:var(--fg)}
.acc{cursor:pointer}
.acc circle.d{stroke:var(--editor);stroke-width:1.2}
.acc rect.c{stroke:var(--border);stroke-width:1;fill:var(--editor)}
.acc text{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--fg)}
.acc .ring{fill:none;stroke:var(--fg);stroke-width:2}
.acc.fc{opacity:.55}
.person{cursor:pointer}
.person .pb{fill:var(--accent)}
.person .pr{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 2}
.hq{cursor:pointer}
.hq path{fill:var(--agent);stroke:var(--editor);stroke-width:1.5}
.hq text{font-family:var(--ui);font-size:11px;font-weight:700;fill:var(--fg);paint-order:stroke;stroke:var(--editor);stroke-width:3px}
.lvl{position:absolute;left:10px;top:10px;display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--editor);font-size:12px}
.lvl button{padding:4px 10px;color:var(--fg2)}
.lvl button[aria-pressed="true"]{background:var(--fg);color:var(--editor)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11px;color:var(--fg2);background:color-mix(in srgb,var(--editor) 90%,transparent);border:1px solid var(--border);border-radius:6px;padding:5px 9px;max-width:calc(100% - 70px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend .grad{display:inline-block;width:90px;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--down),color-mix(in srgb,var(--down) 35%,var(--land)),var(--land),color-mix(in srgb,var(--up) 35%,var(--land)),var(--up));vertical-align:-1px}
.zbtn{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--editor)}
.zbtn button{width:28px;height:26px;text-align:center;font-size:15px;color:var(--fg2)}
.zbtn button+button{border-top:1px solid var(--border)}
.hint{position:absolute;right:10px;top:10px;font-size:11px;color:var(--fg3);background:color-mix(in srgb,var(--editor) 90%,transparent);padding:3px 8px;border-radius:5px;border:1px solid var(--border)}

/* SOP: service blueprint */
.bp{padding:14px 16px 24px;min-width:1150px}
.bph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.bph h2{font-size:16px;margin:0;font-weight:600}
.bpgrid{display:grid;grid-template-columns:120px repeat(6,minmax(168px,1fr));gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.bpc{padding:7px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:62px;display:flex;flex-direction:column;gap:5px;position:relative}
.bpc:nth-child(7n){border-right:0}
.bpc.lane{background:var(--side);font-size:12px;font-weight:600;justify-content:center}
.bpc.lane small{font-weight:400;color:var(--fg3);font-size:11px}
.bpc.colh{min-height:34px;background:var(--side);font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--fg2);justify-content:center}
.bpc.colh.now{color:var(--link)}
.bpc.now{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.bpc.line{min-height:0;padding:2px 8px;font-size:11px;color:var(--fg3);background:var(--side);grid-column:1/-1}
.bpc.line.int{border-bottom:1px solid var(--fg2);color:var(--fg2)}
.bpc.line.vis{border-bottom:1px dashed var(--border)}
.card{border:1px solid var(--border);border-radius:5px;padding:5px 7px;background:var(--editor);font-size:12px;display:flex;flex-direction:column;gap:3px;text-align:left;width:100%}
.card:hover{border-color:var(--fg3)}
.card .who{display:flex;align-items:center;gap:5px;font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t{color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.miss{border:1.5px dashed var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent)}
.card.miss .t{color:var(--fg)}
.card.fc{border-style:dashed;opacity:.7}
.card.doc{border-left:3px solid var(--st4)}
.card.agentc{border-left:3px solid var(--agent)}
.card.humanc{border-left:3px solid var(--human)}
.card.client{border-left:3px solid var(--fg3)}
.act{font-size:11px;font-weight:600;letter-spacing:.03em;padding:0 5px;border-radius:3px;background:var(--hover);color:var(--fg2);align-self:flex-start}
.bneck{position:absolute;inset:3px;border:2px solid var(--focus);border-radius:6px;pointer-events:none}
.bnote{font-size:12px;margin-top:10px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.bnote .k{display:inline-block;width:14px;height:10px;border:2px solid var(--focus);border-radius:3px;vertical-align:-1px}
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--fg2);margin:4px 0 12px}
.flow span.s{border:1px solid var(--border);border-radius:10px;padding:1px 8px;color:var(--fg)}

/* doc / message / news / org views */
.doc{max-width:760px;margin:0 auto;padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.doch{display:flex;gap:12px;align-items:flex-start}
.doch h2{margin:0;font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv div{border:1px solid var(--border);border-radius:6px;padding:7px 9px}
.kv b{display:block;font-family:var(--mono);font-size:14px;font-weight:500}
.kv span{font-size:11px;color:var(--fg3)}
.paper{border:1px solid var(--border);border-radius:6px;padding:16px 18px;background:var(--editor);font-size:13px;line-height:1.6}
.paper h3{font-size:13px;margin:10px 0 4px}
.paper[contenteditable="true"]{outline:2px solid var(--accent)}
.signers{display:flex;flex-direction:column;gap:6px}
.signer{display:flex;align-items:center;gap:10px;border:1px solid var(--border);border-radius:6px;padding:7px 10px}
.signer .grow{flex:1}
.btn{height:26px;padding:0 11px;border-radius:4px;border:1px solid var(--border);background:var(--editor);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){background:#0258a8}
.btn.good{}
.lnk{color:var(--fg2);font-size:12px;height:26px;padding:0 6px}
.lnk:hover{color:var(--fg);text-decoration:underline}
.btn.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,var(--border))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.note{font-size:12px;color:var(--fg2)}
.thread{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .bub2{border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-width:560px;display:flex;flex-direction:column;gap:4px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub2{background:var(--accent-soft)}
.msg .meta{font-size:11px;color:var(--fg3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.compose{display:flex;flex-direction:column;gap:6px}
.compose textarea{min-height:70px;resize:vertical;width:100%}
.facts{display:flex;flex-direction:column;gap:6px}
.fact{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.fact .grow{flex:1;display:flex;flex-direction:column;gap:3px}
.org{padding:16px;display:flex;flex-direction:column;gap:14px;min-width:640px}
.orgrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.orgcard{border:1px solid var(--border);border-radius:8px;padding:9px 11px;display:flex;gap:9px;align-items:center;min-width:210px;background:var(--editor);text-align:left}
.orgcard:hover{border-color:var(--fg3)}
.orgcard .grow{display:flex;flex-direction:column;gap:2px}
.orgcard .r{font-size:11px;color:var(--fg2)}
.orgline{height:16px;border-left:1px solid var(--fg3);margin:0 auto;width:0}

/* panel: feeds */
.panel{background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-right .panel{border-top:0;border-left:1px solid var(--border)}
.ptabs{display:flex;align-items:center;gap:2px;height:35px;padding-inline:8px;flex:none;overflow-x:auto}
.ptab{height:35px;padding:0 10px;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);border-bottom:1px solid transparent;display:flex;align-items:center;gap:6px;white-space:nowrap}
.ptab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.ptab .cnt{font-family:var(--mono);font-size:11px;background:var(--hover);border-radius:8px;padding:0 5px}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:0}
.panel-right .pbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.ecard{border-right:1px solid var(--border);padding:10px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.ecard>.btn:last-child{position:sticky;bottom:0;align-self:flex-start}
.panel-right .ecard{border-right:0;border-bottom:1px solid var(--border)}
.ecard .top{display:flex;gap:10px;align-items:center}
.ecard h3{margin:0;font-size:14px;font-weight:600}
.ecard .sub{font-size:12px;color:var(--fg2)}
.ecard .params{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ecard .params div{font-size:11px;color:var(--fg3)}
.ecard .params b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;color:var(--fg)}
.feed{overflow:auto;padding:2px 0}
.fi{display:grid;grid-template-columns:20px minmax(0,1fr) 104px 56px;gap:3px 10px;padding:7px 12px;border-bottom:1px solid var(--border);align-items:start;width:100%;text-align:left;position:relative;transition:background-color 80ms linear}
.fi:hover{background:var(--hover)}
.fi .lead{display:flex;align-items:center;justify-content:center}
.fi .av{width:20px;height:20px;font-size:9px;margin-top:1px}
.fi .av.bot{padding:2px}
.feed .subrule{padding:6px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;background:var(--panel)}
.feed .subrule .gloss{flex-basis:100%;color:var(--fg3);opacity:.8;font-size:10.5px}
.av.bot svg{width:11px;height:11px}
.av.bot.big svg{width:22px;height:22px}
.av.bot.mid svg{width:16px;height:16px}
.fi .src{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;color:var(--fg2);border:1px solid var(--border);margin-top:1px}
.fi .main{display:flex;flex-direction:column;gap:2px;min-width:0}
.fi .ttl{font-size:13px}
.fi .mt{font-size:12px;color:var(--fg3);display:flex;flex-wrap:wrap;gap:3px 8px;align-items:center}
.fi .mt b{color:var(--fg2);font-weight:500}
.fi .mt b.due{color:var(--link);font-weight:600}
.fi .mt b.mk.up{color:var(--up)}
.fi .mt b.mk.no,.fi .mt b.mk.down{color:var(--down)}
.fi .st{justify-self:start;margin-top:2px}
.fi .when{text-align:right;margin-top:3px}
.fi .acts{position:absolute;right:12px;bottom:6px;opacity:0;transition:opacity 80ms linear}
.fi:hover .acts,.fi:focus-within .acts{opacity:1}
.fi .when{font-family:var(--mono);font-size:11px;color:var(--fg3)}
.fi .acts{display:flex;gap:4px}
.ib{height:20px;min-width:20px;padding:0 5px;border-radius:4px;border:1px solid var(--border);font-size:11px;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center;background:var(--editor)}
.ib:hover{border-color:var(--fg3);color:var(--fg)}
.ib.ok:hover{color:var(--up)} .ib.no:hover{color:var(--down)}
.fi.gone{opacity:.45}
.addfact{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border)}
.addfact input{flex:1}

/* agent: secondary side bar */
.agentbar{background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.agh{height:35px;display:flex;align-items:center;justify-content:space-between;padding-inline:12px 8px;flex:none}
.agbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 12px 12px}
.who{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--fg2)}
.focus{border:1px solid var(--focus);border-radius:8px;padding:10px 11px;display:flex;flex-direction:column;gap:6px;background:color-mix(in srgb,var(--focus) 5%,var(--editor))}
.focus .k{font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--link)}
.focus .t{font-size:13px;font-weight:600}
.focus .d{font-size:12px;color:var(--fg2)}
.tri{border:1px solid var(--border);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;background:var(--editor)}
.tri .t{font-size:13px}
.tri .s{font-size:11px;color:var(--fg3)}
.tri.done{opacity:.55}
.tri.now{border-color:var(--focus);background:color-mix(in srgb,var(--focus) 7%,var(--editor))}
.tri.now .t{font-size:14px;font-weight:600;line-height:1.3}
.tri .urg{font-family:var(--mono);font-size:9.5px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--link)}
.tri.fyi{border-color:transparent;background:transparent;padding:4px 2px;gap:1px}
.tri.fyi .t{font-size:12.5px;color:var(--fg2)}
.tri.fyi .btns{margin-top:2px}
.chat{display:flex;flex-direction:column;gap:8px}
.cm{font-size:13px;padding:7px 9px;border-radius:8px;max-width:92%}
.cm.u{align-self:flex-end;background:var(--accent-soft)}
.cm.a{align-self:flex-start;background:var(--editor);border:1px solid var(--border)}
.ask{flex:none;padding:8px 12px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.ask textarea{width:100%;min-height:52px;resize:none}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg button{font-size:11px;border:1px solid var(--border);border-radius:10px;padding:1px 8px;color:var(--fg2);background:var(--editor)}

/* status bar */
.statusbar{background:var(--title);border-top:1px solid var(--border);display:flex;align-items:center;gap:0;font-size:12px;color:var(--fg2);overflow:hidden;white-space:nowrap}
.statusbar .it{padding:0 9px;height:22px;display:flex;align-items:center;gap:5px}
.statusbar .it:hover{background:var(--hover)}
.statusbar .rem{background:var(--accent);color:var(--on-accent)}
.statusbar .sp{flex:1}
.statusbar .alarm{color:var(--down);font-weight:600}

/* palette */
.pal{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:60px;background:rgba(0,0,0,.18)}
.pal[hidden]{display:none}
.palbox{width:min(600px,calc(100% - 32px));background:var(--side);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:10px 12px;font-size:14px;background:var(--side)}
.pall{max-height:360px;overflow:auto}
.pall button{display:flex;gap:8px;align-items:center;width:100%;padding:6px 12px;font-size:13px}
.pall button:hover,.pall button.on{background:var(--selbg)}
.pall .ty{margin-left:auto;font-size:11px;color:var(--fg3)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--editor);font-size:12px;padding:5px 8px;border-radius:5px;max-width:320px;line-height:1.35}
#tip[hidden]{display:none!important}
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--editor);padding:7px 12px;border-radius:6px;font-size:12px;z-index:60}
.toast[hidden]{display:none}

@media (max-width:760px){
  .activity,.sidebar,.g1,.center,.g2,.agentbar{grid-column:auto;grid-row:auto}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body,.body.no-side,.body.no-agent{grid-template-columns:48px minmax(0,1fr);grid-auto-rows:auto}
  .sidebar,.g1,.g2{display:none}
  .agentbar{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);max-height:none}
  .center{grid-template-rows:520px 0 auto}
  .panel{min-height:360px}
  .pbody{grid-template-columns:1fr}
  .ecard{border-right:0;border-bottom:1px solid var(--border)}
  .titlebar{grid-template-columns:1fr auto}
  .titlebar .cmdw{display:none}
  .timeline{margin-left:0}
}

/* spec v3: result band on top, alarm strip at bottom */
.app{grid-template-rows:35px auto minmax(0,1fr) auto 22px}
.band{background:var(--title);border-bottom:1px solid var(--border);display:flex;flex-direction:column}
.band .formula{border-bottom:0;padding:6px 12px 2px}
.band .filters{border-bottom:0;padding:4px 12px 8px}
.fsel{height:24px;font-size:12px;padding:0 6px;border-radius:12px}
.tarrow{display:inline-flex;align-items:center;gap:4px}
.tarrow button{width:24px;height:24px;border:1px solid var(--border);border-radius:12px;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.tarrow button:hover{border-color:var(--fg3);color:var(--fg)}
.tnote{font-size:12px;color:var(--fg3);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarmbar{display:flex;align-items:center;gap:10px;padding:5px 12px;background:color-mix(in srgb,var(--down) 10%,var(--title));border-top:1px solid color-mix(in srgb,var(--down) 40%,var(--border));font-size:12px}
.alarmbar[hidden]{display:none}
.alarmbar .k{color:var(--down);font-weight:600;white-space:nowrap}
.alarmbar .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* machine sidebar */
.mrow{display:flex;flex-direction:column;gap:3px;padding:6px 12px;border-bottom:1px solid var(--border)}
.mrow:hover{background:var(--hover)}
.mrow .l1{display:flex;align-items:center;gap:7px;min-width:0}
.mrow .l1 .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l2{font-size:11px;color:var(--fg3);padding-left:23px}
.mrow .stop{font-size:11px;color:var(--fg2);padding-left:23px}
.mrow .stop b{color:var(--down);font-weight:600}
.mknob{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-left:23px;align-self:flex-start}
.mknob button{font-size:11px;padding:0 7px;height:18px;color:var(--fg3)}
.mknob button[aria-pressed="true"]{background:var(--fg);color:var(--editor)}
/* SOP as BPMN collaboration: two pools and message flows */
.bpmn{padding:14px 16px 28px;min-width:1180px;display:flex;flex-direction:column;gap:10px}
.loop{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg2);flex-wrap:wrap}
.loop span.s{border:1px solid var(--border);border-radius:10px;padding:1px 9px}
.loop span.on{border-color:var(--focus);color:var(--fg);font-weight:600}
.pgrid{display:grid;grid-template-columns:150px repeat(6,minmax(160px,1fr));border:1px solid var(--border);border-radius:6px;overflow:hidden}
.pgrid>div{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px 8px;display:flex;flex-direction:column;gap:5px;min-height:56px}
.pgrid>div:nth-child(7n){border-right:0}
.pgrid .pool{grid-column:1/-1;min-height:0;padding:5px 10px;background:var(--side);font-size:12px;font-weight:600;flex-direction:row;gap:8px;align-items:center}
.pgrid .pool small{font-weight:400;color:var(--fg3)}
.pgrid .lh{background:var(--side);font-size:12px;justify-content:center}
.pgrid .lh small{color:var(--fg3);font-size:11px}
.pgrid .sh{min-height:0;background:var(--side);font-size:11px;font-weight:600;color:var(--fg2);justify-content:center}
.pgrid .sh.now{color:var(--link)}
.pgrid .now{background:color-mix(in srgb,var(--accent) 5%,transparent)}

          <span class="rt">${why?`<span class="why ${mcls(m)}">${why}</span>`:`<span class="stg">${e?STAGE[e.s]:'—'}</span>`}</span></button>`;}).join('');

          <span class="av bot ag ${ASTATE[a.state][0]}">${ICONS.bot}</span><span class="nm">${esc(a.nm)}</span>

  } else if(S.side==='machine'){

    h+=`<div class="sec" style="margin-top:6px">▾ Мы · Bobroff MSP</div>`;
    h+=`<button class="row" data-open="us" style="padding-left:12px"><span class="tw">▾</span><span class="av sq bot">B</span><span class="nm">Орграмма: люди и агенты</span></button>`;
    h+=OURS.map(p=>`<button class="row" data-open="us" style="padding-left:24px"><span class="tw"></span>${av(p.nm,'var(--human)')}<span class="nm">${esc(p.nm)}</span><span class="rt">человек</span></button>`).join('');
    h+=AGENTS.map(a=>`<button class="row ${S.sel&&S.sel.id===a.id?'on':''}" data-open="agent:${a.id}" style="padding-left:24px"><span class="tw"></span><span class="av bot">${a.ini}</span><span class="nm" title="отвечает ${esc(OURS.find(o=>o.id===a.owner).nm)}">${a.nm}</span><span class="rt ${ASTATE[a.state][0]}">${ASTATE[a.state][1]}</span></button>`).join('');
  } else if(S.side==='search'){
    h=`<div class="search"><input id="sideSearch" placeholder="Название, человек, штат…" value="${esc(S.q||'')}"></div><div id="sideRes"></div>`;
  } else if(S.side==='filters'){
    h=`<div class="filt"><div class="hdr">Сегмент по Core Job</div>`+SEGS.map(g=>`<label><input type="radio" name="fseg" value="${g.id}" ${S.seg===g.id?'checked':''}> ${g.name} <span class="naics">${g.abc}</span></label>`).join('')+`<label><input type="radio" name="fseg" value="" ${!S.seg?'checked':''}> все сегменты</label>
      <div class="hdr" style="margin-top:8px">Движение</div><label><input type="checkbox" id="fdown" ${S.downOnly?'checked':''}> только ▼ (застряло или сигнал ухода)</label>
      <div class="hdr" style="margin-top:8px">Неделя</div><div class="num">н${S.t} · ${wkd(S.t)}</div></div>`;
  } else if(S.side==='agents'){
    h=`<div class="sec">Люди</div>`+OURS.map(p=>`<button class="row" data-open="us" style="padding-left:12px">${av(p.nm,'var(--human)')}<span class="nm">${esc(p.nm)}</span><span class="rt">${esc(p.title.split(' · ')[0])}</span></button>`).join('')+
      `<div class="sec" style="margin-top:6px">Агенты · отвечает человек</div>`+AGENTS.map(a=>`<button class="row ${S.sel&&S.sel.id===a.id?'on':''}" data-open="agent:${a.id}" style="padding-left:12px"><span class="av bot">${a.ini}</span><span class="nm">${a.nm} <span class="faint">· отв. ${esc(OURS.find(o=>o.id===a.owner).nm.split(" ")[0])}</span></span><span class="rt ${ASTATE[a.state][0]}">${ASTATE[a.state][1]}</span></button>`).join('');
  } else if(S.side==='sop'){

      `<div class="note" style="padding:8px 14px">SOP показан как service blueprint: сверху клиент, снизу мы, посередине линия взаимодействия. Речь → документ → информация.</div>`;
  } else {
    h=`<div class="filt"><div class="hdr">Кто вошёл</div><div>${esc($('profile').selectedOptions[0].text)}</div><div class="note">Агент справа подстраивает фокус, карточки и тревоги под Jobs этого человека. Смените профиль в верхней строке.</div></div>`;
  }
  $('side').innerHTML=h;
  if(S.side==='search')renderSearch();
}
function allEntities(){
  return [...SEGS.map(g=>({k:'seg:'+g.id,t:g.name,ty:'сегмент · '+g.naics[0]})),
    ...ACC.filter(a=>stateAt(a,S.t)).map(a=>({k:'acc:'+a.id,t:a.name,ty:`юрлицо · ${a.city}, ${a.st}`})),
    ...Object.values(PEOPLE).map(p=>({k:'person:'+p.id,t:p.nm,ty:'человек · '+ACCBY[p.acc].name})),
    ...Object.entries(DOCS).map(([id,d])=>({k:'doc:'+id,t:d.kind+' · '+ACCBY[d.acc].name,ty:'документ'})),
    ...AGENTS.map(a=>({k:'agent:'+a.id,t:a.nm,ty:'агент'})),{k:'us',t:'Bobroff MSP (мы)',ty:'наша орграмма'}];}
function renderSearch(){const q=(S.q||'').toLowerCase();const r=q?allEntities().filter(e=>(e.t+' '+e.ty).toLowerCase().includes(q)).slice(0,40):[];
  $('sideRes').innerHTML=r.map(e=>`<button class="row" data-open="${e.k}" style="padding-left:12px"><span class="nm">${esc(e.t)}</span><span class="rt">${esc(e.ty.split(' · ')[0])}</span></button>`).join('')||`<div class="note" style="padding:8px 14px">${q?'Ничего не найдено':'Например: Brightline, Moss, Tampa, MSA'}</div>`;}

function openTab(kind,id,title){const tid=kind+':'+id;if(!S.tabs.some(t=>t.id===tid))S.tabs.push({id:tid,kind,ref:id,title});S.tab=tid;renderEditor();}
function renderTabs(){
  const st=S.tabs.find(t=>t.id==='sop');if(st)st.title='SOP · '+ACCBY[S.sopAcc].name.split(' ')[0];

}
function renderSource(t){if(t.kind==='doc')return renderDoc(t.ref);if(t.kind==='msg')return renderMsg(t.ref);if(t.kind==='news')return renderNews(t.ref);if(t.kind==='org')return renderOrg();if(t.kind==='agent')return renderAgentTab(t.ref);return '';}
function renderEditor(){
  const t=S.tabs.find(x=>x.id===S.tab)||S.tabs[0];
  if(t.kind==='map'||t.kind==='sop'||t.kind==='db'||t.kind==='today'){S.primary=t.kind;S.source=null;if(t.kind==='db')S.dbKind=t.ref;}else S.source=t.id;
  renderTabs();
  if(!MAPEL)buildMapView();
  $('mapwrap').style.display=S.primary==='map'?'':'none';
  $('sopview').style.display=S.primary==='sop'?'':'none';
  $('dbview').style.display=S.primary==='db'?'block':'none';
  $('todayview').style.display=S.primary==='today'?'block':'none';
  if(S.primary==='sop')$('sopview').innerHTML=renderSOP(ACCBY[S.sopAcc]);
  else if(S.primary==='db')renderDB();
  else if(S.primary==='today')renderToday();
  else renderMap();
  const src=S.source&&S.tabs.find(x=>x.id===S.source);
  $('groups').classList.toggle('src',!!src);
  $('view2').innerHTML=src?renderSource(src):'';

function renderCrumbs(){const t=S.tabs.find(x=>x.id===S.tab)||S.tabs[0];let c='';
  if(t.kind==='map'){c=[['segment','Сегменты'],['accounts','Юрлица'],['people','Люди']].map(([k,n])=>`<button class="crumb ${S.level===k?'on':''}" data-level="${k}">${n}</button>`).join('<span class="faint">›</span>')+(S.seg?` <span class="faint">·</span> ${segBy(S.seg).name}`:'')+(S.sel&&S.sel.type==='acc'?` <span class="faint">·</span> <b>${esc(ACCBY[S.sel.id].name)}</b>`:'');}
  else if(t.kind==='today')c=`Сегодня <span class="faint">·</span> <b>${esc($('profile').selectedOptions[0].text)}</b>`;
  else if(t.kind==='db')c=`База <span class="faint">›</span> <b>${t.ref==='acc'?'юрлица':'физлица'}</b> <span class="faint">·</span> ${S.seg?segBy(S.seg).name:'все сегменты'}`;
  else c=`${{sop:'SOP',doc:'Документ',msg:'Профиль',news:'Новость',org:'Мы',agent:'Агент'}[t.kind]} <span>›</span> <b>${esc(t.title)}</b>`;
  $('crumbs').innerHTML=c;}

/* =================== map view =================== */
let MAPEL,svg,root,gStates,gBub,gClu,gAcc,gPer,gHQ,zoom,statesF,pathG;
function buildMapView(){
  const v=$('mapwrap');
  v.innerHTML=`<div class="mapview" id="mapview">
    <div class="mapbox" id="mapbox">
      <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Карта США"></svg>
      <div class="legend" id="legend"></div>
      <div class="zbtn"><button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">−</button></div>
    </div></div>`;
  MAPEL=$('mapview');
  svg=d3.select('#map');root=svg.append('g');gStates=root.append('g');gBub=root.append('g');gClu=root.append('g');gAcc=root.append('g');gPer=root.append('g');gHQ=root.append('g');
  statesF=topojson.feature(TOPO,TOPO.objects.states).features.map(f=>(f.abbr=ABBR[f.properties.name],f));
  pathG=d3.geoPath();
  gStates.selectAll('path').data(statesF).join('path').attr('class','state').attr('d',pathG)
    .on('click',(ev,f)=>{if(S.level==='segment')zoomToFeature(f);})
    .on('pointermove',(ev,f)=>tipShow(ev,stateTip(f))).on('pointerleave',tipHide);
  zoom=d3.zoom().scaleExtent([1,20]).translateExtent([[-60,-20],[1030,630]]).on('zoom',ev=>{
    root.attr('transform',ev.transform);S.K=ev.transform.k;
    if(S.sel&&S.sel.type==='acc'&&ev.sourceEvent&&S.K<3)S.sel=null;
    const lv=S.sel&&S.sel.type==='acc'?'people':S.K>=1.8?'accounts':'segment';
    if(lv!==S.level){S.level=lv;S.ptab={segment:'market',accounts:'account',people:'people'}[lv];renderMap();renderCrumbs();renderPanel();}else scaleMarks();});
  svg.call(zoom).on('dblclick.zoom',null);
  svg.on('click',ev=>{if(ev.target===svg.node()&&S.sel){S.sel=null;renderAllButMap();renderMap();}});
  $('zin').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1.8);
  $('zout').onclick=()=>svg.transition().duration(300).call(zoom.scaleBy,1/1.8);
}
function fitMap(){}
function zoomTo(x,y,k){svg.transition().duration(700).call(zoom.transform,d3.zoomIdentity.translate(487.5,305).scale(k).translate(-x,-y));}
function zoomToFeature(f){const [[x0,y0],[x1,y1]]=pathG.bounds(f),k=Math.max(2.2,Math.min(9,.85/Math.max((x1-x0)/975,(y1-y0)/610)));zoomTo((x0+x1)/2,(y0+y1)/2,k);}
function stateStats(ab){let n=0,v=0;for(const g of SEGS){if(S.seg&&g.id!==S.seg)continue;const c=(POP[ab]||0)*g.perM;n+=c;v+=c*g.acv;}
  const F=formulaAt(S.t,ab);return {n,v,d:F.start?F.end/F.start-1:0,end:F.end};}
function stateTip(f){const s=stateStats(f.abbr);return `${f.properties.name} · ${int(s.n)} юрлиц · ${usd(s.v)} рынка · наш ARR ${usd(s.end)} ${s.d>=0?'▲':'▼'} ${Math.abs(s.d*100).toFixed(1)} % за 4 нед.`;}
function tradeCol(d,span=.04){const m=Math.min(Math.abs(d)/span,1);const c=d<0?'var(--down)':'var(--up)';return `color-mix(in srgb, ${c} ${Math.round(18+m*82)}%, var(--land))`;}
function renderMap(){
  if(!svg)return;
  const seg=S.level==='segment';
  $('mapbox').classList.toggle('future',S.t>NOW);
  gStates.selectAll('path').classed('hot',f=>!seg&&(f.abbr==='TX'||f.abbr==='FL')&&S.t>=36);
  // segment level: bubble per state, size = $ market, colour = ARR change (Finviz / TradingView)
  const stats=seg?statesF.map(f=>({f,s:stateStats(f.abbr),c:pathG.centroid(f)})).filter(x=>x.s.end>0&&Math.abs(x.s.d)>=.002&&isFinite(x.c[0])):[];
  const rS=d3.scaleSqrt().domain([0,d3.max(stats,x=>x.s.v)||1]).range([0,26]);
  const bb=gBub.selectAll('g').data(stats,x=>x.f.abbr).join(en=>{const g=en.append('g');g.append('circle').attr('class','bub');g.append('text').attr('class','bubt').attr('text-anchor','middle');return g;});

/* =================== SOP: service blueprint =================== */
/* ===== ДОБАВЛЕНО: КПД шага, сбой, разбор и правка правил ===== */
/* КПД шага — свойство когорты той сделки, что открыта, а не текущего глобального фильтра.
   Иначе при фильтре «Price-first» над дорожками сделки из Compliance-first встают чужие
   проценты, и человек читает их как характеристику этой сделки. */
function stepYield(i,scopeAcc){
  const st=S.steps[i];if(!st||!st.stage)return null;   /* свой шаг: данных о нём ещё нет */
  i=st.stage-1;
  if(i>=4)return null;            /* стадии 5-6 — это база, там мера Retention, а не КПД */
  const seg=scopeAcc?scopeAcc.seg:(S.seg||null);
  const at=t=>{let inn=0,out=0;const lo=t-WIN;
    for(const a of ACC){if(seg?a.seg!==seg:!inF(a))continue;if(filtered(a))continue;
      if(a.ev.some(e=>e.s===i+1&&e.w>lo&&e.w<=t))inn++;
      if(a.ev.some(e=>e.s===i+2&&e.s<=6&&e.w>lo&&e.w<=t))out++;}
    return {inn,out,r:Math.min(1,inn?out/inn:0)};};
  const n=at(S.t),p=at(Math.max(TMIN+WIN,S.t-WIN));
  return {inn:n.inn,out:n.out,r:n.r,d:n.r-p.r};
}
function defectAt(i){
  const st=S.steps[i];if(!st||st.stage!==2||st.ag!=='qual')return null;
  const r=S.rules.qual.find(x=>x.id==='q2');
  if(r.on)return null;
  return {ag:'qual',ttl:'пропускает Price-first без ответа о бюджете',cnt:2};
}

  /* содержимое привязано к стадии, а не к номеру колонки: шаги можно переставлять */
  const BR=[{1:['отношение','«айтишник ушёл, в ноябре аудит»'],2:['требование','«пришлите цену на 14 мест»'],3:['требование','«сколько со скидкой?»'],5:['прогноз','первая ценность ≤ 7 дн'],6:['прогноз','продление через 36 мес.']},

document.addEventListener('click',e=>{

  if(b.dataset.tab){S.tab=b.dataset.tab;renderEditor();return;}

const tip=$('tip');
