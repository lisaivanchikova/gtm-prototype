<!doctype html><html data-theme="dark"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Revenue OS</title>
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%2314171F%22/%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2216%22%20r%3D%225%22%20fill%3D%22%230057FF%22/%3E%3Ccircle%20cx%3D%2221%22%20cy%3D%2216%22%20r%3D%226.5%22%20fill%3D%22none%22%20stroke%3D%22%23A9BDF0%22%20stroke-width%3D%222%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Один шрифт на весь экран. Цифры держит tabular-nums, а не вторая гарнитура. */
html,body,button,input,select,textarea,table{font-family:var(--ui)}
b,strong,h1,h2,h3,th{font-weight:600}

/* Tokens follow VS Code "Light Modern" / "Dark Modern"; up/down follow TradingView */
:root{
  --title:#EEF2F9; --act:#EEF2F9; --side:#F2F5FB; --editor:#F7F9FC; --panel:#F2F5FB; --tab:#EEF2F9; --tab-on:#F7F9FC;
  --border:#D7E0EE; --fg:#14171F; --fg2:#4A5468; --fg3:#7C879C; --accent:#0057FF; --accent-soft:#DCEBF8; --on-accent:#F7F9FC;
  --link:#131A54; --echo1:#A9BDF0; --echo2:#DCEBF8; --hover:#E8EEF8; --selbg:#DCEBF8; --focus:#0057FF; --input:#FFFFFF;
  --land:#E3E9F3; --land-stroke:#F7F9FC; --water:#F7F9FC;
  --up:#0A8A5F; --down:#C62B3C; --flat:#7C879C; --warn:#9A6B00; --agent:#0057FF; --human:#131A54;
  --st1:#DCEBF8; --st2:#A9BDF0; --st3:#4C86FF; --st4:#0057FF; --st5:#131A54;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --title:#101319; --act:#101319; --side:#14171F; --editor:#181C26; --panel:#14171F; --tab:#14171F; --tab-on:#181C26;
  --border:#262C3A; --fg:#EAF2FB; --fg2:#9FAABF; --fg3:#69748C; --accent:#0057FF; --accent-soft:#131A54; --on-accent:#F7F9FC;
  --link:#A9BDF0; --echo1:#667292; --echo2:#40464F; --hover:#1C212D; --selbg:#1C212D; --focus:#0057FF; --input:#14171F;
  --land:#2A3140; --land-stroke:#14171F; --water:#101319;
  --up:#3DD8A4; --down:#FF6B7A; --flat:#69748C; --warn:#E8B14C; --agent:#0057FF; --human:#EAF2FB;
  --st1:#232A3B; --st2:#40507A; --st3:#A9BDF0; --st4:#0057FF; --st5:#3DD8A4;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --title:#101319; --act:#101319; --side:#14171F; --editor:#181C26; --panel:#14171F; --tab:#14171F; --tab-on:#181C26;
  --border:#262C3A; --fg:#EAF2FB; --fg2:#9FAABF; --fg3:#69748C; --accent:#0057FF; --accent-soft:#131A54; --on-accent:#F7F9FC;
  --link:#A9BDF0; --echo1:#667292; --echo2:#40464F; --hover:#1C212D; --selbg:#1C212D; --focus:#0057FF; --input:#14171F;
  --land:#2A3140; --land-stroke:#14171F; --water:#101319;
  --up:#3DD8A4; --down:#FF6B7A; --flat:#69748C; --warn:#E8B14C; --agent:#0057FF; --human:#EAF2FB;
  --st1:#232A3B; --st2:#40507A; --st3:#A9BDF0; --st4:#0057FF; --st5:#3DD8A4;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--editor);color:var(--fg);font-family:var(--ui);font-size:13px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--accent);outline-offset:-1px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--input);border:1px solid var(--border);border-radius:4px;padding:4px 7px}
.num{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-variant-numeric:tabular-nums}
.pav{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex:none;border-radius:50%;background:var(--side);border:1px solid var(--border);overflow:hidden;color:var(--fg3)}
.pav svg{width:13px;height:13px}
.pav img{width:100%;height:100%;object-fit:cover}
.pav.up{box-shadow:0 0 0 1.5px var(--up)} .pav.warn{box-shadow:0 0 0 1.5px var(--warn)} .pav.down{box-shadow:0 0 0 1.5px var(--down)}
.pav.big{width:30px;height:30px} .pav.big svg{width:19px;height:19px}
.pav.mid{width:24px;height:24px} .pav.mid svg{width:15px;height:15px}
.gl{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;flex:none;color:var(--fg3)}
.gl svg{width:100%;height:100%}
.gl.up{color:var(--up)} .gl.warn{color:var(--warn)} .gl.down{color:var(--down)}
.gl.agent{color:var(--flat)} .gl.agent.up{color:var(--up)} .gl.agent.down{color:var(--down)} .gl.agent.warn{color:var(--warn)}
.gl.big{width:26px;height:26px} .gl.mid{width:21px;height:21px}
.agentry{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px 0}
.agentry button{height:26px;padding:0 10px;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--fg2);display:flex;align-items:center;gap:8px}
.agentry button:hover{background:var(--hover)}
.agentry button[aria-pressed="true"]{background:var(--selbg);border-color:var(--accent);color:var(--fg)}
.agentry button b{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;color:var(--accent)}
.agentry button.alarm{border-color:var(--down);color:var(--down)}
.agentry button.alarm b{color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)} .wn{color:var(--warn)}
.picked .sgn{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.03em;border:1px solid currentColor;border-radius:8px;padding:0 6px;margin-left:4px}
.muted{color:var(--fg2)} .faint{color:var(--fg3)}
.hdr{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--fg2)}
q{quotes:"«" "»"}

/* shell: VS Code workbench */
.app{height:100%;display:grid;grid-template-rows:35px minmax(0,1fr) auto}   /* последний ряд по содержимому: фиксированные 22px не совпадали с высотой строки и вылезали за окно */
.app>*{min-width:0}
.titlebar{background:var(--title);border-bottom:1px solid var(--border);display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,560px) minmax(0,1fr);align-items:center;padding-inline:10px;gap:8px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap;overflow:hidden;min-width:0}
.brand .ex{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);border:1px dashed var(--fg3);border-radius:4px;padding:0 5px}
.cmd{display:flex;align-items:center;gap:8px;height:24px;border:1px solid var(--border);border-radius:8px;background:var(--input);padding-inline:10px;color:var(--fg2);font-size:11px;width:100%}
.cmd kbd{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3)}
.tright{display:flex;justify-content:flex-end;align-items:center;gap:4px;min-width:0;overflow:hidden}
.lbtn{width:26px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg2)}
.lbtn:hover{background:var(--hover)}
.lbtn[aria-pressed="true"]{color:var(--fg)}
.lbtn svg{width:16px;height:16px}
.profile{height:24px;font-size:11px;padding:0 6px;margin-left:8px;min-width:0;max-width:clamp(88px,17vw,200px)}

.body{display:grid;grid-template-columns:66px var(--sbw,270px) 4px minmax(0,1fr) 4px var(--agw,340px);min-height:0}
@media (max-width:1100px){.body{--agw:300px}}
.activity{grid-column:1;grid-row:1}.sidebar{grid-column:2;grid-row:1}.g1{grid-column:3;grid-row:1}.center{grid-column:4;grid-row:1}.g2{grid-column:5;grid-row:1}.agentbar{grid-column:6;grid-row:1}
.fever{max-height:180px}
.body.no-side{grid-template-columns:66px 0 0 minmax(0,1fr) 4px var(--agw,360px)}
.body.no-agent{grid-template-columns:66px var(--sbw,270px) 4px minmax(0,1fr) 0 0}
.body.no-side.no-agent{grid-template-columns:66px 0 0 minmax(0,1fr) 0 0}
.body.swap{direction:rtl}.body.swap>*{direction:ltr}
.activity{background:var(--act);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding-top:4px;gap:4px}
.activity button{width:66px;min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--fg3);border-left:2px solid transparent;position:relative;padding:4px 2px}
.activity .cap{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.02em;line-height:1;white-space:nowrap}
.activity button:hover{color:var(--fg)}
.activity button[aria-pressed="true"]{color:var(--fg);border-left-color:var(--accent)}
.activity svg{width:19px;height:19px}
.activity .badge{position:absolute;right:7px;top:4px;min-width:15px;height:15px;border-radius:8px;background:var(--accent);color:var(--on-accent);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding-inline:3px}
.activity .sp{flex:1}
.sidebar{background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.no-side .sidebar,.no-side .g1{display:none}
.no-agent .agentbar,.no-agent .g2{display:none}
.sidehead{height:35px;display:flex;align-items:center;padding-inline:14px 8px;justify-content:space-between}
.sidebody{overflow:auto;flex:1;padding-bottom:12px}
.gutter{background:transparent;cursor:col-resize;position:relative;z-index:3}
.gutter::after{content:'';position:absolute;inset:0;margin:auto;background:transparent;transition:background-color 80ms linear 300ms}
.gutter:not(.hgut)::after{width:1px}.gutter.hgut::after{height:1px}
.gutter:hover::after,.gutter.drag::after{background:var(--accent)}
.hgut{cursor:row-resize}

/* tree */
.sec{display:flex;align-items:center;gap:4px;height:22px;padding-inline:6px;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--fg)}
.row{display:flex;align-items:center;gap:8px;height:22px;padding-right:8px;white-space:nowrap;overflow:hidden;width:100%;font-size:13px}
.row{transition:background-color 80ms linear}
.row:hover{background:var(--hover)}
.row:focus-visible,.fi:focus-within{outline:1px solid var(--accent);outline-offset:-1px;background:var(--selbg)}
.btn,.ib,.lbtn,.tabb{transition:background-color 80ms linear,border-color 80ms linear}
#map g{transition:opacity 150ms ease-out}
.acc:focus-visible{outline:none}.acc:focus-visible circle.d{stroke:var(--accent);stroke-width:2}
.tri{transition:opacity 150ms ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.row.on{background:var(--selbg)}
.row .tw{width:14px;flex:none;color:var(--fg3);text-align:center;font-size:11px}
.row .nm{overflow:hidden;text-overflow:ellipsis;flex:1}
.row .rt{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3)}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:10px;font-weight:600;color:var(--fg2);background:transparent;border:1px solid var(--border);width:16px;height:16px}
.av.hum{background:var(--fg);border-color:var(--fg);color:var(--title)}
.av.sq{border-radius:4px}
.av.bot{border-radius:4px;background:var(--flat);border-color:var(--flat);color:var(--editor)}
.av.big{width:40px;height:40px;font-size:13px}
.av.mid{width:28px;height:28px;font-size:11px}
.av.lg{overflow:hidden;padding:4px;background:transparent}
.av.lg svg{width:100%;height:100%;display:block}
.av.lg.big{padding:4px;border-radius:8px}
.av.lg.mid{padding:4px}
.av.pf{overflow:hidden;padding:0;border-radius:50%;background:var(--border)}
.av.pf svg{width:100%;height:100%;display:block}
.av.pf.hum{background:var(--border);border-color:var(--fg)}
.naics{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:0 6px;height:17px;border-radius:8px;border:1px solid currentColor;white-space:nowrap;letter-spacing:.02em}
.chip.up{color:var(--up)} .chip.down{color:var(--down)} .chip.flat{color:var(--flat)} .chip.warn{color:var(--warn)} .chip.acc{color:var(--accent)} .chip.agent{color:var(--fg2)}
.search{padding:8px 12px}
.search input{width:100%}
/* складывающиеся разделы дерева */
.sec.fold{cursor:pointer;user-select:none;display:flex;align-items:center;gap:8px}
.sec.fold:hover{color:var(--fg)}
.sec.fold .tw{width:10px;flex:none;font-size:10px;color:var(--fg3)}
.sec.fold .sum{margin-left:auto;font-family:var(--ui);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.grp2{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);padding:8px 12px 2px;border-top:1px solid var(--border);margin-top:8px}
.grp2:first-child{border-top:0;margin-top:0}
.pl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:middle;flex:none}
.pl.up{background:var(--up)}.pl.warn{background:var(--warn)}.pl.down{background:var(--down)}.pl.flat{background:var(--fg3)}
.tri .owner{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.06em;color:var(--fg3);border:1px solid var(--border);border-radius:8px;padding:4px 6px;margin-left:8px;white-space:nowrap}
.tri .owner.me{color:var(--accent);border-color:var(--accent)}
.tri.mine{box-shadow:inset 2px 0 0 var(--focus)}
.sidebody .row.alarm{background:color-mix(in srgb,var(--down) 12%,transparent);box-shadow:inset 2px 0 0 var(--down)}
.sidebody .row.alarm .nm{color:var(--fg)}
/* выход в полную базу */
.dbopen{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 12px;margin:4px 0 2px;font-size:11px;color:var(--accent);border-top:1px dashed var(--border)}
.dbopen:hover{background:var(--hover)}
.dbopen i{font-style:normal;color:var(--fg3);font-size:11px}
.dbopen b{font-weight:600}
/* база таблицей */
#dbview{display:none;height:100%;overflow:auto;background:var(--editor)}
/* «Сегодня» — очередь ходов в центре. Три независимых разбора сошлись на том, что
   самое важное действие не может жить в 340-пиксельной колонке у края экрана. */
.tdbn{border:1px solid var(--accent);border-radius:8px;padding:12px;margin:0 0 8px}
.tdbn .k{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.tdbn .t{font-size:13px;font-weight:600;color:var(--fg);margin-bottom:4px}
.tdbn .s{font-size:11px;color:var(--fg2);margin-bottom:8px}
.tdbn .btns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
/* дериватив: только сведение, поэтому ни рамки, ни кнопок */
.tddrill{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 0 8px;font-size:11px}
.tddrill .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3)}
.tddrill .s{color:var(--fg3)}
.tddrill .drill{font-size:11px;padding:2px 8px;border-radius:4px;border:1px solid var(--border);
  background:none;color:var(--fg2);cursor:pointer}
.tddrill .drill:hover{border-color:var(--accent);color:var(--fg)}
.tddrill .drill.down{border-color:var(--down);color:var(--down)}
.tddrill .drill.warn{border-color:var(--warn);color:var(--warn)}
.tdnext{padding:0 0 14px;font-size:11px;color:var(--fg3)}
.tdempty{font-size:13px;color:var(--fg3);padding:8px 0}
.tdh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.tdh h2{margin:0;font-size:13px;font-weight:600}
.tdh .who{font-size:11px;color:var(--fg3)}
.tdwrap{display:flex;flex-direction:column}
.tdsec{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--fg3);margin:12px 0 6px;border-top:1px solid var(--border);padding-top:8px}
.tdq{display:flex;flex-direction:column;gap:8px}
.tdempty{font-size:11px;color:var(--fg3);padding:8px 0}
.dbh{position:sticky;top:0;z-index:3;background:var(--editor);border-bottom:1px solid var(--border);padding:8px 14px 8px;display:flex;flex-direction:column;gap:8px}
.dbh .r1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.dbh h3{margin:0;font-size:13px}
.dbh .cnt{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3)}
.dbh input{flex:1;min-width:160px;max-width:320px;height:26px;background:var(--side);border:1px solid var(--border);border-radius:4px;color:var(--fg);padding:0 8px;font-size:11px;font-family:var(--ui)}
.dbh .note{font-size:11px;color:var(--fg3)}
table.db{width:100%;border-collapse:collapse;font-size:11px}
table.db th{position:sticky;top:0;background:var(--side);text-align:left;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg3);padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap}
table.db th:hover{color:var(--fg2)}
table.db th .ar{color:var(--accent)}
table.db td{padding:4px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 55%,transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:240px}
table.db tr:hover td{background:var(--hover)}
table.db tr{cursor:pointer}
table.db td.nm{display:flex;align-items:center;gap:8px;color:var(--fg)}
table.db td.num{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;text-align:right}
.scope .picked{display:inline-flex;align-items:baseline;gap:8px;border:1px solid var(--accent);border-radius:8px;padding:4px 9px}
.scope .picked .lb2{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3)}
.scope .picked .rl{font-size:10px;color:var(--fg3)}
.scope .picked .num{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--accent)}
/* Верхний слой карты — не география. Работа №1 решается по сегменту (Core Job),
   а юрлица сегмента разбросаны по всем штатам. Площадь = $ рынка, цвет = движение ARR;
   география включается вторым разрезом внутри выбранного сегмента. */
/* первая ступень лестницы: сегменты пузырями на самой карте.
   Плиточный вид (treemap) удалён целиком — Лиза 30.09: «никаких плиток,
   всегда должна быть карта визуальная, все отображения только на карте». */
.segclu{display:flex;align-items:flex-end;gap:4px;position:relative}
.segclu .sb{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:600;line-height:1.05;cursor:pointer;border:1px solid rgba(255,255,255,.3);box-shadow:0 1px 5px rgba(0,0,0,.4);transition:filter 90ms linear}
.segclu .sb:hover{filter:brightness(1.35)}
.segclu .sb i{font-style:normal;font-size:.72em;opacity:.92;font-weight:600}
.segclu .ab{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:4px;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.04em;color:var(--fg2);white-space:nowrap;pointer-events:none}
.outscope{margin:8px 12px 0;padding:8px 9px;border:1px solid var(--warn);border-radius:4px;background:color-mix(in srgb,var(--warn) 8%,transparent);font-size:11px;color:var(--fg2)}
.dbmore{display:block;width:100%;padding:8px;font-size:11px;color:var(--accent);border-top:1px solid var(--border)}
.dbmore:hover{background:var(--hover)}
.filt{padding:4px 14px;display:flex;flex-direction:column;gap:8px}
.filt label{display:flex;align-items:center;gap:8px;font-size:13px}

/* center */
.center{display:grid;grid-template-rows:minmax(0,1fr) 4px var(--pnh,300px);min-width:0;min-height:0}
.center.panel-right{grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr) 4px var(--pnw,420px)}
.center.no-panel{grid-template-rows:minmax(0,1fr) 0 0}
.center.no-panel .panel,.center.no-panel .g3{display:none}
/* фокус-режим: открыт исходник — лента отдаёт место, оставляя свой заголовок */
body.focus-mode .center:not(.panel-right){grid-template-rows:minmax(0,1fr) 4px 30px}
body.focus-mode .center:not(.panel-right) .pbody{display:none}
body.focus-mode .ptabs .fname::after{content:' \2014 click to open the feed';color:var(--fg3);font-weight:400;font-size:10px;text-transform:none;letter-spacing:0}
body.focus-mode .ptabs{cursor:pointer}
.center.panel-right .g3{cursor:col-resize}
.editor{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--editor)}
.tabs{display:flex;background:var(--tab);border-bottom:1px solid var(--border);overflow-x:auto;flex:none;height:35px}
.tabs::-webkit-scrollbar{height:3px}
.tabb{display:flex;align-items:center;gap:8px;padding:0 10px 0 12px;border-right:1px solid var(--border);white-space:nowrap;color:var(--fg2);font-size:13px;border-top:1px solid transparent;flex:none}
.tabb[aria-selected="true"]{background:var(--tab-on);color:var(--fg);border-top-color:var(--accent)}
.tabb .x{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3);font-size:13px}
.tabb .x:hover{background:var(--hover);color:var(--fg)}
.tabb .ic{display:inline-flex;width:14px;height:14px;vertical-align:-2px;color:var(--fg3)}
.tabb .ic svg{width:14px;height:14px;display:block}
.tabb button[aria-current],.tabb[aria-selected="true"] .ic{color:inherit}
.crumbs[hidden]{display:none}
.crumbs{height:24px;display:flex;align-items:center;gap:8px;padding-inline:12px;font-size:11px;color:var(--fg2);border-bottom:1px solid var(--border);flex:none;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--fg);font-weight:600}
.crumb{color:var(--fg2);padding:4px 4px;border-radius:4px;transition:background-color 80ms linear}
.crumb:hover{background:var(--hover);color:var(--fg)}
.crumb.on{color:var(--fg);font-weight:600}
.view{flex:1;min-height:0;overflow:auto;position:relative}

/* map view */
.mapview{display:flex;flex-direction:column;height:100%;min-height:0}
.formula .d{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;white-space:nowrap;letter-spacing:-.01em}
.formula .d.flat{color:var(--fg3)}
.f{display:flex;flex-direction:column;padding:4px 8px;border-radius:4px;min-width:0}
.f.res .v{font-weight:600}
.f.lim{box-shadow:inset 0 -2px 0 var(--focus)}
.f .n{font-size:11px;color:var(--fg3);font-weight:400;white-space:nowrap}
.f .v{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:16px;font-weight:600;white-space:nowrap}
.f .d{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;white-space:nowrap}
.op{align-self:center;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--fg3);font-size:13px}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:8px 8px;padding:8px 12px;border-bottom:1px solid var(--border);flex:none}
.fchip{display:inline-flex;align-items:center;gap:8px;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--fg2);background:var(--editor)}
.fchip:hover{border-color:var(--fg3)}
.fchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.fchip .naics{font-size:11px}
.timeline input{width:170px;padding:0;accent-color:var(--accent)}
.timeline .tl{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;min-width:92px}
.mapbox{position:relative;flex:1;min-height:260px;overflow:hidden;background:var(--water)}
/* «Компании все отвалились» (Николай, 06.10, 07:40). Пустая карта молчала.
   Пустой экран читается как поломка, поэтому он обязан назвать причину. */
.mnone{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  background:var(--editor);border:1px solid var(--border);border-radius:8px;
  padding:12px 16px;text-align:center;max-width:320px;font-size:13px;color:var(--fg2)}
.mnone b{display:block;color:var(--fg);font-weight:600;margin-bottom:4px}
.mnone button{display:block;margin:8px auto 0;font-size:11px;padding:4px 10px;border-radius:4px;
  border:1px solid var(--accent);background:none;color:var(--accent);cursor:pointer}
.mkorg{position:relative;width:0;height:0}
.mkorg .node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.mkorg .node i{width:16px;height:16px;border-radius:50%;background:var(--fg3);border:1.5px solid var(--editor);display:block}
.mkorg .node.on{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 45%,transparent)}
.mkorg .node.miss i{background:var(--down)}
.mkorg .node span{font-size:10px;color:var(--fg);background:color-mix(in srgb,var(--editor) 88%,transparent);border:1px solid var(--border);border-radius:8px;padding:0 6px;white-space:nowrap}
.mkorg .ln{position:absolute;height:1px;background:var(--fg3);opacity:.7;transform-origin:0 50%}
.mkorg .node.doc i{width:13px;height:16px;border-radius:4px 2px 2px 0;background:var(--fg3)}
.mkorg .node.flow i{width:16px;height:16px;border-radius:4px;background:var(--fg3)}
.mkorg .node.bot i{border-radius:4px;background:var(--flat)}
.mkorg .node.up i{background:var(--up)} .mkorg .node.down i{background:var(--down)} .mkorg .node.warn i{background:var(--warn)}
.mkorg .node i{width:19px;height:19px;border-radius:0;background:none;border:0;color:var(--fg2);display:flex;align-items:center;justify-content:center}
.mkorg .node i svg{width:19px;height:19px;display:block}
.mkorg .node.doc i,.mkorg .node.flow i,.mkorg .node.bot i{width:19px;height:19px;border-radius:0;background:none}
.mkorg .node.bot i{color:var(--flat)}
.mkorg .node.up i{background:none;color:var(--up)}
.mkorg .node.down i{background:none;color:var(--down)}
.mkorg .node.warn i{background:none;color:var(--warn)}
.mkorg .node.miss i{background:none;color:var(--down)}
.mkorg .node.on i{filter:drop-shadow(0 0 3px var(--accent))}
.mapbox.future{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--accent) 9%,transparent) 6px 12px)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#map:active{cursor:grabbing}
.state{fill:var(--land);stroke:var(--land-stroke);stroke-width:1;vector-effect:non-scaling-stroke}
.state.hot{fill:color-mix(in srgb,var(--land) 70%,var(--fg3))}
.bub{stroke:var(--editor);stroke-width:1.5;vector-effect:non-scaling-stroke;cursor:pointer}
.clu circle{stroke:var(--editor);stroke-width:1.5;cursor:pointer}
.clu text,.bubt{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;font-weight:600;fill:#111;pointer-events:none}
.bubt.o{fill:var(--fg)}
.acc{cursor:pointer}
.acc circle.d{stroke:var(--editor);stroke-width:1.2}
.acc rect.c{stroke:var(--border);stroke-width:1;fill:var(--editor)}
.acc text{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;font-weight:600;fill:var(--fg)}
.acc .ring{fill:none;stroke:var(--fg);stroke-width:2}
.acc.fc{opacity:.55}
.person{cursor:pointer}
.person .pb{fill:var(--accent)}
.person .pr{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:3 2}
.hq{cursor:pointer}
.hq path{fill:var(--agent);stroke:var(--editor);stroke-width:1.5}
.hq text{font-family:var(--ui);font-size:11px;font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--editor);stroke-width:3px}
.lvl{position:absolute;left:10px;top:10px;display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--editor);font-size:11px}
.lvl button{padding:4px 10px;color:var(--fg2)}
.lvl button[aria-pressed="true"]{background:var(--fg);color:var(--editor)}
.legend{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11px;color:var(--fg2);background:color-mix(in srgb,var(--editor) 90%,transparent);border:1px solid var(--border);border-radius:8px;padding:4px 9px;max-width:calc(100% - 70px)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.legend s{display:inline-block;width:13px;height:13px;margin-right:4px;vertical-align:-2px;text-decoration:none}
.legend s svg{width:13px;height:13px;display:block}
.legend .grad{display:inline-block;width:90px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--down),color-mix(in srgb,var(--down) 35%,var(--land)),var(--land),color-mix(in srgb,var(--up) 35%,var(--land)),var(--up));vertical-align:-1px}
.skins{display:inline-flex;flex:none;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-right:8px}
.skins button,.skins a{display:inline-flex;align-items:center;height:22px;padding:0 8px;font-size:10px;color:var(--fg3);white-space:nowrap;flex:none;text-decoration:none}
.skins button[aria-pressed="true"]{background:var(--selbg);color:var(--fg)}
.skins a:hover{color:var(--accent);background:var(--hover)}
.skins>*+*{border-left:1px solid var(--border)}

/* ---- карта: слой MapLibre, маркеры, органиграмма над юрлицом ---- */
#mlmap{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:10px;background:color-mix(in srgb,var(--editor) 80%,transparent)!important}
.maplibregl-ctrl-attrib a{color:var(--fg3)}
.mk{cursor:pointer;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-size:11px;font-weight:600;border:1.5px solid rgba(0,0,0,.35);box-shadow:0 1px 4px rgba(0,0,0,.35);white-space:nowrap}
.mk{position:relative}
.mk i{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;
 font-style:normal;font-size:10px;line-height:1;padding:4px 3px;border-radius:4px;
 background:color-mix(in srgb,var(--editor) 78%,transparent);color:var(--fg2)}
.mk.sq{border-radius:4px;padding:0 7px;height:20px;width:auto}
.mk.hq{background:var(--agent);width:15px;height:15px;transform:rotate(45deg);border-radius:4px}
.zbtn{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--editor)}
.zbtn button{width:28px;height:26px;text-align:center;font-size:13px;color:var(--fg2)}
.zbtn button+button{border-top:1px solid var(--border)}
.hint{position:absolute;right:10px;top:10px;font-size:11px;color:var(--fg3);background:color-mix(in srgb,var(--editor) 90%,transparent);padding:4px 8px;border-radius:4px;border:1px solid var(--border)}
/* SOP: service blueprint */
.bp{padding:12px 16px 24px;min-width:1150px}
.bph{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.bph h2{font-size:16px;margin:0;font-weight:600}
.bpgrid{display:grid;grid-template-columns:120px repeat(6,minmax(168px,1fr));gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.bpc{padding:8px 8px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-height:62px;display:flex;flex-direction:column;gap:4px;position:relative}
.bpc:nth-child(7n){border-right:0}
.bpc.lane{background:var(--side);font-size:11px;font-weight:600;justify-content:center}
.bpc.lane small{font-weight:400;color:var(--fg3);font-size:11px}
.bpc.colh{min-height:34px;background:var(--side);font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--fg2);justify-content:center}
.bpc.colh.now{color:var(--accent)}
.bpc.now{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.bpc.line{min-height:0;padding:4px 8px;font-size:11px;color:var(--fg3);background:var(--side);grid-column:1/-1}
.bpc.line.int{border-bottom:1px solid var(--fg2);color:var(--fg2)}
.bpc.line.vis{border-bottom:1px dashed var(--border)}
.card{border:1px solid var(--border);border-radius:4px;padding:4px 7px;background:var(--editor);font-size:11px;display:flex;flex-direction:column;gap:4px;text-align:left;width:100%}
.card:hover{border-color:var(--fg3)}
.card .who{display:flex;align-items:center;gap:4px;font-weight:600;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t{color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.miss{border:1.5px dashed var(--focus);background:color-mix(in srgb,var(--focus) 8%,transparent)}
.card.miss .t{color:var(--fg)}
.card.fc{border-style:dashed;opacity:.7}
.card.doc{border-left:3px solid var(--accent)}
.card.agentc{border-left:3px solid var(--border)}
.card.humanc{border-left:3px solid var(--fg)}
.card.client{border-left:3px solid var(--fg3)}
.act{font-size:11px;font-weight:600;letter-spacing:.03em;padding:0 5px;border-radius:4px;background:var(--hover);color:var(--fg2);align-self:flex-start}
.bneck{position:absolute;inset:3px;border:2px solid var(--focus);border-radius:8px;pointer-events:none}
.bnote{font-size:11px;margin-top:8px;display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.bnote .k{display:inline-block;width:14px;height:10px;border:2px solid var(--focus);border-radius:4px;vertical-align:-1px}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--fg2);margin:4px 0 12px}
.flow span.s{border:1px solid var(--border);border-radius:8px;padding:4px 8px;color:var(--fg)}

/* doc / message / news / org views */
.doc{max-width:760px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-direction:column;gap:12px}
.doch{display:flex;gap:12px;align-items:flex-start}
.doch h2{margin:0;font-size:16px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kv div{border:1px solid var(--border);border-radius:8px;padding:8px 9px}
.kv b{display:block;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:13px;font-weight:600}
.kv span{font-size:11px;color:var(--fg3)}
.paper{border:1px solid var(--border);border-radius:8px;padding:16px 18px;background:var(--editor);font-size:13px;line-height:1.6}
.paper h3{font-size:13px;margin:8px 0 4px}
.paper[contenteditable="true"]{outline:2px solid var(--accent)}
.signers{display:flex;flex-direction:column;gap:8px}
.signer{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.signer .grow{flex:1}
.btn{height:26px;padding:0 11px;border-radius:4px;border:1px solid var(--border);background:var(--editor);font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){background:#0258a8}
.btn.good{}
.lnk{color:var(--fg2);font-size:11px;height:26px;padding:0 6px}
.lnk:hover{color:var(--fg);text-decoration:underline}
.btn.bad{color:var(--down);border-color:color-mix(in srgb,var(--down) 50%,var(--border))}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.note{font-size:11px;color:var(--fg2)}
.thread{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg .bub2{border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-width:560px;display:flex;flex-direction:column;gap:4px}
.msg.me{flex-direction:row-reverse}
.msg.me .bub2{background:var(--accent-soft)}
.msg .meta{font-size:11px;color:var(--fg3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.compose{display:flex;flex-direction:column;gap:8px}
.compose textarea{min-height:70px;resize:vertical;width:100%}
.facts{display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.fact .grow{flex:1;display:flex;flex-direction:column;gap:4px}
.fact.mb{background:none;font:inherit;color:inherit;text-align:left;cursor:pointer;align-items:center}
.fact.mb:hover{background:var(--hover)}
.fact.mb .note{font-weight:400}
.org{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:640px}
.orgcols{display:flex;gap:16px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
.orgcol{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.orgstem{width:1px;height:14px;background:var(--border)}
.orgbots{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.orgbots.own{margin:8px auto 0;max-width:200px}
/* Агент — не равный человеку узел, а его инструмент: карточка в одну строку,
   иначе три агента под одним человеком заслоняют схему. */
.orgcard.bot{padding:5px 8px;gap:7px;min-width:0;width:100%}
.orgcard.bot .r{display:none}
.orgcard.bot b{font-size:11px;font-weight:500}
.orgcard.bot .chip{font-size:9px;padding:1px 5px;margin-left:auto}
.orgcard.bot .grow{display:flex;align-items:center;gap:6px;min-width:0}
.orgcol{max-width:200px}
.orgrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.orgcard{border:1px solid var(--border);border-radius:8px;padding:8px 11px;display:flex;gap:8px;align-items:center;min-width:210px;background:var(--editor);text-align:left}
.orgcard:hover{border-color:var(--fg3)}
.orgcard .grow{display:flex;flex-direction:column;gap:4px}
.orgcard .r{font-size:11px;color:var(--fg2)}
.orgline{height:16px;border-left:1px solid var(--fg3);margin:0 auto;width:0}

/* panel: feeds */
.panel{background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column;min-height:0;min-width:0}
.panel-right .panel{border-top:0;border-left:1px solid var(--border)}
.ptabs{display:flex;align-items:center;gap:4px;height:35px;padding-inline:8px;flex:none;overflow-x:auto}
.ptab{height:35px;padding:0 10px;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg3);border-bottom:1px solid transparent;display:flex;align-items:center;gap:8px;white-space:nowrap}
.ptab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.ptab .cnt{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;background:var(--hover);border-radius:8px;padding:0 5px}
.pbody{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:0}
.panel-right .pbody{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.ecard[hidden]{display:none}
.pbody.nocard{grid-template-columns:minmax(0,1fr)}
.ecard{border-right:1px solid var(--border);padding:8px 12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.ecard>.btn:last-child{position:sticky;bottom:0;align-self:flex-start}
.panel-right .ecard{border-right:0;border-bottom:1px solid var(--border)}
.ecard .top{display:flex;gap:8px;align-items:center}
.ecard h3{margin:0;font-size:13px;font-weight:600}
.ecard .sub{font-size:11px;color:var(--fg2)}
.ecard .params{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;min-width:0}
.ecard .params>div{font-size:11px;color:var(--fg3);min-width:0}
.ecard .params b{display:block;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:13px;font-weight:600;color:var(--fg);min-width:0;overflow-wrap:anywhere}
/* Список полей — строки, а не сетка: ".ecard .params" перебивал ".flds" по
   специфичности, и каждая строка «подпись · значение · политика · ×» вжималась
   в половину карточки. Отсюда налезание и срез вторым столбцом. */
.ecard .params.flds{display:flex;flex-direction:column;gap:0}
/* Строка поля переносится целиком, если не влезает: подпись на первой строке,
   значение с политикой на второй. Неразрывно только «стрелка + слово состояния» —
   иначе знак отрывался от слова, а запрет переноса всей строки клал её на подпись. */
.ecard .flds .fld{flex-wrap:wrap;row-gap:4px}
.ecard .flds .fld b{display:inline;font-size:11px;text-align:right;margin-left:auto}
.ecard .flds .fld b>*{white-space:nowrap}
.ecard .flds .fk{font-size:11px}
.feed{overflow:auto;padding:4px 0}
.fi{display:grid;grid-template-columns:20px minmax(0,1fr) 104px 56px;gap:4px 10px;padding:8px 12px;border-bottom:1px solid var(--border);align-items:start;width:100%;text-align:left;position:relative;transition:background-color 80ms linear}
.fi:hover{background:var(--hover)}
.fi .lead{display:flex;align-items:center;justify-content:center}
.fi .av{width:20px;height:20px;font-size:10px;margin-top:4px}
.fi .av.bot{padding:4px}
.fname{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg3);padding:0 8px 0 12px;flex:none}
.pick.ent button{height:20px;padding:0 7px;font-size:11px;display:flex;align-items:center;gap:4px}
.pick.ent button b{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;opacity:.75}
.feed .subrule{padding:8px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:2;background:var(--panel)}
.feed .subrule .gloss{flex-basis:100%;color:var(--fg3);opacity:.8;font-size:10px}
.av.bot svg{width:11px;height:11px}
.av.bot.big svg{width:22px;height:22px}
.av.bot.mid svg{width:16px;height:16px}
.fi .src{width:20px;height:20px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--fg2);border:1px solid var(--border);margin-top:4px}
.fi .main{display:flex;flex-direction:column;gap:4px;min-width:0}
.fi .ttl{font-size:13px}
.fi .mt{font-size:11px;color:var(--fg3);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.fi .mt b{color:var(--fg2);font-weight:600}
.fi .mt b.due{color:var(--accent);font-weight:600}
.fi .mt b.fm.up{color:var(--up)}
.fi .mt b.fm.need{color:var(--warn)}
.fmem{color:var(--accent);font-weight:600}
.seen{font-weight:600;color:var(--fg2)}
/* «Окно в окне, чтобы девочки не лазили во внешние системы… они не выходили
   из системы вообще» (Николай, 05.10, 63:29) */
.inwin{position:absolute;inset:18px;z-index:40;display:flex;flex-direction:column;
  background:var(--editor);border:1px solid var(--accent);border-radius:8px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden}
.inwin .iwh{display:flex;align-items:center;gap:8px;padding:8px 10px;
  border-bottom:1px solid var(--border);background:var(--hover);font-size:11px}
.inwin .iwh .url{flex:1;font-family:ui-monospace,monospace;color:var(--fg2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inwin .iwb{flex:1;overflow:auto;padding:16px 18px}
.inwin .iwf{padding:8px 12px;border-top:1px solid var(--border);
  color:var(--fg2);font-size:11px}
.seen.up{color:var(--up)}
.seen.down{color:var(--down)}
.seen.flat{color:var(--fg2);border-bottom:1px dotted var(--border)}
.fi .mt b.fm.no,.fi .mt b.fm.down{color:var(--down)}
.fi .st{justify-self:start;margin-top:4px}
.fi .when{text-align:right;margin-top:4px}
.fi .acts{position:absolute;right:12px;bottom:6px;opacity:0;transition:opacity 80ms linear}
.fi:hover .acts,.fi:focus-within .acts{opacity:1}
.fi .when{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3)}
.fi .acts{display:flex;gap:4px}
.ib{height:20px;min-width:20px;padding:0 5px;border-radius:4px;border:1px solid var(--border);font-size:11px;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center;background:var(--editor)}
.ib:hover{border-color:var(--fg3);color:var(--fg)}
.ib.ok:hover{color:var(--up)} .ib.no:hover{color:var(--down)}
.fi.gone{opacity:.45}
.addfact{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border)}
.addfact input{flex:1}

/* agent: secondary side bar */
.agentbar{background:var(--side);border-left:1px solid var(--border);display:flex;flex-direction:column;min-width:0;min-height:0}
.agh{height:35px;display:flex;align-items:center;justify-content:space-between;padding-inline:12px 8px;flex:none}
.agbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:4px 12px 12px}
.who{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--fg2)}
.focus{border:1px solid var(--focus);border-radius:8px;padding:8px 11px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--focus) 5%,var(--editor))}
.focus .k{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.focus .t{font-size:13px;font-weight:600}
.focus .d{font-size:11px;color:var(--fg2)}
/* Строка списка, а не карточка. Свёрнутая строка несёт ровно два сигнала: что сделать
   и какую цифру это двигает. Почему и кнопки — только у открытой. */
.tri{border:0;border-radius:0;background:none;border-bottom:1px solid var(--border)}
.tri:last-child{border-bottom:0}
.trih{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;padding:10px 0;cursor:pointer;color:inherit}
.trih:hover .t{color:var(--fg)}
.tri .t{font-size:13px;color:var(--fg2);line-height:1.35}
.tri.on .t{color:var(--fg);font-weight:600}
.tri .m{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);white-space:nowrap}
.tri.on .m{color:var(--accent)}
.trib{padding:0 0 12px;display:flex;flex-direction:column;gap:8px}
.tri .s{font-size:11px;color:var(--fg3)}
.tri .btns{display:flex;gap:10px;align-items:center}
.tri .t{font-size:13px}
.tri .s{font-size:11px;color:var(--fg3)}
.tri.done{opacity:.55}
.planbar{border:1px solid var(--accent);border-radius:8px;padding:8px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;background:color-mix(in srgb,var(--accent) 6%,var(--editor));margin:4px 0 12px}
.planbar .k{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.planbar .t{font-size:13px;font-weight:600}
.planbar .s{font-size:11px;color:var(--fg3);flex-basis:100%}
.planbar .lnk{margin-left:auto}
.tri .owner.pl{color:var(--accent);border-color:var(--accent)}
.tri.plan{box-shadow:inset 2px 0 0 var(--accent)}
.scn{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.scn:first-of-type{margin-top:4px;padding-top:0;border-top:0}
/* Акцентная рамка принадлежит ограничению и только ему: «в ТОС грамотно настроенная
   система всегда имеет одно ограничение» (06.10, 22:16). Очередь — это то, что ждёт
   тебя, а не узкое место системы, и спорить с ним по громкости она не должна. */
.tri .btns .btn{background:none;border:1px solid var(--border);color:var(--fg2);
  font-size:11px;padding:4px 10px;border-radius:4px}
.tri .btns .btn:hover{border-color:var(--accent);color:var(--fg)}
.tri .btns .lnk{font-size:11px;color:var(--fg3)}
.tri.now .t{font-size:13px;font-weight:600;line-height:1.3}
.tri .urg{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.tri.fyi{border-color:transparent;background:transparent;padding:4px 2px;gap:4px}
.tri.fyi .t{font-size:11px;color:var(--fg2)}
.tri.fyi .btns{margin-top:4px}
.chat{display:flex;flex-direction:column;gap:8px}
.cm{font-size:13px;padding:8px 9px;border-radius:8px;max-width:92%}
.cm.u{align-self:flex-end;background:var(--accent-soft)}
.cm.a{align-self:flex-start;background:var(--editor);border:1px solid var(--border)}
.ask{flex:none;padding:8px 12px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.ask textarea{width:100%;min-height:52px;resize:none}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg button{font-size:11px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;color:var(--fg2);background:var(--editor)}

/* status bar */
.statusbar{background:var(--title);border-top:1px solid var(--border);display:flex;align-items:center;gap:0 14px;min-height:28px;font-size:11px;color:var(--fg2);overflow:hidden;white-space:nowrap;padding-right:4px}
.statusbar .stat{display:flex;align-items:center;gap:0;min-width:0;overflow:hidden}
.formula{display:flex;align-items:center;gap:0 3px;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;flex:none}
.formula .fres{display:inline-flex;align-items:baseline;gap:4px;color:var(--fg);font-weight:600;font-size:11px;background:none;border:0;font-family:inherit;cursor:pointer;padding:0 2px;border-bottom:1px solid transparent}
.formula .fres:hover{border-bottom-color:var(--fg3)}
.formula .fres:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.formula .fres.pointed{border-bottom-color:var(--accent)}
.formula .fm{display:inline-flex;align-items:baseline;gap:4px;color:var(--fg2);padding:0 2px;background:none;border:0;font:inherit;cursor:pointer;border-bottom:1px solid transparent}
/* Множитель — вход в работу, значит он обязан выглядеть нажимаемым. */
.formula .fm:hover{color:var(--fg);border-bottom-color:var(--fg3)}
.formula .fm:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* Агент называет ограничение — множитель внизу отзывается, чтобы человек
   один раз увидел, где это живёт, и дальше знал. */
.formula .fm.pointed{color:var(--fg);border-bottom-color:var(--accent)}
.formula .fres i,.formula .fm i{font-style:normal;font-family:var(--ui);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.formula .fm b,.formula .fres b{font-weight:600;font-size:10px}
.formula .fm.lim{color:var(--accent);font-weight:600;border-bottom:1px solid var(--accent)}
.timeline{display:flex;align-items:center;gap:8px;padding-left:12px;font-size:11px;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;flex:none}
.timeline .tarrow button{width:20px;height:20px;border-radius:4px;font-size:10px}
.timeline .tl{white-space:nowrap;color:var(--fg2)}
.timeline .tnote{display:none}
.statusbar .it{padding:0 9px;height:22px;display:flex;align-items:center;gap:4px}
.statusbar .it:hover{background:var(--hover)}
.statusbar .rem{background:var(--accent);color:var(--on-accent)}
.statusbar .sp{flex:1}
.statusbar .alarm{color:var(--down);font-weight:600}

/* palette */
.pal{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;align-items:flex-start;padding-top:24px;background:rgba(0,0,0,.18)}
.pal[hidden]{display:none}
.palbox{width:min(600px,calc(100% - 32px));background:var(--side);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden}
.palbox input{width:100%;border:0;border-bottom:1px solid var(--border);border-radius:0;padding:8px 12px;font-size:13px;background:var(--side)}
.pall{max-height:360px;overflow:auto}
.pall button{display:flex;gap:8px;align-items:center;width:100%;padding:8px 12px;font-size:13px}
.pall button:hover,.pall button.on{background:var(--selbg)}
.pall .ty{margin-left:auto;font-size:11px;color:var(--fg3)}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--fg);color:var(--editor);font-size:11px;padding:4px 8px;border-radius:4px;max-width:320px;line-height:1.35}
#tip[hidden]{display:none!important}
.toast{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--editor);padding:8px 12px;border-radius:8px;font-size:11px;z-index:60}
.toast[hidden]{display:none}

@media (max-width:760px){
  .activity,.sidebar,.g1,.center,.g2,.agentbar{grid-column:auto;grid-row:auto}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .body,.body.no-side,.body.no-agent{grid-template-columns:66px minmax(0,1fr);grid-auto-rows:auto}
  .sidebar,.g1,.g2{display:none}
  .agentbar{grid-column:1/-1;border-left:0;border-top:1px solid var(--border);max-height:none}
  .center{grid-template-rows:520px 0 auto}
  .panel{min-height:360px}
  .pbody{grid-template-columns:1fr}
  .ecard{border-right:0;border-bottom:1px solid var(--border)}
  .titlebar{grid-template-columns:1fr auto}
  .titlebar .cmdw{display:none}
  .timeline{margin-left:0}
}

/* Осколок схемы «band сверху, alarm снизу»: сами элементы удалены (A2, A4), а правило
   на пять рядов осталось. Детей у .app три, и строка состояния попадала в растягивающийся
   ряд — на высоком окне она разрасталась до 422px. Сетка живёт в одном месте, выше. */
.fsel{height:24px;font-size:11px;padding:0 6px;border-radius:8px}
.tarrow{display:inline-flex;align-items:center;gap:4px}
.tarrow button{width:24px;height:24px;border:1px solid var(--border);border-radius:8px;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.tarrow button:hover{border-color:var(--fg3);color:var(--fg)}
.tnote{font-size:11px;color:var(--fg3);max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* machine sidebar */
.mrow{display:flex;flex-direction:column;gap:4px;padding:8px 12px;border-bottom:1px solid var(--border)}
.mrow:hover{background:var(--hover)}
.mrow .l1{display:flex;align-items:center;gap:8px;min-width:0}
.mrow .l1 .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .l2{font-size:11px;color:var(--fg3);padding-left:24px}
.mrow .stop{font-size:11px;color:var(--fg2);padding-left:24px}
.mrow .stop b{color:var(--down);font-weight:600}
.mknob{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-left:24px;align-self:flex-start}
.mknob button{font-size:11px;padding:0 7px;height:18px;color:var(--fg3)}
.mknob button[aria-pressed="true"]{background:var(--fg);color:var(--editor)}
/* SOP as BPMN collaboration: two pools and message flows */
.bpmn{padding:12px 16px 28px;min-width:0;max-width:100%;display:flex;flex-direction:column;gap:8px}
.loop{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fg2);flex-wrap:wrap}
.loop span.s{border:1px solid var(--border);border-radius:8px;padding:4px 9px}
.loop span.on{border-color:var(--focus);color:var(--fg);font-weight:600}
.pgrid{display:grid;grid-template-columns:150px repeat(6,minmax(160px,1fr));border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pgrid>div{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:8px 8px;display:flex;flex-direction:column;gap:4px;min-height:56px}
.pgrid>div:nth-child(7n){border-right:0}
.pgrid .pool{grid-column:1/-1;min-height:0;padding:4px 10px;background:var(--side);font-size:11px;font-weight:600;flex-direction:row;gap:8px;align-items:center}
.pgrid .pool small{font-weight:400;color:var(--fg3)}
.pgrid .lh{background:var(--side);font-size:11px;justify-content:center}
.pgrid .lh small{color:var(--fg3);font-size:11px}
.pgrid .sh{min-height:0;background:var(--side);font-size:11px;font-weight:600;color:var(--fg2);justify-content:center}
.pgrid .sh.now{color:var(--accent)}
.pgrid .now{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.pgrid .iface{min-height:44px;justify-content:center;align-items:flex-start;background:repeating-linear-gradient(90deg,transparent 0 8px,color-mix(in srgb,var(--fg3) 12%,transparent) 8px 9px)}
.pgrid .iface.lab{background:var(--side);font-size:11px;font-weight:600;align-items:stretch}
.mf{display:inline-flex;align-items:center;gap:4px;font-size:11px;border:1px dashed var(--fg3);border-radius:8px;padding:4px 8px;background:var(--editor);color:var(--fg2)}
.mf:hover{border-color:var(--fg);color:var(--fg)}
.mf.miss{border-color:var(--focus);color:var(--fg)}
.states{display:grid;grid-template-columns:150px repeat(6,minmax(160px,1fr));font-size:11px;color:var(--fg2)}
.states .br{border-top:1px solid var(--fg3);margin:4px 6px 0;padding-top:4px;text-align:center;font-size:11px;color:var(--fg3)}
.states .cur{color:var(--fg);font-weight:600}
/* org chart over the entity */
.orgn{cursor:pointer}
.orgn circle{fill:var(--editor);stroke:var(--fg2);stroke-width:1.5}
.orgn.miss circle{stroke:var(--focus);stroke-dasharray:3 2;stroke-width:2}
.orgn text{font-family:var(--ui);font-size:11px;fill:var(--fg);paint-order:stroke;stroke:var(--editor);stroke-width:3px}
.orgl{stroke:var(--fg3);stroke-width:1}
/* fever chart */
.fever{width:100%;height:auto;display:block}
.fever text{font-family:var(--ui);font-size:10px;fill:var(--fg3)}
.fever .pt{stroke:var(--editor);stroke-width:1.5;cursor:pointer}
.fever .zn{font-size:10px;fill:var(--fg3);letter-spacing:.02em}
.fever .lab{fill:var(--fg);font-size:11px}
.grp{margin-top:8px}
.risk{display:flex;flex-direction:column;gap:4px;font-size:11px;padding:4px 0;border-top:1px solid var(--border)}
.risk b{font-weight:600}
.risk span{color:var(--fg2)}

/* spec v4: band = formula + time; editor groups split like VS Code */
.bandrow .formula{padding:0;border:0;flex:1 1 auto}
.bandrow .timeline{margin-left:auto}
.groups{flex:1;min-height:0;display:flex}
.groups>.view{flex:1;min-width:0}
#view2{display:none}
.groups.src #view{display:none}
.groups.src #view2{display:block;flex:1;overflow:auto}
.gh{height:24px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border);font-size:11px;color:var(--fg2)}
.gh b{color:var(--fg);font-weight:600}
.gh .x{margin-left:auto;width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:var(--fg3)}
.gh .x:hover{background:var(--hover);color:var(--fg)}
#sopview{height:100%;overflow:auto}
.tabb.grp{box-shadow:inset 0 -2px 0 var(--fg3)}
/* tree + filters */
.cnt2{margin-left:auto;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg3);font-weight:400}
.sfilt{padding:8px 12px 12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);margin-top:8px}
.sfilt .fl{display:flex;flex-direction:column;gap:4px}
.sfilt .fl span{font-size:11px;color:var(--fg3)}
.sfilt select{width:100%}
.sfilt .chips{display:flex;flex-wrap:wrap;gap:4px}
.sfilt .fchk{display:flex;gap:8px;align-items:flex-start;font-size:11px;color:var(--fg2)}
.sfilt .fchk i{display:block;font-style:normal;font-size:10px;color:var(--fg3)}
.knobi{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.knobi button{font-size:11px;padding:0 6px;height:17px;color:var(--fg3)}
.knobi button[aria-pressed="true"]{background:var(--fg);color:var(--editor)}

/* Мой агент — VS Code Chat look */
.aghb{display:flex;gap:4px}
.aghb .lbtn{font-size:13px}
.agbody{gap:12px}
.turn{display:flex;flex-direction:column;gap:8px}
.turn .by{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600}
.turn .by .faint{font-weight:400}
.turn .bodyt{font-size:13px;line-height:1.5;padding-left:24px}
/* блочно, а не flex: во flex-контейнере каждый <b> внутри фразы становится
   отдельной строкой и рвёт предложение — «This is / Tom Hale / , the bookkeeper…» */
.turn .bodyt>.focus{margin:8px 0}
.turn.user .bodyt{background:var(--hover);border-radius:8px;padding:8px 9px;margin-left:24px}
.askbox{border:1px solid var(--border);border-radius:8px;background:var(--input);display:flex;flex-direction:column}
.askbox:focus-within{border-color:var(--accent)}
.askbox textarea{border:0;background:transparent;min-height:40px;resize:none;padding:8px 9px}
.askbox textarea:focus-visible{outline:none}
.askrow{display:flex;align-items:center;gap:8px;padding:4px 6px 5px}
.askrow .ctx{font-size:11px;color:var(--fg2);border:1px solid var(--border);border-radius:4px;padding:0 6px;height:20px;display:inline-flex;align-items:center;gap:4px;max-width:55%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.askrow select{height:20px;font-size:11px;padding:0 4px;margin-left:auto;border-radius:4px}
.askrow .send{width:24px;height:22px;border-radius:4px;color:var(--fg2);display:inline-flex;align-items:center;justify-content:center}
.askrow .send:hover{background:var(--hover);color:var(--fg)}

/* v6 visual fixes: time block never overlaps the formula; feed gets the room */
.bandrow .formula{min-width:0}
.center{grid-template-rows:minmax(0,1fr) 4px var(--pnh,42%)}
.pbody{grid-template-columns:200px minmax(0,1fr)}
.ecard{padding:8px 10px;gap:8px;font-size:11px}
.ecard .top{gap:8px}
.ecard .av.big{width:28px;height:28px;font-size:11px}
.ecard h3{font-size:13px;line-height:1.25}
.ecard .sub{font-size:11px;color:var(--fg3);line-height:1.3}
.ecard .params{grid-template-columns:1fr 1fr;gap:4px 8px}
.ecard .params b{font-size:11px}
.ecard .hdr{font-size:10px}
.ecard .row{height:20px;font-size:11px}
.ecard .row{flex:none}
.ecard .row .rt{display:none}
.ecard .btn{height:22px;font-size:11px;padding:0 8px}
.fi{padding:8px 14px}
.ptabs .ib{white-space:nowrap}
.turn .by{white-space:nowrap;overflow:hidden;min-width:0}
.turn .by .faint{overflow:hidden;text-overflow:ellipsis}

/* v7: dense feed — one event per line (VS Code Problems / Bloomberg news) */
.feed.dense .fi{grid-template-columns:18px 48px minmax(0,1fr) minmax(0,auto);height:24px;padding:0 12px;gap:0 8px;align-items:center;border-bottom:1px solid color-mix(in srgb,var(--border) 60%,transparent)}
.feed.dense .fi .src{width:16px;height:16px;font-size:10px;margin:0;border-radius:4px}
.feed.dense .fi .av{width:16px;height:16px;font-size:10px;margin:0}
.feed.dense .fi .st:empty{display:none}
.feed.dense .fi .when{order:0;margin:0;text-align:left;font-size:11px;white-space:nowrap}
.feed.dense .fi .main{flex-direction:row;align-items:baseline;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.feed.dense .fi .ttl{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.feed.dense .fi .mt{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:11px}
.feed.dense .fi .mt .act{display:none}
.feed.dense .fi .chip.st{height:16px;font-size:10px;margin:0;padding:0 5px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;line-height:16px}
.feed.dense .fi .mt b{min-width:0;overflow:hidden;text-overflow:ellipsis}
.feed.dense .fi .acts{top:2px;bottom:auto;background:var(--panel);padding-left:8px}
.feed.dense .addfact{padding:4px 12px}
.feed.dense .addfact input,.feed.dense .addfact .btn{height:22px;font-size:11px}
.feed .day{position:sticky;top:0;z-index:1;background:var(--panel);font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--fg3);padding:4px 12px;border-bottom:1px solid var(--border)}
.ptabs .ptab{flex:none}
.dens{flex:none;display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-right:8px}
.dens button{font-size:11px;padding:0 7px;height:20px;color:var(--fg3)}
.dens button[aria-pressed="true"]{background:var(--hover);color:var(--fg)}
.mark{height:16px;width:auto;flex:none;margin-right:4px}
/* дерево: правило отбора видно, строки читаются */
.subrule{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:4px 12px 6px;font-size:11px;color:var(--fg3);line-height:1.35}
.subrule b{color:var(--fg2);font-weight:600}
.subrule i{flex-basis:100%;font-style:normal;color:var(--fg3);opacity:.85}
.pick{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden;flex:none}
.pick button{font-size:10px;padding:0 6px;height:18px;color:var(--fg3);background:transparent;white-space:nowrap}
.pick button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.sidebody .row{width:100%;display:flex;align-items:center;gap:8px;padding:4px 12px;min-height:24px;text-align:left}
.sidebody .row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.sidebody .row .rt{flex:none;display:inline-flex;align-items:baseline;gap:8px;font-size:11px;max-width:40%}
.row .stg{color:var(--fg3);font-size:11px}
.row .why{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;white-space:nowrap}
.row .why.down{color:var(--down)} .row .why.flat{color:var(--fg3)} .row .why.up{color:var(--up)}
.row .role{border-bottom:1px dotted var(--fg3);color:var(--fg2);cursor:help}
.row.us .nm{font-weight:600}
.more{padding:4px 12px 6px;font-size:11px;color:var(--fg3)}
.agrow{padding:4px 12px 6px;border-bottom:1px solid var(--border)}
.agrow .l1{display:flex;align-items:center;gap:8px;width:100%;text-align:left}
.agrow .l1 .nm{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agrow .l1 .rt{font-size:11px;flex:none}
.agrow .agk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-left:24px;margin-top:4px}
.agrow .cw{font-size:10px;color:var(--fg3);cursor:help}
.agrow .stops{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;color:var(--down);border:1px solid var(--down);border-radius:4px;padding:0 4px;cursor:help}
.av.bot.ag{background:transparent;border:1px solid var(--flat);color:var(--flat);padding:4px}
.av.bot.ag svg{width:100%;height:100%}
.av.bot.ag.down{border-color:var(--down);color:var(--down)}
.av.bot.ag.warn{border-color:var(--warn);color:var(--warn)}
.av.sq.bot svg{width:14px;height:14px}
.shops{display:inline-flex;gap:4px;margin-left:4px}
.shops button{font-family:var(--ui);font-size:11px;line-height:1;width:16px;height:16px;border:1px solid var(--border);border-radius:4px;color:var(--fg3);background:var(--editor)}
.shops button:hover:not(:disabled){border-color:var(--accent);color:var(--fg)}
.shops button:disabled{opacity:.3}
.flds{display:flex;flex-direction:column;gap:0}
.fld{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--border);font-size:11px}
.fld .fk{color:var(--fg3);flex:1;min-width:0}
.fld b{font-weight:600;color:var(--fg);text-align:right;min-width:0;overflow-wrap:anywhere}
.fops{display:inline-flex;gap:4px;align-items:center;flex:none}
.fpol{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.08em;padding:4px 5px;border:1px solid var(--border);border-radius:4px;color:var(--fg3);background:var(--editor)}
.fpol:hover{border-color:var(--accent);color:var(--fg)}
.fpol.sys{border-style:dashed;cursor:default}
.fpol.on{background:var(--down);border-color:var(--down);color:#fff}
.fhide{font-size:11px;width:16px;height:16px;border:1px solid transparent;border-radius:4px;color:var(--fg3)}
.fhide:hover{border-color:var(--border);color:var(--down)}
.fshow{align-self:flex-start;font-size:11px;color:var(--accent);padding:4px 0}
.fld.dnc{border-bottom:0;margin-top:4px}
.rcl{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;letter-spacing:.08em;padding:0 4px;border:1px solid currentColor;border-radius:4px}
.rcl.up{color:var(--up)}.rcl.down{color:var(--down)}.rcl.warn{color:var(--warn)}.rcl.flat{color:var(--fg3)}
.shname{border-bottom:1px dashed var(--fg3);outline:none;padding:0 1px}
.shname:focus{border-bottom-color:var(--accent);background:var(--hover)}
/* ===== ДОБАВЛЕНО: правка SOP, КПД шага, разбор сбоя, ящики ===== */
.sopbar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--fg2)}
.sopbar>span:nth-of-type(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pgrid .sh{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-direction:row;flex-wrap:wrap;gap:0 4px}
.modesw{display:inline-flex;border:1px solid var(--border);border-radius:4px;overflow:hidden}
.modesw button{font-size:11px;padding:0 10px;height:22px;color:var(--fg3)}
.modesw button[aria-pressed="true"]{background:var(--fg);color:var(--editor);font-weight:600}
.pgrid .yh{min-height:0;background:var(--side);font-size:11px;justify-content:center;color:var(--fg3)}
.pgrid .yc{min-height:0;padding:4px 8px;background:var(--side);gap:4px}
.ybar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--fg3) 22%,transparent);overflow:hidden}
.ybar i{display:block;height:100%;border-radius:4px}
.ynum{font-size:11px;color:var(--fg2);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ynum b{font-variant-numeric:tabular-nums}
.ybad{color:var(--down);font-weight:600}
.rules{display:flex;flex-direction:column;gap:4px}
.rule{display:flex;align-items:flex-start;gap:8px;font-size:11px;line-height:1.35;text-align:left;color:var(--fg2);border:0;background:none;padding:4px 0;width:100%}
.rule .bx{flex:none;width:12px;height:12px;border:1px solid var(--fg3);border-radius:4px;margin-top:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--editor)}
.rule.on .bx{background:var(--up);border-color:var(--up)}
.rule.off .bx{border-color:var(--down);border-style:dashed}
.rule.off{color:var(--fg3)}
.rule .lk{flex:none;font-size:10px;color:var(--fg3);border:1px solid var(--border);border-radius:8px;padding:0 5px}
.rule:hover:not(.lockd){color:var(--fg)}
.defect{border:1px solid var(--down);border-radius:4px;background:color-mix(in srgb,var(--down) 7%,transparent);padding:4px 7px;font-size:11px;color:var(--fg);text-align:left;width:100%;display:flex;flex-direction:column;gap:4px}
.defect b{color:var(--down)}
.fixp{border:1px solid var(--focus);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--focus) 5%,transparent)}
.fixp h4{margin:0;font-size:13px}
.fixp .row{display:flex;gap:8px;font-size:11px;color:var(--fg2);flex-wrap:wrap}
.fixp .q{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;background:var(--side);border:1px solid var(--border);border-radius:4px;padding:4px 7px;color:var(--fg2)}
.cw{display:flex;gap:8px;align-items:center;font-size:10px;color:var(--fg3);flex-wrap:wrap}
.cw b{color:var(--fg2);font-weight:600}
.mailrow{display:flex;align-items:center;gap:8px;font-size:11px;padding:4px 12px 3px 22px;color:var(--fg2)}
.mailrow .adr{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px}
.mailrow .lim{font-variant-numeric:tabular-nums;color:var(--fg3)}
.warmb{width:34px;height:4px;border-radius:4px;background:color-mix(in srgb,var(--fg3) 25%,transparent);overflow:hidden;flex:none}
.warmb i{display:block;height:100%;background:var(--up)}
/* ===== C2 · конструктор воронок: рейка этапов, шарики по людям =====
   Разведка в polish/C2-RESEARCH.md. Порядок задаётся положением, не стрелками;
   «+» живёт в промежутке между этапами, как у Zapier и Pipedrive. */
.rail,.prow{display:grid;grid-template-columns:150px repeat(var(--sn,6),minmax(0,1fr));max-width:100%}
.rail .rst,.prow>*{min-width:0}
.rail{align-items:stretch;margin-top:4px}
.rlab{display:flex;align-items:flex-end;padding:0 8px 9px;font-size:11px;color:var(--fg3)}
.rst{position:relative;border:1px solid var(--border);border-radius:8px;margin:0 4px;padding:8px 9px;display:flex;flex-direction:column;gap:4px;background:var(--side);cursor:pointer;min-width:0}
.rst:hover{border-color:var(--fg3)}
.rst.sel{box-shadow:inset 0 0 0 2px var(--accent);border-color:var(--accent)}
.rst.done{opacity:.7}
.rst.next{opacity:.55}
.rst.now{background:var(--bg);border-color:var(--warn)}
.rst.stuck{background:var(--bg);border-color:var(--down)}
.rsn{font-weight:600;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rss{font-size:10px;color:var(--fg3)}
.rst.stuck .rss{color:var(--down);font-weight:600}
.rst.now .rss{color:var(--warn);font-weight:600}
.rsy{display:block;height:3px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.rsy i{display:block;height:100%}
.rsp{font-size:10px;color:var(--fg3)}
.rsp.ybad{color:var(--down)}
.rgap{position:absolute;left:-11px;top:14px;width:19px;height:19px;border-radius:50%;border:1px solid var(--border);background:var(--bg);color:var(--fg2);font-size:11px;line-height:1;cursor:pointer;z-index:3;display:flex;align-items:center;justify-content:center;padding:0}
.rgap:hover{border-color:var(--accent);color:var(--accent)}
.rgap.last{left:auto;right:-11px}
.rsops{display:flex;align-items:center;gap:8px;margin-top:4px}
.rgrip{cursor:grab;color:var(--fg3);font-size:13px;letter-spacing:-1px;user-select:none}
.rdel{border:0;background:none;color:var(--fg3);cursor:pointer;font-size:13px;line-height:1;padding:0 2px}
.rdel:hover{color:var(--down)}
.rdel[disabled]{opacity:.3;cursor:default}
.rst.dragging{opacity:.35}
.rst.dropto{border-color:var(--accent);border-style:dashed}
.shname{-webkit-user-drag:none}
.rsel{margin:12px 0 6px;border:1px solid var(--border);border-radius:8px;padding:8px 11px;background:var(--side);display:flex;flex-direction:column;gap:4px}
.rselh{display:flex;gap:8px;align-items:center;font-size:11px;flex-wrap:wrap}
.pgh{margin:12px 0 2px;font-size:11px;color:var(--fg3)}
.prow{border-top:1px solid var(--border);align-items:center}
.pwho{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;padding:8px 8px;font-size:11px;min-width:0}
.pwho>:first-child{grid-row:1/3}
.pnm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prole{color:var(--fg3);font-size:10px;line-height:1.3}
.pc{text-align:center;padding:4px 0;min-width:0}
.pc.sel{background:var(--side)}
.dt{border:0;background:none;cursor:pointer;font-size:13px;line-height:1;padding:4px 6px;border-radius:4px;color:var(--fg3)}
.dt:hover{background:var(--border)}
.dt.up,.dt.done{color:var(--up)}
.dt.warn{color:var(--warn)}
.dt.down{color:var(--down);font-size:11px}
.dt.flat{color:var(--fg2)}
.dt.done{opacity:.55}
.dt.none{cursor:default;opacity:.5}
.dt.none:hover{background:none}

/* Узлы на карте несут тот же знак, что списки (A9). Цвет состояния красит сам знак,
   а не подложку: иначе тип читался как «квадрат», «ещё квадрат», «прямоугольник». */
.crumb[disabled]{opacity:.4;cursor:default}

/* Нижняя строка — справка, а не приборная панель. Громким остаётся одно: ARR.
   Терминальный вид давали сплошной моноширинный набор и прописные подписи у каждого
   множителя — читались как лог, а не как формула. Подпись тихая, число моноширинное. */
.statusbar{min-height:26px;font-size:11px;gap:0 12px}
.formula{font-family:var(--ui);font-size:11px;gap:0 1px}
.formula .fres{font-size:13px;font-weight:600;gap:4px;color:var(--fg)}
.formula .fres i{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3);font-weight:600}
.formula .fres .v{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-weight:600}
.formula .fm{color:var(--fg3);gap:4px;padding:0 2px;align-items:baseline}
.formula .fm i{font-size:10px;letter-spacing:0;text-transform:none;color:var(--fg3);font-weight:400;font-family:var(--ui)}
.formula .fm .v{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;color:var(--fg2)}
.formula .fm b,.formula .fres b{font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:10px;font-weight:600;opacity:.85}
/* Знаки = × + несут всю арифметику строки, а стояли цветом линии (--border)
   и были невидимы. Правило здесь одно: второе такое же ниже перебивало первое. */
.formula .fo{color:var(--fg2);padding:0 4px;font-size:11px;font-weight:600}
.formula .fm.lim{color:var(--down);font-weight:600;border-bottom:0}
.formula .fm.lim .v{color:var(--down);font-weight:600}
.formula .fm.lim i{color:var(--down)}
.timeline{font-size:11px;padding-left:8px;gap:4px}
.timeline .tl{min-width:86px;color:var(--fg3)}
.statusbar .it.bld{font-size:10px;color:var(--fg3);opacity:.6;letter-spacing:.02em}

/* Выбор недели календарём. Всплывает над строкой, потому что строка — у самого низа. */
.timeline{position:relative}
.timeline .tl{display:inline-flex;align-items:center;gap:4px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 7px;color:var(--fg2);font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;font-size:11px;cursor:pointer}
.timeline .tl:hover{border-color:var(--border);color:var(--fg)}
.timeline .tl[aria-expanded="true"]{border-color:var(--accent);color:var(--fg)}
.timeline .tl .cv{font-style:normal;font-size:10px;color:var(--fg3)}
.wkpop{position:absolute;bottom:calc(100% + 7px);left:0;z-index:60;background:var(--editor);border:1px solid var(--border);border-radius:8px;box-shadow:0 12px 34px rgba(0,0,0,.45);padding:12px 12px;min-width:430px;font-family:var(--ui)}
.wkh{display:flex;flex-direction:column;gap:4px;margin-bottom:8px;font-size:11px}
.wkh .faint{font-size:10px}
.wkcal{display:flex;gap:12px;align-items:flex-start}
.wkm{display:flex;flex-direction:column;gap:4px;min-width:96px}
.wkmn{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg3);margin-bottom:4px}
.wk{display:flex;flex-direction:column;align-items:flex-start;gap:4px;background:none;border:1px solid transparent;border-radius:8px;padding:4px 7px;color:var(--fg2);font-size:11px;cursor:pointer;text-align:left;white-space:nowrap}
.wk i{font-style:normal;font-size:10px;color:var(--fg3)}
.wk:hover{border-color:var(--fg3);color:var(--fg)}
.wk.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
.wk.fc{opacity:.72}
.wk.fc i{color:var(--accent)}
.wkq{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.wkq button{background:none;border:1px solid var(--border);border-radius:8px;padding:4px 10px;color:var(--fg2);font-size:11px;cursor:pointer}
.wkq button:hover{border-color:var(--fg3);color:var(--fg)}
.wkq button.on{border-color:var(--accent);color:var(--fg)}

/* Строка обрезала всё, что из неё выходит, — и календарь был не кликабелен мышью,
   хотя программный клик проходил. Обрезку оставляем только самой формуле. */
.statusbar{overflow:visible}
.statusbar .formula{overflow:hidden;min-width:0}

/* Календарь: дни сеткой, неделя — строка, подсвечивается целиком. */
.wkpop{min-width:330px}
.calh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;font-size:11px}
.calnav{width:24px;height:24px;border:1px solid var(--border);border-radius:8px;background:none;color:var(--fg2);cursor:pointer;font-size:11px;line-height:1}
.calnav:hover:not([disabled]){border-color:var(--fg3);color:var(--fg)}
.calnav[disabled]{opacity:.25;cursor:default}
.caldow,.calrow{display:grid;grid-template-columns:repeat(7,30px) minmax(60px,1fr);align-items:center}
.caldow{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:0 0 3px}
.caldow span{text-align:center}
.calrow{border:1px solid transparent;border-radius:8px;cursor:pointer;margin:4px 0}
.calrow:hover:not(.off){background:var(--side);border-color:var(--fg3)}
.calrow.on{border-color:var(--accent);background:var(--accent-soft)}
.calrow.off{opacity:.28;cursor:default}
.calrow.fc{opacity:.8}
.cd{text-align:center;font-size:11px;padding:4px 0;font-family:var(--ui);font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--fg2)}
.calrow.on .cd{color:var(--fg)}
