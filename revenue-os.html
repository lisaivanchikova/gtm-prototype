  $('status').innerHTML=`<span class="it bld" data-tip="When this version was published. If it is older than what you expect, the page came from cache — press Cmd+Shift+R.">${BUILD}</span>`;}
let palSel=0;
function openPal(){$('pal').hidden=false;$('palIn').value='';palSel=0;renderPal();$('palIn').focus();}
function renderPal(){const q=$('palIn').value.toLowerCase();const r=allEntities().filter(e=>!q||(e.t+' '+e.ty).toLowerCase().includes(q)).slice(0,30);S.palR=r;
  $('pall').innerHTML=r.map((e,i)=>`<button class="${i===palSel?'on':''}" data-open="${e.k}" data-pal="1"><span>${esc(e.t)}</span><span class="ty">${esc(e.ty)}</span></button>`).join('');}
$('openPal').onclick=openPal;
$('palIn').addEventListener('input',()=>{palSel=0;renderPal();});
$('palIn').addEventListener('keydown',e=>{if(e.key==='ArrowDown'){palSel=Math.min(palSel+1,(S.palR||[]).length-1);renderPal();e.preventDefault();}if(e.key==='ArrowUp'){palSel=Math.max(palSel-1,0);renderPal();e.preventDefault();}if(e.key==='Enter'&&S.palR&&S.palR[palSel]){$('pal').hidden=true;openRef(S.palR[palSel].k);}if(e.key==='Escape')$('pal').hidden=true;});
$('pal').addEventListener('click',e=>{if(e.target.id==='pal')$('pal').hidden=true;});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();}});

/* =================== routing =================== */
function openRef(k){
  const [type,id,id2]=k.split(':');
  if(type==='flowlist'){openTab('flowlist',null);setEnt('flow');renderAllButMap();return;}
  if(type==='camp'){openTab('camp',id);S.campStep=1;setEnt('flow');renderAllButMap();return;}
  if(type==='draft'){const B=BNS().find(x=>x.id===id)||bnCur();
    openTab('draft',B.id,'Draft · '+(personById(B.draft.to)||{nm:''}).nm.split(' ').slice(-1)[0]);
    setEnt('ppl');S.sel={type:'person',id:B.draft.to};renderAllButMap();return;}
  if(type==='docnode'){const d=DOCS[id];S.mapAcc=d.acc;S.orgOpen=true;selectNode('doc',id);
    /* С карты клик только подсвечивает; из списка или таблицы — открывает документ. */
    if(S.tab!=='map'){openTab('doc',id);renderAllButMap();}
    if(ML&&MLREADY&&S.primary==='map')ML.flyTo({center:llOf(ACCBY[d.acc]),zoom:Math.max(ML.getZoom(),13),duration:700});return;}
  if(type==='acc'){selectAcc(ACCBY[id]);return;}
  if(type==='seg'){S.seg=S.seg===id?null:id;setEnt('seg');S.sel=null;S.level='segment';
    if(S.tab!=='map'){S.tab='map';renderEditor();}
    if(ML&&ML.getZoom()>=4.2)ML.flyTo({center:[-98.5,39.5],zoom:3.1,duration:700});
    renderAll();return;}
  if(type==='person'){const p=personById(id);S.sel={type:'person',id};setEnt('ppl');syncFilters();openTab('msg',id);renderAllButMap();return;}
  if(type==='msg'){const p=personById(id);S.sel={type:'person',id};setEnt('ppl');openTab('msg',id,'Profile · '+p.nm);renderAllButMap();return;}
  if(type==='doc'){setEnt('doc');S.sel={type:'doc',id};syncFilters();openTab('doc',id);renderAllButMap();return;}
  if(type==='news'){setEnt('seg');openTab('news',id,MARKET.find(n=>n.id===id).ttl.slice(0,28)+'…');renderAllButMap();return;}
  if(type==='sop'){S.sopAcc=id;S.sel={type:'acc',id};S.mapAcc=id;setView('org',id);openTab('sop',id);setEnt('flow');syncFilters();renderAllButMap();return;}
  if(type==='agent'){S.sel={type:'agent',id};setEnt('ag');openTab('agent',id,'Agent · '+agBy(id).nm);renderAllButMap();return;}
  if(type==='ourp'){setEnt('ag');S.sel=null;openTab('ourp',id);renderAllButMap();return;}
  if(type==='us'){openTab('org','us','Us · people and agents');setEnt('us');S.sel=null;renderAllButMap();return;}
  if(type==='db'){S.dbKind=id;S.dbN=50;S.dbSort=null;openTab('db',id,'Database · '+(id==='acc'?'accounts':'people'));return;}
}
function logAdd(ag,ttl,st){(S.extraLogs=S.extraLogs||[]).push({ag,w:NOW,ttl,st});}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-fmul],[data-open],[data-side],[data-tab],[data-close],[data-level],[data-seg],[data-knob],[data-tri],[data-do],[data-fact],[data-factall],[data-sign],[data-approve],[data-reject],[data-send],[data-edit],[data-ask],[data-clearsel],[data-dense],[data-feeddown],[data-plus],[data-newchat],[data-agundo],[data-weekpick],[data-week],[data-calm],[data-sopmode],[data-rule],[data-fix],[data-fixclose],[data-dofix],[data-f],[data-freset],[data-fclr],[data-knobcycle],[data-photo],[data-stepadd],[data-stepdel],[data-stepsel],[data-stepreset],[data-setag],[data-brief],[data-treemode],[data-fpol],[data-fhide],[data-fshow],[data-dnc],[data-fmode],[data-dbsort],[data-dbmore],[data-dbkind],[data-camp],[data-campsel],[data-campoff],[data-inwin],[data-stuck],[data-mailclear],[data-mark],[data-note],[data-notecancel],[data-ent],[data-mail],[data-common],[data-importfacts],[data-nextbn],[data-influencer],[data-sim],[data-role],[data-triopen],#fDown,#addFact,#addNote');
  if(!b){if(S.wkOpen&&!e.target.closest('.wkpop')){S.wkOpen=false;renderFilters();}return;}
  if(S.wkOpen&&!b.dataset.weekpick&&!b.dataset.week&&!b.dataset.calm&&!e.target.closest('.wkpop')){S.wkOpen=false;renderFilters();}
  if(b.dataset.pal)$('pal').hidden=true;
  if(b.dataset.dense!==undefined){S.dense=b.dataset.dense==='1';renderPanel();return;}
  if(b.dataset.fmode){S.fmode=b.dataset.fmode;renderPanel();return;}
  if(b.dataset.dbsort){const k=b.dataset.dbsort,cur=S.dbSort||{};S.dbSort={k,d:cur.k===k?-cur.d:(k==='acv'||k==='last'||k==='mv'?-1:1)};renderDB();return;}
  if(b.dataset.dbmore){S.dbN=(S.dbN||50)+50;renderDB();return;}
  if(b.dataset.mark){const [ref,v]=b.dataset.mark.split('|');S.marks=S.marks||{};S.marks[ref]=S.marks[ref]===v?null:v;renderPanel();return;}
  if(b.dataset.note){S.noteFor=b.dataset.note;renderPanel();const i=$('myNote');if(i)i.focus();return;}
  if(b.dataset.notecancel){S.noteFor=null;renderPanel();return;}
  if(b.id==='addNote'){const i=$('myNote'),v=i?i.value.trim():'';if(!v)return;
    const it=(feedItems(S.ptab)||[]).find(x=>((x.open||'')+'#'+String(x.ttl).slice(0,60))===S.noteFor);
    (S.own=S.own||[]).unshift({tab:S.ptab,ref:it?it.open:null,txt:v,about:it?String(it.ttl).slice(0,40):''});
    S.noteFor=null;renderPanel();toast('Note added under your name.');return;}
  if(b.dataset.dbkind){S.dbKind=b.dataset.dbkind;S.dbN=50;S.dbSort=null;S.dbQ='';openTab('db',S.dbKind,'Database · '+(S.dbKind==='acc'?'accounts':'people'));return;}
  if(b.dataset.agundo){const id=b.dataset.agundo, e=(S.edits||{})[id];
    if(!e){toast('That change has already been rolled back.');return;}
    e.undo(); delete S.edits[id];
    S.own=(S.own||[]).filter(o=>o.eid!==id);
    /* кнопка под откаченной правкой не должна выглядеть живой */
    const mark='data-agundo="'+id+'">undo this</button>';
    S.chat.forEach(m=>{if(!m.u&&m.t.indexOf(mark)>=0)
      m.t=m.t.replace('<button class="lnk" '+mark,'<span class="faint">rolled back</span>');});
    S.chat.push({u:0,t:'Rolled back — '+esc(e.txt.split('.')[0])+'. The model is as it was, and the line is gone from the log.'});
    renderAll();return;}
  if(b.dataset.weekpick){S.wkOpen=!S.wkOpen;S.calM=null;S.calY=null;renderFilters();return;}
  if(b.dataset.week){S.t=+b.dataset.week;S.wkOpen=false;renderAll();return;}
  if(b.dataset.calm){const cur=weekStart(S.t);
    let m=(S.calM==null?cur.getMonth():S.calM)+(+b.dataset.calm), y=S.calY==null?cur.getFullYear():S.calY;
    if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    S.calM=m;S.calY=y;renderFilters();return;}
  if(b.dataset.newchat){S.chat=[];renderAgent();return;}
  /* ===== ДОБАВЛЕНО: правка SOP ===== */
  if(b.dataset.stepadd!==undefined){const i=+b.dataset.stepadd;
    S.steps.splice(i+1,0,{id:'u'+Date.now(),a:'new step',b:'what we do',stage:null,ag:null});
    toast('Step inserted. Name it and assign who runs it.');renderEditorLight();return;}
  if(b.dataset.stepdel!==undefined){const i=+b.dataset.stepdel;if(S.steps.length<=2)return;
    const st=S.steps[i];S.steps.splice(i,1);toast(`The “${st.a}” step was removed from the process.`);renderEditorLight();return;}
  if(b.dataset.stepsel!==undefined){if(e.target.closest('.shname'))return;
    const i=+b.dataset.stepsel; S.sopStep=(S.sopStep===i)?null:i; renderEditorLight();return;}
  if(b.dataset.stepreset){S.steps=JSON.parse(JSON.stringify(STEPS0));toast('The process is back to its six original steps.');renderEditorLight();return;}
  if(b.dataset.setag!==undefined){const i=+b.dataset.setag;const opts=[...AGENTS.map(g=>g.id),'sign'];
    const cur=S.steps[i].ag;S.steps[i].ag=opts[(opts.indexOf(cur)+1)%opts.length];
    if(!S.rules[S.steps[i].ag])S.rules[S.steps[i].ag]=[{id:'n1',t:'no rule set yet',on:false}];
    renderEditorLight();return;}
  if(b.dataset.treemode){S.treeMode=b.dataset.treemode;renderSide();return;}
  if(b.dataset.common){const id=b.dataset.common;S.common=S.common||{};S.common[id]=!S.common[id];
    toast(S.common[id]?'Moved to common ground — it no longer counts as a signal.':'Back to being a signal.');renderPanel();return;}
  if(b.dataset.importfacts){
    if(S.addedFacts&&S.addedFacts.length){toast('The facts from that conference are already loaded.');return;}
    const seg=S.seg||'cmp';
    S.addedFacts=[
      {id:'cf1',seg:seg,src:'conf',ttl:'ASCII Edge: 4 of 5 owners named their insurer, not a hacker, as the reason to buy IT',ttl2:'',when:'2h',url:'ASCII Edge 2026, hall B',hits:'Conv',facts:['from what five owners said']},
      {id:'cf2',seg:seg,src:'conf',ttl:'ASCII Edge: two MSPs raised prices 18 % and lost no clients',when:'2h',url:'ASCII Edge 2026, hallway',hits:'ACV',facts:['two independent accounts']},
      {id:'cf3',seg:seg,src:'conf',ttl:'Brooke: email works when it is written for a specific state, otherwise it goes to spam',when:'3h',url:'conversation with Brooke',hits:'Reach',facts:['30 years training MSPs']},
      {id:'cf4',seg:seg,src:'conf',ttl:'Sean: sell lines of the P&L, not technology — otherwise the conversation never starts',when:'3h',url:'conversation with Sean',hits:'Conv',facts:['hundreds of millions in sales']}];
    logAdd('scout','4 facts loaded from ASCII Edge — none confirmed yet',['warn','new facts']);
    toast('4 facts loaded from the conference. None confirmed yet — the formula does not count them.');
    renderAll();return;}
  if(b.dataset.nextbn){const [id,skip]=b.dataset.nextbn.split('|');
    const L=BNS(),i=L.findIndex(x=>x.id===id),B=L[i];
    if(!skip){S.sent[id]=true;
      logAdd('seller',`${B.draft.ch}: the draft “${B.draft.subj}” was approved by a human and sent`,['up','sent']);}
    else logAdd('seller',`${B.draft.ch}: the draft “${B.draft.subj}” was declined by a human`,['down','declined']);
    S.bn=Math.min(i+1,L.length-1);
    const n=L[Math.min(i+1,L.length-1)];
    toast(skip?`Not sent. Next constraint: ${n.t}`:`Sent. Next constraint: ${n.t}`);
    renderAll();renderEditorLight();const tb=S.tabs.find(x=>x.id==='draft:'+id);if(tb)renderEditor();return;}
  if(b.dataset.influencer){const id=b.dataset.influencer,inf=influencerFor(ACCBY[id]);
    S.infl=S.infl||{};S.infl[id]=inf;
    logAdd('seller',`${inf.nm} (${inf.from}) added to the ${ACCBY[id].name} flow — they can reach the person who is blocking`,['up','flow edited']);
    toast(`${inf.nm} added to the flow: ${inf.why}.`);renderAll();return;}
  if(b.dataset.sopmode!==undefined){S.sopEdit=b.dataset.sopmode==='1';if(!S.sopEdit)S.sopFix=null;renderEditorLight();return;}
  if(b.dataset.rule){const [ag,rid]=b.dataset.rule.split(':');const r=S.rules[ag].find(x=>x.id===rid);r.on=!r.on;
    if(r.knob==='qual'){S.knob.qual=r.on?1:2;}
    logAdd(ag,`Step rule “${r.t}” ${r.on?'switched on':'switched off'} (${$('profile').selectedOptions[0].text})`,[r.on?'up':'down','edited']);
    toast(`Rule ${r.on?'switched on':'switched off'}. The formula has been recalculated.`);renderAll();return;}
  if(b.dataset.fix){S.sopFix=b.dataset.fix;renderEditorLight();
    setTimeout(()=>{const f=document.querySelector('.fixp');f&&f.scrollIntoView({block:'center',behavior:'smooth'});},30);return;}
  if(b.dataset.fixclose){S.sopFix=null;renderEditorLight();return;}
  if(b.dataset.dofix){const ag=b.dataset.dofix;const r=S.rules[ag].find(x=>x.knob==='qual');if(r){r.on=true;S.knob[ag]=1;}
    logAdd(ag,'After the failure review: the budget check is on, the dial went Auto → Approve',['up','fixed after a failure']);
    S.sopFix=null;S.tri['t-knob']='done: fixed on the diagram';
    toast('Fixed. The agent now works to the new rule. The effect is in the forecast: move time to W42.');renderAll();return;}
  if(b.dataset.knobcycle){const [id,w]=b.dataset.knobcycle.split(':');
    if(w==='cold'){S.knob[id]=(S.knob[id]+1)%3;logAdd(id,`Cold: dial → ${KNOB[S.knob[id]]}`,['flat','edited']);
      const r=(S.rules[id]||[]).find(x=>x.knob==='qual');if(r)r.on=S.knob[id]<2;}
    else{if(S.knobW[id]>=1){S.knobW[id]=0;}else{S.knobW[id]=1;}
      logAdd(id,`Warm: dial → ${KNOB[S.knobW[id]]}`,['flat','edited']);
      toast('An agent never writes to a warm contact on its own: that mail goes out under your name. The dial never goes above Approve.');}
    renderAll();return;}
  if(b.dataset.plus!==undefined){setEnt('seg');renderPanel();const i=$('myFact');i.value='on “'+b.dataset.plus+'…”: ';i.focus();return;}
  if(b.dataset.open){openRef(b.dataset.open);return;}
  if(b.dataset.ent){goEnt(b.dataset.ent,true);return;}
  /* A8: один обработчик на все фильтры — поле само знает, куда класть и что перерисовать */
  if(b.dataset.f){const i=b.dataset.f.indexOf(':'),k=b.dataset.f.slice(0,i),v=b.dataset.f.slice(i+1);
    const f=FFLD[k];if(!f)return;
    f.set(String(f.get())===v&&!f.keep?'':v);
    if(f.light){renderSide();renderPanel();}else renderAll();return;}
  if(b.dataset.feeddown){S.feedDown=!S.feedDown;renderEditor();return;}
  if(b.dataset.fclr){const f=FFLD[b.dataset.fclr];if(f){f.set(f.type==='tog'?false:'');
    if(f.light){renderSide();renderPanel();}else renderAll();}return;}
  if(b.dataset.freset!==undefined){let wide=false;
    (FSET[b.dataset.freset]||[]).forEach(k=>{const f=FFLD[k];if(!f||f.keep)return;f.set(f.type==='tog'?false:'');if(!f.light)wide=true;});
    if(wide)renderAll();else{renderSide();renderPanel();}return;}
  if(b.dataset.mail){S.mail=b.dataset.mail;S.ptab='channel';renderSide();renderPanel();return;}
  if(b.dataset.side){if(S.side===b.dataset.side&&S.layout.side){S.layout.side=false;}else{S.side=b.dataset.side;S.layout.side=true;}applyLayout();renderActivity();renderSide();return;}
  /* Провал от ограничения к роли: раздел агентов, сузленный до её агентов. */
  if(b.dataset.triopen){S.triOpen=(S.triOpen===b.dataset.triopen)?null:b.dataset.triopen;renderAgent();return;}
  if(b.dataset.role){S.ef=S.ef||{};S.ef.arole=b.dataset.role;S.sel=null;setEnt('ag');renderAll();
    toast('Agents of the '+b.dataset.role+' — the broken ones are flagged.');return;}
  /* Множитель формулы — вход в четыре работы Head: от упавшей цифры к причине,
     сценарии, прогноз, когда сломалось. Отвечает агент, а не отдельный экран. */
  if(b.dataset.fmul){fmulAsk(b.dataset.fmul);return;}
  if(b.dataset.tab){S.tab=b.dataset.tab;renderEditor();return;}
  /* Закрывать нечего: пять областей постоянны. */
  if(b.dataset.clearsel){S.sel=null;renderAll();return;}
  if(b.dataset.mailclear){S.mail=null;renderPanel();return;}
  if(b.dataset.camp){const s=b.dataset.camp;
    openTab('camp',s,'Campaign · '+(s==='all'?'all segments':segBy(s).name));
    S.campStep=1;renderAllButMap();return;}
  if(b.dataset.campsel){S.campStep=+b.dataset.campsel;renderEditor();return;}
  if(b.dataset.campoff){S.campOff=S.campOff||{};const k=b.dataset.campoff;
    S.campOff[k]=!S.campOff[k];renderEditor();return;}
  if(b.dataset.inwin){const v=b.dataset.inwin;
    if(v==='x'){S.inwin=null;}else{const [ch,id]=v.split(':');S.inwin={ch,id};}
    renderInwin();return;}
  if(b.dataset.stuck){const d=DOCS[b.dataset.stuck],a=ACCBY[d.acc];
    const st=DOCSTAGE[d.kind]||4, i=S.steps.findIndex(x=>x.stage===st);
    S.sopStep=i>=0?i:null; S.sel={type:'acc',id:a.id}; setEnt('acc');
    openTab('sop',a.id,'Workflow · '+a.name.split(' ')[0]);
    toast(`“${d.kind}” lives on the “${S.steps[i>=0?i:0].a}” stage — here is who is holding it.`);
    renderAllButMap();return;}
  /* Крошки — та же лестница, что клики по карте: «Segments» и «Accounts» раньше
     улетали в произвольные места (Техас, Brightline) и при выбранном сегменте вообще
     ничего не меняли — ступень выводилась из зума. Теперь они её задают. */
  if(b.dataset.level){const l=b.dataset.level;
    if(l==='segment'){pickSeg(null);return;}
    if(l==='accounts'){S.sel=null;S.mapAcc=null;S.showAcc=true;S.level='accounts';setEnt('acc');renderAll();
      if(S.seg)zoomToSeg(S.seg);else if(ML&&ML.getZoom()<3.6)ML.flyTo({center:[-96,38.5],zoom:3.6,duration:700});
      return;}
    if(S.mapAcc)selectAcc(ACCBY[S.mapAcc]);   /* третья ступень — только внутри выбранной компании */
    return;}
  if(b.dataset.seg!==undefined){pickSeg(b.dataset.seg);return;}
  if(b.id==='fDown'){S.downOnly=!S.downOnly;renderAll();return;}
  if(b.dataset.knob){const [id,k]=b.dataset.knob.split(':');logAdd(id,`Dial: ${KNOB[S.knob[id]]} → ${KNOB[+k]} (${$('profile').selectedOptions[0].text})`,['flat','edited']);S.knob[id]=+k;renderAll();return;}
  if(b.dataset.tri){const [id,k,label]=b.dataset.tri.split('|');
    if(k==='knob'){logAdd('qual','Dial: Auto → Approve (approved by Nikolai)',['flat','edited']);S.knob.qual=1;}
    if(k==='resume'){agBy('seller').state='active';logAdd('seller','Put back to work after the alarm was reviewed',['up','decision']);}
    if(k.startsWith('rule:')){const [,ag,rid]=k.split(':');const r=(S.rules[ag]||[]).find(x=>x.id===rid);if(r){r.on=true;logAdd(ag,`Rule \u201c${r.t}\u201d turned on (${$('profile').selectedOptions[0].text})`,['up','edited']);}}
    if(k.startsWith('fact:')){const [,nid,v]=k.split(':');S.facts[nid]={0:v,1:v};}
    if(k.startsWith('open:')){openRef(k.slice(5));return;}
    S.tri[id]=label==='Decline'||label==='Keep it stopped'?'declined':'done: '+label.toLowerCase();renderAll();return;}
  if(b.dataset.do){const k=b.dataset.do;if(k==='today'){S.agView=S.agView==='today'?null:'today';renderAgent();return;}if(k==='alarm'){S.agView=S.agView==='alarm'?null:'alarm';renderAgent();return;}if(k==='openfilters'){S.side='tree';S.layout.side=true;applyLayout();renderActivity();renderSide();return;}if(k==='openchannel'){setEnt('us');S.ptab='channel';S.layout.panel=true;applyLayout();renderActivity();renderSide();renderPanel();return;}if(k==='opendocs'){setEnt('acc');S.layout.panel=true;applyLayout();renderActivity();renderSide();renderPanel();return;}if(k==='planclear'){S.plan=null;renderEditor();renderAllButMap();toast('Plan dropped. The moves it added are gone; the rest of the queue is untouched.');return;}if(k==='resetscope'){S.seg=null;S.job='';S.stF='';S.stage='';S.downOnly=false;renderAll();return;}if(k==='focuscard'){S.agView=null;renderAgent();const f=document.querySelector('#agbody .focus');f&&f.scrollIntoView({block:'nearest'});return;}if(false){S.layout.agent=true;applyLayout();const f=document.querySelector('.focus');f&&f.scrollIntoView({block:'nearest'});f&&f.animate([{outline:'2px solid var(--focus)'},{outline:'2px solid transparent'}],{duration:600});return;}if(k==='showtx'){S.seg='price';S.downOnly=true;if(S.tab!=='map'){S.tab='map';renderEditor();}S.sel=null;renderAll();zoomToFeature(statesF.find(f=>f.abbr==='TX'));return;}
    if(k==='showdfw'){S.seg=null;S.sel=null;if(S.tab!=='map'){S.tab='map';renderEditor();}renderAll();zoomTo(bx,by,7);return;}if(k.startsWith('open:'))openRef(k.slice(5));return;}
  if(b.dataset.fact){const [id,i,v]=b.dataset.fact.split(':');S.facts[id]=S.facts[id]||{};S.facts[id][i]=v;renderEditor();renderPanel();return;}
  if(b.dataset.factall){const [id,v]=b.dataset.factall.split(':');const n=MARKET.find(x=>x.id===id);S.facts[id]={all:v};n.facts.forEach((f,i)=>S.facts[id][i]=v);renderPanel();if(S.tabs.find(x=>x.id==='doc').ref===id)renderEditor();return;}
  if(b.dataset.sign){S.docs[b.dataset.sign]={...(S.docs[b.dataset.sign]||{}),us:true};logAdd('pricer','Brightline MSA: Lisa has signed, waiting on Dr. Moss',['up','signature']);renderEditor();renderPanel();toast('Signed. The document is waiting on the client’s signature.');return;}
  if(b.dataset.approve){logAdd('pricer','Draft v2 approved by a human → sent to the client',['up','approved']);S.tri['t-v2']='done';toast('Approved.');renderAll();return;}
  if(b.dataset.reject){logAdd('pricer','Draft v2 sent back to the agent: the discount was not justified',['down','sent back']);toast('Sent back to the agent.');renderAll();return;}
  if(b.dataset.send){toast('Sent under your name. Logged against you, not the agent.');return;}
  if(b.dataset.edit){const p=$('paper');const on=p.getAttribute('contenteditable')==='true';p.setAttribute('contenteditable',on?'false':'true');b.textContent=on?'Edit':'Done';return;}
  if(b.dataset.fpol){const k=b.dataset.fpol,cur=S.fieldPol[k]||'auto';
    const i=FPOL.findIndex(x=>x[0]===cur);S.fieldPol[k]=FPOL[(i+1)%FPOL.length][0];
    toast(`Field “${k.split(':')[1]}”: ${FPOL.find(x=>x[0]===S.fieldPol[k])[2]}.`);renderPanel();return;}
  if(b.dataset.fhide){const [sc,k]=b.dataset.fhide.split('|');S.hidden[sc]=S.hidden[sc]||{};S.hidden[sc][k]=true;renderPanel();return;}
  if(b.dataset.fshow){S.hidden[b.dataset.fshow]={};renderPanel();return;}
  if(b.dataset.dnc){const sc=b.dataset.dnc;S.dnc[sc]=!S.dnc[sc];
    toast(S.dnc[sc]?'Ban on: agents will not write to this account, cold touches stop.':'Ban lifted.');renderPanel();return;}
  if(b.dataset.brief){const m=MEET.find(x=>x.id===b.dataset.brief);const a=ACCBY[m.acc];const e=stateAt(a,S.t);
    S.chat.push({u:1,t:esc('Pull together the context for this conversation: '+m.who)});
    S.chat.push({u:0,t:`<b>${esc(m.who)}</b> · ${esc(a.name)} · stage “${STAGE[e?e.s:1]}” · ${usd(a.acv)}/year.<br><b>Why this meeting:</b> ${esc(m.ttl)}.<br><b>What they said last:</b> ${m.id==='mt2'?'“$38K is a lot, right now we pay a freelancer $1,400 a month” (6-min call, W37)':'“our IT guy left, audit in November” — and asked for pricing on 14 seats'}.<br><b>Three questions:</b> what exactly has to be working by the audit · who else has to say yes · what happens if November is missed.`});
    S.layout.agent=true;applyLayout();renderAgent();toast('The context is in the agent panel.');return;}
  if(b.dataset.photo){
    S.chat.push({u:1,t:'<span class="q">⧉ photo · a heavyset man in his fifties, badge reads “Hale &amp; Ortiz CPA”</span><br>Who is this, what did we talk about, and where did we leave it?'});
    S.chat.push({u:0,t:'This is <b>Tom Hale</b>, the external bookkeeper at Brightline Dental LLC (Plano, TX). His role in the deal is <b>pays</b>: Dr. Moss will not sign without his yes.<br>Last touch — a 6-minute call in W37, source Aircall: “$38K is a lot, right now we pay a freelancer $1,400 a month”.<br>Where it stands: the $38K MSA is waiting for a signature, and this objection is exactly what holds it — it is the constraint on the deal. A reply with the $1,400 against $3,170 with SLA and HIPAA arithmetic is already drafted. Their profile is open next to this.'});
    renderAgent();openRef('person:p-hale');return;}
  if(b.dataset.sim){chooseScenario(+b.dataset.sim);return;}
  if(b.dataset.ask){ask(b.dataset.ask);return;}
  if(b.id==='addFact'){const v=$('myFact').value.trim();if(!v)return;MARKET.unshift({id:'u'+Date.now(),src:'me',when:'now',ttl:v,seg:S.seg||'cmp',st:null,hits:'hypothesis',facts:[v],url:'my note'});renderPanel();return;}
});

document.addEventListener('input',e=>{

  if(e.target.id==='dbQ'){S.dbQ=e.target.value;S.dbN=50;const c=e.target.selectionStart;renderDB();const el=$('dbQ');if(el){el.focus();el.setSelectionRange(c,c);}}
  if(e.target.dataset&&e.target.dataset.rename){const [i,f]=e.target.dataset.rename.split(':');
    const v=e.target.textContent.replace(/\s+/g,' ').trim();if(v)S.steps[+i][f]=v;}
});
/* перенос этапа воронки ручкой ⠿: draggable включается только при захвате за ручку,
   иначе он отбирает выделение у contenteditable-имени */
let DRAGI=null;
document.addEventListener('mousedown',e=>{const g=e.target.closest&&e.target.closest('.rgrip');if(!g)return;const c=g.closest('.rst');if(c)c.draggable=true;});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.rst');if(!c||!c.draggable)return;
  DRAGI=+c.dataset.stepsel;c.classList.add('dragging');if(e.dataTransfer){e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(DRAGI));}catch(_){}}});
document.addEventListener('dragover',e=>{if(DRAGI==null)return;const c=e.target.closest&&e.target.closest('.rst');if(!c)return;e.preventDefault();c.classList.add('dropto');});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('.rst');c&&c.classList.remove('dropto');});
document.addEventListener('drop',e=>{if(DRAGI==null)return;const c=e.target.closest&&e.target.closest('.rst');if(!c)return;e.preventDefault();
  const j=+c.dataset.stepsel;
  if(j!==DRAGI&&S.steps[DRAGI]){const x=S.steps.splice(DRAGI,1)[0];S.steps.splice(j,0,x);S.sopStep=j;
    toast(`The “${x.a}” stage moved to position ${j+1}.`);renderEditorLight();}
  DRAGI=null;});
document.addEventListener('dragend',()=>{DRAGI=null;document.querySelectorAll('.rst').forEach(x=>{x.draggable=false;x.classList.remove('dragging','dropto');});});
document.addEventListener('change',e=>{const d=e.target.dataset||{};
  if(d.fsel){const f=FFLD[d.fsel];if(f){f.set(e.target.value);if(f.light){renderSide();renderPanel();}else renderAll();}return;}
  if(d.ftog){const f=FFLD[d.ftog];if(f){f.set(e.target.checked);if(f.light){renderSide();renderPanel();}else renderAll();}return;}});
addEventListener('resize',()=>{applyLayout();});
$('ptabs').addEventListener('click',e=>{if(S.feedDown&&!e.target.closest('button')){S.feedDown=false;renderEditor();}});
$('profile').addEventListener('change',e=>{S.profile=e.target.value;S.chat=[];
  /* Экран остаётся тем же: меняется срез агента справа и право на подпись. */
  renderAll();});
$('askSend').onclick=()=>{const i=$('askIn');ask(i.value);i.value='';};
$('agHide').onclick=()=>{S.layout.agent=false;applyLayout();};
$('askIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(e.target.value);e.target.value='';}});
const tip=$('tip');
function tipShow(ev,t){if(!t)return tipHide();tip.textContent=t;tip.hidden=false;const x=Math.min(ev.clientX+14,innerWidth-tip.offsetWidth-8),y=ev.clientY+16+tip.offsetHeight>innerHeight?ev.clientY-tip.offsetHeight-10:ev.clientY+16;tip.style.left=x+'px';tip.style.top=y+'px';}
function tipHide(){tip.hidden=true;}
document.addEventListener('pointerover',e=>{const t=e.target.closest('[data-tip]');if(t)tipShow(e,t.dataset.tip);});
document.addEventListener('pointerout',e=>{if(e.target.closest('[data-tip]'))tipHide();});

function renderAllButMap(){renderFormula();renderFilters();renderActivity();renderSide();renderPanel();renderAgent();renderStatus();renderCrumbs();renderTabs();}
/* Красная полоса внизу уехала сюда: «hard stop убрать в агента, чтобы он выскакивал
   строкой именно в агенте» (Николай, 30.09, 02:23). Вместе с ней уехала и вкладка Today:
   «Today — это справа» (20:43). Обе стали кнопками одной строки входов. */
function alarmHTML(){
  return `<div class="focus" style="border-color:var(--down);background:color-mix(in srgb,var(--down) 6%,var(--editor))">
    <span class="k" style="color:var(--down)">Hard stop · the agent stopped itself</span>
    <span class="t">Outreach sent follow-up #4 to j.moss@… after the Sep 22 opt-out</span>
    <span class="d">From outreach@bobroff-msp.io. The never-do fired on a law (CAN-SPAM), so the agent stopped without asking. Owner paged: Nikolai Bobrov, push Sep 22, 14:05.</span>
    <div class="btns"><button class="btn" data-open="agent:seller">Review it</button><button class="lnk" data-tri="t-seller|resume|Resume">Put it back to work</button></div></div>`;}
function renderAll(){renderFormula();renderFilters();renderActivity();renderSide();renderEditorLight();renderPanel();renderAgent();renderStatus();}
/* Одно правило — одно место. Раньше центр рисовали двое, и лёгкий путь не знал
   про кампанию: разговор с агентом сбрасывал её на СОП. */
function paintCentre(){$('sopview').innerHTML=S.flowList?renderFlowList():S.campSeg?renderCamp(S.campSeg):renderSOP(ACCBY[S.sopAcc]);}
/* «Я так и не увидела, где это делать» (Лиза, 07.10) — про настройку рассылки на целый
   сегмент. Кнопка была: «Make a campaign for this segment» в подвале карточки под лентой.
   Симулятор находил её за один клик и считал работу достижимой; человек туда не смотрит.
   Прибор меряет достижимость, а не заметность, и это его предел.
   Потоки двух видов — рассылка по сегменту и сделка по юрлицу — стоят теперь списком
   в своей же области, как и договаривались: «вкладка помнит последний, зона показывает
   оба». Отсюда же и создаётся новая рассылка. */
function flowRows(){
  const t=S.t;
  const camps=SEGS.filter(g=>!S.seg||g.id===S.seg).map(g=>{
    const pool=campPool(g.id), acc=ACC.filter(a=>a.seg===g.id&&stateAt(a,t));
    return {id:'camp:'+g.id,nm:g.name,abc:g.abc,kind:'campaign',
      reach:`${int(acc.length)} companies · ${int(pool.length)} people`,
      stg:'ready to send',mv:null,acv:0};});
  const deals=ACC.filter(a=>{const e=stateAt(a,t);return e&&e.s>=1&&e.s<=4&&inF(a);})
    .sort((x,y)=>y.acv-x.acv)
    .map(a=>{const e=stateAt(a,t);
      return {id:'sop:'+a.id,nm:a.name,a,kind:'deal',
        reach:`${peopleOf(a).length} people`,stg:STAGE[e.s],mv:momentum(a,t),acv:a.acv};});
  return {camps,deals};}
function renderFlowList(){
  const {camps,deals}=flowRows(), rows=camps.concat(deals);
  const row=r=>`<tr data-open="${r.id}">
    <td class="nm">${r.kind==='campaign'?`<span class="av sq">${esc(r.abc)}</span>`:logo(r.a,'sq')}${esc(r.nm)}</td>
    <td><span class="chip ${r.kind==='campaign'?'up':'flat'}">${r.kind}</span></td>
    <td>${esc(r.reach)}</td>
    <td>${esc(r.stg)}</td>
    <td class="num ${r.mv==null?'':mcls(r.mv)}">${r.mv==null?'':arrow(r.mv)}</td>
    <td class="num">${r.acv?usd(r.acv):'\u2014'}</td></tr>`;
  return `<div class="dbh"><div class="r1"><h3>Workflows</h3>
      <span class="cnt">${int(camps.length)} campaign${camps.length===1?'':'s'} \u00b7 ${int(deals.length)} deals in play${S.seg?' \u00b7 '+esc(segBy(S.seg).name):''}</span>
      <button class="btn pri" data-camp="all">New campaign</button></div>
      <div class="note">A campaign reaches a whole segment at once; a deal is one account\u2019s path to a signature. Both are workflows, so both live here. Pick a segment on the left and the list narrows to it.</div></div>
    <table class="db"><thead><tr><th>Workflow</th><th>Kind</th><th>Reaches</th><th>Stage</th><th>Movement</th><th>ACV</th></tr></thead>
    <tbody>${rows.map(row).join('')}</tbody></table>`;}
function renderEditorLight(){if(S.primary==='map')renderMap();else if(S.primary==='db')renderDB();else paintCentre();const src=S.source&&S.tabs.find(x=>x.id===S.source);if(src&&src.kind!=='msg')$('view2').innerHTML=renderSource(src);renderTabs();renderCrumbs();}

applyLayout();
if(S.layout.panelRight)document.querySelector('.g3').classList.remove('hgut');
renderProfiles();renderSkins();renderEditor();renderAll();
</script>
